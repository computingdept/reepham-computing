<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#006347">
  <meta name="description" content="RHS Computing teacher progress dashboard pilot with fictional learners.">
  <title>Teacher Dashboard · RHS Computing</title>
  <style>
    :root{color-scheme:light;--green:#006347;--dark:#133b2e;--muted:#56685e;--line:#d3e2d9;--soft:#edf7f1;--bg:#f5f8f6;--red:#a43b39;--gold:#85600c}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--dark);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:var(--green)}.skip{position:absolute;left:-10000px}.skip:focus{left:12px;top:12px;z-index:9;background:white;padding:12px}
    .top{background:white;border-bottom:1px solid var(--line)}.top-inner{max-width:1080px;margin:auto;min-height:68px;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;gap:10px;align-items:center;color:var(--dark);text-decoration:none}.brand-mark{width:36px;height:36px;display:grid;place-items:center;background:var(--green);color:#fff;border-radius:9px;font-size:17px;font-weight:900}.brand small{display:block;font-size:10px;letter-spacing:.13em;color:var(--green);font-weight:900}.brand strong{display:block;font-size:16px}.home{font-size:14px;font-weight:700;text-decoration:none}
    main{max-width:1080px;margin:0 auto;padding:28px 22px 60px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--green);font-weight:900}.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}.heading h1{font-size:clamp(29px,4vw,42px);line-height:1.1;letter-spacing:-.035em;margin:6px 0}.heading p{color:var(--muted);margin:6px 0}.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:22px;box-shadow:0 3px 12px #163b2b08}.panel h2{font-size:20px;margin:0 0 14px}.callout{padding:12px 14px;background:#fff7e3;color:#66501e;border:1px solid #eed99f;border-radius:10px;font-size:14px;margin:14px 0 20px}.auth{max-width:440px;margin:36px auto}.stack{display:grid;gap:13px}.field{display:grid;gap:6px;font-weight:700;font-size:14px}.field input,.field select{width:100%;min-height:45px;padding:10px 11px;border:1px solid #a9bcb1;border-radius:9px;background:white;color:var(--dark)}.field input:focus,.field select:focus{outline:3px solid #bce2cf;outline-offset:1px}.btn{border:1px solid var(--green);background:var(--green);color:white;min-height:43px;padding:9px 15px;border-radius:9px;font-weight:800}.btn.secondary{background:white;color:var(--green)}.btn.tertiary{background:var(--soft);color:var(--green);border-color:var(--line)}.btn:disabled{opacity:.55;cursor:not-allowed}.btn-row{display:flex;gap:9px;flex-wrap:wrap}.error{color:var(--red);font-weight:700}.muted{color:var(--muted)}.hidden,[hidden]{display:none!important}
    .summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:20px}.metric{background:white;border:1px solid var(--line);border-radius:12px;padding:16px}.metric strong{display:block;font-size:32px;letter-spacing:-.04em}.metric span{font-size:13px;color:var(--muted);font-weight:700}.two-col{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(290px,1fr);gap:16px}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;text-align:left}th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--line);padding:11px 7px}td{padding:13px 7px;border-bottom:1px solid #e8efe9;font-size:14px}td strong{display:block}.tiny{font-size:12px;color:var(--muted)}.pill{display:inline-block;font-size:12px;font-weight:800;padding:4px 8px;border-radius:20px;background:#f1f4f2;color:#546960;white-space:nowrap}.pill.green{background:#e4f4e8;color:#17633c}.pill.orange{background:#fff3d5;color:#846013}.progress{height:7px;background:#e7eee9;border-radius:10px;overflow:hidden;margin-top:5px}.progress span{display:block;background:#08754d;height:100%}.student-controls{display:grid;gap:12px;margin-top:16px}.record{padding:13px;border:1px solid var(--line);border-radius:10px;margin-top:9px}.record strong{display:block}.record p{font-size:14px;color:var(--muted);margin:5px 0}.code{font:800 14px ui-monospace,SFMono-Regular,monospace;letter-spacing:.06em;background:#eef5f0;padding:3px 7px;border-radius:5px}.list-empty{color:var(--muted);font-size:14px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button[aria-pressed=true]{background:var(--green);color:#fff}.tabs button{padding:9px 15px;border:1px solid var(--line);background:white;color:var(--dark);font-weight:800;border-radius:9px}.practice-item{padding:18px;border:1px solid var(--line);border-radius:12px;margin:14px 0;background:#fcfefd}.practice-item strong{font-size:21px}.practice-meta{color:var(--muted);font-size:13px;font-weight:700}.feedback{margin-top:10px;padding:10px 12px;border-radius:9px;background:var(--soft);font-weight:700}.footer{font-size:12px;color:var(--muted);text-align:center;padding:10px 20px 24px}
    @media(max-width:750px){.two-col{grid-template-columns:1fr}.summary-grid{grid-template-columns:repeat(3,minmax(0,1fr))}main{padding:20px 14px 50px}.panel{padding:17px}.heading{align-items:flex-start}.top-inner{padding:10px 14px}.metric{padding:12px}.metric strong{font-size:25px}.metric span{font-size:11px}}
    @media(max-width:430px){.summary-grid{grid-template-columns:1fr}.metric{display:flex;align-items:baseline;gap:13px}.metric strong{font-size:26px}}
  </style>
</head>
<body>
  <a href="#main" class="skip">Skip to dashboard</a>
  <header class="top"><div class="top-inner"><a class="brand" href="/" aria-label="Back to Learning Hub"><span class="brand-mark">SA</span><span><small>SYNERGY ASSIST</small><strong>Teacher Dashboard</strong></span></a><a href="/" class="home">← Learning Hub</a></div></header>
  <main id="main"><noscript>Please enable JavaScript to use the demonstration dashboard.</noscript><div id="app"></div></main>
  <footer class="footer">RHS Computing · Teacher Progress Pilot · Fictional test records only</footer>
  <script>
  (()=>{
    'use strict';
    // Public GitHub Pages demonstration: NEVER use these client-side checks for real pupil data.
    const STORE='rhs-teacher-progress-demo-v1',AUTH='rhs-teacher-demo-auth';
    const people=[{id:'STU-A',name:'Student A'},{id:'STU-B',name:'Student B'},{id:'STU-C',name:'Student C'},{id:'STU-D',name:'Student D'}];
    const skills=[{id:'binary',name:'Binary & two’s complement'},{id:'floating',name:'Floating-point practice'}];
    const levels=['Easy','Medium','Hard'];
    const questions={
      'binary-Easy':[['00001010₂ → denary','10'],['00010110₂ → denary','22'],['00100101₂ → denary','37'],['00110000₂ → denary','48'],['00001111₂ → denary','15']],
      'binary-Medium':[['11111101₂ as 8-bit two’s complement → denary','-3'],['11111000₂ → denary','-8'],['11110000₂ → denary','-16'],['10000000₂ → denary','-128'],['11101100₂ → denary','-20']],
      'binary-Hard':[['-12 as 8-bit two’s complement','11110100'],['-57 as 8-bit two’s complement','11000111'],['-64 as 8-bit two’s complement','11000000'],['-101 as 8-bit two’s complement','10011011'],['-1 as 8-bit two’s complement','11111111']],
      'floating-Easy':[['4-bit two’s complement exponent 0011 → denary','3'],['Exponent 1110 → denary','-2'],['Exponent 0100 → denary','4'],['Exponent 1101 → denary','-3'],['Exponent 0001 → denary','1']],
      'floating-Medium':[['0.1000000₂ × 2² → denary','2'],['0.1100000₂ × 2² → denary','3'],['0.0100000₂ × 2³ → denary','2'],['0.1010000₂ × 2² → denary','2.5'],['0.1110000₂ × 2² → denary','3.5']],
      'floating-Hard':[['0.1010000₂ × 2⁻¹ → denary','0.3125'],['0.1100000₂ × 2⁻² → denary','0.1875'],['0.1011000₂ × 2³ → denary','5.5'],['0.1110000₂ × 2¹ → denary','1.75'],['0.1001000₂ × 2² → denary','2.25']]
    };
    const app=document.getElementById('app');let mode=sessionStorage.getItem(AUTH)==='yes'?'teacher':'entry';let selected='STU-A';let active=null;
    let data=read();
    function read(){try{const v=JSON.parse(localStorage.getItem(STORE));if(v&&v.assignments&&v.attempts)return v;}catch{}return {assignments:[],attempts:[]};}
    function persist(){localStorage.setItem(STORE,JSON.stringify(data));}
    function esc(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
    function skillName(id){return skills.find(s=>s.id===id)?.name||id;}
    function bestFor(student,skill,level){const hits=data.attempts.filter(a=>a.student===student&&a.skill===skill&&a.level===level);return hits.length?Math.max(...hits.map(a=>a.score)):null;}
    function studentAssignments(student){return data.assignments.filter(a=>a.student===student);}
    function progress(student){const list=studentAssignments(student);return {total:list.length,mastered:list.filter(a=>(bestFor(student,a.skill,a.level)??-1)>=80).length,attempted:list.filter(a=>bestFor(student,a.skill,a.level)!==null).length};}
    function heading(title,description){return `<div class="heading"><div><div class="eyebrow">RHS COMPUTING · PILOT</div><h1>${title}</h1><p>${description}</p></div></div>`;}
    const note='<div class="callout"><strong>Live-page demonstration.</strong> All student names and results here are fictional. This version saves only in this browser; cross-device progress and real teacher security are not enabled yet.</div>';
    function render(){if(mode==='teacher')return renderTeacher();if(mode==='student')return renderStudent();return renderEntry();}
    function renderEntry(){app.innerHTML=heading('Progress pilot','Choose how to test the dashboard.')+note+`<div class="two-col"><section class="panel"><h2>Teacher sign in</h2><form id="login" class="stack"><label class="field">Username<input name="username" value="Jerome" autocomplete="username" required></label><label class="field">Password<input type="password" name="password" autocomplete="off" required></label><button class="btn" type="submit">Open Teacher Dashboard</button><p id="loginError" class="error" hidden>Username or password not recognised.</p></form></section><section class="panel"><h2>Test as a learner</h2><p class="muted">Use one of the fictional learner codes to see assignments and complete a short exercise in this browser.</p><form id="studentLogin" class="stack"><label class="field">Learner code<input name="code" placeholder="e.g. STU-A" autocapitalize="characters" required></label><button class="btn secondary" type="submit">Open learner view</button><p id="codeError" class="error" hidden>Try STU-A, STU-B, STU-C or STU-D.</p></form></section></div>`;
      app.querySelector('#login').addEventListener('submit',e=>{e.preventDefault();const form=e.currentTarget;const good=form.elements.username.value.trim().toLowerCase()==='jerome'&&form.elements.password.value==='demo';if(good){sessionStorage.setItem(AUTH,'yes');mode='teacher';render();}else app.querySelector('#loginError').hidden=false;});
      app.querySelector('#studentLogin').addEventListener('submit',e=>{e.preventDefault();const code=e.currentTarget.elements.code.value.trim().toUpperCase();if(people.some(p=>p.id===code)){selected=code;mode='student';render();}else app.querySelector('#codeError').hidden=false;});
    }
    function renderTeacher(){const total=data.assignments.length,attempts=data.attempts.length,mastered=data.assignments.filter(a=>(bestFor(a.student,a.skill,a.level)??-1)>=80).length;
      app.innerHTML=`<div class="heading"><div><div class="eyebrow">TEACHER VIEW · YEAR 13 PILOT</div><h1>Good to see you, Jerome</h1><p>Assignments and progress for four fictional learners.</p></div><button id="logout" class="btn secondary">Sign out</button></div>${note}<section class="summary-grid"><div class="metric"><strong>${people.length}</strong><span>Learners</span></div><div class="metric"><strong>${total}</strong><span>Assignments set</span></div><div class="metric"><strong>${mastered}</strong><span>At 80% mastery</span></div></section><div class="two-col"><section class="panel"><h2>Class progress</h2><div class="table-wrap"><table><thead><tr><th>Learner</th><th>Assigned</th><th>Completed</th><th>Progress</th></tr></thead><tbody>${people.map(p=>{const n=progress(p.id);const pc=n.total?Math.round(n.mastered/n.total*100):0;return `<tr><td><strong>${p.name}</strong><span class="tiny">Year 13 · ${p.id}</span></td><td>${n.total}</td><td>${n.mastered}</td><td><span class="tiny">${pc}% mastered</span><div class="progress" aria-label="${pc}% mastered"><span style="width:${pc}%"></span></div></td></tr>`;}).join('')}</tbody></table></div><p class="tiny">Mastery = a best score of 80% or above. ${attempts} practice attempts recorded.</p></section><section class="panel"><h2>Set a skill</h2><form id="assign" class="student-controls"><label class="field">Learner<select name="student">${people.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></label><label class="field">Skill<select name="skill">${skills.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label><label class="field">Difficulty<select name="level">${levels.map(l=>`<option>${l}</option>`).join('')}</select></label><button class="btn" type="submit">Assign skill</button><p id="assignMessage" class="muted" aria-live="polite"></p></form></section></div><section class="panel" style="margin-top:16px"><h2>Assignments and attempts</h2>${data.assignments.length?data.assignments.map(a=>{const p=people.find(p=>p.id===a.student);const b=bestFor(a.student,a.skill,a.level);const records=data.attempts.filter(t=>t.student===a.student&&t.skill===a.skill&&t.level===a.level);return `<div class="record"><strong>${esc(p?.name||a.student)} · ${esc(skillName(a.skill))} · ${esc(a.level)}</strong><p>Best score: ${b===null?'Not attempted':b+'%'} · Attempts: ${records.length} · <span class="pill ${b>=80?'green':b!==null?'orange':''}">${b>=80?'Mastered':b!==null?'Keep practising':'Assigned'}</span></p></div>`;}).join(''):'<p class="list-empty">No assignments yet. Set a skill above, then test it in the learner view.</p>'}<div class="btn-row" style="margin-top:18px"><button id="testLearner" class="btn tertiary">Test as Student A</button><button id="reset" class="btn secondary">Clear fictional test data</button></div></section>`;
      app.querySelector('#logout').onclick=()=>{sessionStorage.removeItem(AUTH);mode='entry';render();};
      app.querySelector('#assign').addEventListener('submit',e=>{e.preventDefault();const f=e.currentTarget;const entry={student:f.elements.student.value,skill:f.elements.skill.value,level:f.elements.level.value};if(!data.assignments.some(a=>a.student===entry.student&&a.skill===entry.skill&&a.level===entry.level)){data.assignments.push(entry);persist();}renderTeacher();});
      app.querySelector('#testLearner').onclick=()=>{selected='STU-A';mode='student';render();};
      app.querySelector('#reset').onclick=()=>{if(confirm('Clear all fictional assignments and test scores in this browser?')){data={assignments:[],attempts:[]};persist();renderTeacher();}};
    }
    function renderStudent(){const p=people.find(p=>p.id===selected);const assignments=studentAssignments(selected);app.innerHTML=heading(`Hello, ${p.name}`,'Year 13 · Your assigned skills')+note+`<div class="btn-row" style="margin-bottom:15px"><button id="back" class="btn secondary">← ${sessionStorage.getItem(AUTH)==='yes'?'Teacher Dashboard':'Choose another login'}</button></div><section class="panel"><h2>Your practice</h2>${assignments.length?assignments.map((a,i)=>{const b=bestFor(selected,a.skill,a.level);return `<div class="record"><strong>${esc(skillName(a.skill))} · ${esc(a.level)}</strong><p>${b===null?'Not attempted':`Best: ${b}% · ${b>=80?'Mastered':'Try again to reach 80%'}`}</p><button data-start="${i}" class="btn ${b>=80?'secondary':''}">${b===null?'Start practice':'Practise again'}</button></div>`;}).join(''):'<p class="list-empty">No assignments yet. Ask your teacher to set one, or return to the teacher view to assign a skill.</p>'}</section>`;
      app.querySelector('#back').onclick=()=>{mode=sessionStorage.getItem(AUTH)==='yes'?'teacher':'entry';render();};
      app.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>startPractice(assignments[Number(b.dataset.start)]));
    }
    function startPractice(assignment){const list=questions[assignment.skill+'-'+assignment.level];active={assignment,list,answers:[],step:0};mode='practice';renderPractice();}
    function renderPractice(){const a=active,task=a.list[a.step];const p=people.find(p=>p.id===selected);app.innerHTML=heading('Skill practice',`${p.name} · ${skillName(a.assignment.skill)} · ${a.assignment.level}`)+`<div class="panel" style="max-width:700px"><div class="practice-meta">QUESTION ${a.step+1} OF ${a.list.length}</div><div class="progress"><span style="width:${Math.round(a.step/a.list.length*100)}%"></span></div><div class="practice-item"><p>Write your answer</p><strong>${esc(task[0])}</strong></div><form id="answerForm" class="stack"><label class="field">Answer<input name="answer" id="answer" required autocomplete="off" spellcheck="false" autofocus></label><button class="btn" type="submit">Check answer</button></form><div id="feedback" role="status"></div><button class="btn secondary" id="next" hidden>${a.step===a.list.length-1?'Finish':'Next question →'}</button><p class="tiny">For binary answers, enter eight digits without spaces. Decimal answers can use a minus sign or decimal point.</p></div>`;
      app.querySelector('#answerForm').addEventListener('submit',e=>{e.preventDefault();const raw=e.currentTarget.elements.answer.value.trim().replace(/\s/g,'');const correct=raw.toLowerCase()===task[1].toLowerCase();a.answers.push(correct);app.querySelector('#answerForm').hidden=true;app.querySelector('#feedback').innerHTML=`<div class="feedback" style="color:${correct?'#17633c':'#a43b39'}">${correct?'Correct!':'Not quite.'} Answer: ${esc(task[1])}</div>`;app.querySelector('#next').hidden=false;});
      app.querySelector('#next').onclick=()=>{a.step++;if(a.step<a.list.length)renderPractice();else finishPractice();};
      app.querySelector('#answer')?.focus();
    }
    function finishPractice(){const score=Math.round(active.answers.filter(Boolean).length/active.list.length*100);data.attempts.push({...active.assignment,score,at:new Date().toISOString()});persist();const mastered=score>=80;app.innerHTML=heading(mastered?'Skill mastered!':'Good practice — keep going',`${people.find(p=>p.id===selected).name} · ${skillName(active.assignment.skill)}`)+`<section class="panel" style="max-width:650px"><div class="eyebrow">RESULT RECORDED IN THIS BROWSER</div><h2 style="font-size:48px;margin:5px 0">${score}%</h2><p>${active.answers.filter(Boolean).length} of ${active.list.length} correct. ${mastered?'You have reached the 80% mastery target.':'Try again to reach the 80% mastery target.'}</p><div class="btn-row"><button id="again" class="btn">Try again</button><button id="return" class="btn secondary">Back to assignments</button></div></section>`;app.querySelector('#again').onclick=()=>startPractice(active.assignment);app.querySelector('#return').onclick=()=>{mode='student';render();};}
    render();
  })();
  </script>
</body>
</html>
