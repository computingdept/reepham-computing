<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#006347">
  <meta name="description" content="J277 whole-class assignment and progress pilot for RHS Computing.">
  <title>Teacher Dashboard · J277 · RHS Computing</title>
  <style>
    :root{color-scheme:light;--green:#006347;--dark:#153f31;--ink:#203e31;--muted:#587064;--line:#d0e0d6;--soft:#edf6f0;--bg:#f5f8f6;--red:#a33c36;--amber:#92620c}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:var(--green)}:focus-visible{outline:3px solid #e5a52e;outline-offset:2px}.skip{position:absolute;left:-10000px}.skip:focus{top:8px;left:8px;z-index:9;background:#fff;padding:10px}
    .top{background:#fff;border-bottom:1px solid var(--line)}.bar{max-width:1220px;min-height:64px;margin:auto;padding:10px 20px;display:flex;align-items:center;gap:14px}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--dark)}.mark{width:36px;height:36px;border-radius:9px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:900}.brand small{display:block;font-size:10px;letter-spacing:.12em;color:var(--green);font-weight:900}.brand strong{font-size:17px}.home{margin-left:auto;text-decoration:none;font-weight:800;font-size:13px}
    main{max-width:1220px;margin:auto;padding:24px 20px 55px}.eyebrow{font-size:11px;color:var(--green);font-weight:900;letter-spacing:.14em;text-transform:uppercase}.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:14px}.heading h1{font-size:clamp(27px,3.6vw,38px);letter-spacing:-.04em;line-height:1.15;margin:4px 0}.heading p{margin:5px 0;color:var(--muted)}.heading-actions{display:flex;gap:8px;flex-wrap:wrap}.demo-note{border:1px solid #ead9a8;border-radius:11px;background:#fff9e8;padding:10px 13px;font-size:13px;color:#6b5622;margin:10px 0 17px}.panel{border:1px solid var(--line);background:#fff;border-radius:14px;padding:19px;box-shadow:0 3px 10px #12412c07}.panel h2{font-size:19px;margin:0 0 13px;color:var(--dark)}.panel h3{font-size:16px;margin:0 0 8px}.muted,.hint{color:var(--muted)}.hint{font-size:12px}.error{color:var(--red);font-weight:800}.hidden,[hidden]{display:none!important}.btn{border:1px solid var(--green);border-radius:9px;min-height:42px;background:var(--green);color:#fff;padding:9px 14px;font-weight:800}.btn.alt{background:#fff;color:var(--green)}.btn.soft{background:var(--soft);color:var(--green);border-color:var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.field{display:grid;gap:6px;font-weight:800;font-size:13px}.field input,.field select{min-height:42px;width:100%;padding:8px 10px;border:1px solid #b7cbbd;border-radius:9px;background:#fff;color:var(--dark)}.login-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:930px;margin:32px auto}.stack{display:grid;gap:13px}.year-tabs,.work-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.year-tabs button,.work-tabs button{border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--dark);padding:10px 15px;font-weight:800}.year-tabs [aria-pressed=true],.work-tabs [aria-pressed=true]{background:var(--green);color:#fff;border-color:var(--green)}.year-tabs span{font-size:12px;opacity:.82}
    .metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin:13px 0 18px}.metric{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 16px}.metric strong{display:block;color:var(--dark);font-size:30px;line-height:1.2;letter-spacing:-.04em}.metric span{color:var(--muted);font-size:12px;font-weight:800}.work-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(265px,.72fr);gap:16px}.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:10px 0}.filters .search{grid-column:1/-1}.catalog-list{max-height:390px;overflow-y:auto;border:1px solid var(--line);border-radius:11px;margin:10px 0}.activity{padding:11px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #e6eee8}.activity:last-child{border-bottom:0}.activity:hover{background:#f7fbf8}.activity label{display:flex;align-items:flex-start;gap:9px;flex:1;min-width:0;cursor:pointer}.activity input{width:18px;height:18px;margin-top:2px;accent-color:var(--green);flex:none}.activity strong{display:block;color:var(--dark);font-size:14px}.activity small{display:block;color:var(--muted);font-size:12px;margin-top:2px}.activity a{white-space:nowrap;font-size:12px;font-weight:800;text-decoration:none}.selected-count{font-size:13px;color:var(--muted);font-weight:800}.assignment-card{background:var(--soft);border:1px solid #c5dfce;padding:13px;border-radius:10px;margin-bottom:13px}.assignment-card strong{font-size:17px;color:var(--dark)}.assignment-card p{margin:3px 0;font-size:13px}.activity-count{margin-left:auto;color:var(--muted);font-size:12px;font-weight:800}.toast{margin:12px 0;padding:10px;border-radius:9px;background:#e8f5eb;color:#165c39;font-weight:800}
    .grid-tools{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin:11px 0 15px}.grid-tools .field{min-width:175px;max-width:230px}.grid-nav{margin-left:auto;display:flex;align-items:center;gap:7px}.grid-wrap{max-height:550px;overflow:auto;border:1px solid var(--line);border-radius:11px}.progress-grid{border-collapse:separate;border-spacing:0;width:100%;min-width:680px;table-layout:fixed}.progress-grid th,.progress-grid td{border-bottom:1px solid #e8eee9;border-right:1px solid #edf1ee;padding:9px 8px;text-align:center;font-size:13px}.progress-grid th{background:#f6faf7;position:sticky;top:0;z-index:2;font-weight:900;color:var(--dark)}.progress-grid th:first-child,.progress-grid td:first-child{position:sticky;left:0;z-index:3;text-align:left;background:#fff;width:158px}.progress-grid th:first-child{z-index:4;background:#f6faf7}.progress-grid th:not(:first-child){width:130px}.progress-grid td:first-child small{display:block;color:var(--muted);font-size:11px}.progress-grid th small{font-weight:600;color:var(--muted);display:block;margin-top:4px;font-size:11px}.progress-grid tfoot th{top:auto;bottom:0;z-index:2;background:#eaf4ed}.progress-grid tfoot th:first-child{z-index:4;background:#eaf4ed}.cell{border:0;min-height:30px;width:100%;border-radius:7px;font-size:12px;font-weight:900;background:#f0f3f1;color:#627166}.cell.green{background:#dff2e4;color:#1e673b}.cell.amber{background:#fff1cb;color:#845a0c}.cell.red{background:#ffebea;color:#a13932}.cell:hover{box-shadow:inset 0 0 0 2px #006347}.detail{margin-top:14px;padding:13px 15px;border:1px solid var(--line);border-radius:10px;background:#f8fbf9}.detail h3{margin:0 0 6px}.detail p{margin:4px 0}.empty{color:var(--muted);padding:16px;border:1px dashed var(--line);border-radius:10px}.students-table{border-collapse:collapse;width:100%}.students-table th,.students-table td{border-bottom:1px solid var(--line);padding:10px;text-align:left}.students-table th{background:#f7faf8;font-size:12px;color:var(--muted)}.students-table td{font-size:13px}.students-table td:last-child{text-align:right}.students-scroll{max-height:540px;overflow:auto}.student-card{border:1px solid var(--line);border-radius:11px;padding:14px;margin:11px 0}.student-card strong{display:block}.student-card p{margin:5px 0;color:var(--muted)}.student-card .btn{margin-top:6px}.code{font:800 13px ui-monospace,Consolas,monospace;background:#edf5ef;border-radius:5px;padding:3px 6px}.pill{font-size:11px;font-weight:900;border-radius:20px;padding:4px 8px;background:#eef2ef;color:#687469}.pill.green{background:#e0f3e4;color:#20643f}.pill.amber{background:#fff1d4;color:#84600e}.footer{color:var(--muted);font-size:12px;text-align:center;padding:16px 20px 27px}
    .cell.dual{display:grid;gap:3px;text-align:left;padding:5px 8px}.cell.dual span{display:flex;justify-content:space-between;gap:5px;font-size:11px}.cell.dual .medium{border-top:1px solid #00000014;padding-top:3px}.level-legend{font-size:12px;color:var(--muted);margin:0 0 12px}.learner-levels{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0}.learner-levels .btn{min-width:115px}.step-label{font-size:12px;color:var(--muted);font-weight:800}.assignment-rule{border:1px solid #c5dfce;background:#f4faf5;border-radius:10px;padding:12px 13px;font-size:13px;margin:10px 0}.assignment-rule strong{color:var(--dark)}
    @media(max-width:800px){.work-layout,.login-grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}.metrics{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:530px){main{padding:17px 12px 45px}.bar{padding:10px 12px}.home{font-size:12px}.heading{flex-direction:column}.panel{padding:14px}.filters{grid-template-columns:1fr}.metrics{gap:7px}.metric{padding:11px}.metric strong{font-size:24px}.metric span{font-size:11px}.grid-nav{width:100%;margin-left:0;justify-content:space-between}}
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to dashboard</a>
  <header class="top"><div class="bar"><a class="brand" href="/" aria-label="Learning Hub home"><span class="mark">SA</span><span><small>SYNERGY ASSIST</small><strong>Teacher Dashboard</strong></span></a><a class="home" href="/">← Learning Hub</a></div></header>
  <main id="main"><div id="app"><p>Loading J277 activities…</p></div></main>
  <footer class="footer">RHS Computing · OCR J277 · Fictional demonstration data only</footer>
  <script src="/assets/j277-independent-work-hours.js"></script>
  <script>
  (()=>{'use strict';
    // DEMO ONLY: Static-page credentials and browser-local records are NOT protection for real pupil data.
    const AUTH='rhs-j277-teacher-demo-session',STORE='rhs-j277-teacher-demo-v1',YEAR_KEY='rhs-j277-teacher-year';
    const app=document.getElementById('app'),years=[10,11];let catalog=[];
    let mode=sessionStorage.getItem(AUTH)==='yes'?'teacher':'entry';let tab='set';let year=Number(sessionStorage.getItem(YEAR_KEY))===11?11:10;
    let filters={type:'skill',paper:'1',group:'all',search:''},gridPaper='all',gridPage=0,studentCode='Y10-01',selectedItems=new Set(),activeDetail=null,toast='';
    let data=read();
    const allStudents=y=>Array.from({length:30},(_,i)=>({id:'Y'+y+'-'+String(i+1).padStart(2,'0'),name:'Student '+String(i+1).padStart(2,'0'),year:y}));
    function read(){try{const v=JSON.parse(localStorage.getItem(STORE));if(v&&Array.isArray(v.assignments)&&Array.isArray(v.results))return v;}catch{}return{assignments:[],results:[]};}
    function save(){localStorage.setItem(STORE,JSON.stringify(data));}
    function escapeHtml(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
    function heading(h,sub){return `<div class="heading"><div><span class="eyebrow">OCR J277 · RHS COMPUTING</span><h1>${h}</h1><p>${sub}</p></div></div>`;}
    const warning='<div class="demo-note"><strong>Fictional pilot:</strong> 60 demonstration students. Assigned Skills record first-try accuracy automatically when launched from My Work; Revision Practice still uses demo scores. Records stay in this browser, not across devices. No real pupil data.</div>';
    const byId=id=>catalog.find(c=>c.id===id);
    const workFor=y=>data.assignments.filter(a=>a.year===y&&byId(a.itemId));
    const records=(student,key,level)=>data.results.filter(r=>r.student===student&&r.assignmentKey===key&&(level===undefined||r.level===level));
    const best=(student,key,level)=>{const a=records(student,key,level);return a.length?Math.max(...a.map(r=>r.score)):null;};
    const latest=(student,key,level)=>{const a=records(student,key,level);return a.length?a[a.length-1].score:null;};
    const dual=a=>a.level==='both'&&byId(a.itemId)?.type==='skill';
    const displayName=a=>{const c=byId(a.itemId);return c?c.title+(a.level&&a.level!=='both'?' · '+a.level[0].toUpperCase()+a.level.slice(1):''):'Unavailable activity';};
    const launchUrl=(a,level)=>{const c=byId(a.itemId);if(!c)return'#';if(c.type!=='skill')return c.url;const dest=new URL(c.url,location.origin);if(c.paper===1)dest.searchParams.set('skill',c.sourceKey);dest.searchParams.set('level',level||'easy');if(mode==='learner'){dest.searchParams.set('workCode',studentCode);dest.searchParams.set('workKey',a.key);}return dest.pathname+dest.search+dest.hash;};
    const mastered=(student,a)=>dual(a)?(best(student,a.key,'medium')??-1)>=80:(best(student,a.key)??-1)>=80;
    const attempted=(student,a)=>records(student,a.key).length>0;
    function personProgress(student){const work=workFor(student.year);return{assigned:work.length,attempted:work.filter(a=>attempted(student.id,a)).length,mastered:work.filter(a=>mastered(student.id,a)).length};}
    // Keep fictional progress made before the Easy + Medium rule. A prior Hard score
    // is retained as history but cannot count as Medium mastery.
    function migrateDemoLevels(){const originals=data.assignments.filter(a=>byId(a.itemId)?.type==='skill'&&a.level!=='both');if(!originals.length)return;try{const backupKey='rhs-j277-teacher-demo-before-level-migration-v1';if(!localStorage.getItem(backupKey))localStorage.setItem(backupKey,JSON.stringify(data));}catch{}for(const old of originals){const key=old.year+'|'+old.itemId+'|both';if(!data.assignments.some(a=>a.key===key))data.assignments.push({key,year:old.year,itemId:old.itemId,level:'both',at:old.at});for(const r of data.results){if(r.assignmentKey===old.key){r.assignmentKey=key;r.level=r.level||old.level;}}}data.assignments=data.assignments.filter(a=>!originals.includes(a));save();}
    const canEnter=()=>window.RHSIndependentWorkHours?.isOpen()===true;
    const isTeacherPreview=()=>sessionStorage.getItem(AUTH)==='yes';
    function render(){if(mode==='teacher')return renderTeacher();if(mode==='learner'){if(isTeacherPreview()||canEnter())return renderLearner();mode='entry';}renderEntry();}
    let watchingSchedule=false;
    function watchSchedule(){if(watchingSchedule)return;watchingSchedule=true;let previous=canEnter();setInterval(()=>{const current=canEnter();if(current!==previous){previous=current;if(mode!=='teacher'&&!isTeacherPreview())render();}},15000);}
    function renderEntry(){app.innerHTML=heading('J277 progress pilot','Choose teacher or fictional learner view.')+warning+`<div class="login-grid"><section class="panel"><h2>Teacher sign in</h2><form id="login" class="stack"><label class="field">Username<input name="username" value="Jerome" autocomplete="username" required></label><label class="field">Password<input name="password" type="password" autocomplete="off" required></label><button class="btn" type="submit">Open Teacher Dashboard</button><p class="error" id="loginError" hidden>Username or password not recognised.</p></form></section>${canEnter()?`<section class="panel"><h2>Test as a learner</h2><p class="muted">Use a fictional learner code such as <span class="code">Y10-01</span> or <span class="code">Y11-01</span>.</p><form id="learnerLogin" class="stack"><label class="field">Learner code<input name="code" placeholder="Y10-01" autocomplete="off" autocapitalize="characters" required></label><button class="btn alt" type="submit">Open learner view</button><p class="error" id="codeError" hidden>Use a code from Y10-01 to Y10-30 or Y11-01 to Y11-30.</p></form></section>`:`<section class="panel"><h2>Student access is closed</h2><p class="muted">My Work is for independent study outside lessons, so student entry is unavailable right now.</p><p class="muted"><strong>Open:</strong> ${window.RHSIndependentWorkHours?.label||"School days: 12:30–13:20 and 15:30–midnight. Weekends and school holidays: all day (UK time)."}</p><p class="hint">Teachers can sign in here and use <strong>Test learner view</strong> at any time for classroom demonstrations.</p></section>`}</div>`;
      app.querySelector('#login').onsubmit=e=>{e.preventDefault();const f=e.currentTarget;if(f.elements.username.value.trim().toLowerCase()==='jerome'&&f.elements.password.value==='demo'){sessionStorage.setItem(AUTH,'yes');mode='teacher';render();}else app.querySelector('#loginError').hidden=false;};
      const learnerForm=app.querySelector('#learnerLogin');if(learnerForm)learnerForm.onsubmit=e=>{e.preventDefault();if(!canEnter()){renderEntry();return;}const code=e.currentTarget.elements.code.value.trim().toUpperCase();if(years.some(y=>allStudents(y).some(s=>s.id===code))){studentCode=code;mode='learner';render();}else app.querySelector('#codeError').hidden=false;};
    }
    function renderTeacher(){const work=workFor(year),countMastered=work.reduce((n,a)=>n+allStudents(year).filter(s=>mastered(s.id,a)).length,0);
      app.innerHTML=`<div class="heading"><div><span class="eyebrow">TEACHER · OCR J277</span><h1>Good to see you, Jerome</h1><p>Set work for a class, then review student progress.</p></div><div class="heading-actions"><button id="testLearner" class="btn soft">Test learner view</button><button id="logout" class="btn alt">Sign out</button></div></div>${warning}<nav class="year-tabs" aria-label="Choose class">${years.map(y=>`<button data-year="${y}" aria-pressed="${y===year}">Year ${y} <span>· 30 students</span></button>`).join('')}</nav><div class="metrics"><div class="metric"><strong>30</strong><span>Year ${year} learners</span></div><div class="metric"><strong>${work.length}</strong><span>Activities assigned</span></div><div class="metric"><strong>${countMastered}</strong><span>Mastered results</span></div></div><nav class="work-tabs" aria-label="Dashboard sections"><button data-tab="set" aria-pressed="${tab==='set'}">Set Work</button><button data-tab="progress" aria-pressed="${tab==='progress'}">Progress Grid</button><button data-tab="students" aria-pressed="${tab==='students'}">Students</button></nav><div id="tabContent"></div>`;
      app.querySelectorAll('[data-year]').forEach(b=>b.onclick=()=>{year=Number(b.dataset.year);sessionStorage.setItem(YEAR_KEY,String(year));selectedItems.clear();gridPaper='all';gridPage=0;activeDetail=null;toast='';renderTeacher();});
      app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;gridPage=0;activeDetail=null;toast='';renderTeacher();});
      app.querySelector('#logout').onclick=()=>{sessionStorage.removeItem(AUTH);mode='entry';render();};
      app.querySelector('#testLearner').onclick=()=>{studentCode='Y'+year+'-01';mode='learner';render();};
      if(tab==='set')renderSetWork();else if(tab==='progress')renderGrid();else renderStudents();
    }
    function typeLabel(v){return v==='skill'?'Skills':v==='practice'?'Revision Practice':'All work';}
    function filteredCatalog(){const q=filters.search.trim().toLowerCase();return catalog.filter(i=>(filters.type==='all'||i.type===filters.type)&&(filters.paper==='all'||String(i.paper)===filters.paper)&&(filters.group==='all'||i.group===filters.group)&&(!q||(i.title+' '+i.group+' '+i.spec).toLowerCase().includes(q)));}
    function groupOptions(){return [...new Set(catalog.filter(i=>(filters.type==='all'||i.type===filters.type)&&(filters.paper==='all'||String(i.paper)===filters.paper)).map(i=>i.group))];}
    function renderSetWork(){const root=app.querySelector('#tabContent');root.innerHTML=`<div class="work-layout"><section class="panel"><div class="btn-row"><h2 style="margin:0">Choose J277 activities</h2><span class="activity-count">${catalog.length} live activities</span></div><div class="filters"><label class="field">Type<select id="typeFilter"><option value="skill">Skills</option><option value="practice">Revision Practice</option><option value="all">Both</option></select></label><label class="field">Paper<select id="paperFilter"><option value="1">Paper 1</option><option value="2">Paper 2</option><option value="all">Both papers</option></select></label><label class="field">Topic<select id="groupFilter"></select></label><label class="field search">Find an activity<input id="searchFilter" placeholder="Search e.g. binary, SQL, networks" value="${escapeHtml(filters.search)}"></label></div><p class="hint">Select one or more activities. Planned Skills are excluded.</p><div class="catalog-list" id="catalogList"></div><p class="selected-count" id="chosenCount"></p></section><section class="panel"><h2>Assign to the class</h2><div class="assignment-card"><span class="eyebrow">WHOLE CLASS</span><strong>Year ${year} · 30 students</strong><p>One action assigns the same work to all 30 fictional learners.</p></div><div class="assignment-rule"><strong>Skills: Easy + Medium automatically</strong><div>Students practise Easy first, then Medium. A Medium score of 80% or more earns mastery. Hard remains optional on the Skill page for lessons.</div></div><p class="hint">Revision Practice retains its five-question quizzes and 80% target, without difficulty levels.</p><button class="btn" id="assignNow" style="width:100%;margin-top:15px">Assign selected work</button><p id="assignFeedback" role="status"></p><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Already assigned</h3><div id="assignedSummary"></div></section></div>`;
      root.querySelector('#typeFilter').value=filters.type;root.querySelector('#paperFilter').value=filters.paper;
      const updateGroups=()=>{const opts=groupOptions();if(filters.group!=='all'&&!opts.includes(filters.group))filters.group='all';root.querySelector('#groupFilter').innerHTML='<option value="all">All topics</option>'+opts.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');root.querySelector('#groupFilter').value=filters.group;};
      const drawList=()=>{const items=filteredCatalog();root.querySelector('#catalogList').innerHTML=items.length?items.map(i=>`<div class="activity"><label><input type="checkbox" data-item="${i.id}" ${selectedItems.has(i.id)?'checked':''}><span><strong>${escapeHtml(i.title)}</strong><small>${typeLabel(i.type)} · Paper ${i.paper} · ${escapeHtml(i.group)} · ${escapeHtml(i.spec)}</small></span></label><a href="${escapeHtml(i.url)}" target="_blank" rel="noopener" aria-label="Preview ${escapeHtml(i.title)}">Preview ↗</a></div>`).join(''):'<p class="empty">No activities match these filters.</p>';root.querySelectorAll('[data-item]').forEach(cb=>cb.onchange=()=>{if(cb.checked)selectedItems.add(cb.dataset.item);else selectedItems.delete(cb.dataset.item);updateChosen();});updateChosen();};
      const updateChosen=()=>{root.querySelector('#chosenCount').textContent=selectedItems.size+' activities selected';root.querySelector('#assignNow').disabled=selectedItems.size===0;};
      const drawAssigned=()=>{const work=workFor(year);root.querySelector('#assignedSummary').innerHTML=work.length?`<p class="hint">${work.length} activities set for Year ${year}.</p>`+work.slice(-5).reverse().map(a=>`<div class="student-card"><strong>${escapeHtml(displayName(a))}</strong><span class="hint">${typeLabel(byId(a.itemId).type)} · Paper ${byId(a.itemId).paper}</span></div>`).join(''):'<p class="muted">No work set yet.</p>';};
      updateGroups();drawList();drawAssigned();
      root.querySelector('#typeFilter').onchange=e=>{filters.type=e.target.value;updateGroups();drawList();};
      root.querySelector('#paperFilter').onchange=e=>{filters.paper=e.target.value;updateGroups();drawList();};
      root.querySelector('#groupFilter').onchange=e=>{filters.group=e.target.value;drawList();};
      root.querySelector('#searchFilter').oninput=e=>{filters.search=e.target.value;drawList();};
      root.querySelector('#assignNow').onclick=()=>{const chosen=[...selectedItems];let added=0;for(const id of chosen){const item=byId(id);if(!item)continue;const assignmentLevel=item.type==='skill'?'both':'';const key=year+'|'+id+'|'+assignmentLevel;if(!data.assignments.some(a=>a.key===key)){data.assignments.push({key,year,itemId:id,level:assignmentLevel,at:new Date().toISOString()});added++;}}save();selectedItems.clear();toast=added?`${added} activities assigned to all 30 Year ${year} students. Skills include Easy + Medium.`:'Those activities were already assigned.';tab='progress';gridPage=0;renderTeacher();};
    }
    const scoreText=n=>n===null?'—':n+'%';
    function cellContent(student,a){
      if(dual(a))return `<span>Easy <b>${scoreText(best(student,a.key,'easy'))}</b></span><span class="medium">Medium <b>${scoreText(best(student,a.key,'medium'))}</b></span>`;
      return scoreText(best(student,a.key));
    }
    function cellDetail(student,a){
      if(dual(a))return ['easy','medium'].map(level=>{const b=best(student,a.key,level),hits=records(student,a.key,level);return `<p><strong>${level==='easy'?'Easy':'Medium'}:</strong> ${scoreText(b)} best · ${hits.length} attempt(s)</p>`;}).join('')+'<p class="hint">Mastery is based on Medium reaching 80%. Hard is not assigned.</p>';
      const hits=records(student,a.key);return `<p>${hits.length?`Best ${scoreText(best(student,a.key))} · Latest ${scoreText(latest(student,a.key))} · ${hits.length} attempt(s)`:'Not attempted yet'}</p><p class="hint">Test results: ${hits.map(h=>scoreText(h.score)).join(', ')||'None'}.</p>`;
    }
    function renderGrid(){const root=app.querySelector('#tabContent'),work=workFor(year),visible=work.filter(a=>gridPaper==='all'||String(byId(a.itemId).paper)===gridPaper),pages=Math.max(1,Math.ceil(visible.length/6));gridPage=Math.min(Math.max(0,gridPage),pages-1);const slice=visible.slice(gridPage*6,(gridPage+1)*6),students=allStudents(year);
      root.innerHTML=`<section class="panel">
        <div class="btn-row"><h2 style="margin:0">Year ${year} progress grid</h2><span class="activity-count">30 learners · ${visible.length} activities</span></div>
        ${toast?`<p class="toast" role="status">${escapeHtml(toast)}</p>`:''}
        <div class="grid-tools"><label class="field">Paper<select id="gridPaper"><option value="all">Both papers</option><option value="1">Paper 1</option><option value="2">Paper 2</option></select></label>
          <div class="grid-nav"><button id="prevGrid" class="btn alt" ${gridPage===0?'disabled':''}>← Previous</button><span class="hint">${visible.length?(gridPage*6+1)+'–'+Math.min((gridPage+1)*6,visible.length)+' of '+visible.length:'No work'}</span><button id="nextGrid" class="btn alt" ${gridPage>=pages-1?'disabled':''}>Next →</button></div></div>
        <p class="level-legend">Each Skill uses one column with Easy and Medium results. Mastery requires at least 80% on Medium. Practice uses its 80% score.</p>
        ${visible.length?`<div class="grid-wrap"><table class="progress-grid"><thead><tr><th>Student</th>
        ${slice.map(a=>`<th title="${escapeHtml(displayName(a))}">${escapeHtml(byId(a.itemId).title)}<small>${dual(a)?'Easy + Medium':a.level?a.level[0].toUpperCase()+a.level.slice(1):'Practice'} · P${byId(a.itemId).paper}</small></th>`).join('')}</tr></thead><tbody>
        ${students.map(s=>{const p=personProgress(s);return `<tr><td><strong>${s.name}</strong><small>${s.id} · ${p.mastered}/${p.assigned} mastered</small></td>${slice.map(a=>{const attempts=records(s.id,a.key),cls=mastered(s.id,a)?'green':attempts.length?'amber':'';return `<td><button class="cell ${cls} ${dual(a)?'dual':''}" data-student="${s.id}" data-key="${escapeHtml(a.key)}" aria-label="${escapeHtml(displayName(a))}: ${escapeHtml(s.name)}. ${dual(a)?'Easy '+scoreText(best(s.id,a.key,'easy'))+', Medium '+scoreText(best(s.id,a.key,'medium')):scoreText(best(s.id,a.key))}">${cellContent(s.id,a)}</button></td>`;}).join('')}</tr>`;}).join('')}</tbody><tfoot><tr><th>Mastered / 30</th>${slice.map(a=>`<th>${students.filter(s=>mastered(s.id,a)).length}/30</th>`).join('')}</tr></tfoot></table></div><div id="cellDetail"></div>`:'<p class="empty">No activities assigned for this paper. Open Set Work to assign one or more Skills or Practice topics.</p>'}
        <div class="btn-row" style="margin-top:16px"><button id="setMore" class="btn soft">+ Set more work</button><button id="previewStudent" class="btn alt">Test as Student 01</button></div></section>`;
      root.querySelector('#gridPaper').value=gridPaper;root.querySelector('#gridPaper').onchange=e=>{gridPaper=e.target.value;gridPage=0;activeDetail=null;renderGrid();};
      root.querySelector('#prevGrid').onclick=()=>{gridPage--;renderGrid();};root.querySelector('#nextGrid').onclick=()=>{gridPage++;renderGrid();};
      root.querySelector('#setMore').onclick=()=>{tab='set';toast='';renderTeacher();};root.querySelector('#previewStudent').onclick=()=>{studentCode='Y'+year+'-01';mode='learner';render();};
      root.querySelectorAll('[data-student]').forEach(b=>b.onclick=()=>{const s=b.dataset.student,a=visible.find(x=>x.key===b.dataset.key);if(!a)return;const display=allStudents(year).find(x=>x.id===s)?.name||s;root.querySelector('#cellDetail').innerHTML=`<div class="detail"><h3>${display} · ${escapeHtml(displayName(a))}</h3>${cellDetail(s,a)}<a href="${escapeHtml(launchUrl(a,dual(a)?'easy':undefined))}" target="_blank" rel="noopener">Open original activity ↗</a></div>`;});
    }
    function renderStudents(){const root=app.querySelector('#tabContent'),students=allStudents(year);root.innerHTML=`<section class="panel"><div class="btn-row"><h2 style="margin:0">Year ${year} students</h2><span class="activity-count">30 fictional learner codes</span></div><p class="hint">Select a student to test their assigned work. No real pupil names are stored.</p><div class="students-scroll"><table class="students-table"><thead><tr><th>Student</th><th>Assigned</th><th>Attempted</th><th>Mastered</th><th></th></tr></thead><tbody>${students.map(s=>{const p=personProgress(s);return `<tr><td><strong>${s.name}</strong><br><span class="code">${s.id}</span></td><td>${p.assigned}</td><td>${p.attempted}</td><td>${p.mastered}</td><td><button data-preview="${s.id}" class="btn soft">View</button></td></tr>`;}).join('')}</tbody></table></div><div class="btn-row" style="margin-top:16px"><button id="clearData" class="btn alt">Clear all fictional J277 test data</button></div></section>`;root.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>{studentCode=b.dataset.preview;mode='learner';render();});root.querySelector('#clearData').onclick=()=>{if(confirm('Clear all fictional J277 assignments and scores in this browser?')){data={assignments:[],results:[]};save();renderTeacher();}};}
    function renderLearner(){const student=years.flatMap(allStudents).find(s=>s.id===studentCode);if(!student){mode='entry';return render();}const work=workFor(student.year);app.innerHTML=heading('Hello, '+student.name,'Year '+student.year+' · '+studentCode)+warning+`<div class="btn-row" style="margin-bottom:15px"><button id="learnerBack" class="btn alt">← ${sessionStorage.getItem(AUTH)==='yes'?'Teacher Dashboard':'Choose another code'}</button></div><section class="panel"><h2>Your assigned work</h2>${work.length?work.map(a=>{
      const c=byId(a.itemId),b=best(student.id,a.key),hits=records(student.id,a.key).length;
      const levels=dual(a)?`<p class="step-label">Work through Easy, then Medium. Hard is optional for lessons.</p><p>Easy: ${scoreText(best(student.id,a.key,'easy'))} · Medium: ${scoreText(best(student.id,a.key,'medium'))} ${mastered(student.id,a)?'<span class="pill green">Medium mastered</span>':''}</p><div class="learner-levels"><a class="btn soft" href="${escapeHtml(launchUrl(a,'easy'))}" target="_blank" rel="noopener">1 · Easy ↗</a><a class="btn alt" href="${escapeHtml(launchUrl(a,'medium'))}" target="_blank" rel="noopener">2 · Medium ↗</a></div>${c.paper===1?'<p class="hint">On Paper 1, choose the indicated difficulty after opening the activity.</p>':''}`:
        `<p>${b===null?'Not started':`Best test score: ${b}% · ${hits} attempt(s)`} ${mastered(student.id,a)?'<span class="pill green">80% reached</span>':''}</p><a class="btn" style="text-decoration:none;display:inline-flex;align-items:center" href="${escapeHtml(launchUrl(a))}" target="_blank" rel="noopener">Open original activity ↗</a>`;
      return `<div class="student-card"><span class="eyebrow">${typeLabel(c.type)} · Paper ${c.paper}</span><strong>${escapeHtml(displayName(a))}</strong>${levels}<div class="btn-row"><button class="btn alt" data-test="${escapeHtml(a.key)}">Record a demonstration score</button></div><div id="score-${escapeHtml(a.key).replace(/[^a-zA-Z0-9]/g,'_')}"></div></div>`;
      }).join(''):'<p class="empty">No work assigned to Year '+student.year+' yet. Return to Teacher Dashboard and use Set Work.</p>'}</section>`;
      app.querySelector('#learnerBack').onclick=()=>{mode=sessionStorage.getItem(AUTH)==='yes'?'teacher':'entry';year=student.year;render();};
      app.querySelectorAll('[data-test]').forEach(button=>button.onclick=()=>{const key=button.dataset.test,a=work.find(a=>a.key===key),container=button.parentElement.nextElementSibling;
        container.innerHTML=`<form class="stack" style="margin-top:12px;max-width:300px">${dual(a)?'<label class="field">Which level?<select name="level"><option value="easy">Easy</option><option value="medium">Medium</option></select></label>':''}<label class="field">Fictional test score<select name="score"><option value="0">0%</option><option value="20">20%</option><option value="40">40%</option><option value="60">60%</option><option value="80">80%</option><option value="100">100%</option></select></label><button type="submit" class="btn soft">Save demonstration score</button></form>`;
        container.querySelector('form').onsubmit=e=>{e.preventDefault();const score=Number(e.currentTarget.elements.score.value),level=dual(a)?e.currentTarget.elements.level.value:undefined;data.results.push({student:student.id,assignmentKey:key,score,level,at:new Date().toISOString()});save();renderLearner();};});
    }
    async function start(){try{const response=await fetch('/assets/j277-assignment-catalog.json',{cache:'no-cache'});if(!response.ok)throw Error('Catalogue unavailable');const json=await response.json();if(!Array.isArray(json.items)||json.items.length!==95)throw Error('Unexpected catalogue');catalog=json.items;migrateDemoLevels();render();watchSchedule();}catch(error){app.innerHTML=heading('Catalogue unavailable','Please refresh the page and try again.')+`<section class="panel"><p class="error">The J277 activity catalogue could not be loaded.</p><button class="btn" id="retry">Retry</button></section>`;app.querySelector('#retry').onclick=start;}}
    window.addEventListener('storage',event=>{if(event.key===STORE&&catalog.length){data=read();render();}});
    start();
  })();
  </script>
</body>
</html>
