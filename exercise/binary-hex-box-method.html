<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#006347">
<meta name="description" content="OCR J277 mobile-first 8-bit denary, binary and hexadecimal box method. Works offline.">
<title>Box Method · RHS Computing</title>
<style>
:root{--green:#006347;--dark:#003a31;--ink:#19362b;--muted:#657a6e;--border:#cbdcd1;--wash:#f4f7f5;--mint:#eaf3ed;--good:#087544;--bad:#b93f36}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--wash);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.35}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #dda835;outline-offset:3px}
[hidden]{display:none!important}
.sitehead{background:white;border-bottom:1px solid var(--border)}
.headinner{max-width:580px;margin:auto;display:flex;gap:9px;align-items:center;padding:8px 14px}
.mark{width:31px;height:31px;border-radius:8px;background:var(--green);color:#fff;font-weight:900;font-size:19px;display:grid;place-items:center}
.brand{font-weight:900;font-size:13px;color:var(--dark);letter-spacing:.01em}
.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.07em;font-weight:700}
main{width:min(100%,580px);margin:auto;padding:12px 11px 24px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 1px 10px}
h1{font-size:22px;letter-spacing:-.035em;line-height:1.15;margin:0;color:var(--dark)}
.tag{font-size:10px;letter-spacing:.04em;font-weight:800;color:#426d57;background:#e4efe8;border-radius:30px;padding:5px 9px;white-space:nowrap}
.worksheet{background:#fff;border:1px solid var(--border);border-radius:15px;overflow:hidden;box-shadow:0 3px 14px #11452d0a}
.target{text-align:center;background:var(--mint);padding:13px 10px 11px;border-bottom:1px solid #cae0d1}
.label{font-weight:900;letter-spacing:.12em;color:#416350;font-size:10px}
.number{font-weight:900;font-family:Consolas,'Courier New',monospace;font-size:45px;line-height:1.2;letter-spacing:.035em;color:var(--dark);font-variant-numeric:tabular-nums}
.section{padding:13px 12px 0}
.section-title{font-weight:850;font-size:14px;display:flex;align-items:center;gap:7px;justify-content:space-between;margin:0 0 10px;color:var(--dark)}
.section-title small{font-size:10.5px;color:var(--muted);font-weight:600}
.step{display:grid;place-items:center;background:var(--green);border-radius:50%;color:#fff;font-size:11px;font-weight:850;width:20px;height:20px;flex:0 0 20px}
.section-title .first{display:flex;gap:7px;align-items:center}
.bits{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.bit-cell{min-width:0;border:1px solid #d4e2d8;border-radius:8px;background:#f8fbf8;padding:5px 2px 6px;text-align:center}
.bit-cell:nth-child(4){border-right:3px solid var(--green)}.bit-cell:nth-child(5){border-left:3px solid var(--green)}
.weight{color:#4f6f5c;font-size:11px;font-weight:900;margin-bottom:6px;font-variant-numeric:tabular-nums}
.bit{display:block;width:100%;height:48px;border:1.5px solid #a7c6b2;border-radius:7px;background:white;color:var(--dark);font-size:24px;line-height:1;font-weight:900;font-family:Consolas,'Courier New',monospace;touch-action:manipulation}
.bit.selected{background:#e9f5eb;border-color:#43946b}
.bit.good,.field.good{border-color:var(--good)!important;background:#e6f7ea!important}
.bit.bad,.field.bad{border-color:var(--bad)!important;background:#fff0ed!important}
.half-labels{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 0;text-align:center;font-size:10.5px;color:#538166;font-weight:850}
.half-labels>span{border-top:2px solid #9abdac;padding-top:4px}
.nibbles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.nibble{background:#f9fbf9;border:1px solid #d5e4da;border-radius:10px;padding:8px 8px 10px;min-width:0;text-align:center}
.nibble h3{margin:0 0 8px;font-size:12px;color:#345b45;font-weight:850}
.nibble-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}
.tinyweight{font-size:10px;color:#617d6b;font-weight:850}
.tinybit{display:block;font-family:Consolas,'Courier New',monospace;font-size:16px;font-weight:900;color:var(--dark);margin-top:1px;min-height:21px}
.tinycontrib{font-size:15px;font-weight:900;color:#366f4c;min-height:21px;margin-top:3px}
.sum{height:21px;font:800 12px/21px Consolas,'Courier New',monospace;color:#40694f;white-space:nowrap;overflow:hidden}
.fields{display:flex;align-items:end;justify-content:center;gap:6px;margin-top:4px}
.fieldgroup{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.fieldgroup label{font-size:10px;color:#5c7766;font-weight:900;letter-spacing:.05em}
.field{height:43px;width:59px;max-width:100%;border-radius:7px;border:1.5px solid #a4c4ae;background:white;color:var(--dark);text-align:center;font-size:23px;font-weight:900;font-family:Consolas,'Courier New',monospace;text-transform:uppercase;outline-offset:2px}
.field.hex{width:49px}
.equal{align-self:end;margin-bottom:8px;font-size:19px;font-weight:900;color:#669078}
.hexresult{display:flex;align-items:center;justify-content:center;gap:13px;padding:10px 14px 12px;margin:10px 12px 0;background:var(--mint);border-radius:10px}
.hexresult strong{font-size:12px;color:#365b46;letter-spacing:.06em}
.hexresult span{font:900 31px/1 Consolas,'Courier New',monospace;color:var(--dark);letter-spacing:.15em;min-width:53px}
.actions{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:7px;padding:12px}
.action{min-height:46px;padding:7px;border-radius:9px;font-weight:850;border:1px solid #a7c3b1;font-size:14px}
.check{background:var(--green);color:#fff;border-color:var(--green)}
.show{background:white;color:var(--dark)}
.next{background:#e2efe6;color:var(--dark);border-color:#b7d6c1}
.feedback{text-align:center;font-size:12.5px;color:#5b7664;min-height:18px;margin:0;padding:0 12px 12px}
.feedback.success{color:#087544;font-weight:800}
.feedback.error{color:#a33a32;font-weight:800}
.teacher{margin:10px 3px 0;color:#597264;font-size:12px}
.teacher summary{cursor:pointer;font-weight:750;padding:7px 5px;display:list-item;list-style-position:inside}
.teacher-controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:8px 4px 6px}
.teacher-controls input{width:85px;padding:9px 7px;min-height:42px;border:1px solid #a6c2b0;border-radius:8px;color:var(--dark)}
.teacher-controls button{padding:9px 13px;min-height:42px;border:1px solid var(--green);border-radius:8px;background:white;color:var(--green);font-weight:850}
.footer{font-size:11px;color:#7a8e80;text-align:center;margin:12px 3px 0}
@media(min-width:480px){main{padding-top:17px}.section{padding:15px 22px 0}.bits{gap:7px}.bit-cell{padding:7px 4px}.nibbles{gap:12px}.nibble{padding:13px}.actions{padding:15px 22px}.hexresult{margin:13px 22px 0}}
@media(max-width:359px){.section{padding:10px 8px 0}.bits{gap:3px}.bit-cell{padding:4px 1px}.weight{font-size:10px}.bit{font-size:21px;height:43px}.nibbles{gap:5px}.nibble{padding:7px 4px}.fields{gap:3px}.field{width:48px;height:40px}.field.hex{width:40px}.equal{font-size:16px}.actions{gap:5px;padding:10px}.action{font-size:12px}}
</style>
</head>
<body>
<header class="sitehead"><div class="headinner"><div class="mark" aria-hidden="true">R</div><div class="brand">RHS COMPUTING<small>OCR J277 · PAPER 1</small></div></div></header>
<main>
 <div class="topline"><h1>Box method</h1><span class="tag">8 BIT · 0–255</span></div>
 <div class="worksheet">
  <section class="target"><div class="label">DENARY</div><div class="number" id="number">173</div></section>
  <section class="section" aria-label="Binary boxes">
   <div class="section-title"><span class="first"><span class="step">1</span> Binary</span><small>Tap boxes: 1 → 0</small></div>
   <div class="bits" id="bits" role="group" aria-label="Binary digits for place values 128 to 1"></div>
  </section>
  <section class="section" aria-label="Four-bit totals">
   <div class="section-title"><span class="first"><span class="step">2</span> 4-bit groups</span><small>8 · 4 · 2 · 1</small></div>
   <div class="nibbles">
    <div class="nibble"><h3>LEFT</h3><div class="nibble-grid" id="leftGrid"></div><div class="sum" id="leftSum">· + · + · + ·</div><div class="fields"><div class="fieldgroup"><label for="leftTotal">TOTAL</label><input class="field" id="leftTotal" type="text" inputmode="numeric" autocomplete="off" maxlength="2"></div><span class="equal">=</span><div class="fieldgroup"><label for="leftHex">HEX</label><input class="field hex" id="leftHex" type="text" maxlength="1" autocapitalize="characters" autocomplete="off"></div></div></div>
    <div class="nibble"><h3>RIGHT</h3><div class="nibble-grid" id="rightGrid"></div><div class="sum" id="rightSum">· + · + · + ·</div><div class="fields"><div class="fieldgroup"><label for="rightTotal">TOTAL</label><input class="field" id="rightTotal" type="text" inputmode="numeric" autocomplete="off" maxlength="2"></div><span class="equal">=</span><div class="fieldgroup"><label for="rightHex">HEX</label><input class="field hex" id="rightHex" type="text" maxlength="1" autocapitalize="characters" autocomplete="off"></div></div></div>
   </div>
  </section>
  <div class="actions"><button class="action check" type="button" id="check">Check</button><button class="action show" type="button" id="reveal">Show</button><button class="action next" type="button" id="next">Next →</button></div>
  <p class="feedback" role="status" id="feedback" aria-live="polite">Fill all boxes.</p>
 </div>
 <details class="teacher" id="teacher"><summary>Choose a number</summary><div class="teacher-controls"><label for="custom">Denary</label><input id="custom" inputmode="numeric" type="number" min="0" max="255" step="1" value="173"><button type="button" id="set">Set</button><button type="button" id="clear">Clear answers</button></div></details>
 <div class="footer">Works offline · No account needed</div>
</main>
<script>
'use strict';
const W=[128,64,32,16,8,4,2,1], NW=[8,4,2,1];
const $=id=>document.getElementById(id);
const bits=[];let current=173;
function data(n){return{n,binary:n.toString(2).padStart(8,'0'),left:Math.floor(n/16),right:n%16,hex:n.toString(16).toUpperCase().padStart(2,'0')}}
function clearMarks(){for(const el of [...bits,$('leftTotal'),$('rightTotal'),$('leftHex'),$('rightHex')])el.classList.remove('bad','good')}
function notify(message,kind=''){$('feedback').textContent=message;$('feedback').className='feedback'+(kind?' '+kind:'')}
function update(){const values=bits.map(b=>b.dataset.value||'');for(const [side,offset] of [['left',0],['right',4]]){const parent=$(side+'Grid');const terms=[];for(let j=0;j<4;j++){const v=values[offset+j];const cell=parent.children[j];const contribution=v===''?'·':String(Number(v)*NW[j]);cell.children[1].textContent=contribution;terms.push(contribution)}$(side+'Sum').textContent=terms.join(' + ')}
}
function toggle(i){const bit=bits[i];const old=bit.dataset.value;bit.dataset.value=old===''?'1':old==='1'?'0':'1';bit.textContent=bit.dataset.value;bit.classList.add('selected');clearMarks();update();notify('Fill all boxes.')}
function initialize(){W.forEach((w,i)=>{const wrap=document.createElement('div');wrap.className='bit-cell';const number=document.createElement('div');number.className='weight';number.textContent=String(w);const button=document.createElement('button');button.type='button';button.className='bit';button.dataset.value='';button.setAttribute('aria-label',w+'s column. Tap to set 1 or 0');button.setAttribute('aria-pressed','false');button.textContent='·';button.onclick=()=>{toggle(i);button.setAttribute('aria-pressed',button.dataset.value==='1'?'true':'false')};wrap.append(number,button);$('bits').appendChild(wrap);bits.push(button)});
for(const name of ['left','right']){const root=$(name+'Grid');for(const n of NW){const cell=document.createElement('div');const weight=document.createElement('div');weight.className='tinyweight';weight.textContent=n;const contribution=document.createElement('div');contribution.className='tinycontrib';contribution.textContent='·';cell.append(weight,contribution);root.appendChild(cell)}}
for(const k of ['leftTotal','rightTotal','leftHex','rightHex'])$(k).addEventListener('input',e=>{const el=e.target;el.value=k.endsWith('Hex')?el.value.replace(/[^a-f0-9]/gi,'').toUpperCase():el.value.replace(/\D/g,'');clearMarks();update();notify('Fill all boxes.')});
newPuzzle(173)}
function newPuzzle(value){if(!Number.isInteger(value)||value<0||value>255){notify('Choose a whole number from 0 to 255.','error');return false}current=value;$('number').textContent=String(value);for(const bit of bits){bit.dataset.value='';bit.textContent='·';bit.classList.remove('selected');bit.setAttribute('aria-pressed','false')}for(const id of ['leftTotal','rightTotal','leftHex','rightHex'])$(id).value='';clearMarks();update();notify('Fill all boxes.');return true}
function check(){const e=data(current);let wrong=0;bits.forEach((bit,i)=>{const good=bit.dataset.value===e.binary[i];bit.classList.toggle('good',good);bit.classList.toggle('bad',!good);if(!good)wrong++});for(const [id,ans] of [['leftTotal',e.left],['rightTotal',e.right],['leftHex',e.hex[0]],['rightHex',e.hex[1]]]){const field=$(id);const entered=field.value.trim().toUpperCase();const good=entered!==''&&(id.endsWith('Total')?Number(entered)===ans:entered===ans);field.classList.toggle('good',good);field.classList.toggle('bad',!good);if(!good)wrong++}if(!wrong){notify('✓ Correct: '+e.n+' = '+e.binary.slice(0,4)+' '+e.binary.slice(4)+' = '+e.hex,'success')}else notify(wrong+' to check · red boxes need another look','error');return wrong===0}
function reveal(){const e=data(current);bits.forEach((bit,i)=>{bit.dataset.value=e.binary[i];bit.textContent=e.binary[i];bit.classList.add('selected');bit.setAttribute('aria-pressed',e.binary[i]==='1'?'true':'false')});$('leftTotal').value=String(e.left);$('rightTotal').value=String(e.right);$('leftHex').value=e.hex[0];$('rightHex').value=e.hex[1];clearMarks();update();notify('Answer shown · '+e.n+' = '+e.hex)}
function next(){let n=Math.floor(Math.random()*256);if(n===current)n=(n+1)%256;newPuzzle(n)}
$('check').onclick=check;$('reveal').onclick=reveal;$('next').onclick=next;
$('set').onclick=()=>{const raw=$('custom').value.trim();if(!/^\d{1,3}$/.test(raw)||!newPuzzle(Number(raw)))return;$('teacher').open=false};
$('clear').onclick=()=>newPuzzle(current);
$('custom').addEventListener('keydown',e=>{if(e.key==='Enter')$('set').click()});
initialize();
window.__boxMethod={data,newPuzzle,check,reveal,next,bits};
</script>
</body>
</html>
