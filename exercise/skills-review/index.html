<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#285348">
  <meta name="description" content="Review proposed J277 and H446 interactive Computer Science Skills before classroom release.">
  <title>Skills to review · Synergy Assist</title>
  <link rel="stylesheet" href="/assets/synergy-tokens.css?v=20261101-brand1">
  <link rel="stylesheet" href="/assets/site-nav.css?v=20261101-icon-only1">
  <link rel="stylesheet" href="/assets/synergy-brand.css?v=20261101-logo1">
  <link rel="stylesheet" href="/assets/skills-review.css?v=20261114-preview1">
</head>
<body>
<header class="review-header"><a id="back" href="/exercise/">← Skills</a><span id="qualification">OCR Computer Science</span><a class="sa-brand" href="/" aria-label="Synergy Assist home"><span class="synergy-brand-icon" aria-hidden="true"></span></a></header>
<main class="review-main">
  <div class="review-bar">
    <div class="review-heading"><div class="eyebrow" id="spec">OCR · SKILLS PREVIEW</div><h1 id="title">New Skill to review</h1><p id="subtitle">Try this activity and check the teaching method.</p></div>
    <span class="review-badge">REVIEW · NOT IN MASTERY</span>
  </div>
  <div class="review-settings"><span id="question-number">Question 1</span><div class="levels" role="group" aria-label="Difficulty"><button data-level="easy" aria-pressed="true">Easy</button><button data-level="medium" aria-pressed="false">Medium</button><button data-level="hard" aria-pressed="false">Hard</button></div><button id="demo-launch" class="secondary">▶ Demo</button></div>
  <section id="activity" aria-label="Current review challenge">
    <div class="review-prompt"><h2 id="prompt"></h2><p id="instruction"></p></div>
    <div class="review-grid"><div class="review-card" id="visual" aria-label="Question model or diagram"></div><div class="review-card answer-card"><h3>Your answer</h3><div id="entry"></div><p id="feedback" class="feedback" aria-live="polite"></p></div></div>
    <div class="review-actions"><button id="hint" class="secondary">Show hint</button><button id="check" class="primary">Check answer</button><button id="model" class="secondary">Show model</button><button id="next" class="secondary">Next question →</button></div>
    <div id="explainer" class="explainer" hidden></div>
  </section>
  <section id="demo" class="review-demo" hidden aria-label="Separate worked demonstration"><button id="demo-back" class="secondary">← Back to practice</button><h2 id="demo-title"></h2><p id="demo-prompt"></p><ol id="demo-steps"></ol><div class="review-actions"><button id="demo-step" class="primary">⏭ Next step</button><button id="demo-reset" class="secondary">↺ Start again</button></div></section>
  <footer>Teacher review preview · answers and scores are not sent anywhere or added to Skills mastery.</footer>
</main>
<script src="/assets/skills-review.js?v=20261124-cpu2"></script>
<script src="/assets/site-nav.js?v=20261107-quickbar1" defer></script>
</body>
</html>
