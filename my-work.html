<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#006347">
  <meta name="description" content="My Work: fictional J277 assigned Skills and Revision Practice pilot.">
  <title>My Work · RHS Computing</title>
  <style>
    :root{color-scheme:light;--green:#006347;--dark:#143d30;--ink:#203e32;--muted:#5b7064;--line:#d4e2d8;--bg:#f5f8f6;--soft:#edf6f0;--amber:#88610d}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:var(--green)}:focus-visible{outline:3px solid #e6a62d;outline-offset:2px}
    .skip{position:absolute;left:-10000px}.skip:focus{top:6px;left:8px;background:#fff;z-index:10;padding:10px}.top{background:#fff;border-bottom:1px solid var(--line)}.bar{max-width:1080px;min-height:64px;padding:11px 20px;margin:auto;display:flex;gap:12px;align-items:center}.brand{display:flex;gap:10px;align-items:center;color:var(--dark);text-decoration:none}.mark{width:37px;height:37px;border-radius:9px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:900}.brand small{display:block;font-size:10px;letter-spacing:.12em;color:var(--green);font-weight:900}.brand strong{font-size:18px}.home{margin-left:auto;font-size:13px;text-decoration:none;font-weight:800}
    main{max-width:1080px;margin:auto;padding:24px 20px 50px}.heading{display:flex;justify-content:space-between;align-items:start;gap:14px;margin:0 0 15px}.heading h1{font-size:clamp(28px,3.8vw,38px);line-height:1.1;letter-spacing:-.045em;margin:5px 0}.heading p{color:var(--muted);margin:3px 0}.eyebrow{font-size:11px;letter-spacing:.13em;color:var(--green);font-weight:900;text-transform:uppercase}.small{font-size:12px;color:var(--muted)}.notice{border:1px solid #e9dba9;border-radius:10px;background:#fff9e8;color:#695523;padding:10px 13px;font-size:12px;margin:12px 0 20px}.notice strong{color:#594417}
    .panel,.work-card,.metric{background:#fff;border:1px solid var(--line);border-radius:14px}.panel{padding:22px}.panel h2{font-size:19px;color:var(--dark);margin:0 0 11px}.entry{max-width:600px;margin:22px auto}.entry p{color:var(--muted)}.field{display:grid;gap:6px;font-size:13px;font-weight:800}.field input,.field select{min-height:43px;padding:9px 11px;border:1px solid #b7cbbe;border-radius:9px;width:100%;background:#fff;color:var(--dark)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--green);border-radius:9px;min-height:41px;padding:9px 15px;background:var(--green);color:#fff;text-decoration:none;font-weight:800;font-size:13px}.btn.alt{background:#fff;color:var(--green)}.btn.soft{background:var(--soft);color:var(--green);border-color:var(--line)}.btn:disabled{opacity:.55;cursor:not-allowed}.form-stack{display:grid;gap:14px}.error{color:#a43a32;font-size:12px;font-weight:800}.hint{font-size:12px;color:var(--muted)}
    .metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin:16px 0 19px}.metric{padding:13px 16px}.metric strong{display:block;color:var(--dark);font-size:27px;line-height:1.2;letter-spacing:-.04em}.metric span{display:block;margin-top:3px;font-size:12px;color:var(--muted);font-weight:800}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0 13px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);border-radius:9px;padding:10px 13px;background:#fff;color:var(--dark);font-weight:900}.tabs button[aria-pressed=true]{background:var(--green);color:#fff;border-color:var(--green)}.filter{margin-left:auto;min-width:180px}.filter select{min-height:40px}
    .cards{display:grid;gap:11px}.work-card{padding:16px 18px}.card-top,.actions,.level-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.card-top{justify-content:space-between}.card-top h2{font-size:17px;line-height:1.3;margin:4px 0;color:var(--dark)}.kind{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:900}.status{display:inline-flex;align-items:center;font-size:11px;font-weight:900;border-radius:30px;padding:5px 9px;background:#eff3ef;color:#596d61;white-space:nowrap}.status.amber{background:#fff0cd;color:#815b0c}.status.green{background:#dff1e4;color:#1b6639}.work-card p{margin:7px 0;color:var(--muted);font-size:13px}.level-row{margin:9px 0 12px}.level{border-radius:7px;background:#f2f6f3;padding:7px 10px;font-size:12px;font-weight:800}.level strong{font-weight:900}.level.pass{background:#e0f2e4;color:#1b6339}.actions{margin-top:10px}.spacer{flex:1}.card-hint{font-size:11px;color:var(--muted);margin:7px 0 0}.demo-button{font-size:12px}.score-form{padding:12px;margin-top:12px;border-radius:10px;background:#f7faf8;display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}.empty{border:1px dashed var(--line);border-radius:12px;background:#fff;padding:26px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--dark);font-size:17px;margin-bottom:6px}.footer{text-align:center;padding:16px;color:var(--muted);font-size:12px}
    @media(max-width:700px){.filter{margin-left:0;width:100%}.score-form{grid-template-columns:1fr 1fr}.score-form .btn{grid-column:1/-1}}
    @media(max-width:480px){.bar{padding:10px 12px}.brand strong{font-size:16px}.home{font-size:12px}main{padding:18px 12px 45px}.heading{flex-direction:column}.panel{padding:17px}.metrics{gap:7px}.metric{padding:10px}.metric strong{font-size:24px}.metric span{font-size:11px}.work-card{padding:14px}.card-top{align-items:flex-start}.actions .btn{flex:1}.score-form{grid-template-columns:1fr}.score-form .btn{grid-column:auto}}
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to My Work</a>
  <header class="top"><div class="bar"><a class="brand" href="/" aria-label="Learning Hub home"><span class="mark">SA</span><span><small>SYNERGY ASSIST</small><strong>My Work</strong></span></a><a class="home" href="/">← Learning Hub</a></div></header>
  <main id="main"><div id="app"><p>Loading assigned work…</p></div></main>
  <footer class="footer">RHS Computing · OCR J277 · Fictional demonstration data only</footer>
  <script src="/assets/j277-independent-work-hours.js"></script>
  <script>
  (()=>{'use strict';
    const STORE='rhs-j277-teacher-demo-v1',SESSION='rhs-j277-my-work-demo-student';
    const app=document.querySelector('#app');let catalog=[],learner=sessionStorage.getItem(SESSION)||'',view='todo',type='all',message='';
    const studentPattern=/^Y(10|11)-(0[1-9]|[12][0-9]|30)$/;
    // Return from an assigned activity in another tab (fictional IDs only).
    const returning=new URLSearchParams(location.search).get('demoReturn');if(studentPattern.test(returning||'')){learner=returning;sessionStorage.setItem(SESSION,returning);history.replaceState(null,'',location.pathname);}
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function read(){try{const value=JSON.parse(localStorage.getItem(STORE));return value&&Array.isArray(value.assignments)&&Array.isArray(value.results)?value:{assignments:[],results:[]};}catch{return{assignments:[],results:[]};}}
    let data=read();
    const byId=id=>catalog.find(x=>x.id===id);
    const dual=a=>a.level==='both'&&byId(a.itemId)?.type==='skill';
    const workFor=code=>data.assignments.filter(a=>a.year===Number(code.slice(1,3))&&byId(a.itemId));
    const records=(code,key,level)=>data.results.filter(x=>x.student===code&&x.assignmentKey===key&&(level===undefined||x.level===level));
    const best=(code,key,level)=>{const rows=records(code,key,level);return rows.length?Math.max(...rows.map(x=>x.score)):null;};
    const mastered=(code,a)=>dual(a)?(best(code,a.key,'medium')??-1)>=80:(best(code,a.key)??-1)>=80;
    const started=(code,a)=>records(code,a.key).length>0;
    const status=(code,a)=>mastered(code,a)?'mastered':started(code,a)?'progress':'new';
    const score=n=>n===null?'—':n+'%';
    const url=(a,level)=>{const item=byId(a.itemId);if(!item)return '#';const dest=new URL(item.url,location.origin);if(item.type==='skill'){if(item.paper===1)dest.searchParams.set('skill',item.sourceKey);dest.searchParams.set('level',level||'easy');}dest.searchParams.set('workCode',learner);dest.searchParams.set('workKey',a.key);return dest.pathname+dest.search+dest.hash;};
    function migrateDemoLevels(){const old=data.assignments.filter(a=>byId(a.itemId)?.type==='skill'&&a.level!=='both');if(!old.length)return;try{const backup='rhs-j277-teacher-demo-before-level-migration-v1';if(!localStorage.getItem(backup))localStorage.setItem(backup,JSON.stringify(data));}catch{}for(const a of old){const key=a.year+'|'+a.itemId+'|both';if(!data.assignments.some(x=>x.key===key))data.assignments.push({key,year:a.year,itemId:a.itemId,level:'both',at:a.at});for(const r of data.results){if(r.assignmentKey===a.key){r.assignmentKey=key;r.level=r.level||a.level;}}}data.assignments=data.assignments.filter(a=>!old.includes(a));localStorage.setItem(STORE,JSON.stringify(data));}
    const banner='<div class="notice"><strong>Fictional pilot.</strong> Assigned Skills and Revision Practice save completed scores automatically when opened from My Work. Skills marks use first-try accuracy. Everything stays in this browser, not across devices; do not use real pupil details.</div>';
    const canEnter=()=>window.RHSIndependentWorkHours?.isOpen()===true;
    function render(){data=read();if(!canEnter())return renderClosed();if(!studentPattern.test(learner))return renderEntry();renderWork();}
    function renderClosed(){app.innerHTML=`<div class='heading'><div><span class='eyebrow'>RHS COMPUTING · OCR J277</span><h1>My Work</h1><p>Independent study outside lessons.</p></div></div>${banner}<section class='panel entry'><h2>My Work is closed during lessons</h2><p>Homework and revision practice are for independent study. Please use your teacher's lesson activities during class time.</p><p><strong>Student access:</strong> ${window.RHSIndependentWorkHours?.label||"School days: 12:30–13:20 and 15:30–midnight. Weekends and school holidays: all day (UK time)."}</p><a class='btn alt' href='/'>Back to Learning Hub</a><p class='hint'>Teachers can demonstrate learner progress at any time through their Teacher Dashboard.</p></section>`;}
    let watchingSchedule=false;
    function watchSchedule(){if(watchingSchedule)return;watchingSchedule=true;let previous=canEnter();setInterval(()=>{const current=canEnter();if(current!==previous){previous=current;render();}},15000);}
    function renderEntry(){app.innerHTML=`<div class="heading"><div><span class="eyebrow">RHS COMPUTING · OCR J277</span><h1>My Work</h1><p>Your Skills and Revision Practice, together.</p></div></div>${banner}<section class="panel entry"><h2>Open your work</h2><p>For this pilot, use a fictional learner code, such as <strong>Y10-01</strong> or <strong>Y11-01</strong>.</p><form id="openWork" class="form-stack"><label class="field">Learner code<input name="code" placeholder="Y10-01" autocomplete="off" autocapitalize="characters" required></label><button class="btn" type="submit">Show My Work →</button><span class="error" id="codeError" hidden>Enter Y10-01 to Y10-30 or Y11-01 to Y11-30.</span></form></section>`;app.querySelector('#openWork').onsubmit=e=>{e.preventDefault();if(!canEnter()){renderClosed();return;}const code=e.currentTarget.elements.code.value.trim().toUpperCase();if(!studentPattern.test(code)){app.querySelector('#codeError').hidden=false;return;}learner=code;sessionStorage.setItem(SESSION,code);render();};}
    function activityCard(a){const item=byId(a.itemId),isDual=dual(a),kind=item.type==='skill'?'Skill':'Revision Practice',s=status(learner,a),stateText=s==='mastered'?'Mastered':s==='progress'?'In progress':'Not started';const levelInfo=isDual?`<div class="level-row"><span class="level ${((best(learner,a.key,'easy')??-1)>=80)?'pass':''}">Easy <strong>${score(best(learner,a.key,'easy'))}</strong></span><span class="level ${((best(learner,a.key,'medium')??-1)>=80)?'pass':''}">Medium <strong>${score(best(learner,a.key,'medium'))}</strong></span></div>`:`<p>Five-question revision quiz · Target 80% · Best score ${score(best(learner,a.key))}</p>`;
      const actions=isDual?`<a class="btn soft" href="${esc(url(a,'easy'))}" target="_blank" rel="noopener">1 · Easy ↗</a><a class="btn" href="${esc(url(a,'medium'))}" target="_blank" rel="noopener">2 · Medium ↗</a>`:`<a class="btn" href="${esc(url(a))}" target="_blank" rel="noopener">${s==='new'?'Start practice':'Practise again'} ↗</a>`;
      return `<article class="work-card"><div class="card-top"><div><span class="kind">${kind} · Paper ${item.paper} · ${esc(item.spec)}</span><h2>${esc(item.title)}</h2></div><span class="status ${s==='mastered'?'green':s==='progress'?'amber':''}">${stateText}</span></div>${levelInfo}<div class="actions">${actions}<span class="spacer"></span><button class="btn alt demo-button" data-test="${esc(a.key)}">Test demo score</button></div>${isDual&&item.paper===1?'<p class="card-hint">The selected level opens automatically; you can still switch levels on the Skill page.</p>':''}<div data-score-form="${esc(a.key)}"></div></article>`;
    }
    function renderWork(){const year=learner.slice(1,3),number=learner.slice(4),work=workFor(learner),completed=work.filter(a=>mastered(learner,a)),inProgress=work.filter(a=>status(learner,a)==='progress'),todo=work.filter(a=>!mastered(learner,a));const showing=(view==='completed'?completed:todo).filter(a=>type==='all'||byId(a.itemId).type===type);
      app.innerHTML=`<div class="heading"><div><span class="eyebrow">RHS COMPUTING · YEAR ${year}</span><h1>My Work</h1><p>Student ${number} · ${learner}</p></div><button class="btn alt" id="switchLearner">Switch learner</button></div>${banner}${message?`<div class="notice" role="status">${esc(message)}</div>`:''}<div class="metrics"><div class="metric"><strong>${work.length}</strong><span>Activities set</span></div><div class="metric"><strong>${inProgress.length}</strong><span>In progress</span></div><div class="metric"><strong>${completed.length}</strong><span>Mastered</span></div></div><div class="controls"><nav class="tabs" aria-label="Work status"><button data-view="todo" aria-pressed="${view==='todo'}">To do · ${todo.length}</button><button data-view="completed" aria-pressed="${view==='completed'}">Completed · ${completed.length}</button></nav><label class="field filter">Type<select id="workType"><option value="all">All work</option><option value="skill">Skills</option><option value="practice">Revision Practice</option></select></label></div><section class="cards" aria-label="Assigned activities">${showing.length?showing.map(activityCard).join(''):`<div class="empty"><strong>${view==='completed'?'Nothing mastered yet':'You’re all caught up'}</strong>${work.length?'No activities match this view.':'No work has been assigned to this fictional class in this browser yet.'}</div>`}</section><p class="hint">Activities open in a new tab. Complete a five-question quiz or a ten-question Skill set, then return here to see your score. For Skills with continuing questions, each block of ten records a new attempt. The demo score control remains available for testing.</p>`;
      app.querySelector('#switchLearner').onclick=()=>{learner='';sessionStorage.removeItem(SESSION);message='';renderEntry();};app.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>{view=button.dataset.view;message='';renderWork();});app.querySelector('#workType').value=type;app.querySelector('#workType').onchange=e=>{type=e.target.value;renderWork();};
      app.querySelectorAll('[data-test]').forEach(button=>button.onclick=()=>{const key=button.dataset.test,a=work.find(a=>a.key===key),target=[...app.querySelectorAll('[data-score-form]')].find(x=>x.dataset.scoreForm===key);if(!a||!target)return;target.innerHTML=`<form class="score-form">${dual(a)?'<label class="field">Level<select name="level"><option value="easy">Easy</option><option value="medium">Medium</option></select></label>':''}<label class="field">Fictional score<select name="score"><option value="0">0%</option><option value="20">20%</option><option value="40">40%</option><option value="60">60%</option><option value="80">80%</option><option value="100">100%</option></select></label><button class="btn soft" type="submit">Save demo score</button></form>`;target.querySelector('form').onsubmit=e=>{e.preventDefault();const level=dual(a)?e.currentTarget.elements.level.value:undefined,score=Number(e.currentTarget.elements.score.value);data.results.push({student:learner,assignmentKey:key,level,score,at:new Date().toISOString()});localStorage.setItem(STORE,JSON.stringify(data));message='Saved a fictional '+score+'% result for '+byId(a.itemId).title+'.';renderWork();};});
    }
    async function start(){try{const response=await fetch('/assets/j277-assignment-catalog.json',{cache:'no-cache'});if(!response.ok)throw Error('Missing catalogue');const value=await response.json();if(!Array.isArray(value.items)||value.items.length!==95)throw Error('Invalid catalogue');catalog=value.items;migrateDemoLevels();render();watchSchedule();}catch(error){app.innerHTML='<section class="panel"><h2>Unable to load My Work</h2><p>Please refresh the page and try again.</p><button class="btn" id="retry">Retry</button></section>';app.querySelector('#retry').onclick=start;}}
    window.addEventListener('storage',e=>{if(e.key===STORE&&catalog.length)render();});start();
  })();
  </script>
</body>
</html>
