<svg xmlns="http://www.w3.org/2000/svg" width="660" height="645" viewBox="0 0 660 645" role="img" aria-labelledby="title desc"><title id="title">Flowchart: accumulating a running total</title><desc id="desc">Start, set total to zero and count to one; while count is at most four add count to total and then increase count by one; when false output total and end.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#224d42"/></marker></defs><rect width="660" height="645" fill="white"/><ellipse cx="245" cy="52" rx="70" ry="28" fill="#f1faf5" stroke="#224d42" stroke-width="3"/><text x="245" y="60" font-size="22" text-anchor="middle" font-family="Arial, sans-serif" fill="#173f33" font-weight="600">Start</text><rect x="132" y="124" width="226" height="60" rx="2" fill="white" stroke="#224d42" stroke-width="3"/><text x="245" y="162" font-size="22" text-anchor="middle" font-family="Arial, sans-serif" fill="#173f33" font-weight="600">total = 0, count = 1</text><polygon points="245,218 362.5,270 245,322 127.5,270" fill="#f6fafb" stroke="#224d42" stroke-width="3"/><text x="245" y="277" font-size="20" text-anchor="middle" font-family="Arial, sans-serif" fill="#173f33" font-weight="600">count &lt;= 4?</text><rect x="132" y="365" width="226" height="65" rx="2" fill="white" stroke="#224d42" stroke-width="3"/><text x="245" y="405.5" font-size="22" text-anchor="middle" font-family="Arial, sans-serif" fill="#173f33" font-weight="600">total = total + count</text><rect x="132" y="472" width="226" height="65" rx="2" fill="white" stroke="#224d42" stroke-width="3"/><text x="245" y="512.5" font-size="22" text-anchor="middle" font-family="Arial, sans-serif" fill="#173f33" font-weight="600">count = count + 1</text><polygon points="458,367 634,367 614,432 438,432" fill="white" stroke="#224d42" stroke-width="3"/><text x="536" y="407.5" font-size="22" text-anchor="middle" font-family="Arial, sans-serif" fill="#173f33" font-weight="600">Output total</text><ellipse cx="536" cy="550" rx="70" ry="30" fill="#f1faf5" stroke="#224d42" stroke-width="3"/><text x="536" y="558" font-size="22" text-anchor="middle" font-family="Arial, sans-serif" fill="#173f33" font-weight="600">End</text><path d="M245 80 V124" fill="none" stroke="#224d42" stroke-width="3" stroke-linejoin="round" marker-end="url(#tip)"/><path d="M245 184 V218" fill="none" stroke="#224d42" stroke-width="3" stroke-linejoin="round" marker-end="url(#tip)"/><path d="M245 322 V365" fill="none" stroke="#224d42" stroke-width="3" stroke-linejoin="round" marker-end="url(#tip)"/><path d="M245 430 V472" fill="none" stroke="#224d42" stroke-width="3" stroke-linejoin="round" marker-end="url(#tip)"/><path d="M132 505 H65 V270 H127" fill="none" stroke="#224d42" stroke-width="3" stroke-linejoin="round" marker-end="url(#tip)"/><path d="M363 270 H536 V367" fill="none" stroke="#224d42" stroke-width="3" stroke-linejoin="round" marker-end="url(#tip)"/><path d="M536 432 V520" fill="none" stroke="#224d42" stroke-width="3" stroke-linejoin="round" marker-end="url(#tip)"/><text x="277" y="349" font-size="17" text-anchor="middle" font-family="Arial, sans-serif" fill="#173f33" font-weight="600">Yes</text><text x="443" y="257" font-size="17" text-anchor="middle" font-family="Arial, sans-serif" fill="#173f33" font-weight="600">No</text></svg>
