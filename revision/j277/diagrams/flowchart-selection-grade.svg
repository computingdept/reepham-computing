<svg xmlns="http://www.w3.org/2000/svg" width="620" height="595" viewBox="0 0 620 595" role="img" aria-labelledby="title desc"><title id="title">Flowchart: threshold selection</title><desc id="desc">Start. Input n. If n &gt;= 10? is true, output High, otherwise output Low. End.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#224d42"/></marker></defs><rect width="620" height="595" fill="white"/><ellipse cx="310" cy="55" rx="73" ry="30" fill="#f1faf5" stroke="#224d42" stroke-width="3"/><text x="310" y="63" font-size="22" text-anchor="middle" font-family="Arial, sans-serif" fill="#173f33" font-weight="600">Start</text><polygon points="235,125 405,125 385,190 215,190" fill="white" stroke="#224d42" stroke-width="3"/><text x="310" y="165.5" font-size="22" text-anchor="middle" font-family="Arial, sans-serif" fill="#173f33" font-weight="600">Input n</text><polygon points="310,232.5 410,290 310,347.5 210,290" fill="#f6fafb" stroke="#224d42" stroke-width="3"/><text x="310" y="297" font-size="20" text-anchor="middle" font-family="Arial, sans-serif" fill="#173f33" font-weight="600">n &gt;= 10?</text><polygon points="40,384 210,384 190,449 20,449" fill="white" stroke="#224d42" stroke-width="3"/><text x="115" y="424.5" font-size="22" text-anchor="middle" font-family="Arial, sans-serif" fill="#173f33" font-weight="600">Output Low</text><polygon points="430,384 600,384 580,449 410,449" fill="white" stroke="#224d42" stroke-width="3"/><text x="505" y="424.5" font-size="22" text-anchor="middle" font-family="Arial, sans-serif" fill="#173f33" font-weight="600">Output High</text><ellipse cx="310" cy="548" rx="73" ry="30" fill="#f1faf5" stroke="#224d42" stroke-width="3"/><text x="310" y="556" font-size="22" text-anchor="middle" font-family="Arial, sans-serif" fill="#173f33" font-weight="600">End</text><path d="M310 85 V125" fill="none" stroke="#224d42" stroke-width="3" stroke-linejoin="round" marker-end="url(#tip)"/><path d="M310 190 V232" fill="none" stroke="#224d42" stroke-width="3" stroke-linejoin="round" marker-end="url(#tip)"/><path d="M210 290 H115 V384" fill="none" stroke="#224d42" stroke-width="3" stroke-linejoin="round" marker-end="url(#tip)"/><path d="M410 290 H505 V384" fill="none" stroke="#224d42" stroke-width="3" stroke-linejoin="round" marker-end="url(#tip)"/><path d="M115 449 V491 H310 V518" fill="none" stroke="#224d42" stroke-width="3" stroke-linejoin="round" marker-end="url(#tip)"/><path d="M505 449 V491 H310" fill="none" stroke="#224d42" stroke-width="3" stroke-linejoin="round" marker-end="url(#tip)"/><text x="163" y="280" font-size="18" text-anchor="middle" font-family="Arial, sans-serif" fill="#173f33" font-weight="600">No</text><text x="462" y="280" font-size="18" text-anchor="middle" font-family="Arial, sans-serif" fill="#173f33" font-weight="600">Yes</text></svg>
