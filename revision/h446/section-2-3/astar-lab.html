<header><a class="back" href="/exercise/h446/tools.html">← H446 Skills</a><span class="brand">RHS COMPUTING · H446</span></header>
<main>
  <div class="top"><div><p class="eyebrow">OCR H446 · 2.3.1(f) · Skills</p><h1>A*: graph and heuristic skills</h1><p class="intro">Calculate the scores. Trace the route. Test the estimate.</p></div><div class="score" id="score">First attempts: —</div></div>
  <div class="controls"><div class="seg" role="group" aria-label="Choose activity"><button type="button" id="tab-graph" aria-pressed="true">Exam trace</button><button type="button" id="tab-heuristic" aria-pressed="false">Heuristic practice</button></div><div class="seg levels" role="group" aria-label="Choose challenge level"><button type="button" data-level="easy" aria-pressed="true">Easy</button><button type="button" data-level="medium" aria-pressed="false">Medium</button><button type="button" data-level="hard" aria-pressed="false">Hard</button></div></div>
  <div id="workspace" aria-live="off"></div>
</main>
<script src="/assets/h446-lesson/trace-table-lab.js?v=20261119a"></script>
<script>
(()=>{'use strict';
const params=new URLSearchParams(location.search),classroom=params.get('classroom')==='1',classroomBoard=classroom&&params.get('model')==='1';
if(classroom)document.body.classList.add('classroom');
let mode=params.get('mode')==='heuristic'?'heuristic':'graph';
let level=['easy','medium','hard'].includes(params.get('level'))?params.get('level'):'easy';
const levelNames={easy:'Guided',medium:'Independent',hard:'Challenge'};
const workspace=document.getElementById('workspace');
const graphBank={
  easy:[
    {v:[['S',52,142],['A',192,48],['B',192,233],['G',365,142]],e:[['S','A',2],['S','B',6],['A','B',2],['A','G',8],['B','G',2]],start:'S',goal:'G',h:{S:5,A:3,B:1,G:0}},
    {v:[['M',52,142],['N',192,48],['O',192,233],['G',365,142]],e:[['M','N',2],['M','O',5],['N','O',2],['N','G',7],['O','G',2]],start:'M',goal:'G',h:{M:4,N:3,O:1,G:0}}
  ],
  medium:[
    {v:[['P',52,142],['Q',192,48],['R',192,233],['G',365,142]],e:[['P','Q',3],['P','R',6],['Q','R',1],['Q','G',8],['R','G',2]],start:'P',goal:'G',h:{P:4,Q:3,R:2,G:0}},
    {v:[['S',38,142],['A',145,49],['B',145,235],['C',267,55],['G',375,142]],e:[['S','A',4],['S','B',2],['A','B',1],['A','C',4],['B','C',3],['B','G',9],['C','G',2]],start:'S',goal:'G'}
  ],
  hard:[
    {v:[['S',36,141],['A',131,48],['B',131,237],['C',248,45],['D',248,237],['G',382,140]],e:[['S','A',8],['S','B',2],['B','A',2],['A','C',2],['B','D',8],['C','D',1],['C','G',6],['D','G',2],['B','G',13]],start:'S',goal:'G'},
    {v:[['P',36,141],['Q',131,48],['R',131,237],['T',248,45],['U',248,237],['G',382,140]],e:[['P','Q',5],['P','R',2],['R','Q',1],['Q','T',3],['R','U',5],['T','U',2],['T','G',5],['U','G',3],['R','G',12]],start:'P',goal:'G'}
  ]
};
const dancerGold={id:'dancergold',v:[['A',34,145],['B',148,40],['C',120,252],['D',239,156],['E',349,55],['F',300,245],['G',390,158]],e:[['A','B',21],['A','C',42],['B','D',38],['B','E',40],['C','D',12],['D','F',23],['E','G',55],['F','G',33]],start:'A',goal:'G',h:{A:90,B:80,C:65,D:50,E:50,F:30,G:0}};
const heurBank={
  easy:[{graph:'easy',index:0,probe:'A',estimate:3},{graph:'easy',index:0,probe:'A',estimate:9},{graph:'easy',index:1,probe:'N',estimate:7}],
  medium:[{graph:'easy',index:1,probe:'N',estimate:6},{graph:'medium',index:0,probe:'Q',estimate:3},{graph:'medium',index:1,probe:'B',estimate:9}],
  hard:[{graph:'hard',index:0,probe:'A',estimate:15},{graph:'medium',index:1,probe:'B',estimate:9},{graph:'hard',index:1,probe:'R',estimate:12}]
};
const storeKey='rhs-h446-astar-skills-v1';
const indexes={graph:{easy:0,medium:0,hard:0},heuristic:{easy:0,medium:0,hard:0}};
const requestedSample=Number(params.get('sample'));
if(Number.isInteger(requestedSample)&&requestedSample>=1&&requestedSample<=(mode==='graph'?graphBank[level]:heurBank[level]).length)indexes[mode][level]=requestedSample-1;
let state=null,feedback='',feedbackType='',first=true;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number.isFinite(n)?String(n):'∞';
function getProgress(){try{return JSON.parse(localStorage.getItem(storeKey)||'{}')}catch(_){return {}}}
function updateScore(){const p=getProgress()[mode+'-'+level]||{attempts:0,correct:0};document.getElementById('score').textContent=p.attempts?`First attempts: ${Math.round(p.correct/p.attempts*100)}%`:'First attempts: —'}
function firstAttempt(ok){if(!first)return;first=false;if(classroom)return;const all=getProgress(),key=mode+'-'+level,p=all[key]||{attempts:0,correct:0};p.attempts++;if(ok)p.correct++;all[key]=p;try{localStorage.setItem(storeKey,JSON.stringify(all))}catch(_){}updateScore()}
function neighbours(graph,n){return graph.e.filter(([a,b])=>a===n||b===n).map(([a,b,w])=>({to:a===n?b:a,w}))}
function shortest(graph,start){const d=Object.fromEntries(graph.v.map(v=>[v[0],Infinity])),prev={},done=new Set();d[start]=0;while(done.size<graph.v.length){const choices=graph.v.map(v=>v[0]).filter(n=>!done.has(n)).sort((a,b)=>d[a]-d[b]);const n=choices[0];if(!n||!Number.isFinite(d[n]))break;done.add(n);for(const {to,w} of neighbours(graph,n)){if(d[n]+w<d[to]){d[to]=d[n]+w;prev[to]=n}}}return {d,prev}}
function path(previous,start,goal){const result=[],seen=new Set();let current=goal;while(current&&!seen.has(current)){result.unshift(current);if(current===start)return result;seen.add(current);current=previous[current]}return []}
function astar(graph){const g=Object.fromEntries(graph.v.map(v=>[v[0],Infinity])),prev={},open=new Set([graph.start]),closed=new Set();g[graph.start]=0;
  while(open.size){const n=[...open].sort((a,b)=>g[a]+graph.h[a]-g[b]-graph.h[b]||g[a]-g[b]||a.localeCompare(b))[0];open.delete(n);if(n===graph.goal)return {cost:g[n],route:path(prev,graph.start,n)};closed.add(n);for(const {to,w} of neighbours(graph,n)){const candidate=g[n]+w;if(candidate<g[to]){g[to]=candidate;prev[to]=n;open.add(to);closed.delete(to)}}}
  return {cost:Infinity,route:[]};}
function prepareGraph(template){const g=structuredClone(template);if(!g.h){const toGoal=shortest(g,g.goal).d;g.h=Object.fromEntries(g.v.map(v=>[v[0],Math.floor(toGoal[v[0]]*0.6)]))}return g}
function makeState(){const i=indexes[mode][level]++,choices=mode==='graph'?(classroomBoard?graphBank[level]:[dancerGold,...graphBank[level]]):heurBank[level];const item=choices[i%choices.length];const g=mode==='graph'?prepareGraph(item):prepareGraph(graphBank[item.graph][item.index]);
  if(mode==='heuristic')g.h[item.probe]=item.estimate;
  state={g,index:i+1,probe:item?.probe||null,phase:mode==='graph'?'pick':'cost',gScore:Object.fromEntries(g.v.map(v=>[v[0],v[0]===g.start?0:Infinity])),previous:{},open:new Set([g.start]),closed:new Set(),focus:null,finished:false,history:[]};first=true;feedback='';feedbackType='';render()}
function graphSvg(){const g=state.g,positions=Object.fromEntries(g.v.map(([n,x,y])=>[n,{x,y}]));const lines=g.e.map(([a,b,w])=>{const p=positions[a],q=positions[b],x=(p.x+q.x)/2,y=(p.y+q.y)/2;return `<path d="M${p.x} ${p.y}L${q.x} ${q.y}" stroke="#92ad9d" stroke-width="3" fill="none"/><rect x="${x-13}" y="${y-12}" width="26" height="23" rx="6" fill="#fff" stroke="#c7d9ce"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="14" font-weight="850" fill="#1d5240">${w}</text>`}).join('');
  const nodes=g.v.map(([n,x,y])=>{const active=state.focus===n,closed=state.closed.has(n),probe=state.probe===n;const bg=active?'#e5ac4b':closed?'#0e7c55':probe?'#ffe19c':'#e7f1ea';const fg=active||closed?'#fff':'#184c36';return `<circle cx="${x}" cy="${y}" r="22" fill="${bg}" stroke="#fff" stroke-width="4"/><text x="${x}" y="${y+6}" text-anchor="middle" font-size="17" font-weight="900" fill="${fg}">${n}</text><text x="${x}" y="${y+39}" text-anchor="middle" font-size="13" font-weight="800" fill="#2f6651">h=${g.h[n]}</text>`}).join('');
  return `<svg class="graph" viewBox="0 0 420 280" role="img" aria-label="Weighted graph from ${g.start} to ${g.goal}. Each node displays its heuristic estimate. Edge costs are labelled.">${lines}${nodes}</svg>`}
function table(){return `<div class="table-wrap"><table><thead><tr><th>Node</th><th>g</th><th>h</th><th>f=g+h</th><th>From</th><th>State</th></tr></thead><tbody>${state.g.v.map(([n])=>{const g=state.gScore[n];return `<tr><td>${n}</td><td>${fmt(g)}</td><td>${state.g.h[n]}</td><td>${fmt(Number.isFinite(g)?g+state.g.h[n]:Infinity)}</td><td>${state.previous[n]||'—'}</td><td>${state.closed.has(n)?'<span class="closed">Done</span>':state.open.has(n)?'Open':'—'}</td></tr>`}).join('')}</tbody></table></div>`}
function graphPrompt(){if(state.finished)return `<div class="finish"><h2>Route complete</h2><p><strong>${path(state.previous,state.g.start,state.g.goal).join(' → ')}</strong> · total cost <strong>${fmt(state.gScore[state.g.goal])}</strong></p><div class="actions" style="justify-content:center"><button id="next" class="primary">Next graph →</button></div></div>`;
  if(state.phase==='pick'){const firstNode=state.closed.size===0;const nodes=[...state.open];return `<p class="prompt">${firstNode?`<span class="brush">Start at ${state.g.start}</span>: g=0. Choose it first.`:`Choose the <span class="brush">open node with the smallest f = g + h</span>. All g values count from ${state.g.start}.`}</p><div class="pick-row">${nodes.map(n=>`<button class="pick" data-pick="${n}">${n}</button>`).join('')}</div>`}
  if(state.phase==='update'){const edges=neighbours(state.g,state.focus);return `<p class="prompt">From ${state.focus} (g=${fmt(state.gScore[state.focus])}), check each neighbour: candidate g = ${fmt(state.gScore[state.focus])} + edge cost. Keep the smaller g, then calculate f=g+h.</p><div class="table-wrap"><table class="update-table"><thead><tr><th>Node</th><th>Edge</th><th>New g</th><th>New f</th><th>Came from</th></tr></thead><tbody>${edges.map(({to,w})=>`<tr><td>${to}</td><td>${w}</td><td><input aria-label="Best g for ${to}" data-g="${to}" inputmode="text" placeholder="g"></td><td><input aria-label="Best f for ${to}" data-f="${to}" inputmode="text" placeholder="f"></td><td><select aria-label="Previous node for ${to}" data-prev="${to}"><option value="">—</option>${state.g.v.map(([n])=>`<option value="${n}">${n}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div><div class="actions"><button id="apply" class="primary">Check updates →</button></div>`}
  return `<p class="prompt">Reconstruct the route from ${state.g.start} to ${state.g.goal} and give its total cost.</p><div class="fields"><label class="field">Route (for example S-A-B-G)<input id="route" autocomplete="off" placeholder="${state.g.start}-...-${state.g.goal}"></label><label class="field">Total cost<input id="cost" inputmode="numeric" placeholder="Cost"></label></div><div class="actions"><button id="check-route" class="primary">Check route →</button></div>`}
function bestNodes(){const open=[...state.open];const best=Math.min(...open.map(n=>state.gScore[n]+state.g.h[n]));return open.filter(n=>state.gScore[n]+state.g.h[n]===best)}
function expectedUpdates(){return neighbours(state.g,state.focus).map(({to,w})=>{const candidate=state.gScore[state.focus]+w,old=state.gScore[to],improved=candidate<old;const g=improved?candidate:old;return {to,w,candidate,old,improved,g,f:Number.isFinite(g)?g+state.g.h[to]:Infinity,prev:improved?state.focus:(state.previous[to]||'')}})}
function modelGraph(){if(state.phase==='pick')return `<p>${state.closed.size?'Choose the smallest open f':'Begin at the start'}: <strong>${bestNodes().join(' or ')}</strong>.</p>`;
  if(state.phase==='update')return expectedUpdates().map(x=>`<p>${x.to}: ${fmt(state.gScore[state.focus])} + ${x.w} = ${x.candidate}. ${x.improved?`Improve g from ${fmt(x.old)} to ${x.g}; f=${x.g}+${state.g.h[x.to]}=${x.f}; from ${x.prev}.`:`Keep g=${fmt(x.g)}, f=${fmt(x.f)} and previous ${x.prev||'—'}.`}</p>`).join('');
  return `<p>Follow predecessors backwards. Route: ${path(state.previous,state.g.start,state.g.goal).join(' → ')}; cost ${fmt(state.gScore[state.g.goal])}.</p>`}
function graphAside(){const rule=state.phase==='pick'?'Choose the lowest f among open nodes. Always begin at the start.':state.phase==='update'?'Candidate g = current g + edge weight. If better, update g and predecessor. Then f = g + h.':'Follow predecessors from goal to start; reverse the order.';return `<div class="panel panel-pad"><h3 class="side-title">A* working table</h3>${table()}<div class="aside-box"><strong>Rule</strong><p>${rule}</p></div><details class="aside-box"><summary>Hint</summary><p>g is the best cost from the start, h estimates the remaining cost, and f is their sum. Update a node only if the new g is smaller.</p></details><details class="aside-box" id="model"><summary>Show the worked step</summary><div id="model-text"></div></details><div class="actions"><button class="secondary" id="reset">Reset graph</button></div></div>`}
function chooseNode(n,model=false){const best=bestNodes(),ok=best.includes(n);if(!model&&state.closed.size)firstAttempt(ok);if(!ok){feedback=`Compare f in the table. The lowest open f is ${best.map(x=>`${x} (${state.gScore[x]+state.g.h[x]})`).join(' or ')}.`;feedbackType='bad';renderGraph();return}
  state.focus=n;state.history.push(`Choose ${n}: g=${state.gScore[n]}, h=${state.g.h[n]}, f=${state.gScore[n]+state.g.h[n]}.`);if(n===state.g.goal){state.phase='route';first=true;feedback='Goal selected. Now reconstruct the route and total cost.';feedbackType='good';renderGraph();return}
  state.phase='update';first=true;feedback=`Correct. Now update routes through ${n}.`;feedbackType='good';if(model){applyModelUpdates();return}renderGraph()}
function applyModelUpdates(){const updates=expectedUpdates();for(const x of updates){if(x.improved){state.gScore[x.to]=x.g;state.previous[x.to]=x.prev;state.open.add(x.to);state.closed.delete(x.to)}}state.open.delete(state.focus);state.closed.add(state.focus);state.history.push(...updates.map(x=>`${x.to}: ${fmt(state.gScore[state.focus])}+${x.w}=${x.candidate}; ${x.improved?`new g=${x.g}, f=${x.f}`:`keep g=${fmt(x.g)}`}.`));state.focus=null;state.phase='pick';first=true;feedback=updates.filter(x=>x.improved).map(x=>`${x.to} now has g=${x.g}, f=${x.f}.`).join(' ')||'No shorter routes found.';feedbackType='good';renderGraph()}
function applyUpdates(){const updates=expectedUpdates();let wrong=null;for(const x of updates){const gRaw=workspace.querySelector(`[data-g="${x.to}"]`)?.value.trim()||'',fRaw=workspace.querySelector(`[data-f="${x.to}"]`)?.value.trim()||'',prev=workspace.querySelector(`[data-prev="${x.to}"]`)?.value||'';const value=s=>s==='∞'||/^inf(inity)?$/i.test(s)?Infinity:s===''?NaN:Number(s);if(value(gRaw)!==x.g||value(fRaw)!==x.f||prev!==x.prev){wrong=x;break}}
  const ok=!wrong;firstAttempt(ok);if(!ok){feedback=`For ${wrong.to}: candidate g is ${fmt(state.gScore[state.focus])}+${wrong.w}=${wrong.candidate}. ${wrong.improved?`Use the smaller g=${wrong.g}, f=${wrong.g}+${state.g.h[wrong.to]}=${wrong.f}, from ${wrong.prev}.`:`Keep g=${fmt(wrong.old)}, f=${fmt(wrong.f)}, and previous ${wrong.prev||'—'}.`}`;feedbackType='bad';showFeedback();return}
  applyModelUpdates()}
function checkRoute(){const raw=workspace.querySelector('#route')?.value||'',parts=raw.toUpperCase().split(/[^A-Z]+/).filter(Boolean),costRaw=workspace.querySelector('#cost')?.value.trim()||'',cost=Number(costRaw),answer=path(state.previous,state.g.start,state.g.goal);const ok=parts.join()===answer.join()&&costRaw!==''&&cost===state.gScore[state.g.goal];firstAttempt(ok);if(!ok){feedback='Follow the Came from entries backwards from the goal, reverse the order, and add the edge costs.';feedbackType='bad';showFeedback();return}state.finished=true;feedback='';feedbackType='';renderGraph()}
function heuristicAnswer(){const g=state.g,probe=state.probe,trueRemaining=shortest(g,g.goal).d[probe],safe=g.h[probe]<=trueRemaining,early=astar(g),optimal=shortest(g,g.start);return {trueRemaining,safe,early,optimalCost:optimal.d[g.goal],optimalRoute:path(optimal.prev,g.start,g.goal)}}
function heuristicPrompt(){const ans=heuristicAnswer();if(state.finished)return `<div class="finish"><h2>Evaluation complete</h2><p>h(${state.probe})=${state.g.h[state.probe]} is <strong>${ans.safe?'admissible':'inadmissible'}</strong>. A* returns cost ${ans.early.cost}; the optimal cost is ${ans.optimalCost}.</p><p class="small">An overestimate can cause a longer route, but does not always do so.</p><div class="actions" style="justify-content:center"><button id="next" class="primary">Next heuristic →</button></div></div>`;
  if(state.phase==='cost')return `<p class="prompt">Before testing h(${state.probe}), find the <span class="brush">true cheapest remaining cost</span> from ${state.probe} to ${state.g.goal}. Follow the edges.</p><label class="field">Cheapest remaining cost<input id="true-cost" inputmode="numeric" placeholder="Cost"></label><div class="actions"><button id="check-heuristic" class="primary">Check cost →</button></div>`;
  if(state.phase==='admissible')return `<p class="prompt">h(${state.probe}) = ${state.g.h[state.probe]}. Is it <span class="brush">admissible</span> (no higher than the true cost)?</p><div class="pick-row"><button class="pick" data-safety="yes">Yes</button><button class="pick" data-safety="no">No</button></div>`;
  return `<p class="prompt">Run A* mentally: choose the lowest open f and stop when the goal is selected. Compare that result with the actual shortest route.</p><div class="fields"><label class="field">Cost returned by A*<input id="early-cost" inputmode="numeric" placeholder="A* route cost"></label><label class="field">Actual shortest route cost<input id="optimal-cost" inputmode="numeric" placeholder="Best possible"></label></div><div class="actions"><button id="check-heuristic" class="primary">Check comparison →</button></div>`}
function heuristicAside(){const a=heuristicAnswer();return `<div class="panel panel-pad"><h3 class="side-title">Heuristic check</h3><div class="aside-box"><strong>Key rule</strong><p>Admissible means h(n) never exceeds the true cheapest remaining cost from n to the goal.</p><p>In this example, test the highlighted node <strong>${state.probe}</strong>.</p></div><details class="aside-box"><summary>Hint</summary><p>Calculate the real route cost from ${state.probe}. The h label is an estimate, not an edge weight. With a misleading estimate, A* may select a costly goal before exploring a cheaper route.</p></details><details class="aside-box"><summary>Model and explanation</summary><p>From ${state.probe}, the true cheapest remaining cost is ${a.trueRemaining}. h=${state.g.h[state.probe]} is ${a.safe?'safe because it does not exceed that cost':'unsafe because it exceeds that cost'}.</p><p>A* returns ${a.early.route.join(' → ')} (cost ${a.early.cost}). The actual shortest route is ${a.optimalRoute.join(' → ')} (cost ${a.optimalCost}).</p></details><div class="actions"><button id="reset" class="secondary">Reset question</button></div></div>`}
function checkHeuristic(safety=null){const a=heuristicAnswer();let ok=false;
  if(state.phase==='cost'){const raw=workspace.querySelector('#true-cost')?.value.trim()||'';ok=raw!==''&&Number(raw)===a.trueRemaining;if(ok)state.phase='admissible';feedback=ok?`Yes. The true cheapest remaining cost is ${a.trueRemaining}. Now compare h(${state.probe}) with it.`:'Add the weights along the cheapest route from the highlighted node to the goal.'}
  else if(state.phase==='admissible'){ok=(safety==='yes')===a.safe;if(ok)state.phase='outcome';feedback=ok?`${a.safe?'Correct: the estimate does not overestimate.':'Correct: the estimate overestimates.'} Now compare A* with the shortest route.`:'Remember: admissible means h ≤ true cheapest remaining cost.'}
  else{const early=workspace.querySelector('#early-cost')?.value.trim()||'',optimal=workspace.querySelector('#optimal-cost')?.value.trim()||'';ok=early!==''&&optimal!==''&&Number(early)===a.early.cost&&Number(optimal)===a.optimalCost;if(ok)state.finished=true;feedback=ok?'Correct. A* can lose its guarantee when the estimate is too high.':'Follow the open set by lowest f. When the goal is selected, record its g; compare with the true shortest path.'}
  firstAttempt(ok);if(ok)first=true;feedbackType=ok?'good':'bad';if(ok)renderHeuristic();else showFeedback()}
function showFeedback(){const el=workspace.querySelector('.feedback');if(el){el.textContent=feedback;el.className='feedback '+feedbackType}}
function renderGraph(){if(window.RHSCExamTrace){window.RHSCExamTrace.render({workspace,graph:state.g,algorithm:'astar',level,classroomBoard,graphSvg:graphSvg(),graphImage:state.g.id==='dancergold'?'/assets/h446-lesson/ocr-2021-dancergold-graph.png':null,onFirstAttempt:firstAttempt,onNext:makeState});return;}if(classroomBoard){const done=state.finished,atGoal=state.phase==='route',lines=state.history.slice(-4).map(s=>`<li>${esc(s)}</li>`).join('');workspace.innerHTML=`<div class="panel panel-pad">${graphSvg()}${table()}${lines?`<ol class="running">${lines}</ol>`:''}<p class="prompt">${done||atGoal?`Route ${path(state.previous,state.g.start,state.g.goal).join(' → ')}; cost ${fmt(state.gScore[state.g.goal])}.`:state.closed.size===0?`Start at ${state.g.start} (g=0). Click ${state.g.start} first.`:'Choose the open node with the lowest f.'}</p><div class="pick-row">${!done&&state.phase==='pick'?[...state.open].map(n=>`<button class="pick" data-pick="${n}">${n}</button>`).join(''):''}${atGoal||done?'<button class="secondary" id="reset">Start again</button>':''}</div><p class="feedback ${feedbackType}" role="status">${esc(feedback)}</p></div>`;workspace.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>chooseNode(b.dataset.pick,true)));workspace.querySelector('#reset')?.addEventListener('click',reset);return}
  workspace.innerHTML=`<div class="layout"><div class="panel panel-pad"><div class="head-row"><span class="kicker">${classroom?'Classroom example':levelNames[level]+' · graph '+state.index}</span><span class="mark">Start ${state.g.start} → Finish ${state.g.goal}</span></div><h2>Trace A* from the start</h2><p class="explain">Edge labels are costs. Each node shows its estimated remaining cost h.</p>${graphSvg()}${graphPrompt()}<p class="feedback ${feedbackType}" role="status">${esc(feedback)}</p></div>${graphAside()}</div>`;
  workspace.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>chooseNode(b.dataset.pick)));workspace.querySelector('#apply')?.addEventListener('click',applyUpdates);workspace.querySelector('#check-route')?.addEventListener('click',checkRoute);workspace.querySelector('#next')?.addEventListener('click',makeState);workspace.querySelector('#reset')?.addEventListener('click',reset);workspace.querySelector('#model')?.addEventListener('toggle',e=>{if(e.target.open)workspace.querySelector('#model-text').innerHTML=modelGraph()});
  if(classroom&&state.phase==='update'){const button=document.createElement('button');button.className='secondary';button.type='button';button.textContent='Fill model values';workspace.querySelector('#apply').after(button);button.addEventListener('click',()=>{for(const x of expectedUpdates()){workspace.querySelector(`[data-g="${x.to}"]`).value=fmt(x.g);workspace.querySelector(`[data-f="${x.to}"]`).value=fmt(x.f);workspace.querySelector(`[data-prev="${x.to}"]`).value=x.prev}})}
}
function renderHeuristic(){const a=heuristicAnswer();if(classroomBoard){const text=state.finished?'Compare the route returned with the true shortest route.':state.phase==='cost'?`What is the real cheapest cost from ${state.probe} to ${state.g.goal}?`:state.phase==='admissible'?`Is h(${state.probe})=${state.g.h[state.probe]} admissible?`:'What route and cost does early-stop A* return?';const model=state.phase==='cost'?`True remaining cost: ${a.trueRemaining}.`:state.phase==='admissible'?`h=${state.g.h[state.probe]} is ${a.safe?'admissible':'not admissible'}.`:`A*: ${a.early.route.join(' → ')} = ${a.early.cost}. Optimal: ${a.optimalRoute.join(' → ')} = ${a.optimalCost}.`;workspace.innerHTML=`<div class="panel panel-pad">${graphSvg()}<p class="prompt">${text}</p><button id="reveal" class="primary">${state.finished?'Start again':'Reveal next step →'}</button><p class="feedback good" role="status">${esc(feedback)}</p></div>`;workspace.querySelector('#reveal').addEventListener('click',()=>{if(state.finished){reset();return}feedback=model;if(state.phase==='cost')state.phase='admissible';else if(state.phase==='admissible')state.phase='outcome';else state.finished=true;renderHeuristic()});return}
  workspace.innerHTML=`<div class="layout"><div class="panel panel-pad"><div class="head-row"><span class="kicker">${classroom?'Classroom example':levelNames[level]+' · heuristic '+state.index}</span><span class="mark">Check node ${state.probe}</span></div><h2>Can you trust this estimate?</h2><p class="explain">The graph shows edge costs and estimated costs h. The highlighted node is your focus.</p>${graphSvg()}${heuristicPrompt()}<p class="feedback ${feedbackType}" role="status">${esc(feedback)}</p></div>${heuristicAside()}</div>`;workspace.querySelector('#check-heuristic')?.addEventListener('click',()=>checkHeuristic());workspace.querySelectorAll('[data-safety]').forEach(b=>b.addEventListener('click',()=>checkHeuristic(b.dataset.safety)));workspace.querySelector('#next')?.addEventListener('click',makeState);workspace.querySelector('#reset')?.addEventListener('click',reset)}
function reset(){indexes[mode][level]=Math.max(0,indexes[mode][level]-1);makeState()}
function render(){document.querySelector('#tab-graph').setAttribute('aria-pressed',String(mode==='graph'));document.querySelector('#tab-heuristic').setAttribute('aria-pressed',String(mode==='heuristic'));document.querySelectorAll('[data-level]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.level===level)));updateScore();if(!state)makeState();else if(mode==='graph')renderGraph();else renderHeuristic()}
document.querySelector('#tab-graph').addEventListener('click',()=>{mode='graph';state=null;render()});document.querySelector('#tab-heuristic').addEventListener('click',()=>{mode='heuristic';state=null;render()});document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>{level=b.dataset.level;state=null;render()}));
render();
})();
</script>
