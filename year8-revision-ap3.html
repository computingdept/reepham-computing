<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#006347">
<title>Year 8 Revision Hub · RHSC</title>
<style>
:root{--green:#006347;--dark:#003f36;--ink:#16231f;--muted:#5f6d68;--line:#d5e0dc;--soft:#f3f7f5;--ok:#e4f3ea;--warn:#fff0cc}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f4f7f6;color:var(--ink);font:16px/1.45 Arial,Helvetica,sans-serif}button,a{font:inherit}button{cursor:pointer}.wrap{max-width:900px;margin:auto;padding:20px 16px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.back{color:var(--green);text-decoration:none;font-weight:800}.support{border:2px solid #b8cac3;background:#fff;color:#00543e;border-radius:10px;padding:8px 11px;font-weight:800}.eyebrow{font-size:.76rem;letter-spacing:.12em;font-weight:850;color:var(--green);margin:0 0 6px}.primary,.secondary{min-height:50px;border-radius:11px;padding:11px 16px;font-weight:850}.primary{background:var(--green);color:#fff;border:2px solid var(--green)}.secondary{background:#fff;color:#00543e;border:2px solid #8faea2}.screen{display:none;background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px}.screen.show{display:block}.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.qtop strong{color:var(--green);font-size:1.08rem}.readq{border:2px solid #9fb7ae;background:#fff;border-radius:9px;padding:8px 11px;color:#00543e;font-weight:850}.question{font-size:1.45rem;line-height:1.25;color:var(--dark);font-weight:850;margin:0 0 18px}.answers{display:grid;gap:10px}.answer{width:100%;text-align:left;min-height:62px;border:2px solid #9fb7ae;background:#fff;color:#073d32;border-radius:11px;padding:13px 15px;font-size:1.08rem;font-weight:800;line-height:1.35}.answer:hover,.answer:focus-visible{background:#edf7f3;color:#003f36;border-color:var(--green);outline:3px solid #b8dfd1;outline-offset:2px}.answer.selected{border-color:#004d3a;background:#006347;color:#fff}.answer .letter{display:inline-grid;place-items:center;width:30px;height:30px;margin-right:10px;border-radius:50%;background:#e4efeb;color:#003f36;font-weight:900}.answer.selected .letter{background:#fff;color:#00533e}.feedback{display:none;margin-top:14px;padding:12px 14px;border-radius:10px;font-weight:800}.feedback.show{display:block}.feedback.ok{background:#e4f3ea;color:#124b31;border:1px solid #99c9ae}.feedback.try{background:#fff0cc;color:#5d3d00;border:1px solid #e0b95c}.fix{display:none;margin-top:10px;padding:12px 14px;border-left:4px solid var(--green);background:#f3f8f5;color:#183f34}.fix.show{display:block}.qactions{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:18px}.help-panel{display:none;margin:0 0 14px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px}.help-panel.open{display:block}.help-panel button{margin-right:6px;margin-top:6px}.large{font-size:118%}.spacing{line-height:1.8}.cream{background:#fff9eb}.result h1{margin:0 0 8px;color:var(--dark);font-size:1.8rem}.result p{color:var(--muted)}.next-list{display:grid;gap:9px;margin:15px 0}.next-item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fbfcfb}.next-item strong{color:var(--dark)}.choose{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}.topic-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.topic{min-height:50px;border:2px solid #b8cac3;background:#fff;color:#004d3a;border-radius:10px;font-weight:800}.smalllinks{margin-top:14px;font-size:.92rem}.smalllinks a{color:var(--green);font-weight:750}
@media(max-width:650px){.wrap{padding:12px 10px 50px}.screen{padding:18px}.top{align-items:flex-start}.question{font-size:1.25rem}.qactions{align-items:stretch;flex-direction:column}.qactions button{width:100%}.topic-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="top">
    <a class="back" href="year8-computing.html?v=20260927-1955#lessons">← Year 8 Computing</a>
    <button class="support" id="supportBtn" type="button">Aa Reading support</button>
  </div>

  <div class="help-panel" id="helpPanel">
    <strong>Reading support</strong><br>
    <button class="secondary" id="largeBtn" type="button">Larger text</button>
    <button class="secondary" id="spacingBtn" type="button">More spacing</button>
    <button class="secondary" id="colourBtn" type="button">Cream page</button>
  </div>

  <section class="screen show" id="questionScreen" aria-live="polite">
    <div class="qtop">
      <strong id="qProgress">Question 1 of 10</strong>
      <button class="readq" id="readQ" type="button">🔊 Read question</button>
    </div>
    <div class="question" id="questionText"></div>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>
    <div class="fix" id="fix"></div>
    <div class="qactions">
      <button class="secondary" id="helpBtn" type="button">Show help</button>
      <button class="primary" id="nextBtn" type="button">Next →</button>
    </div>
    <div class="smalllinks"><a href="year8-computing.html?v=20260927-1955#booklet">Need the notes? Open Revision Booklet →</a></div>
  </section>

  <section class="screen" id="resultScreen">
    <div class="result">
      <p class="eyebrow">YOUR NEXT STEP</p>
      <h1>Practise next</h1>
      <p>Start with these two areas:</p>
      <div class="next-list" id="nextList"></div>
      <button class="primary" id="startSuggested" type="button">Start first topic →</button>
      <div class="choose">
        <button class="secondary" id="chooseTopicBtn" type="button">Choose another topic</button>
        <div class="topic-grid" id="topicGrid" hidden>
          <button class="topic" data-topic="systems">Computer Systems</button>
          <button class="topic" data-topic="io">Input &amp; Output</button>
          <button class="topic" data-topic="components">Components</button>
          <button class="topic" data-topic="cpu">CPU</button>
          <button class="topic" data-topic="memory">Memory &amp; Storage</button>
          <button class="topic" data-topic="binary">Binary</button>
        </div>
      </div>
      <div class="smalllinks"><a href="year8-computing.html?v=20260927-1955#booklet">Open Revision Booklet</a></div>
    </div>
  </section>
</div>

<script>
const bank=[
 {topic:'systems',q:'Which list shows the four main things a computer system does?',a:['Input, processing, output and storage','RAM, ROM, CPU and PSU','Save, print, email and browse'],correct:0,fix:'Computer systems use input, processing, output and storage.'},
 {topic:'io',q:'Which is an input device?',a:['Printer','Microphone','Projector'],correct:1,fix:'Input devices put data into a computer system.'},
 {topic:'components',q:'What does the motherboard do?',a:['Connects computer parts together','Stores files long term','Displays graphics'],correct:0,fix:'The motherboard is the main board that connects the components.'},
 {topic:'cpu',q:'What does CPU stand for?',a:['Computer Processing Utility','Central Power Unit','Central Processing Unit'],correct:2,fix:'CPU stands for Central Processing Unit.'},
 {topic:'cpu',q:'Which part of the CPU carries out calculations and logic?',a:['ALU','CU','PSU'],correct:0,fix:'The ALU carries out arithmetic and logical operations.'},
 {topic:'cpu',q:'Which change can improve CPU performance?',a:['Smaller cache','Faster clock speed','Fewer cores'],correct:1,fix:'A faster clock speed can improve CPU performance.'},
 {topic:'memory',q:'Which memory is volatile and stores programs currently being used?',a:['RAM','ROM','Hard drive'],correct:0,fix:'RAM is volatile and stores data and programs currently in use.'},
 {topic:'memory',q:'Which statement describes ROM?',a:['It is volatile','It stores current open programs','It is read only and non-volatile'],correct:2,fix:'ROM is read only and non-volatile.'},
 {topic:'binary',q:'How many bits are in one byte?',a:['4','8','16'],correct:1,fix:'One byte contains 8 bits.'},
 {topic:'binary',q:'What is 01001011 in denary?',a:['68','71','75'],correct:2,fix:'64 + 8 + 2 + 1 = 75.'}
];
const topicNames={systems:'Computer Systems',io:'Input & Output',components:'Components',cpu:'CPU',memory:'Memory & Storage',binary:'Binary'};
const topicPractice={systems:[bank[0]],io:[bank[1]],components:[bank[2]],cpu:[bank[4],bank[5]],memory:[bank[6],bank[7]],binary:[bank[8],bank[9]]};
let mode='check',questions=[...bank],index=0,answersMade={},selected=null,helpVisible=false;
const qscreen=document.getElementById('questionScreen'),rscreen=document.getElementById('resultScreen');
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function startCheck(){mode='check';questions=[...bank];index=0;answersMade={};showQuestion()}
function startTopic(t){mode='topic';questions=[...(topicPractice[t]||[])];index=0;answersMade={};showQuestion()}
function showQuestion(){
  rscreen.classList.remove('show');qscreen.classList.add('show');selected=null;helpVisible=false;
  const item=questions[index];
  document.getElementById('qProgress').textContent=(mode==='check'?'Question ':'Practice ')+(index+1)+' of '+questions.length;
  document.getElementById('questionText').textContent=item.q;
  const box=document.getElementById('answers');box.innerHTML='';
  item.a.forEach((x,i)=>{const b=document.createElement('button');b.className='answer';b.type='button';b.innerHTML='<span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+esc(x)+'</span>';b.onclick=()=>choose(i,b);box.appendChild(b)});
  document.getElementById('feedback').className='feedback';
  document.getElementById('feedback').textContent='';
  document.getElementById('fix').className='fix';
  document.getElementById('fix').textContent=item.fix;
  document.getElementById('helpBtn').textContent='Show help';
  document.getElementById('nextBtn').textContent=index===questions.length-1?(mode==='check'?'Show what to practise →':'Finish topic →'):'Next →';
  window.scrollTo({top:0,behavior:'smooth'});
}
function choose(i,b){
  selected=i;
  [...document.querySelectorAll('.answer')].forEach(x=>x.classList.remove('selected'));
  b.classList.add('selected');
  const item=questions[index];answersMade[index]={topic:item.topic,ok:i===item.correct};
  const fb=document.getElementById('feedback');
  if(i===item.correct){fb.textContent='✓ Correct';fb.className='feedback show ok'}
  else{fb.textContent='Not yet. Use Show help, then try again.';fb.className='feedback show try'}
}
document.getElementById('helpBtn').onclick=()=>{helpVisible=!helpVisible;document.getElementById('fix').classList.toggle('show',helpVisible);document.getElementById('helpBtn').textContent=helpVisible?'Hide help':'Show help'};
document.getElementById('nextBtn').onclick=()=>{
  if(selected===null){const fb=document.getElementById('feedback');fb.textContent='Choose an answer first.';fb.className='feedback show try';return}
  if(index<questions.length-1){index++;showQuestion();return}
  mode==='check'?showResult():showResult();
};
function showResult(){
  qscreen.classList.remove('show');rscreen.classList.add('show');
  const scores={systems:[0,0],io:[0,0],components:[0,0],cpu:[0,0],memory:[0,0],binary:[0,0]};
  Object.values(answersMade).forEach(x=>{scores[x.topic][1]++;if(x.ok)scores[x.topic][0]++});
  const ordered=Object.entries(scores).map(([k,v])=>({k,ratio:v[1]?v[0]/v[1]:1})).sort((a,b)=>a.ratio-b.ratio);
  const weak=ordered.slice(0,2),list=document.getElementById('nextList');
  list.innerHTML=weak.map((x,i)=>'<div class="next-item"><strong>'+(i+1)+'. '+topicNames[x.k]+'</strong><span>Practise next</span></div>').join('');
  document.getElementById('startSuggested').onclick=()=>startTopic(weak[0].k);
  window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('chooseTopicBtn').onclick=()=>{const g=document.getElementById('topicGrid');g.hidden=!g.hidden};
document.querySelectorAll('.topic').forEach(b=>b.onclick=()=>startTopic(b.dataset.topic));
document.getElementById('readQ').onclick=()=>{
  if(!window.speechSynthesis)return;
  if(speechSynthesis.speaking){speechSynthesis.cancel();return}
  const u=new SpeechSynthesisUtterance(document.getElementById('questionText').innerText);u.lang='en-GB';u.rate=.9;
  const vs=speechSynthesis.getVoices().filter(v=>(v.lang||'').toLowerCase().startsWith('en-gb'));
  if(vs.length)u.voice=vs.find(v=>/sonia|libby|serena|female|kate/i.test(v.name))||vs[0];
  speechSynthesis.speak(u);
};
document.getElementById('supportBtn').onclick=()=>document.getElementById('helpPanel').classList.toggle('open');
document.getElementById('largeBtn').onclick=()=>document.getElementById('app').classList.toggle('large');
document.getElementById('spacingBtn').onclick=()=>document.getElementById('app').classList.toggle('spacing');
document.getElementById('colourBtn').onclick=()=>document.body.classList.toggle('cream');
showQuestion();
</script>
</body>
</html>
