<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
  <title id="title">WHILE loop: attempts &lt; 3</title>
  <desc id="desc">Set attempts to zero. Check attempts is less than three before each iteration. If true, print attempts, increment attempts, then check again. If false, end.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9Z" fill="#263b35"/></marker>
  </defs>
  <g fill="none" stroke="#263b35" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M120 36 H179"/>
    <path d="M280 60 V86"/>
    <path d="M180 135 H67 V214"/>
    <path d="M280 184 V211"/>
    <path d="M280 261 V288"/>
    <path d="M410 312 H500 V135 H380"/>
  </g>
  <g stroke-width="2.6" stroke="#263b35">
    <rect x="15" y="13" width="105" height="46" rx="23" fill="#f3f7f5"/>
    <rect x="180" y="13" width="200" height="47" fill="#f3f7f5"/>
    <path d="M280 86 L380 135 L280 184 L180 135Z" fill="#fff2d4"/>
    <path d="M192 212 H392 L368 261 H168Z" fill="#e8f1f8"/>
    <rect x="150" y="289" width="260" height="46" fill="#e9f3ee"/>
    <rect x="15" y="214" width="105" height="46" rx="23" fill="#f3f7f5"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#213e35" font-size="21" font-weight="600">
    <text x="67.5" y="43">Start</text>
    <text x="280" y="44">attempts = 0</text>
    <text x="280" y="142">attempts &lt; 3?</text>
    <text x="280" y="244">print(attempts)</text>
    <text x="280" y="319">attempts = attempts + 1</text>
    <text x="67.5" y="244">End</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="18" font-weight="700">
    <text x="117" y="124" text-anchor="middle" fill="#9b3f39">False</text>
    <text x="295" y="203" fill="#246b50">True</text>
  </g>
</svg>
