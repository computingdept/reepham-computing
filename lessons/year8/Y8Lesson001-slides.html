<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Year 8 Lesson 1 · Slide preview</title>
<style>
:root{--green:#0b5a45;--ink:#17231f;--muted:#66736e;--line:#dce5e1;--bg:#f4f7f5;--card:#fff;--soft:#eef4f1;--shadow:0 18px 50px rgba(20,45,36,.10)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#f8faf9 0,#f1f5f3 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif}button,a{font:inherit;-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible{outline:3px solid #bd7d08;outline-offset:3px}
.topbar{position:sticky;top:0;z-index:20;background:rgba(248,250,249,.9);backdrop-filter:blur(18px);border-bottom:1px solid rgba(220,229,225,.9)}.topbar-inner{max-width:1280px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:13px;padding:9px 14px;background:#fff;color:var(--green);text-decoration:none;font-weight:760;cursor:pointer}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.title{margin-left:auto;text-align:right}.title strong{display:block;color:var(--green)}.title span{font-size:.82rem;color:var(--muted)}
main{max-width:1280px;margin:auto;padding:18px 18px 80px}.viewer{background:var(--card);border:1px solid #e0e8e4;border-radius:24px;box-shadow:var(--shadow);overflow:hidden}.stage{background:#16201c;display:flex;align-items:center;justify-content:center;min-height:min(68vh,760px);padding:14px}.slide{width:min(100%,960px);aspect-ratio:4/3;background-image:url('year8-lesson-upload/Y8-L01-preview/slides-sprite.webp');background-repeat:no-repeat;background-size:100% 1100%;background-position:0 0%;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.22);background-color:#fff}.navrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);background:#fff}.navrow button{min-height:48px;border:1px solid #ccd9d3;background:var(--soft);color:var(--green);border-radius:13px;padding:9px 15px;font-weight:780;cursor:pointer}.navrow button:disabled{opacity:.38;cursor:default}.counter{text-align:center}.counter strong{display:block;color:var(--green);font-size:1.05rem}.counter span{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}.dots{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;padding:0 16px 16px;background:#fff}.dot{width:34px;height:34px;border:1px solid #d5e0db;border-radius:10px;background:#f8faf9;color:#52635c;font-size:.82rem;font-weight:760;cursor:pointer}.dot.active{background:var(--green);border-color:var(--green);color:#fff}.help{max-width:900px;margin:14px auto 0;text-align:center;color:var(--muted);font-size:.88rem}.source-note{max-width:900px;margin:10px auto 0;padding:10px 12px;border:1px solid #dbe6e1;border-radius:12px;background:#fff;color:#52635c;font-size:.86rem;text-align:center}
.fullscreen .topbar,.fullscreen .help,.fullscreen .source-note{display:none}.fullscreen main{max-width:none;padding:0}.fullscreen .viewer{border-radius:0;border:0;min-height:100vh}.fullscreen .stage{min-height:calc(100vh - 78px)}.fullscreen .slide{width:min(100%,1200px)}
@media(max-width:700px){.topbar-inner{display:grid;grid-template-columns:1fr 1fr}.title{grid-column:1/-1;grid-row:1;margin:0;text-align:left}.btn{width:100%}main{padding:10px 10px 70px}.viewer{border-radius:18px}.stage{min-height:48vh;padding:8px}.navrow{grid-template-columns:1fr 1fr;padding:10px}.counter{grid-column:1/-1;grid-row:1}.navrow button{width:100%}.dots{gap:5px;padding:0 10px 12px}.dot{width:31px;height:31px;border-radius:9px}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><a class="btn" href="Y8Lesson001.html">← Back to lesson</a><button class="btn primary" id="fullBtn" type="button">⛶ Full screen</button><div class="title"><strong>Year 8 · Lesson 1</strong><span>Original slide preview</span></div></div></header>
<main><section class="viewer" id="viewer" aria-label="Original lesson slide viewer"><div class="stage"><div class="slide" id="slide" role="img" aria-label="Slide 1 of 11: Computing Expectations"></div></div><div class="navrow"><button id="prevBtn" type="button">← Previous</button><div class="counter" aria-live="polite"><strong id="count">Slide 1 of 11</strong><span id="caption">Computing Expectations</span></div><button id="nextBtn" type="button">Next →</button></div><div class="dots" id="dots" aria-label="Choose a slide"></div></section>
<p class="source-note">Rendered directly from the teacher's original PowerPoint. The slide content and layout have not been redesigned.</p><p class="help">Use the buttons, keyboard arrow keys, or swipe left and right on a touchscreen.</p></main>
<script>
const slides=['Computing Expectations','SLANT lesson behaviour','Welcome Back · Organisation','Presentation of Work','Organisation · Acceptable Use Agreement','Filtering and monitoring','Organisation · Passwords','Digital task · OneDrive','Homework · Wayground','Emails','End of the Lesson'];
let index=0;const slide=document.getElementById('slide'),count=document.getElementById('count'),caption=document.getElementById('caption'),prev=document.getElementById('prevBtn'),next=document.getElementById('nextBtn'),dots=document.getElementById('dots'),viewer=document.getElementById('viewer');
slides.forEach((s,i)=>{const b=document.createElement('button');b.className='dot';b.type='button';b.textContent=String(i+1);b.setAttribute('aria-label','Show slide '+(i+1)+': '+s);b.addEventListener('click',()=>show(i));dots.appendChild(b)});
function show(i){index=Math.max(0,Math.min(i,slides.length-1));const pos=(index/(slides.length-1))*100;slide.style.backgroundPosition='0 '+pos+'%';slide.setAttribute('aria-label','Slide '+(index+1)+' of '+slides.length+': '+slides[index]);count.textContent='Slide '+(index+1)+' of '+slides.length;caption.textContent=slides[index];prev.disabled=index===0;next.disabled=index===slides.length-1;[...dots.children].forEach((b,n)=>b.classList.toggle('active',n===index))}
prev.addEventListener('click',()=>show(index-1));next.addEventListener('click',()=>show(index+1));document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(index-1);if(e.key==='ArrowRight')show(index+1);if(e.key==='Escape'&&document.body.classList.contains('fullscreen'))toggleFull()});let touchStartX=null;viewer.addEventListener('touchstart',e=>{touchStartX=e.changedTouches[0].clientX},{passive:true});viewer.addEventListener('touchend',e=>{if(touchStartX===null)return;const dx=e.changedTouches[0].clientX-touchStartX;touchStartX=null;if(Math.abs(dx)>=45)show(index+(dx<0?1:-1))},{passive:true});
function toggleFull(){const on=document.body.classList.toggle('fullscreen');document.getElementById('fullBtn').textContent=on?'✕ Exit full screen':'⛶ Full screen';if(on&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});else if(!on&&document.fullscreenElement)document.exitFullscreen().catch(()=>{})}document.getElementById('fullBtn').addEventListener('click',toggleFull);document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement){document.body.classList.remove('fullscreen');document.getElementById('fullBtn').textContent='⛶ Full screen'}});show(0);
</script></body></html>
