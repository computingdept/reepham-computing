:"Change number to '28'.","extend":"Add a dash between prefix and number.","answer":"CS27; CS28; CS-27."},"exam":[{"q":"State the difference between concatenation and arithmetic addition.","answer":"Concatenation joins string content; arithmetic addition calculates a numerical sum.","marks":2},{"q":"A user enters 'AB' and '12'. Write the resulting concatenated string with no spaces.","answer":"AB12.","marks":1},{"q":"Explain why checking string length can support validation of a password.","answer":"Length checks whether the input meets a stated minimum/maximum number of characters; alone it does not guarantee a secure password.","marks":3}],"visual":"string join, highlighted separator, length ruler","stage":"text-draft","title":"String Manipulation","spec":"2.2.3","objectives":["Explain the core ideas of string manipulation using accurate OCR terminology.","Apply a clear method to the worked and guided questions.","Use Code First and unseen exam practice to demonstrate independent understanding."],"retrieval":[{"q":"Explain why binary search requires sorted data.","a":"It uses midpoint comparisons to discard half the range safely.","ref":"L113"},{"q":"Convert 10110000 binary to denary.","a":"128+32+16=176.","ref":"L100"},{"q":"State the difference between RAM and ROM.","a":"RAM is volatile working memory; ROM stores persistent firmware.","ref":"L096"},{"q":"Give the array after one pass of bubble sort on [3,1,2].","a":"[1,2,3].","ref":"L110"}],"vocabulary":[{"term":"Concatenation","definition":"Joining strings creates new text; it does not add numerical values."},{"term":"Length","definition":"Counting characters helps validate usernames and input."},{"term":"Slicing","definition":"A slice extracts a specified portion of a string, using the selected language's indexing rules."},{"term":"Data type","definition":"Characters and strings represent text, even when they contain numeric-looking digits."}],"exit":{"question":"Concatenating strings always adds their numeric values.","answer":false},"assessment":false},{"n":115,"facts":[["Two-dimensional arrays","A 2D array stores values in rows and columns and can be accessed with two indexes."],["Zero-based indexing","In a zero-indexed grid, the first row and column use index 0."],["Records","A record groups related fields about one entity under a single item."],["Choice of structure","Use a grid for table-like values and a record for named fields such as name and age."]],"ido":{"q":"Given seats = [[1,0,1],[0,1,0]], identify seats[1][2] with zero-based indexes.","steps":["Label row indexes 0 and 1.","Choose row 1, which contains [0,1,0].","Read column 2 from that row.","The value is 0."]},"wedo":{"q":"Given scores = [[3,6],[8,2]], identify scores[0][1].","steps":["Write both row indexes.","Select row 0.","Read column 1.","The value is 6."]},"code":{"source":"array row = [4, 7, 9]\nprint(row[1])","predict":"Predict the output.","change":"Change the index to 2.","extend":"Explain why index 3 is invalid for this array.","answer":"7; 9; valid indexes are 0,1,2."},"exam":[{"q":"Explain why a 2D array needs two indexes.","answer":"One selects the row; the other selects the column.","marks":2},{"q":"A table contains 4 rows and 3 columns. How many elements are stored?","answer":"4 × 3 = 12.","marks":2},{"q":"Describe how records differ from 2D arrays.","answer":"A record groups named fields of one entity, potentially with differing data types; a 2D array holds indexed elements arranged in rows and columns.","marks":4}],"visual":"row/column coordinate grid plus record card","stage":"text-draft","title":"Two-Dimensional Arrays and Records","spec":"2.2.3","objectives":["Explain the core ideas of two-dimensional arrays and records using accurate OCR terminology.","Apply a clear method to the worked and guided questions.","Use Code First and unseen exam practice to demonstrate independent understanding."],"retrieval":[{"q":"State the difference between concatenation and arithmetic addition.","a":"Concatenation joins string content; arithmetic addition calculates a numerical sum.","ref":"L114"},{"q":"Convert 10110000 binary to denary.","a":"128+32+16=176.","ref":"L100"},{"q":"State the difference between RAM and ROM.","a":"RAM is volatile working memory; ROM stores persistent firmware.","ref":"L096"},{"q":"Give the array after one pass of bubble sort on [3,1,2].","a":"[1,2,3].","ref":"L110"}],"vocabulary":[{"term":"Two-dimensional arrays","definition":"A 2D array stores values in rows and columns and can be accessed with two indexes."},{"term":"Zero-based indexing","definition":"In a zero-indexed grid, the first row and column use index 0."},{"term":"Records","definition":"A record groups related fields about one entity under a single item."},{"term":"Choice of structure","definition":"Use a grid for table-like values and a record for named fields such as name and age."}],"exit":{"question":"A 2D array uses two indexes to locate an element.","answer":true},"assessment":false},{"n":116,"facts":[["Parameter","A value passed to a subprogram when it is called."],["Return value","A function sends a result back to the calling code."],["Local scope","A local variable is accessible within its subprogram."],["Global scope","A global variable is defined outside subprograms and can be accessed more widely, increasing risk of unintended changes."]],"ido":{"q":"Trace a function double(x) that returns x*2 when called with 7.","steps":["The argument 7 is passed into parameter x.","Inside the function x*2 gives 14.","The function returns 14 to its caller.","If printed, the output is 14."]},"wedo":{"q":"Trace a function addTax(price) which returns price+2 for input 9.","steps":["Identify the argument 9.","Evaluate the expression 9+2.","State what returns.","Return value 11."]},"code":{"source":"function square(n)\n    return n * n\nendfunction\nprint(square(4))","predict":"Predict the output.","change":"Change the argument from 4 to 6.","extend":"Explain what n represents.", strate independent understanding."],"retrieval":[{"q":"Differentiate a function and a procedure.","a":"A function returns a value; a procedure performs an action and does not need to return a value.","ref":"L116"},{"q":"Convert 10110000 binary to denary.","a":"128+32+16=176.","ref":"L100"},{"q":"State the difference between RAM and ROM.","a":"RAM is volatile working memory; ROM stores persistent firmware.","ref":"L096"},{"q":"Describe how records differ from 2D arrays.","a":"A record groups named fields of one entity, potentially with differing data types; a 2D array holds indexed elements arranged in rows and columns.","ref":"L115"}],"vocabulary":[{"term":"Open","definition":"A file is opened before reading or writing through a program."},{"term":"Read","definition":"Input from an existing file can be processed by a program."},{"term":"Write","definition":"Output can be saved to a file, with appropriate mode and permissions."},{"term":"Close","definition":"Closing releases the file resource and helps ensure changes are saved."}],"exit":{"question":"A file should normally be closed after use.","answer":true},"assessment":false},{"n":118,"facts":[["SELECT","Identifies which field or fields a query retrieves."],["FROM","Names the table containing the records."],["WHERE","Filters rows using a condition."],["SQL query","A database query retrieves only the requested information from a table."]],"ido":{"q":"For Pupils(ID, Name, Year), write a query to display Name where Year=11.","steps":["Select the Name field.","Specify FROM Pupils.","Filter using WHERE Year = 11.","SELECT Name FROM Pupils WHERE Year = 11;"]},"wedo":{"q":"For Books(Title, Genre), write a query to display Title where Genre='History'.","steps":["Identify the desired Title field.","Identify the Books table.","Filter for the text value History.","SELECT Title FROM Books WHERE Genre = 'History';"]},"code":{"source":"year = 11\nif year == 11 then\n    print(\"Included\")\nendif","predict":"Predict the result cted inputs without leaking data."]},"code":{"source":"attempts = 3\nif attempts >= 3 then\n    print(\"Locked\")\nelse\n    print(\"Try again\")\nendif","predict":"Predict the output.","change":"Change attempts to 2.","extend":"Extend to increment attempts on an incorrect password.","answer":"Locked; Try again; attempts = attempts + 1 when incorrect."},"exam":[{"q":"State two defensive programming techniques.","answer":"Input validation and restricted access or appropriate sanitisation; any two justified techniques.","marks":2},{"q":"Explain why meaningful variable names aid maintainability.","answer":"They make purpose easier to understand and reduce debugging/maintenance effort.","marks":2},{"q":"Explain why showing a user's actual password in an error message is unsafe.","answer":"It exposes a secret to observers and can enable unauthorised access.","marks":2}],"visual":"weak login program annotated with red risk → safe revised flow","stage":"text-draft","title":"Defensive Design","spec":"2.3.1","objectives":["Explain the core ideas of defensive design using accurate OCR terminology.","Apply a clear method to the worked and guided questions.","Use Code First and unseen exam practice to demonstrate independent understanding."],"retrieval":[{"q":"Explain validation versus verification.","a":"Validation checks a rule or format; verification checks data matches the original/source input.","ref":"L122"},{"q":"Identify the role of FROM in SQL.","a":"It names the table containing the data.","ref":"L118"},{"q":"State the difference between RAM and ROM.","a":"RAM is volatile working memory; ROM stores persistent firmware.","ref":"L096"},{"q":"Write an improvement target for an incomplete 4-mark explanation.","a":"Use four accurate, distinct causal points linked to the scenario and check each against marks.","ref":"L121"}],"vocabulary":[{"term":"Anticipate misuse","definition":"Reject unexpected input and avoid exposing sensitive detail in errors."},{"term":"Input sanitis xt targeted practice rather than repeat every topic."]],"ido":{"q":"A monochrome 100 × 50 bitmap uses 1 bit/pixel. Calculate its uncompressed file size in bytes.","steps":["Compute pixels: 100×50=5000.","Multiply by one bit per pixel: 5000 bits.","Convert 5000 ÷ 8=625 bytes.","State assumptions: ignoring metadata and compression."]},"wedo":{"q":"A mono sound clip lasts 5 seconds at 8000 samples/s and 8 bits/sample. Find bytes.","steps":["Compute 8000×5 samples.","Multiply by 8 bits/sample.","Divide bits by eight.","40,000 bytes."]},"code":{"source":"bits = 2400\nbytes = bits DIV 8\nprint(bytes)","predict":"Predict converted size.","change":"Change bits to 4000.","extend":"Extend to output leftover bits for a non-multiple of eight.","answer":"300 bytes; 500 bytes; remainder bits MOD 8."},"exam":[{"q":"Calculate the denary value of unsigned binary 10101010.","answer":"128+32+8+2 = 170.","marks":3},{"q":"Explain why binary search requires a sorted list.","answer":"Midpoint comparisons only allow safe elimination of half the list when values are ordered.","marks":3},{"q":"Explain one advantage and one limitation of virtual memory.","answer":"Lets the OS accommodate memory demand beyond physical RAM; uses slower secondary storage, so paging can reduce performance.","marks":4}],"visual":"worked formula mats for image/sound plus retrieval knowledge graph","stage":"text-draft","title":"Mixed Paper 1 and Paper 2 Retrieval","spec":"1.1–1.6 / 2.1–2.5","objectives":["Explain the core ideas of mixed paper 1 and paper 2 retrieval using accurate OCR terminology.","Apply a clear method to the worked and guided questions.","Use Code First and unseen exam practice to demonstrate independent understanding."],"retrieval":[{"q":"Explain why a trace is useful for unfamiliar code.","a":"It makes executed steps and changing variable values explicit, exposing incorrect assumptions or logic.","ref":"L131"},{"q":"Explain why a larger cache may improve performance.","a":"Frequently needed inst ,{"term":"WAN","definition":"Connects networks over wider geographical areas, often via third-party infrastructure."},{"term":"Client-server","definition":"Central servers provide resources/services for client devices."},{"term":"Peer-to-peer","definition":"Devices share resources directly without a dedicated central server for those resources."}],"exit":{"question":"A WAN can connect LANs in geographically separate locations.","answer":true},"assessment":false},{"n":134,"facts":[["NIC","Provides a device's connection to a network."],["Switch","Forwards frames between devices within a LAN using MAC address information."],["Router","Connects networks and forwards packets using IP address/routing information."],["Star and mesh","Star connects devices via a central point; mesh offers multiple potential paths between nodes."]],"ido":{"q":"Explain how data travels from a classroom PC to a server on another network.","steps":["The PC connects via its NIC.","A switch forwards traffic inside the LAN.","A router forwards the packet to the other network.","The destination network delivers data to the server."]},"wedo":{"q":"Compare star and mesh topology after one connection fails.","steps":["A star's peripheral link failure isolates the affected device.","If the central switch fails, many devices can lose connectivity.","Mesh may have alternative routes.","Explain the trade-off: mesh uses more connections and costs more."]},"code":{"source":"devices = 5\nconnections = devices * (devices - 1) DIV 2\nprint(connections)","predict":"Predict full-mesh links.","change":"Change devices to 4.","extend":"Explain why a star usually needs fewer physical links.","answer":"10; 6; five-node star normally has four peripheral links to central switch."},"exam":[{"q":"State what a switch does in a LAN.","answer":"Forwards frames to the appropriate device/port using learned MAC address information.","marks":2},{"q":"Give the purpose of a router.","answer":"Connects separate networks and forwards packets between them using IP routing.","marks":2},{"q":"Calculate full-mesh connections for four nodes.","answer":"4×3÷2=6 connections.","marks":2}],"visual":"labeled switches, routers, NICs plus accurate star/mesh connections","stage":"text-draft","title":"Network Hardware and Topologies","spec":"1.3.1","objectives":["Explain the core ideas of network hardware and topologies using accurate OCR terminology.","Apply a clear method to the worked and guided questions.","Use Code First and unseen exam practice to demonstrate independent understanding."],"retrieval":[{"q":"Explain one difference between LAN and WAN.","a":"LAN covers smaller/local area; WAN connects over wide geographical areas.","ref":"L133"},{"q":"State the role of parameters.","a":"They pass input values into a subprogram.","ref":"L129"},{"q":"Explain validation versus verification.","a":"Validation checks a rule or format; verification checks data matches the original/source input.","ref":"L122"},{"q":"Explain one advantage and one limitation of virtual memory.","a":"Lets the OS accommodate memory demand beyond physical RAM; uses slower secondary storage, so paging can reduce performance.","ref":"L132"}],"vocabulary":[{"term":"NIC","definition":"Provides a device's connection to a network."},{"term":"Switch","definition":"Forwards frames between devices within a LAN using MAC address information."},{"term":"Router","definition":"Connects networks and forwards packets using IP address/routing information."},{"term":"Star and mesh","definition":"Star connects devices via a central point; mesh offers multiple potential paths between nodes."}],"exit":{"question":"A switch normally forwards using IP routes between networks.","answer":false},"assessment":false},{"n":135,"facts":[["IP address","Identifies devices/interfaces for routing across IP networks."],["MAC address","Identifies a network interface at the data-link level for local communication."],["DNS","Resolves a domain name to an IP address."],[ :"RAM is physical primary working memory; virtual memory uses secondary storage to back pages when RAM is insufficient.","ref":"L163"},{"q":"State the prerequisite for binary search.","a":"The list must be sorted.","ref":"L159"},{"q":"What does MDR hold during a memory operation?","a":"Data or instruction being transferred.","ref":"L152"},{"q":"Give a suitable test after fixing an upper boundary error.","a":"Test exactly at upper boundary and one beyond, plus normal value.","ref":"L162"}],"vocabulary":[{"term":"Recall the full course","definition":"Paper 1 systems and Paper 2 computational thinking are equal components."},{"term":"Use accurate language","definition":"State precise definitions and causal effects."},{"term":"Demonstrate independence","definition":"Complete unseen traces, calculations and explanation without hints."},{"term":"Check answers","definition":"Use command words, units, bounds and allocated marks before submission."}],"exit":{"question":"OCR J277 has two equally weighted examination components.","answer":true},"assessment":false}]</script><script>
"use strict";
const all=JSON.parse(document.getElementById("lesson-data").textContent),byNumber=new Map(all.map(x=>[x.n,x]));
const nodes={nav:document.getElementById("nav-list"),out:document.getElementById("lesson-out"),search:document.getElementById("search"),count:document.getElementById("count")};
let active=114;
function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=String(text);return x}
function into(parent,...kids){kids.forEach(k=>parent.append(k));return parent}
function section(parent,title){const x=into(parent,el("section","section"));x.append(el("div","section-label",title));return x}
function paragraph(parent,txt,cls){return into(parent,el("p",cls||"",txt))}
function ordered(parent,items){const list=into(parent,el("ol","steps"));items.forEach(x=>into(list,el("li","",x)));return list}
function render(){
const d=byNumber.get(active);if(!d)return;
document.title="Lesson "+active+" · "+d.title+" · Year 11 text review";
history.replaceState(null,"","#lesson-"+active);
nodes.out.replaceChildren();
const top=into(nodes.out,el("div","top-line"));
into(top,el("div","chip","LESSON "+active+" · "+d.spec+" · TEACHER TEXT DRAFT"));
const buttons=into(top,el("div","step-nav"));
const prev=into(buttons,el("button","","← Previous")),next=into(buttons,el("button","","Next →"));
prev.disabled=active===114;next.disabled=active===164;prev.onclick=()=>select(active-1);next.onclick=()=>select(active+1);
nodes.out.append(el("h2","",d.title));
paragraph(nodes.out,"Check the content and worked answers before the SVG design and student-page publication.","lead");
if(d.assessment){const p=section(nodes.out,"Assessment planning note");paragraph(p,"This draft contains lesson-level modelling and example questions only. A complete timed examination paper and mark scheme are not yet included.","note");}
const dn=section(nodes.out,"01 · Do Now — previous knowledge only, no diagrams");
const grid=into(dn,el("div","four"));
d.retrieval.forEach((z,i)=>{const p=into(grid,el("div","prompt"));p.append(el("strong","",["1 · Last lesson","2 · Earlier learning","3 · Earlier learning","4 · Higher challenge"][i]+" · "+z.ref));paragraph(p,z.q);const details=into(p,el("details"));details.append(el("summary","","Show answer"));paragraph(details,z.a,"answer")});
const o=section(nodes.out,"02 · Objectives and key terms");ordered(o,d.objectives);
const nl=section(nodes.out,"03 · New Learning — four teaching steps");
d.facts.forEach(([term,def],i)=>{const p=into(nl,el("div","prompt"));p.style.marginBottom="9px";p.append(el("strong","",(i+1)+" · "+term));paragraph(p,def)});
const id=section(nodes.out,"04 · I Do — one complete model");
paragraph(id,d.ido.q,"model-q");ordered(id,d.ido.steps);
const wd=section(nodes.out,"05 · We Do — a different guided problem");
paragraph(wd,d.wedo.q,"model-q");ordered(wd,d.wedo.steps);
const yd=section(nodes.out,"06 · You Do — independent practice");
const code=into(yd,el("div","prompt"));code.append(el("strong","","CODE FIRST · approximately 5 minutes"));
paragraph(code,d.code.predict);
code.append(el("pre","code-box",d.code.source));
const tasks=into(code,el("div","code-tasks"));
paragraph(tasks,"Change: "+d.code.change);
paragraph(tasks,"Extend: "+d.code.extend);
let detail=into(code,el("details"));detail.append(el("summary","","Code First model answer"));paragraph(detail,d.code.answer,"answer");
d.exam.forEach((q,i)=>{
  const card=into(yd,el("div","exam"));
  card.append(el("div","meta","INDEPENDENT EXAM QUESTION "+(i+1)+" · "+q.marks+" MARK"+(q.marks===1?"":"S")));
  paragraph(card,q.q);
  const d2=into(card,el("details"));d2.append(el("summary","","Reveal marking points"));paragraph(d2,q.answer,"answer");
});
const v=section(nodes.out,"07 · Key Vocabulary — one term at a time");
const vg=into(v,el("div","vocab"));
d.vocabulary.forEach(x=>{const p=into(vg,el("div","vocab-item"));p.append(el("strong","",x.term));paragraph(p,x.definition)});
const ex=section(nodes.out,"08 · Exit Ticket");
paragraph(ex,"True or false: "+d.exit.question,"model-q");
const answer=into(ex,el("details"));answer.append(el("summary","","Show answer"));paragraph(answer,d.exit.answer?"True":"False","answer");
paragraph(ex,"Confidence: Confident / Nearly there / Help needed.");
const plan=section(nodes.out,"Visual design brief (after text approval)");
paragraph(plan,d.visual);
paragraph(plan,"Do Now: no SVG. I Do and We Do: purposeful diagrams, different data, step-by-step. You Do: only essential diagram data, without revealing answers.","muted");
for(const b of nodes.nav.querySelectorAll("button"))b.classList.toggle("active",+b.dataset.n===active);
nodes.count.textContent=(active-113)+" of 51 drafted lessons";
window.scrollTo({top:0,behavior:"instant"});
}
function select(n){if(!byNumber.has(n))return;active=n;render()}
const groups=[
["Programming and robust design",114,125],["CPU and consolidation",126,132],
["Networks, security and systems",133,142],["Logic and final coverage",143,148],
["Examination preparation",149,164]];
function buildNav(filter=""){
 nodes.nav.replaceChildren();const q=filter.trim().toLowerCase();
 groups.forEach(([name,from,to])=>{
 const subset=all.filter(d=>d.n>=from&&d.n<=to&&(String(d.n).includes(q)||d.title.toLowerCase().includes(q)||d.spec.toLowerCase().includes(q)));
 if(!subset.length)return;
 nodes.nav.append(el("div","group-title",name));
 subset.forEach(d=>{const b=into(nodes.nav,el("button","lesson-link"));b.dataset.n=d.n;b.append(el("strong","",String(d.n)));b.append(document.createTextNode(d.title));b.onclick=()=>select(d.n)});
 });for(const b of nodes.nav.querySelectorAll("button"))b.classList.toggle("active",+b.dataset.n===active);
}
nodes.search.addEventListener("input",()=>buildNav(nodes.search.value));
window.addEventListener("hashchange",()=>{const n=+(location.hash.match(/lesson-(\d+)/)||[])[1];if(byNumber.has(n)&&n!==active)select(n)});
buildNav();
const initial=+(location.hash.match(/lesson-(\d+)/)||[])[1];select(byNumber.has(initial)?initial:114);
document.getElementById("print").onclick=()=>window.print();
</script></body></html>
