<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 234" role="img" aria-labelledby="cycle-title cycle-desc">
  <title id="cycle-title">Code First: Predict, Write, Test, Iterate</title>
  <desc id="cycle-desc">Four connected coding steps. The highlighted step indicates the current learning task.</desc>
  <style>
    .cycle-step .cycle-card{fill:#e7f3ed;stroke:#087050;stroke-width:3}
    .cycle-step.is-active .cycle-card{fill:#fff2a2;stroke:#087050;stroke-width:4}
    .cycle-label{font:800 29px Arial,Helvetica,sans-serif;fill:#075e45}
    .cycle-note{font:21px Arial,Helvetica,sans-serif;fill:#17674f}
    .cycle-icon{fill:none;stroke:#097251;stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}
    .cycle-connector{fill:none;stroke:#086c50;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <g class="cycle-step is-active" data-cycle-step="predict">
    <rect class="cycle-card" x="12" y="10" width="274" height="151" rx="17"/>
    <g class="cycle-icon" transform="translate(41 41)">
      <path d="M24 4a27 27 0 0 1 18 48c-5 4-6 9-7 15H14c-1-7-2-11-7-16A27 27 0 0 1 24 4Z"/>
      <path d="M15 75h20M18 84h14M22 90h6M24-5v-8M-5 23l-9-3M53 23l9-3M2 3l-7-7M47 3l7-7"/>
    </g>
    <text class="cycle-label" x="112" y="77">PREDICT</text>
    <text class="cycle-note" x="125" y="112">Think first</text>
  </g>
  <g class="cycle-connector"><path d="M294 84l12 12-12 12"/></g>
  <g class="cycle-step" data-cycle-step="write">
    <rect class="cycle-card" x="315" y="10" width="274" height="151" rx="17"/>
    <g class="cycle-icon" transform="translate(341 51)">
      <rect x="0" y="0" width="65" height="48" rx="4"/><path d="M26 14 15 24l11 10M39 14l11 10-11 10M-6 53h77l-8 10H2Z"/>
    </g>
    <text class="cycle-label" x="427" y="77">WRITE</text>
    <text class="cycle-note" x="427" y="112">Keep it small</text>
  </g>
  <g class="cycle-connector"><path d="M597 84l12 12-12 12"/></g>
  <g class="cycle-step" data-cycle-step="test">
    <rect class="cycle-card" x="618" y="10" width="274" height="151" rx="17"/>
    <g class="cycle-icon" transform="translate(649 44)">
      <circle cx="28" cy="35" r="18"/><path d="M28 4v-8M28 73v8M-2 35h-8M66 35h8M7 14 1 8M49 56l7 7M7 56l-6 7M49 14l7-6"/>
      <circle cx="28" cy="35" r="6"/>
    </g>
    <text class="cycle-label" x="734" y="77">TEST</text>
    <text class="cycle-note" x="734" y="112">Trace or run</text>
  </g>
  <g class="cycle-connector"><path d="M901 84l12 12-12 12"/></g>
  <g class="cycle-step" data-cycle-step="iterate">
    <rect class="cycle-card" x="921" y="10" width="267" height="151" rx="17"/>
    <g class="cycle-icon" transform="translate(950 48)">
      <path d="M5 32A32 32 0 0 1 59 15l3 13M61 49A32 32 0 0 1 7 68L4 54"/>
      <path d="M47 23 62 29l6-17M20 58 4 52l-3 18"/>
    </g>
    <text class="cycle-label" x="1014" y="77">ITERATE</text>
    <text class="cycle-note" x="1026" y="112">Refine &amp; retry</text>
  </g>
  <g class="cycle-connector">
    <path d="M1057 167v15c0 23-19 41-42 41H462c-23 0-42-18-42-41v-10"/>
    <path d="m408 187 12-14 12 14"/>
  </g>
</svg>