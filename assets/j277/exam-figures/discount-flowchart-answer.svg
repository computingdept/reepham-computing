<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" role="img" aria-labelledby="discount-flow-title discount-flow-desc"><title id="discount-flow-title">Student discount eligibility flowchart answer</title><desc id="discount-flow-desc">Starts, reads student/loyalty/Saturday; checks if a discount category applies; checks not Saturday; outputs half price or full price.</desc><defs>
<filter id="softEdge" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="16"/></filter>
<filter id="componentShadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#222b35"/></marker>
</defs>
<rect x="25" y="25" width="850" height="850" rx="68" fill="#c5d3e2" opacity=".38" filter="url(#softEdge)"/>
<rect x="32" y="32" width="836" height="836" rx="58" fill="#fff" stroke="#e1e5e8" stroke-width="2"/>
<style>
text{fill:#1d242c;font-family:Inter,Arial,Helvetica,sans-serif}
.head{font-weight:750;font-size:45px;letter-spacing:1px}
.label{font-weight:650;font-size:36px}
.small{font-weight:550;font-size:29px}
.big{font-weight:750;font-size:46px}
.link{fill:none;stroke:#242a32;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.device{fill:#fff;stroke:#242a32;stroke-width:5;stroke-linejoin:round}
.gridline{fill:#fff;stroke:#303842;stroke-width:4}
</style><text class="head" x="450" y="120" text-anchor="middle">DISCOUNT DECISION</text><text class="small" x="450" y="162" text-anchor="middle">Worked flowchart</text>
<g class="link" marker-end="url(#arrow)">
<path d="M375 236 V278"/><path d="M375 351 V383"/>
<path d="M375 514 V530"/>
<path d="M375 667 V712"/>
<path d="M497 449 H710 V715"/>
<path d="M493 591 H710 V715"/></g>
<rect class="device" x="247.5" y="172.5" width="255" height="65" rx="32.5"/><text class="label" x="375" y="217" text-anchor="middle">START</text>
<path class="device" d="M225 281 H585 L525 355 H165 Z"/><text class="label" x="375" y="331" text-anchor="middle">INPUT A, B, C</text>
<path class="device" d="M375 383 L497.5 449 L375 515 L252.5 449 Z"/><text class="label" x="375" y="461" text-anchor="middle">A OR B?</text>
<path class="device" d="M375 520 L493.5 591 L375 662 L256.5 591 Z"/><text class="label" x="375" y="603" text-anchor="middle">Saturday?</text>
<text class="small" x="388" y="530" text-anchor="middle">YES</text>
<text class="small" x="608" y="424" text-anchor="middle">NO</text>
<text class="small" x="390" y="700" text-anchor="middle">NO</text>
<text class="small" x="600" y="571" text-anchor="middle">YES</text>
<path class="device" d="M270 717.5 H540 L480 792.5 H210 Z"/><text class="label" x="375" y="768" text-anchor="middle">HALF PRICE</text>
<path class="device" d="M615 717.5 H865 L805 792.5 H555 Z"/><text class="label" x="710" y="768" text-anchor="middle">FULL PRICE</text><path class="link" d="M375 793 V807 H450 V812 M710 793 V807 H450"/><rect class="device" x="362" y="812" width="176" height="52" rx="26"/><text class="small" x="450" y="845" text-anchor="middle">END</text></svg>
