<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="heading-101-a description-101-a"><title id="heading-101-a">Testing a quiz program — worked answer</title><desc id="description-101-a">RHS model/reveal illustration with the correct responses. Part 101.</desc><defs><filter id="schoolGlow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="8"/></filter></defs><rect x="1" y="1" width="998" height="408" rx="24" fill="#fff" stroke="#d9dcdf" stroke-width="2"/><rect x="39" y="27" width="80" height="8" rx="4" fill="#195B42" opacity=".25" filter="url(#schoolGlow)"/><rect x="36" y="29" width="85" height="4" rx="2" fill="#484c50"/><text x="33" y="81" fill="#22252a" font-family="'Inter',Arial,Helvetica,sans-serif" font-size="31" font-weight="800"><tspan x="33" dy="0">Testing a quiz program</tspan></text><text x="34" y="119" fill="#555a60" font-family="'Inter',Arial,Helvetica,sans-serif" font-size="19" font-weight="500"><tspan x="34" dy="0">Name one testing method and describe its use</tspan></text><rect x="37" y="155" width="926" height="171" rx="17" fill="#195B42" opacity=".12" filter="url(#schoolGlow)"/><rect x="32" y="148" width="936" height="178" rx="14" fill="#fff" stroke="#d9dcdf" stroke-width="2"/><path d="M 577 148 V 326" stroke="#dadde0" stroke-width="1.5"/><rect x="33" y="149" width="934" height="49" rx="13" fill="#f3f4f5"/><text x="50" y="180" fill="#4b4e53" font-family="'Inter',Arial,Helvetica,sans-serif" font-size="18" font-weight="750"><tspan x="50" dy="0">PROMPT / ROW</tspan></text><text x="595" y="180" fill="#4b4e53" font-family="'Inter',Arial,Helvetica,sans-serif" font-size="18" font-weight="750"><tspan x="595" dy="0">ACCEPTABLE ANSWER</tspan></text><rect x="583" y="203" width="379" height="42" rx="8" fill="#eff1f0"/><path d="M 32 198 H 968" stroke="#eaeced"/><text x="48" y="230" fill="#22252a" font-family="'Inter',Arial,Helvetica,sans-serif" font-size="19" font-weight="55