<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" role="img" aria-labelledby="star-network-title star-network-desc"><title id="star-network-title">A fully connected star network with five laptops, two printers and one central switch</title><desc id="star-network-desc">Worked answer. Each of five laptops and two printers is connected only to the central switch.</desc><defs>
