ize="21" font-weight="550"><tspan x="59" dy="0">total = ______</tspan></text><rect x="47" y="273" width="906" height="36" rx="5" fill="#fafafa"/><text x="59" y="301" fill="#22252a" font-family="'SFMono-Regular',Consolas,monospace" font-size="21" font-weight="550"><tspan x="59" dy="0">for i = ______ to ______</tspan></text><rect x="47" y="312" width="906" height="36" rx="5" fill="#fff"/><text x="59" y="340" fill="#22252a" font-family="'SFMono-Regular',Consolas,monospace" font-size="21" font-weight="550"><tspan x="59" dy="0">    if arrayEvents[i][____] == dateToFind then</tspan></text><rect x="47" y="351" width="906" height="36" rx="5" fill="#fafafa"/><text x="59" y="379" fill="#22252a" font-family="'SFMono-Regular',Consolas,monospace" font-size="21" font-weight="550"><tspan x="59" dy="0">        total = total + arrayEvents[i][____]</tspan></text><rect x="47" y="390" width="906" height="36" rx="5" fill="#fff"/><text x="59" y="418" fill="#22252a" font-family="'SFMono-Regular',Consolas,monospace" font-size="21" font-weight="550"><tspan x="59" dy="0">    endif</tspan></text><rect x="47" y="429" width="906" height="36" rx="5" fill="#fafafa"/><text x="59" y="457" fill="#22252a" font-family="'SFMono-Regular',Consolas,monospace" font-size="21" font-weight="550"><tspan x="59" dy="0">next i</tspan></text><rect x="47" y="468" width="906" height="36" rx="5" fill="#fff"/><text x="59" y="496" fill="#22252a" font-family="'SFMono-Regular',Consolas,monospace" font-size="21" font-weight="550"><tspan x="59" dy="0">print(______, ______)</tspan></text><text x="635" y="529" fill="#777b7e" font-family="'Inter',Arial,Helvetica,sans-serif" font-size="13" font-weight="700"><tspan x="635" dy="0">RHS J277 · 115 · QUESTION</tspan></text></svg>