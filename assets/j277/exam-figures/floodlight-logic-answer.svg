<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" role="img" aria-labelledby="floodlight-title floodlight-desc"><title id="floodlight-title">Three-gate floodlight logic solution</title><desc id="floodlight-desc">A is movement, B is daylight and C is manual enable. Invert B, AND with A, then AND result with C.</desc><defs>
<filter id="softEdge" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="16"/></filter>
<filter id="componentShadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<rect x="25" y="25" width="850" height="850" rx="68" fill="#c5d3e2" opacity=".38" filter="url(#softEdge)"/>
<rect x="32" y="32" width="836" height="836" rx="58" fill="#fff" stroke="#e1e5e8" stroke-width="2"/>
<style>
text{fill:#1d242c;font-family:Inter,Arial,Helvetica,sans-serif}
.head{font-weight:750;font-size:45px;letter-spacing:1px}
.label{font-weight:650;font-size:36px}
.small{font-weight:550;font-size:29px}
.big{font-weight:750;font-size:48px}
.link{fill:none;stroke:#242a32;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.device{fill:#fff;stroke:#242a32;stroke-width:5;stroke-linejoin:round}
.faint{stroke:#dce2e7;stroke-width:3}
</style><text class="head" x="450" y="123" text-anchor="middle">FLOODLIGHT</text><text class="small" x="450" y="165" text-anchor="middle">Q = A AND (NOT B) AND C</text>
<g class="link"><path d="M125 276 H320 V308 H430"/><path d="M125 458 H243"/><path d="M352 458 H386 V372 H430"/><path d="M530 339 H578 V448 H654"/><path d="M125 622 H578 V496 H654"/><path d="M752 473 H800"/></g>
<text class="label" x="102" y="267" text-anchor="end">A</text><text class="label" x="102" y="451" text-anchor="end">B</text><text class="label" x="102" y="615" text-anchor="end">C</text>
<path class="device" d="M245 421 L330 458 L245 495 Z"/><circle cx="341" cy="458" r="11" class="device"/><path class="device" d="M430 291 H478 A48 48 0 0 1 478 387 H430 Z"/><path class="device" d="M654 425 H702 A48 48 0 0 1 702 521 H654 Z"/>
<text class="small" x="293" y="531" text-anchor="middle">NOT</text><text class="small" x="481" y="354" text-anchor="middle">AND</text><text class="small" x="705" y="487" text-anchor="middle">AND</text><text class="big" x="810" y="485" text-anchor="start">Q</text></svg>
