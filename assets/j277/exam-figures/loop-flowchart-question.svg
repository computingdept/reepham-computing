<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" role="img" aria-labelledby="loop-question-title loop-question-desc"><title id="loop-question-title">Loop tracing question flowchart</title><desc id="loop-question-desc">Input x, print OK, subtract 2, check whether x is less than zero; if no, loop back to print OK; if yes, stop.</desc><defs>
<filter id="softEdge" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="16"/></filter>
<filter id="componentShadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#222b35"/></marker>
</defs>
<rect x="25" y="25" width="850" height="850" rx="68" fill="#c5d3e2" opacity=".38" filter="url(#softEdge)"/>
<rect x="32" y="32" width="836" height="836" rx="58" fill="#fff" stroke="#e1e5e8" stroke-width="2"/>
<style>
text{fill:#1d242c;font-family:Inter,Arial,Helvetica,sans-serif}
.head{font-weight:750;font-size:45px;letter-spacing:1px}
.label{font-weight:650;font-size:36px}
.small{font-weight:550;font-size:29px}
.big{font-weight:750;font-size:46px}
.link{fill:none;stroke:#242a32;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.device{fill:#fff;stroke:#242a32;stroke-width:5;stroke-linejoin:round}
.gridline{fill:#fff;stroke:#303842;stroke-width:4}
</style><text class="head" x="450" y="120" text-anchor="middle">TRACE THE LOOP</text><text class="small" x="450" y="162" text-anchor="middle">Question diagram · do not show answer</text>
<g class="link" marker-end="url(#arrow)">
<path d="M450 238 V278"/><path d="M450 350 V382"/>
<path d="M450 449 V486"/><path d="M450 554 V582"/>
<path d="M562 650 H680 V747 H565"/>
<path d="M338 650 H190 V415 H325"/></g>
<rect class="device" x="325" y="172" width="250" height="66" rx="33"/><text class="label" x="450" y="217" text-anchor="middle">START</text>
<path class="device" d="M353 280 H607 L547 350 H293 Z"/><text class="label" x="450" y="328" text-anchor="middle">INPUT x</text>
<path class="device" d="M355 386.5 H605 L545 451.5 H295 Z"/><text class="label" x="450" y="432" text-anchor="middle">PRINT OK</text>
<rect class="device" x="308.5" y="485.5" width="283" height="69" rx="12"/><text class="label" x="450" y="532" text-anchor="middle">x = x - 2</text>
<path class="device" d="M450 581.5 L562.5 650 L450 718.5 L337.5 650 Z"/><text class="label" x="450" y="662" text-anchor="middle">x &lt; 0 ?</text>
<text class="small" x="604" y="624" text-anchor="middle">YES</text><text class="small" x="254" y="623" text-anchor="middle">NO</text>
<rect class="device" x="334" y="745" width="232" height="70" rx="35"/><text class="label" x="450" y="792" text-anchor="middle">END</text></svg>
