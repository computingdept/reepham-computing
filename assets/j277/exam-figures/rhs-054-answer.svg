<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="488" viewBox="0 0 1000 488" role="img" aria-labelledby="heading-054-a description-054-a"><title id="heading-054-a">Correct the room-occupancy total — worked answer</title><desc id="description-054-a">RHS model/reveal illustration with the correct responses. Part 054.</desc><defs><filter id="schoolGlow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="8"/></filter></defs><rect x="1" y="1" width="998" height="486" rx="24" fill="#fff" stroke="#d9dcdf" stroke-width="2"/><rect x="39" y="27" width="80" height="8" rx="4" fill="#195B42" opacity=".25" filter="url(#schoolGlow)"/><rect x="36" y="29" width="85" height="4" rx="2" fill="#484c50"/><text x="33" y="81" fill="#22252a" font-family="'Inter',Arial,Helvetica,sans-serif" font-size="31" font-weight="800"><tspan x="33" dy="0">Correct the room-occupancy total</tspan></text><text x="34" y="119" fill="#555a60" font-family="'Inter',Arial,Helvetica,sans-serif" font-size="19" font-weight="500"><tspan x="34" dy="0">Find the two logic errors in the pseudocode</tspan></text><rect x="37" y="150" width="926" height="241" rx="16" fill="#195B42" opacity=".11" filter="url(#schoolGlow)"/><rect x="32" y="148" width="936" height="245" rx="14" fill="#fff" stroke="#d9dcdf" stroke-width="2"/><rect x="33" y="149" width="934" height="43" rx="13" fill="#f3f4f5"/><text x="52" y="178" fill="#4b4e53" font-family="'Inter',Arial,Helvetica,sans-serif" font-size="18" font-weight="700"><tspan x="52" dy="0">CORRECTED / MODEL CODE</tspan></text><rect x="47" y="195" width="906" height="36" rx="5" fill="#fafafa"/><text x="59" y="223" fill="#22252a" font-family="'SFMono-Regular',Consolas,monospace" font-size="21" font-weight="550"><tspan x="59" dy="0">total = 0</tspan></text><rect x="47" y="234" width="906" height="36" rx="5" fill="#fff"/><text x="59" y="262" fill="#22252a" font-family="'SFMono-Regular',Consolas,monospace" font-size="21" font-weight="550"><tspan x="59" dy="0">for count = 0 to 8</tspan></text><rect x="47" y="273" width="906" height="36" rx="5" fill="#fafafa"/><text x="59" y="301" fill="#22252a" font-family="'SFMono-Regular',Consolas,monospace" font-size="21" font-weight="550"><tspan x="59" dy="0">    total = total + room[count]</tspan></text><rect x="47" y="312" width="906" height="36" rx="5" fill="#fff"/><text x="59" y="340" fill="#22252a" font-family="'SFMono-Regular',Consolas,monospace" font-size="21" font-weight="550"><tspan x="59" dy="0">next count</tspan></text><rect x="47" y="351" width="906" height="36" rx="5" fill="#fafafa"/><text x="59" y="379" fill="#22252a" font-family="'SFMono-Regular',Consolas,monospace" font-size="21" font-weight="550"><tspan x="59" dy="0">print(total)</tspan></text><rect x="32" y="405" width="936" height="48" rx="10" fill="#f4f4f5" stroke="#dadde0"/><text x="50" y="436" fill="#22252a" font-family="'Inter',Arial,Helvetica,sans-serif" font-size="19" font-weight="600"><tspan x="50" dy="0">Include room[0]; initialise total once before the loop</tspan></text><text x="635" y="474" fill="#777b7e" font-family="'Inter',Arial,Helvetica,sans-serif" font-size="13" font-weight="700"><tspan x="635" dy="0">RHS J277 · 054 · WORKED ANSWER</tspan></text></svg>