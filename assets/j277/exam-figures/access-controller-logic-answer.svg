<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" role="img" aria-labelledby="access-gates-title access-gates-desc"><title id="access-gates-title">Access controller logic gates answer</title><desc id="access-gates-desc">Invert A. Combine B and C with OR. Then combine the two results with AND producing P.</desc><defs>
<filter id="softEdge" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="16"/></filter>
<filter id="componentShadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<rect x="25" y="25" width="850" height="850" rx="68" fill="#c5d3e2" opacity=".38" filter="url(#softEdge)"/>
<rect x="32" y="32" width="836" height="836" rx="58" fill="#fff" stroke="#e1e5e8" stroke-width="2"/>
<style>
text{fill:#1d242c;font-family:Inter,Arial,Helvetica,sans-serif}
.head{font-weight:750;font-size:45px;letter-spacing:1px}
.label{font-weight:650;font-size:36px}
.small{font-weight:550;font-size:29px}
.big{font-weight:750;font-size:48px}
.link{fill:none;stroke:#242a32;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.device{fill:#fff;stroke:#242a32;stroke-width:5;stroke-linejoin:round}
.faint{stroke:#dce2e7;stroke-width:3}
</style><text class="head" x="450" y="123" text-anchor="middle">ACCESS CONTROLLER</text><text class="small" x="450" y="165" text-anchor="middle">P = (NOT A) AND (B OR C)</text>
<g class="link"><path d="M125 280 H265"/><path d="M374 280 H525 V395 H645"/><path d="M125 513 H290 V553"/><path d="M125 666 H290 V606"/><path d="M385 580 H530 V465 H645"/><path d="M743 431 H803"/></g>
<text class="label" x="106" y="273" text-anchor="end">A</text><text class="label" x="106" y="506" text-anchor="end">B</text><text class="label" x="106" y="659" text-anchor="end">C</text>
<path class="device" d="M267 243 L352 280 L267 317 Z"/><circle cx="363" cy="280" r="11" class="device"/><path class="device" d="M290 532 Q336 532 384 580 Q336 628 290 628 Q319 580 290 532 Z"/><path class="device" d="M645 383 H693 A48 48 0 0 1 693 479 H645 Z"/>
<text class="small" x="305" y="370" text-anchor="middle">NOT</text><text class="small" x="339" y="598" text-anchor="middle">OR</text><text class="small" x="696" y="445" text-anchor="middle">AND</text><text class="big" x="817" y="446" text-anchor="start">P</text></svg>
