<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" role="img" aria-labelledby="odd-even-flow-title odd-even-flow-desc"><title id="odd-even-flow-title">Odd or even flowchart worked answer</title><desc id="odd-even-flow-desc">Flowchart inputs num, checks num MOD 2 equals zero; true prints Even, false prints Odd; both paths lead to End.</desc><defs>
<filter id="softEdge" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="16"/></filter>
<filter id="componentShadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#222b35"/></marker>
</defs>
<rect x="25" y="25" width="850" height="850" rx="68" fill="#c5d3e2" opacity=".38" filter="url(#softEdge)"/>
<rect x="32" y="32" width="836" height="836" rx="58" fill="#fff" stroke="#e1e5e8" stroke-width="2"/>
<style>
text{fill:#1d242c;font-family:Inter,Arial,Helvetica,sans-serif}
.head{font-weight:750;font-size:45px;letter-spacing:1px}
.label{font-weight:650;font-size:36px}
.small{font-weight:550;font-size:29px}
.big{font-weight:750;font-size:46px}
.link{fill:none;stroke:#242a32;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.device{fill:#fff;stroke:#242a32;stroke-width:5;stroke-linejoin:round}
.gridline{fill:#fff;stroke:#303842;stroke-width:4}
</style><text class="head" x="450" y="120" text-anchor="middle">ODD OR EVEN</text><text class="small" x="450" y="162" text-anchor="middle">Flowchart · worked answer</text>
<g class="link" marker-end="url(#arrow)">
<path d="M450 255 V292"/><path d="M450 365 V414"/><path d="M310 510 H235 V612"/><path d="M590 510 H665 V612"/>
<path d="M235 686 V753 H450 V770"/><path d="M665 686 V753 H450"/></g>
<rect class="device" x="320" y="186" width="260" height="72" rx="36"/><text class="label" x="450" y="234" text-anchor="middle">START</text><path class="device" d="M342.5 289 H617.5 L557.5 367 H282.5 Z"/><text class="label" x="450" y="341" text-anchor="middle">INPUT num</text>
<path class="device" d="M450 433 L590 510 L450 587 L310 510 Z"/><text class="label" x="450" y="522" text-anchor="middle">num MOD 2 = 0?</text>
<text class="small" x="254" y="491" text-anchor="middle">TRUE</text><text class="small" x="656" y="491" text-anchor="middle">FALSE</text>
<path class="device" d="M125 613.5 H405 L345 686.5 H65 Z"/><text class="label" x="235" y="663" text-anchor="middle">PRINT Even</text><path class="device" d="M555 613.5 H835 L775 686.5 H495 Z"/><text class="label" x="665" y="663" text-anchor="middle">PRINT Odd</text>
<rect class="device" x="327.5" y="771" width="245" height="70" rx="35"/><text class="label" x="450" y="818" text-anchor="middle">END</text></svg>
