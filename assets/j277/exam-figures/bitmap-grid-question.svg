<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" role="img" aria-labelledby="bitmap-question-title bitmap-question-desc"><title id="bitmap-question-title">Blank three-column by four-row bitmap grid</title><desc id="bitmap-question-desc">Blank four-row, three-column grid for students to write red, green, blue and purple pixel names from binary codes.</desc><defs>
<filter id="softEdge" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="16"/></filter>
<filter id="componentShadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#222b35"/></marker>
</defs>
<rect x="25" y="25" width="850" height="850" rx="68" fill="#c5d3e2" opacity=".38" filter="url(#softEdge)"/>
<rect x="32" y="32" width="836" height="836" rx="58" fill="#fff" stroke="#e1e5e8" stroke-width="2"/>
<style>
text{fill:#1d242c;font-family:Inter,Arial,Helvetica,sans-serif}
.head{font-weight:750;font-size:45px;letter-spacing:1px}
.label{font-weight:650;font-size:36px}
.small{font-weight:550;font-size:29px}
.big{font-weight:750;font-size:46px}
.link{fill:none;stroke:#242a32;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.device{fill:#fff;stroke:#242a32;stroke-width:5;stroke-linejoin:round}
.gridline{fill:#fff;stroke:#303842;stroke-width:4}
</style><text class="head" x="450" y="120" text-anchor="middle">PIXEL GRID</text><text class="small" x="450" y="162" text-anchor="middle">Complete the twelve cells</text><rect class="gridline" x="233" y="220" width="145" height="145"/><text class="big" x="305.5" y="304.5" text-anchor="middle">? </text><rect class="gridline" x="378" y="220" width="145" height="145"/><text class="big" x="450.5" y="304.5" text-anchor="middle">? </text><rect class="gridline" x="523" y="220" width="145" height="145"/><text class="big" x="595.5" y="304.5" text-anchor="middle">? </text><rect class="gridline" x="233" y="365" width="145" height="145"/><text class="big" x="305.5" y="449.5" text-anchor="middle">? </text><rect class="gridline" x="378" y="365" width="145" height="145"/><text class="big" x="450.5" y="449.5" text-anchor="middle">? </text><rect class="gridline" x="523" y="365" width="145" height="145"/><text class="big" x="595.5" y="449.5" text-anchor="middle">? </text><rect class="gridline" x="233" y="510" width="145" height="145"/><text class="big" x="305.5" y="594.5" text-anchor="middle">? </text><rect class="gridline" x="378" y="510" width="145" height="145"/><text class="big" x="450.5" y="594.5" text-anchor="middle">? </text><rect class="gridline" x="523" y="510" width="145" height="145"/><text class="big" x="595.5" y="594.5" text-anchor="middle">? </text><rect class="gridline" x="233" y="655" width="145" height="145"/><text class="big" x="305.5" y="739.5" text-anchor="middle">? </text><rect class="gridline" x="378" y="655" width="145" height="145"/><text class="big" x="450.5" y="739.5" text-anchor="middle">? </text><rect class="gridline" x="523" y="655" width="145" height="145"/><text class="big" x="595.5" y="739.5" text-anchor="middle">? </text><text class="small" x="450" y="848" text-anchor="middle">4 rows × 3 columns</text></svg>
