<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1540" role="img" aria-labelledby="title desc"><title id="title">J277 iteration worked flowchart mobile</title><desc id="desc">Mobile original iteration flowchart for positive integer count. Output GO before reducing count. Decrement by one, if zero End else repeat output. Input 3 prints three times; input 5 prints five times. Decorative school-colour blurred outlines around flowchart shapes.</desc><defs><filter id="schoolGlow" x="-70%" y="-80%" width="240%" height="260%"><feGaussianBlur stdDeviation="8"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#262626" stroke-width="1.5"/></marker></defs><style>text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#161616}.wire{fill:none;stroke:#262626;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.shape{stroke:#262626;stroke-width:4;fill:white;stroke-linejoin:round}.label{font-weight:800;text-anchor:middle}.hint{fill:#616161}</style><rect width="900" height="1540" fill="#FFFFFF"/><text x="42" y="68" font-size="22" font-weight="800" letter-spacing="1.5">J277 · 2.1.2 / ITERATION</text>
