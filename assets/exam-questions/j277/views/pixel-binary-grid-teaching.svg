<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Decode a bitmap — teaching view</title>
<desc id="desc">Twelve binary codes in a 4 by 3 grid. Key 00 white 01 light grey 10 dark grey 11 black. 24 bits or 3 bytes for uncompressed pixel data, excluding metadata. Original J277 worked illustration, not an OCR examination figure. The school-colour glow has no technical meaning.</desc>
<defs><filter id="schoolGlow" x="-70%" y="-80%" width="240%" height="260%"><feGaussianBlur stdDeviation="8"/></filter>
<marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L10 5.5 L1 10" fill="none" stroke="#292929" stroke-width="1.8"/></marker></defs>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#161616}.secondary{fill:#575757}</style>
<rect width="1200" height="900" fill="#FFFFFF"/>
<text x="45" y="59" font-size="24" font-weight="800">J277 · 1.2.4</text>
<text x="45" y="112" font-size="47" font-weight="800">Decode a bitmap</text>
<text x="46" y="151" font-size="26" class="secondary">Each two-bit code determines one pixel shade.</text>
