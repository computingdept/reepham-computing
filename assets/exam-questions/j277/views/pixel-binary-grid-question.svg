<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
<title id="title">Decode a bitmap — student Question View</title>
<desc id="desc">Original 4 by 3 pixel grid, 2 bits per pixel; bit codes in row-major order 00 01 10 11, 11 00 01 10, 10 11 00 01. The lower pixel grid is left blank. Use the supplied question's colour key. A minimal original J277 question illustration, suitable for the left half of a classroom screen. No worked answer is shown.</desc>
<defs><filter id="schoolGlow" x="-70%" y="-80%" width="240%" height="260%"><feGaussianBlur stdDeviation="8"/></filter></defs>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#171717} .secondary{fill:#585858}</style>
<rect width="800" height="800" fill="#FFFFFF"/>
<text x="48" y="58" font-size="25" font-weight="800">J277 · 1.2.4</text>
<text x="48" y="111" font-size="43" font-weight="800">Decode a bitmap</text>
<rect x="34" y="153" width="732" height="604" rx="26" fill="none" stroke="#195B42" stroke-width="16" opacity="0.17" filter="url(#schoolGlow)"/>
<rect x="34" y="153" width="732" height="604" rx="26" fill="white" stroke="#E2E2E2" stroke-width="2"/>
