<style>text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#161616}.secondary{fill:#575757}</style>
<rect width="1200" height="900" fill="#FFFFFF"/>
<text x="45" y="59" font-size="24" font-weight="800">J277 · 1.3.1</text>
<text x="45" y="112" font-size="47" font-weight="800">Network topologies</text>
<text x="46" y="151" font-size="26" class="secondary">Compare the connections, not just the number of devices.</text>
