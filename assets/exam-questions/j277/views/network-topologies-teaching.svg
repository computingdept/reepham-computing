<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Network topologies — teaching view</title>
<desc id="desc">Star topology with three PCs and one printer linked to a central switch; full mesh of four routers A B C D with six distinct links. Crossing diagonals are not a junction. Original J277 worked illustration, not an OCR examination figure. The school-colour glow has no technical meaning.</desc>
