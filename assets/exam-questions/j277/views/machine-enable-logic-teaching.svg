<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Machine controller — teaching view</title>
<desc id="desc">Inputs Manual, Automatic, Service: first gate OR; third input inverted via NOT; final output Run = (Manual OR Automatic) AND NOT Service. Original GCSE teaching diagram, not an OCR examination figure. The soft school-colour halo is decorative and does not encode meaning.</desc>
