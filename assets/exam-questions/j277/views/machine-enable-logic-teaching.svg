<rect width="1200" height="900" fill="white"/>
<text x="45" y="59" font-size="24" font-weight="800">J277 · 2.4.1</text>
<text x="45" y="112" font-size="47" font-weight="800">Machine controller</text>
<text x="46" y="151" font-size="26" class="secondary">Follow both branches into the final AND gate.</text>
