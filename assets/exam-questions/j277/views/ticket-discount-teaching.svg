<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Ticket decision — teaching view</title>
<desc id="desc">Input age and price. Decision: age under 16. True path reduces price to 75 percent of original; False keeps full price. Both paths join to output price and End. Original J277 worked illustration, not an OCR examination figure. The school-colour glow has no technical meaning.</desc>
<defs><filter id="schoolGlow" x="-70%" y="-80%" width="240%" height="260%"><feGaussianBlur stdDeviation="8"/></filter>
<marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L10 5.5 L1 10" fill="none" stroke="#292929" stroke-width="1.8"/></marker></defs>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#161616}.secondary{fill:#575757}</style>
<rect width="1200" height="900" fill="#FFFFFF"/>
<text x="45" y="59" font-size="24" font-weight="800">J277 · 2.1.2</text>
<text x="45" y="112" font-size="47" font-weight="800">Ticket decision</text>
<text x="46" y="151" font-size="26" class="secondary">A decision selects one of two actions.</text>
<rect x="32" y="181" width="1136" height="677" rx="24" fill="none" stroke="#195B42" stroke-width="15" opacity="0.17" filter="url(#schoolGlow)"/>
<rect x="32" y="181" width="1136" height="677" rx="24" fill="white" stroke="#E2E2E2" stroke-width="2"/>
<text x="80" y="219" text-anchor="start" font-size="25" font-weight="740">START → DECISION → TWO PATHS → OUTPUT</text><path d="M600 278 V305" fill="none" stroke="#292929" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M600 375 V395" fill="none" stroke="#292929" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M449 489 H328 V608" fill="none" stroke="#292929" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M751 489 H883 V608" fill="none" stroke="#292929" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M328 683 V702 H600 M883 683 V702 H600" fill="none" stroke="#292929" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M600 702 V720" fill="none" stroke="#292929" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M600 783 V801" fill="none" stroke="#292929" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="353" y="481" text-anchor="start" font-size="24" font-weight="740">Yes</text><text x="794" y="481" text-anchor="start" font-size="24" font-weight="740">No</text><path d="M528 217 H672 Q702 217 702 248 Q702 278 672 278 H528 Q498 278 498 248 Q498 217 528 217 Z" fill="none" stroke="#195B42" stroke-width="15" opacity=".44" filter="url(#schoolGlow)"/><path d="M528 217 H672 Q702 217 702 248 Q702 278 672 278 H528 Q498 278 498 248 Q498 217 528 217 Z" fill="white" stroke="#262626" stroke-width="4" stroke-linejoin="round"/><text x="600" y="257" text-anchor="middle" font-size="26" font-weight="740">Start</text><path d="M473 305 H753 L726 375 H445 Z" fill="none" stroke="#195B42" stroke-width="15" opacity=".44" filter="url(#schoolGlow)"/><path d="M473 305 H753 L726 375 H445 Z" fill="white" stroke="#262626" stroke-width="4" stroke-linejoin="round"/><text x="600" y="347" text-anchor="middle" font-size="26" font-weight="740">INPUT age, price</text><path d="M600 395 L751 489 L600 583 L449 489 Z" fill="none" stroke="#195B42" stroke-width="15" opacity=".44" filter="url(#schoolGlow)"/><path d="M600 395 L751 489 L600 583 L449 489 Z" fill="white" stroke="#262626" stroke-width="4" stroke-linejoin="round"/><text x="600" y="499" text-anchor="middle" font-size="27" font-weight="740">age &lt; 16?</text><path d="M165 608 H490 V683 H165 Z" fill="none" stroke="#195B42" stroke-width="15" opacity=".44" filter="url(#schoolGlow)"/><path d="M165 608 H490 V683 H165 Z" fill="white" stroke="#262626" stroke-width="4" stroke-linejoin="round"/><text x="328" y="652" text-anchor="middle" font-size="25" font-weight="740">price = price × 0.75</text><path d="M720 608 H1045 V683 H720 Z" fill="none" stroke="#195B42" stroke-width="15" opacity=".44" filter="url(#schoolGlow)"/><path d="M720 608 H1045 V683 H720 Z" fill="white" stroke="#262626" stroke-width="4" stroke-linejoin="round"/><text x="883" y="652" text-anchor="middle" font-size="25" font-weight="740">Keep full price</text><path d="M472 720 H755 L728 783 H445 Z" fill="none" stroke="#195B42" stroke-width="15" opacity=".44" filter="url(#schoolGlow)"/><path d="M472 720 H755 L728 783 H445 Z" fill="white" stroke="#262626" stroke-width="4" stroke-linejoin="round"/><text x="600" y="760" text-anchor="middle" font-size="27" font-weight="740">OUTPUT price</text><path d="M529 801 H671 Q701 801 701 826 Q701 851 671 851 H529 Q499 851 499 826 Q499 801 529 801 Z" fill="none" stroke="#195B42" stroke-width="15" opacity=".44" filter="url(#schoolGlow)"/><path d="M529 801 H671 Q701 801 701 826 Q701 851 671 851 H529 Q499 851 499 826 Q499 801 529 801 Z" fill="white" stroke="#262626" stroke-width="4" stroke-linejoin="round"/><text x="600" y="836" text-anchor="middle" font-size="25" font-weight="740">End</text>
