<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
<title id="title">Star network — student Question View</title>
<desc id="desc">Three computers, one printer, and one switch shown as unconnected monochrome devices. Students may be asked to draw the connections, but no solution wiring is shown. A minimal original J277 question illustration, suitable for the left half of a classroom screen. No worked answer is shown.</desc>
