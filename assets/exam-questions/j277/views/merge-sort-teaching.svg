<title id="title">Merge sort — teaching view</title>
<desc id="desc">Eight original values 18,-4,7,12,0,-9,3,15. Sorted pair groups -4 18, 7 12, -9 0, 3 15. Sorted groups of four -4 7 12 18 and -9 0 3 15. Final -9 -4 0 3 7 12 15 18. Original J277 worked illustration, not an OCR examination figure. The school-colour glow has no technical meaning.</desc>
