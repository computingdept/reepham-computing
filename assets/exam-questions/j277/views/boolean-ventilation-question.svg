<title id="title">Fan controller — student Question View</title>
<desc id="desc">Inputs Hot, Humid, Override and output Fan. Connections are intentionally omitted so the logic circuit is not revealed. A minimal original J277 question illustration, suitable for the left half of a classroom screen. No worked answer is shown.</desc>
