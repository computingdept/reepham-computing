<text x="43" y="181" font-size="27" fill="#555555">4 × 3 pixels · 2 bits each</text>
<text x="43" y="220" font-size="23" fill="#666666">Read rows from left to right.</text><text x="43" y="284" font-size="27" font-weight="800">1. BINARY PIXELS</text>
