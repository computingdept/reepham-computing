<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1520" role="img" aria-labelledby="title desc"><title id="title">J277 binary pixel decoding student prompt</title><desc id="desc">Greyscale bitmap exercise with 4 by 3 pixels and 2-bit colour depth. Codes read in row order 00 01 10 11 11 00 01 10 10 11 00 01. Output squares are blank for student. Pixel data 24 bits or 3 bytes, ignoring metadata.</desc><defs><filter id="schoolGlow" x="-65%" y="-65%" width="230%" height="230%"><feGaussianBlur stdDeviation="7"/></filter></defs><style>text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#161616}</style><rect width="900" height="1520" fill="white"/><text x="42" y="70" font-size="24" font-weight="800" letter-spacing="1.7">J277 · 1.2.4 / IMAGES</text>
