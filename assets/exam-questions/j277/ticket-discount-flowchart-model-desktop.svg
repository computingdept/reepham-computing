<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc"><title id="title">J277 worked ticket discount flowchart</title><desc id="desc">Original non-exam flowchart about ticket pricing. Input age and full price. Decision age less than 16. Yes price equals full price times 0.75; No price equals full price. Both branches join at output price, followed by End. Standard shapes and black wires with school-colour soft halo.</desc><defs><filter id="schoolGlow" x="-70%" y="-80%" width="240%" height="260%"><feGaussianBlur stdDeviation="7.5"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" stroke="#242424" stroke-width="1.5" fill="none"/></marker></defs><style>text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#191919}.ink{fill:#FFFFFF;stroke:#262626;stroke-width:4;stroke-linejoin:round}.wire{fill:none;stroke:#252525;stroke-width:4.5;stroke-linejoin:round;stroke-linecap:round}.txt{font-weight:750;text-anchor:middle}.hint{fill:#5B5B5B}</style><rect width="1600" height="930" fill="#FFFFFF"/><text x="68" y="67" font-size="19" font-weight="800" letter-spacing="2.3">J277 · 2.1.2 / ALGORITHM DESIGN</text>
<text x="68" y="134" font-size="55" font-weight="800">Flowchart: calculate a ticket price</text>
<text x="70" y="180" font-size="23" class="hint">Independent worked example: visitors under 16 receive a 25% discount.</text>
<rect x="55" y="212" width="1490" height="692" rx="25" stroke="#195B42" stroke-width="13" opacity=".15" fill="none" filter="url(#schoolGlow)"/>
<rect x="55" y="212" width="1490" height="692" rx="25" fill="white" stroke="#E4E4E4" stroke-width="2"/>
<g class="wire">
<path d="M800 330 V354" marker-end="url(#arrow)"/>
<path d="M800 424 V448" marker-end="url(#arrow)"/>
<path d="M641 524 H388 V644" marker-end="url(#arrow)"/>
<path d="M959 524 H1220 V644" marker-end="url(#arrow)"/>
<path d="M388 710 V740 H800 M1220 710 V740 H800 M800 740 V759" marker-end="url(#arrow)"/>
<path d="M800 823 V836" marker-end="url(#arrow)"/>
</g>
<text x="508" y="512" font-size="21" font-weight="800">Yes</text>
<text x="1040" y="512" font-size="21" font-weight="800">No</text>
<path d="M712 274 H888 Q917 274 917 302 Q917 330 888 330 H712 Q683 330 683 302 Q683 274 712 274 Z" stroke="#195B42" stroke-width="14" opacity=".48" fill="none" filter="url(#schoolGlow)"/><path class="ink" d="M712 274 H888 Q917 274 917 302 Q917 330 888 330 H712 Q683 330 683 302 Q683 274 712 274 Z"/><text x="800" y="309" font-size="23" class="txt">Start</text>
<path d="M675 354 H945 L919 424 H649 Z" stroke="#195B42" stroke-width="14" opacity=".48" fill="none" filter="url(#schoolGlow)"/><path class="ink" d="M675 354 H945 L919 424 H649 Z"/><text x="797" y="396" font-size="23" class="txt">INPUT age, fullPrice</text>
<path d="M800 448 L959 524 L800 600 L641 524 Z" stroke="#195B42" stroke-width="14" opacity=".48" fill="none" filter="url(#schoolGlow)"/><path class="ink" d="M800 448 L959 524 L800 600 L641 524 Z"/><text x="800" y="530" font-size="25" class="txt">age &lt; 16?</text>
<path d="M228 644 H548 V710 H228 Z" stroke="#195B42" stroke-width="14" opacity=".48" fill="none" filter="url(#schoolGlow)"/><path class="ink" d="M228 644 H548 V710 H228 Z"/><text x="388" y="685" font-size="20" class="txt">price = fullPrice × 0.75</text>
<path d="M1060 644 H1380 V710 H1060 Z" stroke="#195B42" stroke-width="14" opacity=".48" fill="none" filter="url(#schoolGlow)"/><path class="ink" d="M1060 644 H1380 V710 H1060 Z"/><text x="1220" y="685" font-size="22" class="txt">price = fullPrice</text>
<path d="M674 759 H949 L924 823 H649 Z" stroke="#195B42" stroke-width="14" opacity=".48" fill="none" filter="url(#schoolGlow)"/><path class="ink" d="M674 759 H949 L924 823 H649 Z"/><text x="797" y="801" font-size="25" class="txt">OUTPUT price</text>
<path d="M711 836 H889 Q917 836 917 858 Q917 882 889 882 H711 Q683 882 683 858 Q683 836 711 836 Z" stroke="#195B42" stroke-width="14" opacity=".48" fill="none" filter="url(#schoolGlow)"/><path class="ink" d="M711 836 H889 Q917 836 917 858 Q917 882 889 882 H711 Q683 882 683 858 Q683 836 711 836 Z"/><text x="800" y="866" font-size="23" class="txt">End</text>
<text x="99" y="250" font-size="19" font-weight="800">START → INPUT → DECIDE → CALCULATE → OUTPUT → END</text></svg>