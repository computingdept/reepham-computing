<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc"><title id="title">J277 positive-count loop original worked flowchart</title><desc id="desc">Independent J277 iteration algorithm. Start, input a positive integer count, output GO, decrease count by 1, test count equals zero. On false return to output; on true end. For input 3 outputs three GO messages. For input 5 outputs five. This is not the OCR original 2025 flowchart.</desc><defs><filter id="schoolGlow" x="-70%" y="-80%" width="240%" height="260%"><feGaussianBlur stdDeviation="8"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#262626" stroke-width="1.5"/></marker></defs><style>text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#161616}.wire{fill:none;stroke:#262626;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.shape{stroke:#262626;stroke-width:4;fill:white;stroke-linejoin:round}.label{font-weight:800;text-anchor:middle}.hint{fill:#616161}</style><rect width="1600" height="920" fill="#FFFFFF"/><text x="65" y="69" font-size="20" font-weight="800" letter-spacing="2.4">J277 · 2.1.2 / ITERATION</text>
<text x="65" y="138" font-size="56" font-weight="800">Trace a condition-controlled loop</text>
<text x="67" y="181" font-size="23" class="hint">Input a positive integer. Output GO, subtract one, and stop when the counter reaches zero.</text>
<rect x="58" y="214" width="1031" height="668" rx="24" stroke="#195B42" stroke-width="14" opacity=".16" fill="none" filter="url(#schoolGlow)"/>
<rect x="58" y="214" width="1031" height="668" rx="24" fill="white" stroke="#E2E2E2" stroke-width="2"/>
