<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" role="img" aria-labelledby="title desc">
<title id="title">Merge sort mobile portrait: original eight-number worked trace</title>
<desc id="desc">A mobile diagram shows four stages for independently chosen values 18,-4,7,12,0,-9,3,15: singles, sorted pairs, sorted groups of four and final sorted eight. White numbered cells with black outlines and school-colour shape halos.</desc>
