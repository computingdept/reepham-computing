<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Merge sort: original eight-number worked trace</title>
<desc id="desc">Independent GCSE teaching merge sort, not copied from OCR 2022. Input 18, -4, 7, 12, 0, -9, 3, 15; sorted pairs -4 18, 7 12, -9 0, 3 15; sorted fours -4 7 12 18 and -9 0 3 15; final -9 -4 0 3 7 12 15 18. All number cells are black and white with decorative school-colour glow.</desc>
<!-- Black-and-white content; only blurred outlines use the school's colour. -->
<defs><filter id="schoolGlow" x="-70%" y="-80%" width="240%" height="260%"><feGaussianBlur stdDeviation="7"/></filter>
<marker id="down" viewBox="0 0 12 12" markerWidth="8" markerHeight="8" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10" stroke="#202020" stroke-width="1.5" fill="none"/></marker></defs>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#161616}</style>
<rect width="1600" height="900" fill="#FFFFFF"/><text x="65" y="63" font-size="18" font-weight="800" letter-spacing="3">J277 / 2.1 / SORTING ALGORITHMS</text>
 <text x="65" y="125" font-size="56" font-weight="800">Merge sort — watch the groups grow</text>
 <text x="66" y="168" font-size="23" fill="#5B5B5B">Original worked example. Each merge combines already-sorted groups.</text>
 <text x="1535" y="65" font-size="19" font-weight="700" text-anchor="end">TEACHER MODEL</text><text x="67" y="251" font-size="24" font-weight="800">1.</text>
 <text x="115" y="251" font-size="21" font-weight="800">Split into single values</text>
 <text x="115" y="281" font-size="16" fill="#616161">Keep every value, ready to compare.</text>
