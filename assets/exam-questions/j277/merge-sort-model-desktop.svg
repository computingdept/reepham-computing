 <text x="897" y="266.18" font-size="27" font-weight="700" text-anchor="middle">12</text><rect stroke="#195B42" stroke-width="12" opacity=".43" fill="none" filter="url(#schoolGlow)" x="978" y="224" width="94" height="66" rx="12"/><rect x="978" y="224" width="94" height="66" rx="12" fill="white" stroke="#292929" stroke-width="2.7"/>
