<text x="65" y="274" font-size="27" font-weight="800">INPUTS</text><rect x="75" y="310" width="750" height="80" rx="14" stroke="#195B42" stroke-width="15" opacity=".39" fill="none" filter="url(#schoolGlow)"/><rect x="75" y="310" width="750" height="80" rx="14" fill="white" stroke="#303030" stroke-width="3"/><text x="105" y="359" font-size="28" font-weight="700">Badge valid</text><rect x="75" y="422" width="750" height="80" rx="14" stroke="#195B42" stroke-width="15" opacity=".39" fill="none" filter="url(#schoolGlow)"/><rect x="75" y="422" width="750" height="80" rx="14" fill="white" stroke="#303030" stroke-width="3"/><text x="105" y="471" font-size="28" font-weight="700">PIN correct</text><rect x="75" y="534" width="750" height="80" rx="14" stroke="#195B42" stroke-width="15" opacity=".39" fill="none" filter="url(#schoolGlow)"/><rect x="75" y="534" width="750" height="80" rx="14" fill="white" stroke="#303030" stroke-width="3"/><text x="105" y="583" font-size="28" font-weight="700">Lockout active</text><text x="65" y="690" font-size="27" font-weight="800">FOLLOW THE GATES</text>
