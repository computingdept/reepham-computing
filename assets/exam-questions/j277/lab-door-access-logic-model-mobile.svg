<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1580" role="img" aria-labelledby="title desc"><title id="title">Lab door access portrait steps</title><desc id="desc">Mobile staged explanation of the J277 2.4.1 circuit: DoorOpen = (Badge AND PIN) AND NOT Lockout. Gate 1 is AND for the first two inputs; NOT inverts third input; final AND combines the results. The portrait view is a staged explanation rather than a wired exam circuit.</desc><defs><filter id="schoolGlow" x="-70%" y="-80%" width="240%" height="260%"><feGaussianBlur stdDeviation="8"/></filter></defs><style>text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#191919}</style><rect width="900" height="1580" fill="white"/><text x="40" y="67" font-size="22" font-weight="800" letter-spacing="1.5">J277 · 2.4.1</text>
<text x="40" y="130" font-size="47" font-weight="800">Lab door access</text>
<text x="41" y="177" font-size="25" fill="#5A5A5A">Three inputs · AND, OR, NOT gates</text>
<rect x="32" y="219" width="836" height="1082" rx="24" stroke="#195B42" stroke-width="14" opacity=".17" fill="none" filter="url(#schoolGlow)"/>
