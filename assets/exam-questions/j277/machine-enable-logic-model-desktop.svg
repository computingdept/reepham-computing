<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Machine enable logic</title><desc id="desc">Independent J277 2.4.1 three-gate logic circuit. Run = (Manual OR Auto) AND NOT Service. Inputs Manual request, Automatic request, Service mode active. J277/02 June 2024 Q5(b) assessed a three-gate expression. For I Do / teacher reveal, not as an exam prompt.</desc><defs><filter id="schoolGlow" x="-70%" y="-80%" width="240%" height="260%"><feGaussianBlur stdDeviation="8"/></filter></defs><style>text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#191919}</style><rect width="1600" height="900" fill="white"/><text x="70" y="70" font-size="20" font-weight="800" letter-spacing="2.2">J277 · 2.4.1 / BOOLEAN LOGIC</text>
<text x="70" y="141" font-size="54" font-weight="800">Machine enable logic</text>
<text x="72" y="184" font-size="23" fill="#555555">Run if manual or automatic request is present, provided service mode is off.</text>
