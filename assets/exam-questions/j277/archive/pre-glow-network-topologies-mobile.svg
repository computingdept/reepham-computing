<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1540" role="img" aria-labelledby="title desc">
  <title id="title">Mobile comparison of star and full mesh network topologies</title>
  <desc id="desc">A portrait teaching illustration with a four-end-device star network around one central switch, then a separate full mesh of four routers joined by six independent links. Includes strengths and limitations. Not a reproduction of an OCR examination figure.</desc>
  <!-- Palette matches the desktop master: accent #195B42, dark #124632, tint #E8F4ED. -->
  <style>
    text { font-family:Inter,Arial,Helvetica,sans-serif; fill:#162B35; }
    .kicker { fill:#195B42; font-size:23px; font-weight:800; letter-spacing:2.2px; }
    .heading { font-size:47px; font-weight:800; letter-spacing:-1px; }
    .intro { font-size:26px; fill:#50636D; }
    .panel-title { font-size:40px; font-weight:800; }
    .panel-desc { font-size:25px; fill:#50636D; }
    .name { font-size:25px; font-weight:800; text-anchor:middle; }
    .foot { font-size:25px; fill:#124632; font-weight:700; }
    .foot-note { font-size:22px; fill:#50636D; }
    .cable { stroke:#387A8A; stroke-width:6; fill:none; stroke-linecap:round; }
  </style>
  <defs>
    <g id="pc"><rect x="-52" y="-39" width="104" height="75" rx="7" fill="#FFFFFF" stroke="#6B8792" stroke-width="4"/><rect x="-41" y="-29" width="82" height="54" rx="3" fill="#DCECF1"/><path d="M-14 37 V51 H14 V37 M-34 53 H34" fill="none" stroke="#6B8792" stroke-width="5" stroke-linecap="round"/></g>
    <g id="router"><rect x="-60" y="-44" width="120" height="88" rx="16" fill="#FFFFFF" stroke="#387A8A" stroke-width="4"/><path d="M-39 -3 H38 M-39 13 H38" stroke="#387A8A" stroke-width="5" stroke-linecap="round"/><circle cx="-35" cy="-22" r="6" fill="#195B42"/></g>
  </defs>
  <rect width="900" height="1540" fill="#F5F8FA"/>
  <rect width="900" height="15" fill="#195B42"/>
  <text class="kicker" x="47" y="65">J277 / NETWORK TOPOLOGIES</text>
  <text class="heading" x="47" y="124">Star and mesh networks</text>
  <text class="intro" x="48" y="164">The links between devices make the difference.</text>

  <rect x="34" y="203" width="832" height="557" rx="28" fill="#FFFFFF" stroke="#D7E2E6" stroke-width="3"/>
  <rect x="34" y="203" width="832" height="11" rx="5" fill="#195B42"/>
  <text class="panel-title" x="75" y="264">STAR topology</text>
  <text class="panel-desc" x="75" y="302">Each end device connects to one switch.</text>
  <g aria-label="Four switch-to-device links">
    <path class="cable" d="M395 485 L259 409 M504 485 L642 409 M395 541 L259 648 M504 541 L642 648"/>
  </g>
  <g aria-label="Central switch"><rect x="377" y="465" width="145" height="98" rx="18" fill="#E8F4ED" stroke="#195B42" stroke-width="5"/><rect x="403" y="482" width="94" height="31" rx="5" fill="#195B42"/><g fill="#FFFFFF"><circle cx="419" cy="498" r="5"/><circle cx="440" cy="498" r="5"/><circle cx="461" cy="498" r="5"/><circle cx="482" cy="498" r="5"/></g><text class="name" x="449" y="549">Switch</text></g>
  <use href="#pc" x="206" y="384"/><text class="name" x="206" y="479">PC 1</text>
  <use href="#pc" x="694" y="384"/><text class="name" x="694" y="479">PC 2</text>
  <use href="#pc" x="206" y="645"/><text class="name" x="206" y="731">PC 3</text>
  <g transform="translate(694 671)"><rect x="-51" y="-40" width="102" height="72" rx="9" fill="#FFFFFF" stroke="#6B8792" stroke-width="4"/><rect x="-39" y="-57" width="78" height="40" rx="5" fill="#DFEAF0" stroke="#6B8792" stroke-width="4"/><rect x="-32" y="4" width="64" height="23" rx="3" fill="#DFEAF0"/><circle cx="37" cy="-6" r="5" fill="#195B42"/></g><text class="name" x="694" y="744">Printer</text>

  <rect x="34" y="787" width="832" height="558" rx="28" fill="#FFFFFF" stroke="#D7E2E6" stroke-width="3"/>
  <rect x="34" y="787" width="832" height="11" rx="5" fill="#195B42"/>
  <text class="panel-title" x="75" y="848">FULL MESH topology</text>
  <text class="panel-desc" x="75" y="886">Every router links directly to the others.</text>
  <g aria-label="Six direct links, including two independent crossing links">
    <path class="cable" d="M211 1004 H689 M211 1227 H689 M211 1004 V1227 M689 1004 V1227 M211 1004 L689 1227"/>
    <path class="cable" d="M211 1227 L438 1121 M462 1110 L689 1004"/>
  </g>
  <use href="#router" x="211" y="1004"/><text class="name" x="211" y="947">Router A</text>
  <use href="#router" x="689" y="1004"/><text class="name" x="689" y="947">Router B</text>
  <use href="#router" x="211" y="1227"/><text class="name" x="211" y="1303">Router C</text>
  <use href="#router" x="689" y="1227"/><text class="name" x="689" y="1303">Router D</text>

  <rect x="34" y="1370" width="832" height="102" rx="19" fill="#E8F4ED"/>
  <text class="foot" x="60" y="1409">Key trade-off</text>
  <text class="foot-note" x="60" y="1446">Star: simpler wiring. Mesh: alternative routes.</text>
  <text x="35" y="1513" font-size="17" fill="#50636D">Independent teaching visual · not an original OCR figure</text>
</svg>
