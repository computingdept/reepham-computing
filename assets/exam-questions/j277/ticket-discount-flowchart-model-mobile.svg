<path d="M450 533 L655 655 L450 777 L245 655 Z" stroke="#195B42" stroke-width="14" opacity=".48" fill="none" filter="url(#schoolGlow)"/><path class="ink" d="M450 533 L655 655 L450 777 L245 655 Z"/><text x="450" y="662" font-size="31" class="txt">age &lt; 16?</text>
<path d="M64 848 H407 V925 H64 Z" stroke="#195B42" stroke-width="14" opacity=".48" fill="none" filter="url(#schoolGlow)"/><path class="ink" d="M64 848 H407 V925 H64 Z"/><text x="235" y="895" font-size="23" class="txt">price = 0.75 ×</text><text x="235" y="919" text-anchor="middle" font-size="20">fullPrice</text>
