<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1460" role="img" aria-labelledby="title desc"><title id="title">J277 ticket discount flowchart portrait</title><desc id="desc">Mobile original selection model: age and full price input; age less than 16? Yes compute price 0.75 times full price, No keep full price, both join to output price, then End. Decorative school-colour glows trace each standard flowchart shape.</desc><defs><filter id="schoolGlow" x="-70%" y="-80%" width="240%" height="260%"><feGaussianBlur stdDeviation="7.5"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" stroke="#242424" stroke-width="1.5" fill="none"/></marker></defs><style>text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#191919}.ink{fill:#FFFFFF;stroke:#262626;stroke-width:4;stroke-linejoin:round}.wire{fill:none;stroke:#252525;stroke-width:4.5;stroke-linejoin:round;stroke-linecap:round}.txt{font-weight:750;text-anchor:middle}.hint{fill:#5B5B5B}</style><rect width="900" height="1460" fill="#FFFFFF"/><text x="39" y="67" font-size="22" font-weight="800" letter-spacing="1.8">J277 · 2.1.2 / FLOWCHARTS</text>
<text x="39" y="130" font-size="50" font-weight="800">Ticket price decision</text>
<text x="41" y="174" font-size="25" class="hint">Under 16? Apply a 25% discount.</text>
<rect x="25" y="207" width="850" height="1164" rx="24" stroke="#195B42" stroke-width="14" opacity=".16" fill="none" filter="url(#schoolGlow)"/>
<rect x="25" y="207" width="850" height="1164" rx="24" fill="white" stroke="#E1E1E1" stroke-width="2"/>
<text x="61" y="257" font-size="25" font-weight="800">WORKED ALGORITHM</text>
<g class="wire">
<path d="M450 350 V391" marker-end="url(#arrow)"/>
<path d="M450 469 V533" marker-end="url(#arrow)"/>
<path d="M245 655 H235 V848" marker-end="url(#arrow)"/>
<path d="M655 655 H670 V848" marker-end="url(#arrow)"/>
<path d="M235 925 V1022 H450 M670 925 V1022 H450 M450 1022 V1091" marker-end="url(#arrow)"/>
<path d="M450 1161 V1236" marker-end="url(#arrow)"/>
</g>
<text x="84" y="641" font-size="25" font-weight="800">Yes</text><text x="734" y="641" font-size="25" font-weight="800">No</text>
