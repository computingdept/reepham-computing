<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1540" role="img" aria-labelledby="title desc"><title id="title">Boolean gate circuit — original H446 mobile teaching illustration</title><desc id="desc">A three-input expression using AND and OR. Independently authored artwork, not an OCR paper diagram. Technical symbols are monochrome and school colour is decorative only.</desc><defs><filter id="schoolGlow" x="-70%" y="-80%" width="240%" height="260%"><feGaussianBlur stdDeviation="8"/></filter><marker id="tip" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10 Z" fill="#242424"/></marker></defs><rect width="900" height="1540" fill="#fff"/><g font-family="Inter,Arial,Helvetica,sans-serif"><text x="44" y="67" font-size="21" letter-spacing="2" font-weight="800" fill="#303030">A LEVEL COMPUTER SCIENCE / H446</text><text x="44" y="138" font-size="44" font-weight="800" fill="#171717">Boolean gate circuit</text><text x="44" y="184" font-size="23" fill="#585858">A three-input expression using AND and OR.</text><rect x="36" y="216" width="828" height="1210" rx="27" stroke="#195B42" stroke-width="16" opacity=".15" fill="none" filter="url(#schoolGlow)"/><rect x="36" y="216" width="828" height="1210" rx="27" stroke="#E5E5E5" stroke-width="2" fill="#fff"/><path d="M261 400 H322 A75 75 0 0 1 322 550 H261 Z" stroke="#195B42" stroke-width="16" fill="none" opacity=".43" filter="url(#schoolGlow)"/><path d="M261 400 H322 A75 75 0 0 1 322 550 H261 Z" fill="#fff" stroke="#242424" stroke-width="4"/><path d="M492 419 Q543 490 492 561 Q601 561 658 490 Q601 419 492 419 Z" stroke="#195B42" stroke-width="16" fill="none" opacity=".43" filter="url(#schoolGlow)"/><path d="M492 419 Q543 490 492 561 Q601 561 658 490 Q601 419 492 419 Z" fill="#fff" stroke="#242424" stroke-width="4"/><path d="M142 436 L261 436" stroke="#242424" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M142 511 L261 511" stroke="#242424