<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Tree balance and height — original H446 landscape teaching diagram</title><desc id="desc">Search efficiency depends on the tree's shape. Independently drawn RHS example, not the original OCR examination diagram. Black-and-white technical content, with decorative school-colour blurring around each component.</desc><defs><filter id="schoolGlow" x="-70%" y="-80%" width="240%" height="260%"><feGaussianBlur stdDeviation="8"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10 Z" fill="#242424"/></marker></defs><rect width="1600" height="900" fill="#fff"/><g font-family="Inter,Arial,Helvetica,sans-serif"><text x="72" y="68" font-size="19" font-weight="800" letter-spacing="2" fill="#303030">A LEVEL COMPUTER SCIENCE / H446</text><text x="72" y="137" font-size="56" font-weight="800" fill="#161616">Tree balance and height</text><text x="74" y="183" font-size="23" fill="#5C5C5C">Search efficiency depends on the tree's shape.</text><rect x="70" y="215" width="1460" height="611" rx="26" stroke="#195B42" stroke-width="17" fill="none" opacity=".17" filter="url(#schoolGlow)"/><rect x="70" y="215" width="1460" height="611" rx="26" stroke="#E5E5E5" stroke-width="2" fill="white"/><text x="450" y="305" font-size="30" font-weight="800" text-anchor="middle" fill="#242424">BALANCED</text><text x="1140" y="305" font-size="30" font-weight="800" text-anchor="middle" fill="#242424">SKEWED</text><path d="M428 398 L366 477" stroke="#242424" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M472 398 L534 477" stroke="#242424" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M327 543 L300 611" stroke="#242424" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M353 543 L380 611" stroke="#242424" stroke-width="4" stroke-linecap="round" fill="none"