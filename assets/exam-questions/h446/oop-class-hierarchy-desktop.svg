<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">OOP inheritance — original H446 desktop teaching illustration</title><desc id="desc">One base class with two derived types and private fields. Independently authored artwork, not an OCR paper diagram. Technical symbols are monochrome and school colour is decorative only.</desc><defs><filter id="schoolGlow" x="-70%" y="-80%" width="240%" height="260%"><feGaussianBlur stdDeviation="8"/></filter><marker id="tip" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10 Z" fill="#242424"/></marker></defs><rect width="1600" height="900" fill="#fff"/><g font-family="Inter,Arial,Helvetica,sans-serif"><text x="70" y="67" font-size="19" letter-spacing="2" font-weight="800" fill="#303030">A LEVEL COMPUTER SCIENCE / H446</text><text x="70" y="138" font-size="56" font-weight="800" fill="#171717">OOP inheritance</text><text x="73" y="184" font-size="23" fill="#585858">One base class with two derived types and private fields.</text><rect x="70" y="215" width="1460" height="611" rx="26" stroke="#195B42" stroke-width="16" opacity=".15" fill="none" filter="url(#schoolGlow)"/><rect x="70" y="215" width="1460" height="611" rx="26" stroke="#E5E5E5" stroke-width="2" fill="#fff"/><rect x="560" y="322" width="480" height="210" rx="24" stroke="#195B42" stroke-width="16" fill="none" opacity=".43" filter="url(#schoolGlow)"/><rect x="560" y="322" width="480" height="210" rx="24" fill="white" stroke="#E5E5E5" stroke-width="2"/><rect x="145" y="630" width="480" height="183" rx="24" stroke="#195B42" stroke-width="16" fill="none" opacity=".43" filter="url(#schoolGlow)"/><rect x="145" y="630" width="480" height="183" rx="24" fill="white" stroke="#E5E5E5" stroke-width="2"/><rect x="975" y="630" width="480" height="183" rx="24" stroke="#195B42" stroke-width="16" fill="none" opacity=".43" filter="url(#schoolGlow)"/><rect x="975" y="630" width="480" height="183" rx="24" fill="white" stroke="#E5E5E5" stroke-width="2"/><text x="589" y="376" font-size="33" font-weight="850" text-anchor="start" fill="#242424">Vehicle</text><text x="589" y="431" font-size="25" font-weight="650" text-anchor="start" fill="#242424"># brand: string</text><text x="589" y="482" font-size="23" font-weight="650" text-anchor="start" fill="#242424">+ getBrand(): string</text><text x="169" y="688" font-size="29" font-weight="830" text-anchor="start" fill="#242424">Car : Vehicle</text><text x="169" y="754" font-size="24" font-weight="650" text-anchor="start" fill="#242424"># doors: integer</text><text x="999" y="688" font-size="29" font-weight="830" text-anchor="start" fill="#242424">Bicycle : Vehicle</text><text x="999" y="754" font-size="24" font-weight="650" text-anchor="start" fill="#242424"># gears: integer</text><path d="M385 628 L720 532" stroke="#242424" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#tip)"/><path d="M1215 628 L880 532" stroke="#242424" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#tip)"/><text x="118" y="829" font-size="22" font-weight="740" text-anchor="start" fill="#242424">Car and Bicycle inherit Vehicle's public operations.</text><text x="118" y="864" font-size="22" font-weight="550" text-anchor="start" fill="#242424">UML-style symbols: # private attribute; + public method.</text><text x="77" y="865" font-size="18" fill="#606060">RHS ORIGINAL TEACHING EXAMPLE · NOT OCR ARTWORK · TEACHER REVIEW PENDING</text></g></svg>
