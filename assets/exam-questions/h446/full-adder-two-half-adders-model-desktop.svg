<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Full adder built from two half-adders and an OR gate, worked model</title>
<desc id="desc">H446 original conceptual full adder diagram, not a replica of the incomplete OCR exam figure. A and B enter half adder one: XOR gives X and AND gives C1. X and carry-in enter half adder two: XOR gives Sum S and AND gives C2. The OR gate combines C1 and C2 to give carry-out. School colour appears only as blurred decorative halos.</desc>
<!-- Technical information is monochrome; the school-specific token #195B42 appears on decorative blurred strokes only. -->
<defs><filter id="schoolGlow" x="-65%" y="-75%" width="230%" height="250%"><feGaussianBlur stdDeviation="8"/></filter></defs>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#181818}.wire{stroke:#242424;stroke-width:4.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.body{font-size:21px;fill:#5B5B5B}.lab{font-size:22px;font-weight:800}.strong{font-weight:800}.equation{font-size:21px;font-weight:700}.panel{fill:white;stroke:#292929;stroke-width:3}</style>
<rect width="1600" height="900" fill="white"/><text x="64" y="65" font-size="19" font-weight="800" letter-spacing="2.6">H446 / BOOLEAN LOGIC / ADDERS</text>
 <text x="64" y="129" font-size="55" font-weight="800">Full adder: two half adders + OR</text>
 <text x="65" y="176" font-size="23" fill="#5C5C5C">Three input bits produce one Sum bit and one Carry-out bit.</text>
 <text x="1540" y="64" font-size="18" text-anchor="end" font-weight="800">TEACHER MODEL</text>
 <rect x="59" y="218" width="1482" height="552" rx="25" stroke="#195B42" stroke-width="16" fill="none" opacity="0.16" filter="url(#schoolGlow)"/>
 <rect x="59" y="218" width="1482" height="552" rx="25" fill="white" stroke="#E3E3E3" stroke-width="2"/>
 <text x="94" y="266" font-size="20" font-weight="800">SIGNAL FLOW · THE TWO HALF ADDERS ARE FUNCTIONAL BLOCKS</text>
 <!-- Interconnects are drawn before their components. -->
 <g class="wire">
  <path d="M212 355 H302 M212 436 H302"/>
  <path d="M626 355 H772"/>
  <path d="M626 466 H662 V696 H1210"/>
  <path d="M1096 355 H1380"/>
  <path d="M1096 466 H1135 V621 H1210"/>
  <path d="M1368 662 H1460"/>
  <path d="M840 570 V545 H712 V436 H772"/>
 </g>
 <text x="689" y="341" font-size="21" font-weight="800">X</text>
 <text x="641" y="572" font-size="20" font-weight="800">C₁</text>
 <text x="1148" y="604" font-size="19" font-weight="800">C₂</text>
 <text x="106" y="319" font-size="19" fill="#646464">Inputs</text>
 <rect x="102" y="328" width="110" height="58" rx="12" stroke="#195B42" stroke-width="16" fill="none" opacity="0.37" filter="url(#schoolGlow)"/><rect x="102" y="328" width="110" height="58" rx="12" class="panel"/>
 <rect x="102" y="408" width="110" height="58" rx="12" stroke="#195B42" stroke-width="16" fill="none" opacity="0.37" filter="url(#schoolGlow)"/><rect x="102" y="408" width="110" height="58" rx="12" class="panel"/>
 <text x="157" y="365" font-size="24" text-anchor="middle" font-weight="800">A</text>
 <text x="157" y="445" font-size="24" text-anchor="middle" font-weight="800">B</text>
 <rect x="302" y="302" width="324" height="216" rx="22" stroke="#195B42" stroke-width="16" fill="none" opacity="0.44" filter="url(#schoolGlow)"/><rect x="302" y="302" width="324" height="216" rx="22" class="panel"/>
<text x="326" y="342" font-size="27" font-weight="800">Half adder 1</text>
<path d="M322 363 H606" stroke="#E0E0E0" stroke-width="2"/>
<text x="326" y="406" font-size="24" font-weight="800">X = A XOR B</text>
<text x="326" y="457" font-size="24" font-weight="800">C₁ = A AND B</text>
<text x="326" y="488" font-size="17" fill="#666666">Internally: XOR gate + AND gate</text>
 <rect x="772" y="302" width="324" height="216" rx="22" stroke="#195B42" stroke-width="16" fill="none" opacity="0.44" filter="url(#schoolGlow)"/><rect x="772" y="302" width="324" height="216" rx="22" class="panel"/>
<text x="796" y="342" font-size="27" font-weight="800">Half adder 2</text>
<path d="M792 363 H1076" stroke="#E0E0E0" stroke-width="2"/>
<text x="796" y="406" font-size="24" font-weight="800">S = X XOR Cᵢₙ</text>
<text x="796" y="457" font-size="24" font-weight="800">C₂ = X AND Cᵢₙ</text>
<text x="796" y="488" font-size="17" fill="#666666">Internally: XOR gate + AND gate</text>
 <rect x="758" y="570" width="163" height="72" rx="12" stroke="#195B42" stroke-width="16" fill="none" opacity="0.37" filter="url(#schoolGlow)"/><rect x="758" y="570" width="163" height="72" rx="12" class="panel"/>
 <text x="839" y="602" text-anchor="middle" font-size="22" font-weight="800">Carry-in</text>
 <text x="839" y="629" text-anchor="middle" font-size="20">Cᵢₙ</text>
 <!-- Rounded conventional OR outline follows the school's decorative glow. -->
 <path d="M1178 581 Q1223 662 1178 743 Q1290 742 1368 662 Q1290 582 1178 581 Z" stroke="#195B42" stroke-width="17" opacity=".46" fill="none" filter="url(#schoolGlow)"/>
 <path d="M1178 581 Q1223 662 1178 743 Q1290 742 1368 662 Q1290 582 1178 581 Z" fill="white" stroke="#242424" stroke-width="4.5"/>
 <text x="1283" y="674" font-size="25" text-anchor="middle" font-weight="800">OR</text>
 <text x="1390" y="342" font-size="23" font-weight="800">Sum (S)</text>
 <text x="1380" y="692" font-size="21" font-weight="800">C-out</text>
 <rect x="62" y="796" width="1474" height="80" rx="15" fill="#F8F8F8"/>
 <text x="88" y="829" class="equation">Sum = A XOR B XOR Cᵢₙ</text>
 <text x="88" y="854" font-size="19" fill="#555555">Carry-out = (A AND B) OR (Cᵢₙ AND (A XOR B))</text>
 <text x="1535" y="853" font-size="14" text-anchor="end" fill="#555555">Original teaching diagram · not the OCR figure</text></svg>