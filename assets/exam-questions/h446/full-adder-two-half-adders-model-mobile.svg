<text x="60" y="1342" font-size="24" font-weight="800">Check the logic</text>
<text x="60" y="1380" font-size="21">S = A XOR B XOR Cᵢₙ</text>
<text x="60" y="1410" font-size="20">C-out = C₁ OR C₂</text>
<text x="38" y="1492" font-size="19" fill="#616161">Functional blocks · independent teaching model, not OCR artwork</text></svg>