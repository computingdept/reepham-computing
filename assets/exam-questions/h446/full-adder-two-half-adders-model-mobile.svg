<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1540" role="img" aria-labelledby="title desc">
<title id="title">Portrait full adder: two half adders and OR, worked model</title>
<desc id="desc">First half adder takes A and B and produces X from XOR and C1 from AND. Second half adder takes X and Cin and produces Sum via XOR and C2 via AND. OR combines C1 and C2 to give Carry-out. The mobile arrangement is a staged functional flow, not a copied exam gate figure.</desc>
<!-- Technical information is monochrome; the school-specific token #195B42 appears on decorative blurred strokes only. -->
<defs><filter id="schoolGlow" x="-65%" y="-75%" width="230%" height="250%"><feGaussianBlur stdDeviation="8"/></filter></defs>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#181818}.wire{stroke:#242424;stroke-width:4.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.body{font-size:21px;fill:#5B5B5B}.lab{font-size:22px;font-weight:800}.strong{font-weight:800}.equation{font-size:21px;font-weight:700}.panel{fill:white;stroke:#292929;stroke-width:3}</style>
<rect width="900" height="1540" fill="white"/><text x="43" y="67" font-size="23" font-weight="800" letter-spacing="2">H446 / BOOLEAN LOGIC</text>
<text x="43" y="129" font-size="51" font-weight="800">Full adder</text>
<text x="43" y="170" font-size="25" fill="#5D5D5D">Two half adders and one OR gate</text>
<text x="43" y="208" font-size="21" fill="#666666">Three inputs · two outputs</text>
<rect x="34" y="239" width="832" height="270" rx="20" stroke="#195B42" stroke-width="16" fill="none" opacity="0.2" filter="url(#schoolGlow)"/><rect x="34" y="239" width="832" height="270" rx="20" fill="white" stroke="#DEDEDE" stroke-width="2"/>
 <text x="62" y="282" font-size="30" font-weight="800">1. First half adder</text>
 <path d="M60 297 H840" stroke="#E4E4E4" stroke-width="2"/><text x="61" y="346" font-size="25" font-weight="800">Inputs: A and B</text><text x="61" y="395" font-size="25" font-weight="700">X = A XOR B</text><text x="61" y="444" font-size="25" font-weight="700">C₁ = A AND B</text>
<path d="M451 513 V597" stroke="#303030" stroke-width="4" fill="none"/>
<path d="M439 583 L451 597 L463 583" stroke="#303030" stroke-width="3" fill="none"/>
<text x="476" y="563" font-size="22" font-weight="700">Pass X forward</text>
<rect x="34" y="612" width="832" height="283" rx="20" stroke="#195B42" stroke-width="16" fill="none" opacity="0.2" filter="url(#schoolGlow)"/><rect x="34" y="612" width="832" height="283" rx="20" fill="white" stroke="#DEDEDE" stroke-width="2"/>
 <text x="62" y="655" font-size="30" font-weight="800">2. Second half adder</text>
 <path d="M60 670 H840" stroke="#E4E4E4" stroke-width="2"/><text x="61" y="719" font-size="25" font-weight="800">Inputs: X and carry-in (Cᵢₙ)</text><text x="61" y="768" font-size="25" font-weight="700">Sum (S) = X XOR Cᵢₙ</text><text x="61" y="817" font-size="25" font-weight="700">C₂ = X AND Cᵢₙ</text>
<path d="M451 900 V974" stroke="#303030" stroke-width="4" fill="none"/>
<path d="M439 961 L451 975 L463 961" stroke="#303030" stroke-width="3" fill="none"/>
<text x="477" y="949" font-size="22" font-weight="700">Combine both carries</text>
<rect x="34" y="989" width="832" height="280" rx="20" stroke="#195B42" stroke-width="16" fill="none" opacity="0.2" filter="url(#schoolGlow)"/><rect x="34" y="989" width="832" height="280" rx="20" fill="white" stroke="#DEDEDE" stroke-width="2"/>
 <text x="62" y="1032" font-size="30" font-weight="800">3. Carry-out</text>
 <path d="M60 1047 H840" stroke="#E4E4E4" stroke-width="2"/><text x="61" y="1096" font-size="25" font-weight="800">Inputs: C₁ and C₂</text><text x="61" y="1145" font-size="25" font-weight="700">C-out = C₁ OR C₂</text><text x="61" y="1194" font-size="25" font-weight="700">Outputs: Sum and Carry-out</text>
