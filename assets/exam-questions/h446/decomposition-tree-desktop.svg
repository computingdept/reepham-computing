<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Problem decomposition — original H446 desktop teaching illustration</title><desc id="desc">Split a grid puzzle project into independent parts. Independently authored artwork, not an OCR paper diagram. Technical symbols are monochrome and school colour is decorative only.</desc><defs><filter id="schoolGlow" x="-70%" y="-80%" width="240%" height="260%"><feGaussianBlur stdDeviation="8"/></filter><marker id="tip" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10 Z" fill="#242424"/></marker></defs><rect width="1600" height="900" fill="#fff"/><g font-family="Inter,Arial,Helvetica,sans-serif"><text x="70" y="67" font-size="19" letter-spacing="2" font-weight="800" fill="#303030">A LEVEL COMPUTER SCIENCE / H446</text><text x="70" y="138" font-size="56" font-weight="800" fill="#171717">Problem decomposition</text><text x="73" y="184" font-size="23" fill="#585858">Split a grid puzzle project into independent parts.</text><rect x="70" y="215" width="1460" height="611" rx="26" stroke="#195B42" stroke-width="16" opacity=".15" fill="none" filter="url(#schoolGlow)"/><rect x="70" y="215" width="1460" height="611" rx="26" stroke="#E5E5E5" stroke-width="2" fill="#fff"/><rect x="565" y="320" width="470" height="111" rx="18" stroke="#195B42" stroke-width="16" fill="none" opacity=".43" filter="url(#schoolGlow)"/><rect x="565" y="320" width="470" height="111" rx="18" fill="white" stroke="#242424" stroke-width="3"/><text x="800" y="383.5" font-size="31" font-weight="780" text-anchor="middle" fill="#242424">GRID PUZZLE</text><path d="M800 431 V525 H326 V592" stroke="#242424" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><rect x="111" y="605" width="430" height="115" rx="18" stroke="#195B42" stroke-width="16" fill="none" opacity=".43" filter="url(#schoolGlow)"/><rect x="111" y="605" width="430" height="115" rx="18" fill="white" stroke="#242424" stroke-width="3"/><text x="326" y="670.5" font-size="27" font-weight="780" text-anchor="middle" fill="#242424">Generate grid</text><path d="M800 431 V525 H800 V592" stroke="#242424" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><rect x="585" y="605" width="430" height="115" rx="18" stroke="#195B42" stroke-width="16" fill="none" opacity=".43" filter="url(#schoolGlow)"/><rect x="585" y="605" width="430" height="115" rx="18" fill="white" stroke="#242424" stroke-width="3"/><text x="800" y="670.5" font-size="27" font-weight="780" text-anchor="middle" fill="#242424">Play puzzle</text><path d="M800 431 V525 H1274 V592" stroke="#242424" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tip)"/><rect x="1059" y="605" width="430" height="115" rx="18" stroke="#195B42" stroke-width="16" fill="none" opacity=".43" filter="url(#schoolGlow)"/><rect x="1059" y="605" width="430" height="115" rx="18" fill="white" stroke="#242424" stroke-width="3"/><text x="1274" y="670.5" font-size="27" font-weight="780" text-anchor="middle" fill="#242424">Check solution</text><text x="118" y="783" font-size="22" font-weight="740" text-anchor="start" fill="#242424">Decomposition separates one problem into testable tasks.</text><text x="118" y="818" font-size="22" font-weight="550" text-anchor="start" fill="#242424">Independent example: this is not the OCR Nonogram diagram.</text><text x="77" y="865" font-size="18" fill="#606060">RHS ORIGINAL TEACHING EXAMPLE · NOT OCR ARTWORK · TEACHER REVIEW PENDING</text></g></svg>
