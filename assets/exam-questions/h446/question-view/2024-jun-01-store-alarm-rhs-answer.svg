<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 740" role="img" aria-labelledby="svgtitle svgdesc"><title id="svgtitle">2024 June H446 equipment-store logic circuit worked answer</title><desc id="svgdesc">Full source-specific four-input alarm circuit: A,B enter an OR; D enters a NOT; OR result and C enter first two-input AND; its output and NOT D enter second AND giving siren S.</desc><defs><filter id="glow" x="-25%" y="-30%" width="150%" height="160%"><feGaussianBlur stdDeviation="10"/></filter><marker id="edgeArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto-start-reverse"><path d="M0 0 L11 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="1240" height="740" fill="#fff"/><rect x="28" y="26" width="1184" height="666" rx="26" fill="none" stroke="#195b42" stroke-width="14" opacity=".12" filter="url(#glow)"/><rect x="28" y="26" width="1184" height="666" rx="26" fill="#fff" stroke="#dedede" stroke-width="2"/><text x="69" y="90" text-anchor="start" font-size="43" font-family="Arial,Helvetica,sans-serif" font-weight="720" fill="#202124">STORE ALARM · WORKED CIRCUIT</text><text x="69" y="127" text-anchor="start" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="500" fill="#555">June 2024 · Paper 1 · Q5(a) · 4 marks</text><rect x="258" y="204" width="175" height="100" rx="14" fill="#fff" stroke="#202124" stroke-width="4"/><text x="345.5" y="264" text-anchor="middle" font-size="39" font-family="Arial,Helvetica,sans-serif" font-weight="720" fill="#202124">OR</text><rect x="258" y="463" width="175" height="100" rx="14" fill="#fff" stroke="#202124" stroke-width="4"/><text x="345.5" y="523" text-anchor="middle" font-size="39" font-family="Arial,Helvetica,sans-serif" font-weight="720" fill="#202124">NOT</text><rect x="606" y="260" width="175" height="100" rx="14" fill="#fff" stroke="#202124" stroke-width="4"/><text x="693.5" y="320" text-anchor="middle" font-size="39" font-family="Arial,Helvetica,sans-serif" font-weight="720" fill="#202124">AND</text><rect x="938" y="314" width="175" height="100" rx="14" fill="#fff" stroke="#202124" stroke-width="4"/><text x="1025.5" y="374" text-anchor="middle" font-size="39" font-family="Arial,Helvetica,sans-serif" font-weight="720" fill="#202124">AND</text><text x="73" y="244" text-anchor="start" font-size="32" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#202124">A</text><text x="73" y="293" text-anchor="start" font-size="32" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#202124">B</text><text x="73" y="503" text-anchor="start" font-size="32" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#202124">D</text><text x="529" y="391" text-anchor="start" font-size="32" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#202124">C</text><path d="M112 234 H251" fill="none" stroke="#252525" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M112 284 H251" fill="none" stroke="#252525" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M112 493 H251" fill="none" stroke="#252525" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M433 254 H517 V298 H599" fill="none" stroke="#252525" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M552 383 H571 V329 H599" fill="none" stroke="#252525" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M781 306 H870 V349 H931" fill="none" stroke="#252525" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M433 513 H837 V390 H931" fill="none" stroke="#252525" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1113 363 H1140" fill="none" stroke="#252525" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="1148" y="374" text-anchor="start" font-size="35" font-family="Arial,Helvetica,sans-serif" font-weight="750" fill="#202124">S</text><text x="90" y="632" text-anchor="start" font-size="33" font-family="Arial,Helvetica,sans-serif" font-weight="720" fill="#195b42">S = (A OR B) AND C AND (NOT D)</text><text x="48" y="723" text-anchor="start" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="450" fill="#606060">RHS ORIGINAL PRACTICE · NOT OCR EXAM ARTWORK</text></svg>