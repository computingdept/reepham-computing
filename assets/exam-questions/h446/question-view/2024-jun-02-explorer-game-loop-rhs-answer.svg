<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 740" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">EXPLORER  ·  GAME LOOP</title><desc id="svgDesc">Question illustration withholds constructor and method names to avoid leaking any of six blanks. Answer maps creation, random movement, getRoadPosition, bounds protection, Cache check and updateValues. Native source pseudocode must remain the graded question.</desc><defs><filter id="soft" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="11"/></filter><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L11 6 L0 12 Z" fill="#4d5a50"/></marker></defs><rect width="1240" height="740" fill="#fff"/><rect x="30" y="29" width="1180" height="660" rx="27" fill="none" stroke="#1d5b40" stroke-width="14" opacity=".12" filter="url(#soft)"/><rect x="30" y="29" width="1180" height="660" rx="27" fill="#fff" stroke="#e1e5e1" stroke-width="2"/><text x="63" y="88" fill="#28332b" font-size="37" font-weight="765" font-family="Arial,Helvetica,sans-serif" text-anchor="start">EXPLORER  ·  GAME LOOP</text><text x="64" y="127" fill="#5b675d" font-size="23" font-weight="550" font-family="Arial,Helvetica,sans-serif" text-anchor="start">June 2024 · H446/02 · Q9(d) · 6 marks · ANSWER REVEAL</text><rect x="72" y="200" width="252" height="166" rx="15" fill="#fff" stroke="#d8e0da" stroke-width="2.5"/><text x="198" y="242" fill="#293e30" font-size="26" font-weight="740" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">Create Explorer</text><text x="198" y="285" fill="#55665c" font-size="22" font-weight="620" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">new Explorer(&quot;Mina&quot;)</text><line x1="329" y1="280" x2="343" y2="280" stroke="#4d5a50" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="353" y="200" width="252" height="166" rx="15" fill="#fff" stroke="#d8e0da" stroke-width="2.5"/><text x="479" y="242" fill="#293e30" font-size="26" font-weight="740" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">Random step</text><text x="479" y="285" fill="#55665c" font-size="22" font-weight="620" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">integer 1–4</text><line x1="610" y1="280" x2="624" y2="280" stroke="#4d5a50" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="634" y="200" width="252" height="166" rx="15" fill="#fff" stroke="#d8e0da" stroke-width="2.5"/><text x="760" y="242" fill="#293e30" font-size="26" font-weight="740" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">Advance position</text><text x="760" y="285" fill="#55665c" font-size="22" font-weight="620" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">changePosition(step)</text><line x1="891" y1="280" x2="905" y2="280" stroke="#4d5a50" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="915" y="200" width="252" height="166" rx="15" fill="#fff" stroke="#d8e0da" stroke-width="2.5"/><text x="1041" y="242" fill="#293e30" font-size="26" font-weight="740" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">Read position</text><text x="1041" y="285" fill="#55665c" font-size="22" font-weight="620" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">getRoadPosition()</text><rect x="73" y="397" width="1095" height="218" rx="19" fill="#fff" stroke="#d8e2da" stroke-width="3"/><text x="620" y="432" fill="#293c30" font-size="28" font-weight="730" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">Safe check before accessing road[position]</text><rect x="93" y="459" width="331" height="119" rx="15" fill="#fff8c4" stroke="#ebce6d" stroke-width="2.5"/><text x="258.5" y="501" fill="#293e30" font-size="26" font-weight="740" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">Index safety</text><text x="258.5" y="544" fill="#55665c" font-size="22" font-weight="620" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">position &lt; 50</text><text x="258.5" y="578" fill="#55665c" font-size="21" font-weight="570" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">avoid road[50]</text><rect x="455" y="459" width="331" height="119" rx="15" fill="#fff8c4" stroke="#ebce6d" stroke-width="2.5"/><text x="620.5" y="501" fill="#293e30" font-size="26" font-weight="740" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">Prize present</text><text x="620.5" y="544" fill="#55665c" font-size="22" font-weight="620" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">road[position] != null</text><text x="620.5" y="578" fill="#55665c" font-size="21" font-weight="570" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">Cache is accessible</text><rect x="817" y="459" width="331" height="119" rx="15" fill="#fff8c4" stroke="#ebce6d" stroke-width="2.5"/><text x="982.5" y="501" fill="#293e30" font-size="26" font-weight="740" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">Award prize</text><text x="982.5" y="544" fill="#55665c" font-size="22" font-weight="620" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">updateValues(</text><text x="982.5" y="578" fill="#55665c" font-size="21" font-weight="570" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">pType, pValue)</text><text x="70" y="659" fill="#5b6b5f" font-size="21" font-weight="560" font-family="Arial,Helvetica,sans-serif" text-anchor="start">Supporting flow diagram. Students complete all six original code blanks in native text.</text><text x="50" y="725" fill="#687069" font-size="17" font-weight="470" font-family="Arial,Helvetica,sans-serif" text-anchor="start">RHS ORIGINAL TEACHING DIAGRAM  ·  NOT OCR EXAM ARTWORK</text></svg>