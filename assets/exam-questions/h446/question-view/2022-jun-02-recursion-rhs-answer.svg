<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 740" role="img" aria-labelledby="title description"><title id="title">H446 2022 recursive sumTrail return values</title><desc id="description">sumTrail(5)=15, sumTrail(4)=10, sumTrail(3)=6, sumTrail(2)=3, sumTrail(1)=1. Recursive calls descend from 5 to 1, then return values accumulate back to 15.</desc><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="11"/></filter><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0 1 L14 7 L0 13Z" fill="#343a39"/></marker><marker id="greenArrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0 1 L14 7 L0 13Z" fill="#195b42"/></marker></defs><rect width="1240" height="740" fill="#fff"/><rect x="32" y="27" width="1176" height="660" rx="26" fill="none" stroke="#195b42" stroke-width="14" opacity=".13" filter="url(#glow)"/><rect x="32" y="27" width="1176" height="660" rx="26" stroke="#e2e4e3" stroke-width="2" fill="#fff"/><text x="67" y="93" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="730" fill="#242728">RECURSION  ·  CALL/RETURN ANSWER</text><text x="68" y="128" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="520" fill="#555">June 2022 · H446/02 · Q7(b) · 5 marks</text><rect x="260" y="205" width="392" height="63" rx="14" stroke="#29322d" stroke-width="3" fill="#fff"/><text x="282" y="247" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#242728">sumTrail(5)</text><rect x="674" y="205" width="360" height="63" rx="14" stroke="#195b42" stroke-width="3" fill="#eff8f2"/><text x="854" y="246" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="730" fill="#195b42">returns 15</text><path d="M373 269 V280" stroke="#a7aeaa" stroke-wi