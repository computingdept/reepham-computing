<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc"><title id="title">2021 November RHS iterative binary search complete answer</title><desc id="desc">Completed six blanks: wanted; -1; 2; middle plus one; middle minus one; middle.</desc><defs><filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="8"/></filter></defs><rect width="900" height="900" fill="white"/><rect x="30" y="30" width="840" height="819" rx="25" fill="none" stroke="#195b42" stroke-width="16" opacity=".14" filter="url(#glow)"/><rect x="30" y="30" width="840" height="819" rx="25" fill="white" stroke="#e0e0e0" stroke-width="2"/><text x="50" y="103" font-family="Arial,Helvetica,sans-serif" font-size="37" font-weight="750" text-anchor="start" fill="#1d1d1f">BINARY SEARCH · ANSWER</text><text x="50" y="157" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#1d1d1f">Sorted array · inclusive lower..upper</text><rect x="52" y="183" width="796" height="37" rx="5" fill="#fff"/><text x="62" y="212" font-family="Consolas,Menlo,monospace" font-size="19" font-weight="750" text-anchor="start" fill="#1d1d1f">01  function binarySearch(dataArray, lower, upper, wanted)</text><rect x="52" y="223" width="796" height="37" rx="5" fill="#f7f7f7"/><text x="62" y="252" font-family="Consolas,Menlo,monospace" font-size="19" font-weight="500" text-anchor="start" fill="#1d1d1f">02    while true</text><rect x="52" y="263" width="796" height="37" rx="5" fill="#fff"/><text x="62" y="292" font-family="Consolas,Menlo,monospace" font-size="19" font-weight="500" text-anchor="start" fill="#1d1d1f">03      if upper &lt; lower then</text><rect x="52" y="303" width="796" height="37" rx="5" fill="#f7f7f7"/><text x="62" y="332" font-family="Consolas,Menlo,monospace" font-size="19" font-weight="750" text-anchor="start" fill="#1d1d1f">04        return -1</text><rect x="52" y="343" width="796" height="37" rx="5" fill="#fff"/><text x="62" y="372" font-family="Consolas,Menlo,monospace" font-size="19" font-weight="500" text-anchor="start" fill="#1d1d1f">05      endif</text><rect x="52" y="383" width="796" height="37" rx="5" fill="#f7f7f7"/><text x="62" y="412" font-family="Consolas,Menlo,monospace" font-size="19" font-weight="750" text-anchor="start" fill="#1d1d1f">06      middle = lower + ((upper - lower) DIV 2)</text><rect x="52" y="423" width="796" height="37" rx="5" fill="#fff"/><text x="62" y="452" font-family="Consolas,Menlo,monospace" font-size="19" font-weight="500" text-anchor="start" fill="#1d1d1f">07      if dataArray[middle] &lt; wanted then</text><rect x="52" y="463" width="796" height="37" rx="5" fill="#f7f7f7"/><text x="62" y="492" font-family="Consolas,Menlo,monospace" font-size="19" font-weight="750" text-anchor="start" fill="#1d1d1f">08        lower = middle + 1</text><rect x="52" y="503" width="796" height="37" rx="5" fill="#fff"/><text x="62" y="532" font-family="Consolas,Menlo,monospace" font-size="19" font-weight="500" text-anchor="start" fill="#1d1d1f">09      elseif dataArray[middle] &gt; wanted then</text><rect x="52" y="543" width="796" height="37" rx="5" fill="#f7f7f7"/><text x="62" y="572" font-family="Consolas,Menlo,monospace" font-size="19" font-weight="750" text-anchor="start" fill="#1d1d1f">10        upper = middle - 1</text><rect x="52" y="583" width="796" height="37" rx="5" fill="#fff"/><text x="62" y="612" font-family="Consolas,Menlo,monospace" font-size="19" font-weight="500" text-anchor="start" fill="#1d1d1f">11      else</text><rect x="52" y="623" width="796" height="37" rx="5" fill="#f7f7f7"/><text x="62" y="652" font-family="Consolas,Menlo,monospace" font-size="19" font-weight="750" text-anchor="start" fill="#1d1d1f">12        return middle</text><rect x="52" y="663" width="796" height="37" rx="5" fill="#fff"/><text x="62" y="692" font-family="Consolas,Menlo,monospace" font-size="19" font-weight="500" text-anchor="start" fill="#1d1d1f">13      endif</text><rect x="52" y="703" width="796" height="37" rx="5" fill="#f7f7f7"/><text x="62" y="732" font-family="Consolas,Menlo,monospace" font-size="19" font-weight="500" text-anchor="start" fill="#1d1d1f">14    endwhile</text><rect x="52" y="743" width="796" height="37" rx="5" fill="#fff"/><text x="62" y="772" font-family="Consolas,Menlo,monospace" font-size="19" font-weight="500" text-anchor="start" fill="#1d1d1f">15  endfunction</text><text x="43" y="883" font-family="Arial" font-size="18" fill="#666">RHS ORIGINAL PRACTICE · NOT OCR EXAM ARTWORK</text></svg>