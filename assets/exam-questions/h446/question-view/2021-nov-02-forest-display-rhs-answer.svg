<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc"><title id="title">DISPLAY ROWS · ANSWER</title><desc id="desc">Nested row and column loops print each binary row followed by its rowClue string.</desc><defs><filter id="g" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="8"/></filter></defs><rect width="900" height="900" fill="white"/><rect x="28" y="29" width="844" height="815" rx="25" fill="none" stroke="#195b42" opacity=".14" stroke-width="17" filter="url(#g)"/><rect x="28" y="29" width="844" height="815" rx="25" fill="white" stroke="#dedede" stroke-width="2"/><text x="50" y="99" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="750" fill="#1d1d1f">DISPLAY ROWS · ANSWER</text><text x="52" y="145" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="500" fill="#1d1d1f">Forest Pixels · 5×5 solution grid</text><rect x="49" y="168" width="801" height="28.6" rx="4" fill="white"/><text x="63" y="192" font-family="Consolas,Menlo,monospace" font-size="19" font-weight="500" fill="#1d1d1f">01  procedure displayRows(solution)</text><rect x="49" y="199.6" width="801" height="28.6" rx="4" fill="#f7f7f7"/><text x="63" y="223.6" font-family="Consolas,Menlo,monospace" font-size="19" font-weight="500" fill="#1d1d1f">02    for row = 0 to 4</text><rect x="49" y="231.2" width="801" height="28.6" rx="4" fill="white"/><text x="63" y="255.2" font-family="Consolas,Menlo,monospace" font-size="19" font-weight="500" fill="#1d1d1f">03      line = &quot;&quot;</text><rect x="49" y="262.8" width="801" height="28.6" rx="4" fill="#f7f7f7"/><text x="63" y="286.8" font-family="Consolas,Menlo,monospace" font-size="19" font-weight="500" fill="#1d1d1f">04      for col = 0 to 4</text><rect x="49" y="294.4" width="801" height="28.6" rx="4" fill="white"/><text x="63" y="318.4" font-family="Consolas,Menlo,monospace" font-size="19" font-weight="500" fill="#1d1d1f">05        line = line + str(solution[row,col]) + &quot; &quot;</text><rect x="49" y="326" width="801" height="28.6" rx="4" fill="#f7f7f7"/><text x="63" y="350" font-family="Consolas,Menlo,monospace" font-size="19" font-weight="500" fill="#1d1d1f">06      next col</text><rect x="49" y="357.6" width="801" height="28.6" rx="4" fill="white"/><text x="63" y="381.6" font-family="Consolas,Menlo,monospace" font-size="19" font-weight="500" fill="#1d1d1f">07      print(line, rowClue(solution,row))</text><rect x="49" y="389.20000000000005" width="801" height="28.6" rx="4" fill="#f7f7f7"/><text x="63" y="413.20000000000005" font-family="Consolas,Menlo,monospace" font-size="19" font-weight="500" fill="#1d1d1f">08    next row</text><rect x="49" y="420.8" width="801" height="28.6" rx="4" fill="white"/><text x="63" y="444.8" font-family="Consolas,Menlo,monospace" font-size="19" font-weight="500" fill="#1d1d1f">09  endprocedure</text><text x="43" y="884" font-family="Arial" font-size="18" fill="#666">RHS ORIGINAL PRACTICE · NOT OCR EXAM ARTWORK</text></svg>