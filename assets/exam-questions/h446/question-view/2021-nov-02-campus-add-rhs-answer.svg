<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc"><title id="title">CAMPUS MAP · ADD VENUE</title><desc id="desc">Checks nextFree at least twenty before insert; stores place in venues indexed nextFree, increments pointer and returns true.</desc><defs><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8"/></filter></defs><rect width="900" height="900" fill="#fff"/><rect x="28" y="29" width="844" height="815" rx="25" fill="none" stroke="#195b42" opacity=".16" stroke-width="17" filter="url(#glow)"/><rect x="28" y="29" width="844" height="815" rx="25" fill="white" stroke="#dedede" stroke-width="2"/><text x="50" y="104" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="750" fill="#202124">CAMPUS MAP · ADD VENUE</text><text x="52" y="155" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="500" fill="#202124">RHS pseudocode · review only</text><rect x="51" y="179" width="795" height="43" rx="5" fill="white"/><text x="66" y="208" font-family="Consolas,monospace" font-size="26" font-weight="500" fill="#202124">01  public function addVenue(place)</text><rect x="51" y="226" width="795" height="43" rx="5" fill="#f7f7f7"/><text x="66" y="255" font-family="Consolas,monospace" font-size="26" font-weight="500" fill="#202124">02    if nextFree &gt;= 20 then</text><rect x="51" y="273" width="795" height="43" rx="5" fill="white"/><text x="66" y="302" font-family="Consolas,monospace" font-size="26" font-weight="750" fill="#202124">03      return false</text><rect x="51" y="320" width="795" height="43" rx="5" fill="#f7f7f7"/><text x="66" y="349" font-family="Consolas,monospace" font-size="26" font-weight="500" fill="#202124">04    endif</text><rect x="51" y="367" width="795" height="43" rx="5" fill="white"/><text x="66" y="396" font-family="Consolas,monospace" font-size="26" font-weight="500" fill="#202124">05    venues[nextFree] = place</text><rect x="51" y="414" width="795" height="43" rx="5" fill="#f7f7f7"/><text x="66" y="443" font-family="Consolas,monospace" font-size="26" font-weight="500" fill="#202124">06    nextFree = nextFree + 1</text><rect x="51" y="461" width="795" height="43" rx="5" fill="white"/><text x="66" y="490" font-family="Consolas,monospace" font-size="26" font-weight="750" fill="#202124">07    return true</text><rect x="51" y="508" width="795" height="43" rx="5" fill="#f7f7f7"/><text x="66" y="537" font-family="Consolas,monospace" font-size="26" font-weight="500" fill="#202124">08  endfunction</text><text x="43" y="880" font-family="Arial" font-size="18" fill="#6b6b6b">RHS ORIGINAL PRACTICE · NOT OCR EXAM ARTWORK</text></svg>