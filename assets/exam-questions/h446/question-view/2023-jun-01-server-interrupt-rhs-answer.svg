<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 740" role="img" aria-labelledby="tt dd"><title id="tt">H446 school server interrupt service worked answer</title><desc id="dd">Main program is interrupted by an event; CPU detects event, saves register/context state, executes ISR, restores state and resumes the earlier program. The four high-level phases are labelled.</desc><defs><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="11"/></filter></defs><rect width="1240" height="740" fill="#fff"/><rect x="30" y="28" width="1180" height="661" rx="27" fill="none" stroke="#195b42" stroke-width="14" opacity=".12" filter="url(#glow)"/><rect x="30" y="28" width="1180" height="661" rx="27" fill="#fff" stroke="#e1e1e1" stroke-width="2"/><text x="69" y="91" font-size="40" font-weight="735" fill="#202124" text-anchor="start" font-family="Arial,Helvetica,sans-serif">INTERRUPT HANDLING  ·  WORKED ANSWER</text><text x="70" y="130" font-size="23" font-weight="520" fill="#555" text-anchor="start" font-family="Arial,Helvetica,sans-serif">June 2023 · H446/01 · Q1(f) · 3 marks</text><rect x="64" y="193" width="375" height="109" rx="19" fill="#fff" stroke="#2d2d2d" stroke-width="4"/><text x="251" y="238" font-size="30" font-weight="730" fill="#222" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">MAIN PROGRAM</text><text x="251" y="275" font-size="23" font-weight="540" fill="#555" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Library server is working</text><rect x="800" y="193" width="373" height="109" rx="19" fill="#fafafa" stroke="#2d2d2d" stroke-width="4"/><text x="986" y="238" font-size="29" font-weight="720" fill="#222" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">INTERRUPT ARRIVES</text><text x="986" y="275" font-size="23" font-weight="540" fill="#555" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">An event needs attention</text><path d="M447 246 H783" fill="none" stroke="#2e3230" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="616" y="226" font-size="23" font-weight="610" fill="#676767" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">What should the CPU do?</text><rect x="70" y="384" width="232" height="157" rx="18" fill="#f0f8f3" stroke="#195b42" stroke-width="3"/><text x="186" y="439" font-size="26" font-weight="715" fill="#195b42" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">1  DETECT</text><text x="186" y="487" font-size="23" font-weight="540" fill="#333" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Accept / prioritise</text><path d="M310 463 H351" fill="none" stroke="#195b42" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="360" y="384" width="232" height="157" rx="18" fill="#f0f8f3" stroke="#195b42" stroke-width="3"/><text x="476" y="439" font-size="26" font-weight="715" fill="#195b42" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">2  SAVE STATE</text><text x="476" y="487" font-size="23" font-weight="540" fill="#333" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Registers + context</text><path d="M600 463 H641" fill="none" stroke="#195b42" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="650" y="384" width="232" height="157" rx="18" fill="#f0f8f3" stroke="#195b42" stroke-width="3"/><text x="766" y="439" font-size="26" font-weight="715" fill="#195b42" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">3  RUN ISR</text><text x="766" y="487" font-size="23" font-weight="540" fill="#333" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Service the event</text><path d="M890 463 H931" fill="none" stroke="#195b42" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="940" y="384" width="232" height="157" rx="18" fill="#f0f8f3" stroke="#195b42" stroke-width="3"/><text x="1056" y="439" font-size="26" font-weight="715" fill="#195b42" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">4  RESTORE</text><text x="1056" y="487" font-size="23" font-weight="540" fill="#333" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Resume original task</text><text x="620" y="647" font-size="26" font-weight="650" fill="#195b42" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Correct flow: handle interrupt, preserve work, then safely continue.</text><text x="49" y="725" font-size="18" font-weight="470" fill="#666" text-anchor="start" font-family="Arial,Helvetica,sans-serif">RHS ORIGINAL TEACHING IMAGE  ·  NOT OCR EXAM ARTWORK</text></svg>