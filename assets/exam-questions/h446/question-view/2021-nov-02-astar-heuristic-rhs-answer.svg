<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc"><title id="title">RHS museum A-star heuristic answer</title><desc id="desc">h(n) estimates the remaining movement cost from a node n to Z. An admissible heuristic does not overestimate the actual shortest remaining cost.</desc><defs><filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="8"/></filter></defs><rect width="900" height="900" fill="white"/><rect x="28" y="29" width="844" height="818" rx="25" stroke="#195b42" stroke-width="16" opacity=".14" fill="none" filter="url(#glow)"/><rect x="28" y="29" width="844" height="818" rx="25" stroke="#ddd" stroke-width="2" fill="white"/><text x="54" y="112" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="750" text-anchor="start" fill="#202124">HEURISTIC · ANSWER</text><text x="64" y="255" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="750" text-anchor="start" fill="#202124">h(n) estimates the remaining</text><text x="64" y="316" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="750" text-anchor="start" fill="#202124">movement cost to Z.</text><text x="64" y="462" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="500" text-anchor="start" fill="#202124">Admissible means:</text><text x="64" y="533" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="750" text-anchor="start" fill="#202124">h(n) never exceeds the</text><text x="64" y="594" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="750" text-anchor="start" fill="#202124">true minimum remaining cost.</text><text x="64" y="718" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#202124">2 marks · estimate + no overestimate</text><text x="45" y="884" font-family="Arial" font-size="18" fill="#777">RHS ORIGINAL PRACTICE · NOT OCR EXAM ARTWORK</text></svg>