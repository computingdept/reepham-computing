<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc"><title id="title">H446 logic — half-screen question-view original diagram</title><desc id="desc">A and B feed a two-input AND gate. Its output and input C feed a two-input OR gate. The final output is F. No truth table is supplied. Independently drawn RHS teaching concept, not an OCR examination image. School colour is used for decorative component glows only.</desc><defs><filter id="schoolGlow" x="-70%" y="-80%" width="240%" height="260%"><feGaussianBlur stdDeviation="8"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 1 L9 5 L2 9 Z" fill="#222"/></marker></defs><rect width="900" height="900" fill="white"/><rect x="32" y="31" width="836" height="810" rx="25" fill="none" stroke="#195B42" stroke-width="18" opacity=".15" filter="url(#schoolGlow)"/><rect x="32" y="31" width="836" height="810" rx="25" fill="white" stroke="#E6E6E6" stroke-width="2"/><g font-family="Inter,Arial,Helvetica,sans-serif"><path d="M285 255 H360 A124 124 0 0 1 360 503 H285 Z" fill="none" stroke="#195B42" stroke-width="15" opacity=".42" filter="url(#schoolGlow)"/><path d="M285 255 H360 A124 124 0 0 1 360 503 H285 Z" fill="white" stroke="#222" stroke-width="5"/><path d="M613 408 Q684 528 613 648 Q750 642 824 528 Q750 414 613 408 Z" fill="none" stroke="#195B42" stroke-width="15" opacity=".42" filter="url(#schoolGlow)"/><path d="M613 408 Q684 528 613 648 Q750 642 824 528 Q750 414 613 408 Z" fill="white" stroke="#222" stroke-width="5"/><circle cx="127" cy="318" r="42" fill="none" stroke="#195B42" stroke-width="15" opacity=".42" filter="url(#schoolGlow)"/><circle cx="127" cy="318" r="42" fill="#fff" stroke="#1C1C1C" stroke-width="4"/><text x="127" y="332" text-anchor="middle" font-size="43" font-weight="750" fill="#171717">A</text><circle cx="127" cy="443" r="42" fill="none" stroke="#195B42" stroke-width="15" opaci