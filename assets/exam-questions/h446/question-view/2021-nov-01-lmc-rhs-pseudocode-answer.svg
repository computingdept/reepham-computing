<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc"><title id="title">November 2021 RHS LMC equivalent pseudocode</title><desc id="desc">Read two inputs; repeatedly subtract divisor from remainder and increment quotient until remainder is less than divisor. Print quotient then remainder.</desc><rect width="900" height="900" fill="white"/><rect x="30" y="30" width="840" height="817" rx="24" fill="white" stroke="#dadada" stroke-width="3"/><text x="56" y="110" font-family="Arial,sans-serif" font-size="41" font-weight="700" fill="#1b1b1d">LMC · PSEUDOCODE ANSWER</text><text x="56" y="165" font-family="Arial,sans-serif" font-size="28" font-weight="500" fill="#1b1b1d">Repeated subtraction · divisor > 0</text><rect x="55" y="196" width="790" height="54" rx="7" fill="white"/><text x="78" y="235" font-family="Arial,sans-serif" font-size="30" font-weight="500" fill="#1b1b1d">READ dividend</text><rect x="55" y="254" width="790" height="54" rx="7" fill="#f5f5f5"/><text x="78" y="293" font-family="Arial,sans-serif" font-size="30" font-weight="500" fill="#1b1b1d">READ divisor</text><rect x="55" y="312" width="790" height="54" rx="7" fill="white"/><text x="78" y="351" font-family="Arial,sans-serif" font-size="30" font-weight="500" fill="#1b1b1d">quotient = 0</text><rect x="55" y="370" width="790" height="54" rx="7" fill="#f5f5f5"/><text x="78" y="409" font-family="Arial,sans-serif" font-size="30" font-weight="500" fill="#1b1b1d">remainder = dividend</text><rect x="55" y="428" width="790" height="54" rx="7" fill="white"/><text x="78" y="467" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#1b1b1d">WHILE remainder >= divisor</text><rect x="55" y="486" width="790" height="54" rx="7" fill="#f5f5f5"/><text x="78" y="525" font-family="Arial,sans-serif" font-size="30" font-weight="500" fill="#1b1b1d">    remainder = remainder - divisor</text><rect x="55" y="544" width="790" height="54" rx="7" fill="white"/><text x="78" y="583" font-family="Arial,sans-serif" font-size="30" font-weight="500" fill="#1b1b1d">    quotient = quotient + 1</text><rect x="55" y="602" width="790" height="54" rx="7" fill="#f5f5f5"/><text x="78" y="641" font-family="Arial,sans-serif" font-size="30" font-weight="500" fill="#1b1b1d">ENDWHILE</text><rect x="55" y="660" width="790" height="54" rx="7" fill="white"/><text x="78" y="699" font-family="Arial,sans-serif" font-size="30" font-weight="500" fill="#1b1b1d">PRINT quotient</text><rect x="55" y="718" width="790" height="54" rx="7" fill="#f5f5f5"/><text x="78" y="757" font-family="Arial,sans-serif" font-size="30" font-weight="500" fill="#1b1b1d">PRINT remainder</text><text x="45" y="885" font-family="Arial,sans-serif" font-size="18" fill="#666">RHS ORIGINAL PRACTICE · NOT OCR EXAM ARTWORK</text></svg>