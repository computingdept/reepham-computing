<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 740" role="img" aria-labelledby="tt dd"><title id="tt">H446 2022 Von Neumann answer</title><desc id="dd">Von Neumann CPU with one shared main memory containing both program instructions and ticket sales data. Both exchange using a shared memory bus pathway.</desc><defs><filter id="subtleGlow" x="-25%" y="-40%" width="150%" height="180%"><feGaussianBlur stdDeviation="11"/></filter><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0 1 L14 7 L0 13 Z" fill="#292929"/></marker><marker id="greenArrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0 1 L14 7 L0 13 Z" fill="#195b42"/></marker></defs><rect width="1240" height="740" fill="#fff"/><rect x="27" y="29" width="1186" height="658" rx="26" fill="none" stroke="#195b42" stroke-width="14" opacity=".12" filter="url(#subtleGlow)"/><rect x="27" y="29" width="1186" height="658" rx="26" fill="#fff" stroke="#e1e1e1" stroke-width="2"/><text x="67" y="91" font-family="Arial,Helvetica,sans-serif" font-size="41" font-weight="740" fill="#212121" text-anchor="start">VON NEUMANN  ·  WORKED ANSWER</text><text x="67" y="128" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="510" fill="#555" text-anchor="start">June 2022 · H446/01 · Q1(a)(i) · 2 marks</text><rect x="84" y="221" width="360" height="280" rx="24" fill="#fff" stroke="#292929" stroke-width="4"/><text x="264" y="283" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="740" fill="#222" text-anchor="middle">CPU</text><rect x="130" y="324" width="269" height="114" rx="17" fill="#f6f6f6" stroke="#d2d2d2" stroke-width="2"/><text x="264" y="382" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="620" fill="#414141" text-anchor="middle">Control + ALU</text><rect x="775" y="221" width="380" height="280" rx="24" fill="#fff" stroke="#292929" stroke-width="4"/><text x="965" y="281" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="740" fill="#202124" text-anchor="middle">MAIN MEMORY</text><rect x="808" y="313" width="315" height="70" rx="13" fill="#f1f7f3" stroke="#195b42" stroke-width="3"/><text x="964" y="357" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#195b42" text-anchor="middle">Program instructions</text><rect x="808" y="398" width="315" height="70" rx="13" fill="#f1f7f3" stroke="#195b42" stroke-width="3"/><text x="964" y="442" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#195b42" text-anchor="middle">Ticket-sales data</text><path d="M453 359 H755" fill="none" stroke="#195b42" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#greenArrow)"/><path d="M755 391 H453" fill="none" stroke="#195b42" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#greenArrow)"/><rect x="470" y="551" width="571" height="83" rx="15" fill="#f7faf8" stroke="#bdd7c9" stroke-width="2"/><text x="755" y="588" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="720" fill="#195b42" text-anchor="middle">Shared memory + bus access</text><text x="755" y="619" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="540" fill="#404040" text-anchor="middle">Both code and data use the same path</text><text x="48" y="724" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="450" fill="#606060" text-anchor="start">RHS ORIGINAL TEACHING DIAGRAM  ·  NOT OCR EXAM ARTWORK</text></svg>