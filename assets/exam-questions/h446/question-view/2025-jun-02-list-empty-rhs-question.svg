th="3"/><text x="683" y="228" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="720" fill="#28312b" text-anchor="start">List contents</text><rect x="703" y="282" width="408" height="167" rx="16" fill="#fff" stroke="#e0e3e0" stroke-width="3"/><text x="907" y="346" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="680" fill="#546158" text-anchor="middle">No Node objects</text><text x="907" y="397" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="550" fill="#66736a" text-anchor="middle">have been inserted.</text><line x1="584" y1="368" x2="652" y2="368" stroke="#49544d" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="614" y="535" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="620" fill="#59645c" text-anchor="middle">Choose the initial headNode reference.</text><text x="70" y="656" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="550" fill="#606a62" text-anchor="start">Original RHS supporting illustration — not OCR exam artwork</text><text x="50" y="725" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="470" fill="#687069" text-anchor="start">RHS ORIGINAL TEACHING DIAGRAM  ·  NOT OCR EXAM ARTWORK</text></svg>