<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 740" role="img" aria-labelledby="tt dd"><title id="tt">H446 2022 instruction pipelining answer</title><desc id="dd">Four instruction rows I1 to I4 over six clock cycles. I1 Fetch/Decode/Execute in cycles1-3; I2 cycles2-4; I3 cycles3-5; I4 cycles4-6. Overlap boosts throughput, not necessarily single-instruction latency.</desc><defs><filter id="subtleGlow" x="-25%" y="-40%" width="150%" height="180%"><feGaussianBlur stdDeviation="11"/></filter><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0 1 L14 7 L0 13 Z" fill="#292929"/></marker><marker id="greenArrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0 1 L14 7 L0 13 Z" fill="#195b42"/></marker></defs><rect width="1240" height="740" fill="#fff"/><rect x="27" y="29" width="1186" height="658" rx="26" fill="none" stroke="#195b42" stroke-width="14" opacity=".12" filter="url(#subtleGlow)"/><rect x="27" y="29" width="1186" height="658" rx="26" fill="#fff" stroke="#e1e1e1" stroke-width="2"/><text x="67" y="91" font-family="Arial,Helvetica,sans-serif" font-size="41" font-weight="740" fill="#212121" text-anchor="start">INSTRUCTION PIPELINING  ·  ANSWER</text><text x="67" y="128" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="510" fill="#555" text-anchor="start">June 2022 · H446/01 · Q1(c)(iii–iv) · Fetch → Decode → Execute</text><text x="144" y="198" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#212121" text-anchor="start">Instruction</text><text x="349.5" y="198" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="710" fill="#333" text-anchor="middle">Cycle 1</text><text x="504.5" y="198" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="710" fill="#333" text-anchor="middle">Cycle 2</text><text x="659.5" y="198" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="710" fill="#333" text-anchor="middle">Cycle 3</text><text x="814.5" y="198" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="710" fill="#333" text-anchor="middle">Cycle 4</text><text x="969.5" y="198" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="710" fill="#333" text-anchor="middle">Cycle 5</text><text x="1124.5" y="198" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="710" fill="#333" text-anchor="middle">Cycle 6</text><text x="151" y="272" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="710" fill="#212121" text-anchor="start">I1</text><rect x="276" y="230" width="147" height="65" rx="11" fill="#f8f9f8" stroke="#b1cbb9" stroke-width="2.8"/><text x="349.5" y="271" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="720" fill="#333" text-anchor="middle">FETCH</text><rect x="431" y="230" width="147" height="65" rx="11" fill="#f2f5f3" stroke="#b1cbb9" stroke-width="2.8"/><text x="504.5" y="271" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="720" fill="#333" text-anchor="middle">DECODE</text><rect x="586" y="230" width="147" height="65" rx="11" fill="#e8f3ec" stroke="#b1cbb9" stroke-width="2.8"/><text x="659.5" y="271" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="720" fill="#195b42" text-anchor="middle">EXECUTE</text><rect x="741" y="230" width="147" height="65" rx="11" fill="#fff" stroke="#e1e1e1" stroke-width="1.8"/><rect x="896" y="230" width="147" height="65" rx="11" fill="#fff" stroke="#e1e1e1" stroke-width="1.8"/><rect x="1051" y="230" width="147" height="65" rx="11" fill="#fff" stroke="#e1e1e1" stroke-width="1.8"/><text x="151" y="347" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="710" fill="#212121" text-anchor="start">I2</text><rect x="276" y="305" width="147" height="65" rx="11" fill="#fff" stroke="#e1e1e1" stroke-width="1.8"/><rect x="431" y="305" wid