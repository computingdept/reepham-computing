<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc"><title id="title">November 2021 RHS flat file limitation answer</title><desc id="desc">CustomerID is unique, preventing a second vehicle from being stored as another row with the same customer ID. Duplication of customer information risks redundancy and inconsistent updates.</desc><defs><filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="9"/></filter></defs><rect width="900" height="900" fill="#fff"/><rect x="32" y="29" width="836" height="819" rx="23" fill="none" stroke="#195b42" stroke-width="16" opacity=".17" filter="url(#glow)"/><rect x="32" y="29" width="836" height="819" rx="23" fill="#fff" stroke="#ddd" stroke-width="2"/><g font-family="Arial,Helvetica,sans-serif"><text x="52" y="106" font-size="43" font-weight="750" fill="#1d1d1f">FLAT FILE · ANSWER</text><text x="58" y="224" fill="#1d1d1f" font-size="38" font-weight="750">CustomerID must be unique.</text><text x="58" y="307" fill="#1d1d1f" font-size="34" font-weight="500">A second vehicle cannot simply</text><text x="58" y="357" fill="#1d1d1f" font-size="34" font-weight="500">use another row with that ID.</text><text x="58" y="467" fill="#1d1d1f" font-size="34" font-weight="500">Copying the customer details</text><text x="58" y="517" fill="#1d1d1f" font-size="34" font-weight="500">creates duplication and</text><text x="58" y="567" fill="#1d1d1f" font-size="34" font-weight="500">possible inconsistencies.</text></g><text x="48" y="887" font-family="Arial,sans-serif" font-size="18" fill="#666">RHS ORIGINAL PRACTICE · NOT OCR EXAM ARTWORK</text></svg>