<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc"><title id="title">November 2021 RHS relational redesign answer</title><desc id="desc">One Customer record has many Vehicle records. TblCustomer fields CustomerID primary key, Title and Surname; TblVehicle fields VehicleID primary key, CustomerID foreign key and vehicle details. CustomerID joins the tables.</desc><defs><filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="9"/></filter></defs><rect width="900" height="900" fill="#fff"/><rect x="32" y="29" width="836" height="819" rx="23" fill="none" stroke="#195b42" stroke-width="16" opacity=".17" filter="url(#glow)"/><rect x="32" y="29" width="836" height="819" rx="23" fill="#fff" stroke="#ddd" stroke-width="2"/><g font-family="Arial,Helvetica,sans-serif"><text x="52" y="106" font-size="43" font-weight="750" fill="#1d1d1f">RELATIONAL REDESIGN</text><rect x="58" y="231" width="338" height="278" rx="16" fill="#fff" stroke="#202020" stroke-width="3"/><rect x="501" y="231" width="338" height="278" rx="16" fill="#fff" stroke="#202020" stroke-width="3"/><text x="81" y="280" fill="#1d1d1f" font-size="35" font-weight="750">TblCustomer</text><text x="81" y="354" fill="#1d1d1f" font-size="29" font-weight="750">CustomerID · PK</text><text x="81" y="412" fill="#1d1d1f" font-size="29" font-weight="500">Title</text><text x="81" y="467" fill="#1d1d1f" font-size="29" font-weight="500">Surname</text><text x="524" y="280" fill="#1d1d1f" font-size="35" font-weight="750">TblVehicle</text><text x="524" y="354" fill="#1d1d1f" font-size="29" font-weight="750">VehicleID · PK</text><text x="524" y="412" fill="#1d1d1f" font-size="29" font-weight="500">CustomerID · FK</text><text x="524" y="467" fill="#1d1d1f" font-size="29" font-weight="500">Vehicle details</text><path d="M397 363 L497 363" stroke="#202020" stroke-width="5" fill="none"/><circle cx="412" cy="363" r="9" fill="white" stroke="#202020" stroke-width="4"/><path d="M475 347 L497 363 L475 379" stroke="#202020" stroke-width="4" fill="none"/><text x="412" y="331" fill="#1d1d1f" font-size="30" font-weight="750">1</text><text x="467" y="331" fill="#1d1d1f" font-size="21" font-weight="750">many</text><text x="63" y="617" fill="#1d1d1f" font-size="34" font-weight="750">One customer → many vehicles</text><text x="63" y="680" fill="#1d1d1f" font-size="29" font-weight="500">CustomerID links the two tables.</text></g><text x="48" y="887" font-family="Arial,sans-serif" font-size="18" fill="#666">RHS ORIGINAL PRACTICE · NOT OCR EXAM ARTWORK</text></svg>