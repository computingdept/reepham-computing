<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 740" role="img" aria-labelledby="title description"><title id="title">H446 2025 linked list deletion question</title><desc id="description">Illustrative three-node singly linked list 10-&gt;25-&gt;39 with links, asking how to remove a target safely including head/missing cases; no changes or deletion algorithm revealed.</desc><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="11"/></filter><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0 1 L14 7 L0 13Z" fill="#343a39"/></marker><marker id="greenArrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0 1 L14 7 L0 13Z" fill="#195b42"/></marker></defs><rect width="1240" height="740" fill="#fff"/><rect x="32" y="27" width="1176" height="660" rx="26" fill="none" stroke="#195b42" stroke-width="14" opacity=".13" filter="url(#glow)"/><rect x="32" y="27" width="1176" height="660" rx="26" stroke="#e2e4e3" stroke-width="2" fill="#fff"/><text x="67" y="93" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="730" fill="#242728">LINKED LIST  ·  REMOVE A NODE</text><text x="68" y="128" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="520" fill="#555">June 2025 · H446/02 · Q8(e) · 5 marks · illustrative values</text><text x="84" y="181" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="710" fill="#39443e">EXAMPLE LIST: THREE NODES</text><rect x="151" y="247" width="227" height="148" rx="17" stroke="#333c36" stroke-width="4" fill="#fff"/><text x="264" y="304" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="730" fill="#212722">value 10</text><text x="264" y="350" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="590" fill="#555">nextNode</text><rect x="500" y="247" width="227" height="148" rx="17" stroke="#333c36" stroke-width="4" fill="#fff"/><text x="613" y="304" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="730" fill="#212722">value 25</text><text x="613" y="350" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="590" fill="#555">nextNode</text><rect x="855" y="247" width="227" height="148" rx="17" stroke="#333c36" stroke-width="4" fill="#fff"/><text x="968" y="304" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="730" fill="#212722">value 39</text><text x="968" y="350" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="590" fill="#555">nextNode</text><path d="M394 321 H478" stroke="#333c36" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M744 321 H831" stroke="#333c36" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="103" y="492" width="1048" height="128" rx="16" stroke="#c5cbc7" stroke-width="2" fill="#fafafa"/><text x="627" y="536" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="600" fill="#555">How could removeNode(target) bypass the target safely?</text><text x="627" y="580" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="550" fill="#656a67">Also consider deleting the head or a missing target.</text><text x="48" y="725" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="470" fill="#606565">RHS ORIGINAL PRACTICE  ·  NOT OCR EXAM ARTWORK</text></svg>