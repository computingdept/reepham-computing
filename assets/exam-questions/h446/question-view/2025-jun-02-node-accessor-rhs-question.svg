troke="#55655b" stroke-width="3"/><text x="447" y="326" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="650" fill="#667369" text-anchor="middle">Node B</text><text x="447" y="372" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="760" fill="#27342a" text-anchor="middle">25</text><line x1="284" y1="354" x2="358" y2="354" stroke="#49544d" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="112" y="270" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="620" fill="#28312b" text-anchor="start">private fields: value, nextNode</text><text x="112" y="470" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="560" fill="#28312b" text-anchor="start">A points to B through nextNode.</text><rect x="645" y="183" width="525" height="414" rx="18" fill="#fff" stroke="#d5dcd7" stroke-width="3"/><text x="670" y="225" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="720" fill="#28312b" text-anchor="start">Accessor to write</text><rect x="684" y="280" width="450" height="46" rx="10" fill="#f7f8f7" stroke="#e0e3e1" stroke-width="2"/><text x="702" y="311" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="650" fill="#28312b" text-anchor="start">public getter, zero parameters</text><rect x="686" y="374" width="443" height="108" rx="13" fill="#f7f8f7" stroke="#d9dfda" stroke-width="2"/><text x="906" y="440" font-family="Arial,Helvetica,sans-serif" font-size="37" font-weight="600" fill="#8a958d" text-anchor="middle">Return: ?</text><text x="70" y="656" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="550" fill="#606a62" text-anchor="start">Original RHS supporting illustration — not OCR exam artwork</text><text x="50" y="725" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="470" fill="#687069" text-anchor="start">RHS ORIGINAL TEACHING DIAGRAM  ·  NOT OCR EXAM ARTWORK</text></svg>