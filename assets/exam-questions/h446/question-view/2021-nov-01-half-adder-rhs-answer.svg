<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc"><title id="title">November 2021 RHS half-adder circuit answer</title><desc id="desc">Input A and B feed an XOR gate with output S and an AND gate with output C. S equals A XOR B; C equals A AND B.</desc><defs><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9"/></filter></defs><rect width="900" height="900" fill="#fff"/><rect x="31" y="30" width="838" height="817" rx="26" fill="none" stroke="#195b42" stroke-width="16" opacity=".16" filter="url(#glow)"/><rect x="31" y="30" width="838" height="817" rx="26" fill="#fff" stroke="#e0e0e0" stroke-width="2"/><g font-family="Arial,Helvetica,sans-serif"><text x="54" y="108" font-size="42" font-weight="750" text-anchor="start" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">HALF ADDER · ANSWER</text><text x="54" y="158" font-size="28" font-weight="500" text-anchor="start" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">Two one-bit inputs: A and B</text><rect x="340" y="252" width="213" height="125" rx="20" fill="#fff" stroke="#242424" stroke-width="4"/><text x="446" y="327" font-size="40" font-weight="750" text-anchor="middle" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">XOR</text><rect x="340" y="544" width="213" height="125" rx="20" fill="#fff" stroke="#242424" stroke-width="4"/><text x="446" y="619" font-size="40" font-weight="750" text-anchor="middle" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">AND</text><text x="92" y="295" font-size="38" font-weight="750" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">A</text><path d="M139 283 H340" stroke="#202020" stroke-width="5" fill="none"/><text x="92" y="362" font-size="38" font-weight="750" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">B</text><path d="M139 350 H340" stroke="#202020" stroke-width="5" fill="none"/><text x="92" y="585" font-size="38" font-weight="750" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">A</text><path d="M139 573 H340" stroke="#202020" stroke-width="5" fill="none"/><text x="92" y="654" font-size="38" font-weight="750" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">B</text><path d="M139 642 H340" stroke="#202020" stroke-width="5" fill="none"/><path d="M553 314 L716 314" stroke="#202020" stroke-width="5" stroke-linecap="round" fill="none"/><text x="732" y="329" font-size="42" font-weight="750" text-anchor="start" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">S</text><path d="M553 606 L716 606" stroke="#202020" stroke-width="5" stroke-linecap="round" fill="none"/><text x="732" y="621" font-size="42" font-weight="750" text-anchor="start" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">C</text><text x="66" y="756" font-size="36" font-weight="750" text-anchor="start" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">S = A XOR B</text><text x="490" y="756" font-size="36" font-weight="750" text-anchor="start" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">C = A AND B</text></g><text x="44" y="886" font-size="18" fill="#656565" font-family="Arial,sans-serif">RHS ORIGINAL PRACTICE · NOT OCR EXAM ARTWORK</text></svg>