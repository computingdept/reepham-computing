<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 740" role="img" aria-labelledby="tt dd"><title id="tt">H446 community library RAM memory management model answer</title><desc id="dd">Three library applications share RAM but the OS allocates and isolates processes; some pages may be swapped to secondary storage if necessary. Excessive paging can cause thrashing. Diagram is a simplified RAM snapshot.</desc><defs><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="11"/></filter></defs><rect width="1240" height="740" fill="#fff"/><rect x="30" y="28" width="1180" height="661" rx="27" fill="none" stroke="#195b42" stroke-width="14" opacity=".12" filter="url(#glow)"/><rect x="30" y="28" width="1180" height="661" rx="27" fill="#fff" stroke="#e1e1e1" stroke-width="2"/><text x="69" y="91" font-size="40" font-weight="735" fill="#202124" text-anchor="start" font-family="Arial,Helvetica,sans-serif">LIBRARY COMPUTER  ·  MEMORY ANSWER</text><text x="70" y="130" font-size="23" font-weight="520" fill="#555" text-anchor="start" font-family="Arial,Helvetica,sans-serif">June 2023 · H446/01 · Q1(g)* · 9 marks · simplified model</text><rect x="80" y="190" width="295" height="94" rx="18" fill="#fff" stroke="#3e4441" stroke-width="3"/><text x="227" y="246" font-size="27" font-weight="710" fill="#222" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">CATALOGUING</text><line x1="227" y1="285" x2="227" y2="330" stroke="#a5aaa7" stroke-width="3" stroke-linecap="round"/><rect x="430" y="190" width="295" height="94" rx="18" fill="#fff" stroke="#3e4441" stroke-width="3"/><text x="577" y="246" font-size="27" font-weight="710" fill="#222" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">WEB ACCESS</text><line x1="577" y1="285" x2="577" y2="330" stroke="#a5aaa7" stroke-width="3" stroke-linecap="round"/><rect x="780" y="190" width="295" height="94" rx="18" fill="#fff" stroke="#3e4441" stroke-width="3"/><text x="927" y="246" fon