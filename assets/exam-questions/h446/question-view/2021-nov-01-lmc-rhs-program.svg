<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 900 900"><title id="title">November 2021 RHS LMC original program</title><desc id="desc">Twenty-two lines of LMC machine instructions, starting INP, STA REMAINDER, INP, STA DIVISOR and repeated subtraction until branch DONE. Includes DAT fields REMAINDER, DIVISOR, QUOTIENT and ONE.</desc><defs><filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="9"/></filter></defs><rect width="900" height="900" fill="#fff"/><rect x="30" y="29" width="840" height="822" rx="25" stroke="#195b42" stroke-width="15" opacity=".16" fill="none" filter="url(#glow)"/><rect x="30" y="29" width="840" height="822" rx="25" stroke="#ddd" stroke-width="2" fill="#fff"/><text x="60" y="91" font-family="Arial,Helvetica,sans-serif" font-size="37" font-weight="750" fill="#1b1b1d">LMC · REPEATED SUBTRACTION</text><text x="60" y="133" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="500" fill="#1b1b1d">Read dividend, then divisor · output quotient and remainder</text><rect x="65" y="159" width="365" height="48" rx="7" fill="#fff"/><text x="77" y="194" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="500" fill="#1b1b1d">01  INP</text><rect x="65" y="217" width="365" height="48" rx="7" fill="#f8f8f8"/><text x="77" y="252" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="500" fill="#1b1b1d">02  STA REMAINDER</text><rect x="65" y="275" width="365" height="48" rx="7" fill="#fff"/><text x="77" y="310" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="500" fill="#1b1b1d">03  INP</text><rect x="65" y="333" width="365" height="48" rx="7" fill="#f8f8f8"/><text x="77" y="368" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="500" fill="#1b1b1d">04  STA DIVISOR</text><rect x="65" y="391" width="365" height="48" rx="7" fill="#fff"/><text x="77" y="426" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#1b1b1d">05  LOOP LDA REMAINDER</text><rect x="65" y="449" width="365" height="48" rx="7" fill="#f8f8f8"/><text x="77" y="484" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="500" fill="#1b1b1d">06  SUB DIVISOR</text><rect x="65" y="507" width="365" height="48" rx="7" fill="#fff"/><text x="77" y="542" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="500" fill="#1b1b1d">07  BRP TAKE</text><rect x="65" y="565" width="365" height="48" rx="7" fill="#f8f8f8"/><text x="77" y="600" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="500" fill="#1b1b1d">08  BRA DONE</text><rect x="65" y="623" width="365" height="48" rx="7" fill="#fff"/><text x="77" y="658" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#1b1b1d">09  TAKE STA REMAINDER</text><rect x="65" y="681" width="365" height="48" rx="7" fill="#f8f8f8"/><text x="77" y="716" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="500" fill="#1b1b1d">10  LDA QUOTIENT</text><rect x="65" y="739" width="365" height="48" rx="7" fill="#fff"/><text x="77" y="774" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="500" fill="#1b1b1d">11  ADD ONE</text><rect x="455" y="159" width="365" height="48" rx="7" fill="#f8f8f8"/><text x="467" y="194" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="500" fill="#1b1b1d">12  STA QUOTIENT</text><rect x="455" y="217" width="365" height="48" rx="7" fill="#fff"/><text x="467" y="252" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="500" fill="#1b1b1d">13  BRA LOOP</text><rect x="455" y="275" width="365" height="48" rx="7" fill="#f8f8f8"/><text x="467" y="310" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#1b1b1d">14  DONE LDA QUOTIENT</text><rect x="455" y="333" width="365" height="48" rx="7" fill="#fff"/><text x="467" y="368" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="500" fill="#1b1b1d">15  OUT</text><rect x="455" y="391" width="365" height="48" rx="7" fill="#f8f8f8"/><text x="467" y="426" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="500" fill="#1b1b1d">16  LDA REMAINDER</text><rect x="455" y="449" width="365" height="48" rx="7" fill="#fff"/><text x="467" y="484" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="500" fill="#1b1b1d">17  OUT</text><rect x="455" y="507" width="365" height="48" rx="7" fill="#f8f8f8"/><text x="467" y="542" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="500" fill="#1b1b1d">18  HLT</text><rect x="455" y="565" width="365" height="48" rx="7" fill="#fff"/><text x="467" y="600" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="500" fill="#1b1b1d">19  REMAINDER DAT 0</text><rect x="455" y="623" width="365" height="48" rx="7" fill="#f8f8f8"/><text x="467" y="658" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="500" fill="#1b1b1d">20  DIVISOR DAT 0</text><rect x="455" y="681" width="365" height="48" rx="7" fill="#fff"/><text x="467" y="716" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="500" fill="#1b1b1d">21  QUOTIENT DAT 0</text><rect x="455" y="739" width="365" height="48" rx="7" fill="#f8f8f8"/><text x="467" y="774" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="500" fill="#1b1b1d">22  ONE DAT 1</text><text x="44" y="887" font-size="18" fill="#666" font-family="Arial,Helvetica,sans-serif">RHS ORIGINAL PRACTICE · NOT OCR EXAM ARTWORK</text></svg>