<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc"><title id="title">RHS campus map schema question</title><desc id="desc">CampusMap contains a private Venue reference array of 20 slots indexed 0 to 19, and nextFree starts at 0. addVenue(place) returns true only if a slot exists.</desc><defs><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8"/></filter></defs><rect width="900" height="900" fill="#fff"/><rect x="28" y="29" width="844" height="815" rx="25" fill="none" stroke="#195b42" opacity=".16" stroke-width="17" filter="url(#glow)"/><rect x="28" y="29" width="844" height="815" rx="25" fill="white" stroke="#dedede" stroke-width="2"/><text x="48" y="108" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="750" fill="#202124">CAMPUS MAP · STRUCTURE</text><rect x="110" y="237" width="680" height="344" rx="16" fill="#fff" stroke="#242424" stroke-width="3"/><text x="132" y="287" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="750" fill="#202124">CampusMap</text><path d="M110 305H790" stroke="#ddd" stroke-width="2"/><text x="130" y="345" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="500" fill="#202124">− venues[0..19] : Venue references</text><text x="130" y="388" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="500" fill="#202124">− nextFree : integer = 0</text><text x="130" y="431" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="500" fill="#202124">+ addVenue(place) : boolean</text><text x="80" y="673" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="750" fill="#202124">Capacity: 20 venues</text><text x="80" y="736" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="500" fill="#202124">Valid nextFree slots: 0..19</text><text x="43" y="880" font-family="Arial" font-size="18" fill="#6b6b6b">RHS ORIGINAL PRACTICE · NOT OCR EXAM ARTWORK</text></svg>