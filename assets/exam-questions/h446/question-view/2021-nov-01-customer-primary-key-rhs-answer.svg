<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc"><title id="title">November 2021 RHS customer primary key answer</title><desc id="desc">CustomerID is the primary key and uniquely identifies each Customer row.</desc><defs><filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="9"/></filter></defs><rect width="900" height="900" fill="#fff"/><rect x="32" y="29" width="836" height="819" rx="23" fill="none" stroke="#195b42" stroke-width="16" opacity=".17" filter="url(#glow)"/><rect x="32" y="29" width="836" height="819" rx="23" fill="#fff" stroke="#ddd" stroke-width="2"/><g font-family="Arial,Helvetica,sans-serif"><text x="52" y="106" font-size="43" font-weight="750" fill="#1d1d1f">PRIMARY KEY · ANSWER</text><text x="62" y="212" fill="#1d1d1f" font-size="53" font-weight="750">CustomerID</text><text x="62" y="295" fill="#1d1d1f" font-size="40" font-weight="500">uniquely identifies</text><text x="62" y="350" fill="#1d1d1f" font-size="40" font-weight="500">each customer record.</text><text x="62" y="471" fill="#1d1d1f" font-size="34" font-weight="750">2 marking points</text><text x="62" y="531" fill="#1d1d1f" font-size="30" font-weight="500">1 · Unique row identifier</text><text x="62" y="592" fill="#1d1d1f" font-size="30" font-weight="500">2 · CustomerID field</text></g><text x="48" y="887" font-family="Arial,sans-serif" font-size="18" fill="#666">RHS ORIGINAL PRACTICE · NOT OCR EXAM ARTWORK</text></svg>