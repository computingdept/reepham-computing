<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 740" role="img" aria-labelledby="tt dd"><title id="tt">H446 2022 CPU registers answer</title><desc id="dd">Accumulator holds operands or results of the ALU or values read from memory. Program Counter holds the next instruction address and increments after fetching or loads branch targets.</desc><defs><filter id="subtleGlow" x="-25%" y="-40%" width="150%" height="180%"><feGaussianBlur stdDeviation="11"/></filter><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0 1 L14 7 L0 13 Z" fill="#292929"/></marker><marker id="greenArrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0 1 L14 7 L0 13 Z" fill="#195b42"/></marker></defs><rect width="1240" height="740" fill="#fff"/><rect x="27" y="29" width="1186" height="658" rx="26" fill="none" stroke="#195b42" stroke-width="14" opacity=".12" filter="url(#subtleGlow)"/><rect x="27" y="29" width="1186" height="658" rx="26" fill="#fff" stroke="#e1e1e1" stroke-width="2"/><text x="67" y="91" font-family="Arial,Helvetica,sans-serif" font-size="41" font-weight="740" fill="#212121" text-anchor="start">CPU REGISTERS  ·  WORKED ANSWER</text><text x="67" y="128" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="510" fill="#555" text-anchor="start">June 2022 · H446/01 · Q1(d)(i–ii) · 4 marks combined</text><rect x="70" y="200" width="1106" height="382" rx="25" fill="#fdfdfd" stroke="#303030" stroke-width="4"/><text x="632" y="248" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="740" fill="#202124" text-anchor="middle">CPU</text><rect x="117" y="301" width="260" height="190" rx="16" fill="#fff" stroke="#292929" stroke-width="3"/><text x="247" y="349" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="740" fill="#282828" text-anchor="middle">ACCUMULATOR</text><rect x="474" y="301" width="260" height="190" rx="16" fill="#fff" stroke="#292929" stroke-width="3"/><text x="604" y="349" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="740" fill="#282828" text-anchor="middle">PROGRAM COUNTER</text><rect x="829" y="301" width="295" height="190" rx="16" fill="#f6f6f6" stroke="#666" stroke-width="3"/><text x="975" y="344" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="730" fill="#333" text-anchor="middle">EXECUTION</text><text x="975" y="382" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="650" fill="#333" text-anchor="middle">ALU / MEMORY</text><text x="247" y="393" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="650" fill="#195b42" text-anchor="middle">Operand / result</text><text x="247" y="431" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="550" fill="#4b4b4b" text-anchor="middle">from ALU or memory</text><text x="604" y="393" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="650" fill="#195b42" text-anchor="middle">Next instruction</text><text x="604" y="431" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="550" fill="#4b4b4b" text-anchor="middle">address; increment</text><text x="604" y="459" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="550" fill="#4b4b4b" text-anchor="middle">or branch target</text><path d="M390 402 H453" fill="none" stroke="#195b42" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#greenArrow)"/><path d="M747 402 H812" fill="none" stroke="#195b42" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#greenArrow)"/><text x="620" y="634" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="690" fill="#195b42" text-anchor="middle">PC controls which instruction is fetched; ACC holds working values.</text><text x="48" y="724" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="450" fill="#6