<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 740" role="img" aria-labelledby="tt dd"><title id="tt">H446 quicksort final-pivot illustrative partition question</title><desc id="dd">Illustrative array 9 3 8 2 6, final element pivot6 highlighted. Answer partition is hidden. RHS June 2025 question does not give a fixed array, so these values are explicitly illustrative.</desc><defs><filter id="halo" x="-25%" y="-35%" width="150%" height="170%"><feGaussianBlur stdDeviation="10"/></filter></defs><rect width="1240" height="740" fill="#fff"/><rect x="29" y="27" width="1182" height="662" rx="26" stroke="#195b42" stroke-width="14" opacity=".12" fill="none" filter="url(#halo)"/><rect x="29" y="27" width="1182" height="662" rx="26" fill="#fff" stroke="#e0e3e0" stroke-width="2"/><text x="65" y="91" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="735" fill="#22292a" text-anchor="start">QUICKSORT  ·  PARTITION CHALLENGE</text><text x="65" y="132" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="510" fill="#555" text-anchor="start">June 2025 · H446/02 · Q1(c)(iii) · 3 marks · illustrative values</text><text x="82" y="206" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="705" fill="#323a33" text-anchor="start">ILLUSTRATIVE INPUT — LAST VALUE IS PIVOT</text><rect x="245" y="233" width="129" height="87" rx="12" fill="#fff" stroke="#aab2ad" stroke-width="2"/><text x="309.5" y="286.5" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="720" fill="#2b2f2c" text-anchor="middle">9</text><rect x="396" y="233" width="129" height="87" rx="12" fill="#fff" stroke="#aab2ad" stroke-width="2"/><text x="460.5" y="286.5" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="720" fill="#2b2f2c" text-anchor="middle">3</text><rect x="547" y="233" width="129" height="87" rx="12" fill="#fff" stroke="#aab2ad" stroke-width="2"/><text x="611.5" y="286.5" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="720" fill="#2b2f2c" text-anchor="middle">8</text><rect x="698" y="233" width="129" height="87" rx="12" fill="#fff" stroke="#aab2ad" stroke-width="2"/><text x="762.5" y="286.5" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="720" fill="#2b2f2c" text-anchor="middle">2</text><rect x="849" y="233" width="129" height="87" rx="12" fill="#eff8f2" stroke="#195b42" stroke-width="4"/><text x="913.5" y="286.5" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="720" fill="#195b42" text-anchor="middle">6</text><text x="613" y="364" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#4d5650" text-anchor="middle">Pivot = final element: 6</text><path d="M633 379 V431" fill="none" stroke="#87948b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="86" y="440" width="1069" height="175" rx="18" fill="#fff" stroke="#a4aaa6" stroke-width="3" stroke-dasharray="11 9"/><text x="620" y="505" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="640" fill="#686f6a" text-anchor="middle">Arrange smaller values LEFT of the pivot,</text><text x="620" y="555" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="640" fill="#686f6a" text-anchor="middle">and larger values RIGHT of the pivot.</text><text x="620" y="658" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="520" fill="#626963" text-anchor="middle">Different correct partition orders may be accepted.</text><text x="50" y="723" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="460" fill="#626662" text-anchor="start">RHS ORIGINAL PRACTICE  ·  NOT OCR EXAM ARTWORK</text></svg>