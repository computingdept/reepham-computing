" y="261" text-anchor="start" font-size="30" font-weight="600" fill="#171717">private brand: string</text><text x="297" y="319" text-anchor="start" font-size="29" font-weight="600" fill="#171717">public getBrand(): string</text><text x="109" y="616" text-anchor="start" font-size="33" font-weight="800" fill="#171717">Car : Vehicle</text><text x="109" y="681" text-anchor="start" font-size="29" font-weight="600" fill="#171717">private doors: integer</text><text x="513" y="616" text-anchor="start" font-size="31" font-weight="800" fill="#171717">Bicycle : Vehicle</text><text x="513" y="681" text-anchor="start" font-size="29" font-weight="600" fill="#171717">private gears: integer</text><path d="M251 547 L357 375" stroke="#202020" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" fill="none"/><path d="M653 547 L544 375" stroke="#202020" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" fill="none"/><path d="M337 397 L357 371 L366 403 Z" fill="#fff" stroke="#222" stroke-width="4"/><path d="M536 403 L544 371 L564 397 Z" fill="#fff" stroke="#222" stroke-width="4"/></g><text x="44" y="876" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" fill="#666">RHS ORIGINAL EXAMPLE · NOT THE OCR EXAM FIGURE</text></svg>
