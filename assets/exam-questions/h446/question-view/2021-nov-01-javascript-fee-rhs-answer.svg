<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc"><title id="title">November 2021 RHS JavaScript fee answer</title><desc id="desc">Completed blanks: 2.99; nonUKprice; numtickets; return.</desc><defs><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9"/></filter></defs><rect width="900" height="900" fill="#fff"/><rect x="31" y="30" width="838" height="817" rx="26" fill="none" stroke="#195b42" stroke-width="16" opacity=".16" filter="url(#glow)"/><rect x="31" y="30" width="838" height="817" rx="26" fill="#fff" stroke="#e0e0e0" stroke-width="2"/><g font-family="Arial,Helvetica,sans-serif"><text x="54" y="108" font-size="42" font-weight="750" text-anchor="start" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">JAVASCRIPT · MODEL ANSWER</text><text x="55" y="159" font-size="28" font-weight="500" text-anchor="start" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">Booking fee per ticket: 2.99</text><text x="55" y="203" font-size="28" font-weight="500" text-anchor="start" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">Additional non-UK fee per ticket: 4.99</text><rect x="53" y="219" width="794" height="51" rx="7" fill="white"/><text x="69" y="255" font-size="22" font-weight="500" text-anchor="start" fill="#757575" font-family="monospace">01</text><text x="130" y="255" font-size="24" font-weight="500" text-anchor="start" fill="#1b1b1b" font-family="monospace">function calculateFee(numtickets, country) {</text><rect x="53" y="274" width="794" height="51" rx="7" fill="#fafafa"/><text x="69" y="310" font-size="22" font-weight="500" text-anchor="start" fill="#757575" font-family="monospace">02</text><text x="130" y="310" font-size="27" font-weight="500" text-anchor="start" fill="#1b1b1b" font-family="monospace">  let nonUKprice = 4.99;</text><rect x="53" y="329" width="794" height="51" rx="7" fill="#f0f0f0"/><text x="69" y="365" font-size="22" font-weight="500" text-anchor="start" fill="#757575" font-family="monospace">03</text><text x="130" y="365" font-size="27" font-weight="750" text-anchor="start" fill="#1b1b1b" font-family="monospace">  let perTicket = 2.99;</text><rect x="53" y="384" width="794" height="51" rx="7" fill="#fafafa"/><text x="69" y="420" font-size="22" font-weight="500" text-anchor="start" fill="#757575" font-family="monospace">04</text><text x="130" y="420" font-size="27" font-weight="500" text-anchor="start" fill="#1b1b1b" font-family="monospace">  if (country !== "UK") {</text><rect x="53" y="439" width="794" height="51" rx="7" fill="#f0f0f0"/><text x="69" y="475" font-size="22" font-weight="500" text-anchor="start" fill="#757575" font-family="monospace">05</text><text x="130" y="475" font-size="27" font-weight="750" text-anchor="start" fill="#1b1b1b" font-family="monospace">    perTicket = perTicket + nonUKprice;</text><rect x="53" y="494" width="794" height="51" rx="7" fill="#fafafa"/><text x="69" y="530" font-size="22" font-weight="500" text-anchor="start" fill="#757575" font-family="monospace">06</text><text x="130" y="530" font-size="27" font-weight="500" text-anchor="start" fill="#1b1b1b" font-family="monospace">  }</text><rect x="53" y="549" width="794" height="51" rx="7" fill="#f0f0f0"/><text x="69" y="585" font-size="22" font-weight="500" text-anchor="start" fill="#757575" font-family="monospace">07</text><text x="130" y="585" font-size="27" font-weight="750" text-anchor="start" fill="#1b1b1b" font-family="monospace">  let fee = perTicket * numtickets;</text><rect x="53" y="604" width="794" height="51" rx="7" fill="#f0f0f0"/><text x="69" y="640" font-size="22" font-weight="500" text-anchor="start" fill="#757575" font-family="monospace">08</text><text x="130" y="640" font-size="27" font-weight="750" text-anchor="start" fill="#1b1b1b" font-family="monospace">  return fee;</text><rect x="53" y="659" width="794" height="51" rx="7" fill="white"/><text x="69" y="695" font-size="22" font-weight="500"