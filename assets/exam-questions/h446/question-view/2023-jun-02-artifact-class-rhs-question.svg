<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 740" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">H446 2023 Artifact class constructor question</title><desc id="svgDesc">Artifact blueprint with private value integer and category string, unanswered constructor signature, and two blank object attribute assignments. Source context is the 2023 archaeology museum game.</desc><defs><filter id="soft" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="11"/></filter><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="13" refX="13" refY="6.5" orient="auto"><path d="M0 0 L14 6.5 L0 13 Z" fill="#394039"/></marker><marker id="green" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="13" refX="13" refY="6.5" orient="auto"><path d="M0 0 L14 6.5 L0 13 Z" fill="#195b42"/></marker></defs><rect width="1240" height="740" fill="#fff"/><rect x="30" y="30" width="1180" height="658" rx="26" fill="none" stroke="#195b42" stroke-width="14" opacity=".13" filter="url(#soft)"/><rect x="30" y="30" width="1180" height="658" rx="26" stroke="#e2e4e3" stroke-width="2" fill="#fff"/><text x="65" y="91" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="740" fill="#222928" text-anchor="start">ARTIFACT CLASS  ·  CONSTRUCTOR QUESTION</text><text x="66" y="130" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="500" fill="#59605b" text-anchor="start">June 2023 · H446/02 · Q9(b)(i), supports Q9(b)(iii)</text><rect x="73" y="180" width="515" height="412" rx="21" stroke="#2b312c" stroke-width="4" fill="#fff"/><rect x="76" y="183" width="509" height="70" rx="17" stroke="#e4e7e3" stroke-width="1" fill="#f7f8f7"/><text x="329" y="231" font-family="Arial,Helvetica,sans-serif" font-size="37" font-weight="740" fill="#272c28" text-anchor="middle">class Artifact</text><text x="103" y="295" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#56605a" text-anchor="start">PRIVATE ATTRIBUTES</text><rect x="103" y="315" width="444" height="68" rx="10" stroke="#d4d9d5" stroke-width="2" fill="#fafafa"/><text x="126" y="358" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="650" fill="#222928" text-anchor="start">value : integer</text><rect x="103" y="395" width="444" height="68" rx="10" stroke="#d4d9d5" stroke-width="2" fill="#fafafa"/><text x="126" y="438" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="650" fill="#222928" text-anchor="start">category : string</text><text x="103" y="507" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="690" fill="#56605a" text-anchor="start">PUBLIC CONSTRUCTOR</text><rect x="103" y="518" width="444" height="55" rx="11" stroke="#bcc4be" stroke-width="2" fill="#fff" stroke-dasharray="11 8"/><text x="325" y="554" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="560" fill="#9aaca0" text-anchor="middle">new(?, ?)</text><path d="M601 360 H707" stroke="#394039" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="720" y="196" width="449" height="353" rx="21" stroke="#323a34" stroke-width="4" fill="#fff"/><text x="944" y="241" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="735" fill="#282e29" text-anchor="middle">CREATED OBJECT</text><rect x="747" y="290" width="398" height="83" rx="13" stroke="#d0d5d1" stroke-width="2" fill="#fafafa"/><text x="945" y="342" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="580" fill="#9ca39d" text-anchor="middle">value = ?</text><rect x="747" y="389" width="398" height="83" rx="13" stroke="#d0d5d1" stroke-width="2" fill="#fafafa"/><text x="945" y="441" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="580" fill="#9ca39d" text-anchor="middle">category = ?</text><text x="619" y="637" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="590" fill="#505953" text-anc