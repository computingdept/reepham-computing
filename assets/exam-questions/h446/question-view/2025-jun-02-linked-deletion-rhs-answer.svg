<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 740" role="img" aria-labelledby="title description"><title id="title">H446 2025 linked list safe deletion worked example</title><desc id="description">Illustrative singly linked list 10-&gt;25-&gt;39: removing target25 updates previous node 10 next reference to successor39, bypassing node25. Special case removing head updates headNode to next; target not found leaves list unchanged. The example is illustrative not a required concrete input.</desc><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="11"/></filter><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0 1 L14 7 L0 13Z" fill="#343a39"/></marker><marker id="greenArrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0 1 L14 7 L0 13Z" fill="#195b42"/></marker></defs><rect width="1240" height="740" fill="#fff"/><rect x="32" y="27" width="1176" height="660" rx="26" fill="none" stroke="#195b42" stroke-width="14" opacity=".13" filter="url(#glow)"/><rect x="32" y="27" width="1176" height="660" rx="26" stroke="#e2e4e3" stroke-width="2" fill="#fff"/><text x="67" y="93" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="730" fill="#242728">LINKED LIST  ·  SAFE DELETION</text><text x="68" y="128" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="520" fill="#555">June 2025 · H446/02 · Q8(e) · 5 marks · illustrative values</text><text x="84" y="181" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="710" fill="#39443e">EXAMPLE: REMOVE THE MIDDLE NODE</text><rect x="151" y="247" width="227" height="148" rx="17" stroke="#333c36" stroke-width="4" fill="#fff"/><text x="264" y="304" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="730" fill="#212722">value 10</text><text x="264" y="350" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="590" fill="#555">nextNode</text><rect x="500" y="247" width="227" height="148" rx="17" stroke="#b98a8a" stroke-width="3" fill="#fff8f8" stroke-dasharray="9 7"/><text x="613" y="304" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="730" fill="#946b6b">value 25</text><text x="613" y="350" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="590" fill="#555">nextNode</text><rect x="855" y="247" width="227" height="148" rx="17" stroke="#333c36" stroke-width="4" fill="#fff"/><text x="968" y="304" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="730" fill="#212722">value 39</text><text x="968" y="350" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="590" fill="#555">nextNode</text><path d="M389 321 C435 177 762 178 836 321" stroke="#195b42" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#greenArrow)"/><text x="614" y="194" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="710" fill="#195b42">RELINK previous.next → successor</text><path d="M739 322 H832" stroke="#a5aaa7" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="610" y="435" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="590" fill="#8b6464">Node 25 is bypassed</text><rect x="90" y="487" width="1070" height="134" rx="15" stroke="#bdd6c6" stroke-width="2" fill="#f5faf7"/><text x="112" y="531" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="690" fill="#195b42">HEAD MATCH: headNode ← old head.nextNode</text><text x="112" y="576" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="690" fill="#195b42">NOT FOUND: leave the linked list unchanged</text><text x="48" y="725" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="470" fill="#606565">RHS ORIGINAL PRACTICE  ·  NOT OCR EXAM ARTWORK</text></svg>