<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc"><title id="title">RHS constructor marking answer</title><desc id="desc">A constructor is called when an object is instantiated to initialise its attributes.</desc><defs><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8"/></filter></defs><rect width="900" height="900" fill="#fff"/><rect x="28" y="29" width="844" height="815" rx="25" fill="none" stroke="#195b42" opacity=".16" stroke-width="17" filter="url(#glow)"/><rect x="28" y="29" width="844" height="815" rx="25" fill="white" stroke="#dedede" stroke-width="2"/><text x="55" y="114" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="750" fill="#202124">CONSTRUCTOR · ANSWER</text><text x="60" y="270" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="750" fill="#202124">Initialises a new object's</text><text x="60" y="341" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="750" fill="#202124">attributes when created.</text><text x="60" y="505" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="500" fill="#202124">Example:</text><text x="60" y="577" font-family="Consolas,monospace" font-size="37" font-weight="750" fill="#202124">new Gallery(...)</text><text x="43" y="880" font-family="Arial" font-size="18" fill="#6b6b6b">RHS ORIGINAL PRACTICE · NOT OCR EXAM ARTWORK</text></svg>