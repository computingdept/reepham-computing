<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 740" role="img" aria-labelledby="tt dd"><title id="tt">H446 conservation charity thin versus thick clients explained</title><desc id="dd">Two architectures: thin remote endpoint sends inputs and receives output from central server running VMs and virtual storage, improving central control but needing reliable network. Thick client does demanding local computation while using central data, allowing some offline work but increasing endpoint security and cost. Decision depends on charity context.</desc><defs><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="11"/></filter></defs><rect width="1240" height="740" fill="#fff"/><rect x="30" y="28" width="1180" height="661" rx="27" fill="none" stroke="#195b42" stroke-width="14" opacity=".12" filter="url(#glow)"/><rect x="30" y="28" width="1180" height="661" rx="27" fill="#fff" stroke="#e1e1e1" stroke-width="2"/><text x="69" y="91" font-size="40" font-weight="735" fill="#202124" text-anchor="start" font-family="Arial,Helvetica,sans-serif">CONSERVATION CHARITY  ·  EVALUATION</text><text x="70" y="130" font-size="23" font-weight="520" fill="#555" text-anchor="start" font-family="Arial,Helvetica,sans-serif">June 2025 · H446/01 · Q2(b)* · 9 marks · schematic</text><rect x="73" y="178" width="530" height="403" rx="23" fill="#fff" stroke="#d1d5d2" stroke-width="3"/><rect x="642" y="178" width="528" height="403" rx="23" fill="#fff" stroke="#d1d5d2" stroke-width="3"/><text x="338" y="225" font-size="30" font-weight="735" fill="#333" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">THIN CLIENT MODEL</text><text x="906" y="225" font-size="30" font-weight="735" fill="#333" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">THICK CLIENT MODEL</text><rect x="102" y="268" width="180" height="88" rx="12" fill="#fafafa" stroke="#3a3a3a" stroke-width="3"/><text x="191" y="304" font-size="25" font-weight="710" fill="#282828" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">REMOTE</text><text x="191" y="335" font-size="25" font-weight="710" fill="#282828" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">DEVICE</text><rect x="377" y="252" width="188" height="125" rx="14" fill="#f7f7f7" stroke="#303030" stroke-width="3"/><text x="471" y="290" font-size="24" font-weight="700" fill="#292929" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">CENTRAL</text><text x="471" y="324" font-size="24" font-weight="700" fill="#292929" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">SERVER</text><text x="471" y="350" font-size="16" font-weight="530" fill="#195b42" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">VM + shared storage</text><path d="M287 311 H365" fill="none" stroke="#2e3230" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="682" y="267" width="230" height="89" rx="13" fill="#fafafa" stroke="#3a3a3a" stroke-width="3"/><text x="797" y="302" font-size="22" font-weight="710" fill="#292929" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">RESEARCHER'S</text><text x="797" y="332" font-size="24" font-weight="730" fill="#292929" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">COMPUTER</text><rect x="1000" y="267" width="146" height="89" rx="13" fill="#fafafa" stroke="#303030" stroke-width="3"/><text x="1073" y="302" font-size="21" font-weight="715" fill="#292929" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">CENTRAL</text><text x="1073" y="332" font-size="24" font-weight="715" fill="#292929" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">DATA</text><path d="M916 311 H986" fill="none" stroke="#2e3230" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="94" y="405" width="486" height="131" rx="14" fill="#f0f8f3" stroke="#bdd7c5" stroke-width="2"/><text x="113" y="439" font-size="22" font-weight="590" fill="#315541" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Central patching + data control</text><text x="113" y="471" font-size="22" font-weight="590" fill="#315541" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Lower endpoint requirements</text><text x="113" y="503" font-size="22" font-weight="590" fill="#315541" text-anchor="start" font-family="Arial,Helvetica,sans-serif">But network/service dependent</text><rect x="664" y="405" width="484" height="131" rx="14" fill="#f0f8f3" stroke="#bdd7c5" stroke-width="2"/><text x="683" y="439" font-size="22" font-weight="590" fill="#315541" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Powerful local processing</text><text x="683" y="471" font-size="22" font-weight="590" fill="#315541" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Some work possible offline</text><text x="683" y="503" font-size="22" font-weight="590" fill="#315541" text-anchor="start" font-family="Arial,Helvetica,sans-serif">But devices need securing</text><text x="620" y="636" font-size="24" font-weight="640" fill="#195b42" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Choose by bandwidth, confidentiality, processing and support costs.</text><text x="49" y="725" font-size="18" font-weight="470" fill="#666" text-anchor="start" font-family="Arial,Helvetica,sans-serif">RHS ORIGINAL TEACHING IMAGE  ·  NOT OCR EXAM ARTWORK</text></svg>