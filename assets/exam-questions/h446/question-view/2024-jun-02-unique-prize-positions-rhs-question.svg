<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 740" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">RANDOM PRIZES  ·  NO COLLISIONS</title><desc id="svgDesc">Two explicitly illustrative random selections: slot 17 already holds Cache and slot 31 is null. Question shows states but not the required actions; answer reveals retry versus store.</desc><defs><filter id="soft" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="11"/></filter><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L11 6 L0 12 Z" fill="#4d5a50"/></marker></defs><rect width="1240" height="740" fill="#fff"/><rect x="30" y="29" width="1180" height="660" rx="27" fill="none" stroke="#1d5b40" stroke-width="14" opacity=".12" filter="url(#soft)"/><rect x="30" y="29" width="1180" height="660" rx="27" fill="#fff" stroke="#e1e5e1" stroke-width="2"/><text x="63" y="88" fill="#28332b" font-size="37" font-weight="765" font-family="Arial,Helvetica,sans-serif" text-anchor="start">RANDOM PRIZES  ·  NO COLLISIONS</text><text x="64" y="127" fill="#5b675d" font-size="23" font-weight="550" font-family="Arial,Helvetica,sans-serif" text-anchor="start">June 2024 · H446/02 · Q9(b)(iii) · 3 marks · QUESTION VIEW</text><rect x="75" y="178" width="1090" height="108" rx="17" fill="#fff" stroke="#dce2dd" stroke-width="2"/><text x="620" y="225" fill="#2d3c32" font-size="29" font-weight="720" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">Place ten different Cache objects in 50 positions.</text><text x="620" y="263" fill="#68756b" font-size="21" font-weight="540" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">Both example choices are illustrative, not original question data.</text><rect x="85" y="308" width="516" height="299" rx="17" fill="#fff" stroke="#d4ded6" stroke-width="3"/><rect x="637" y="308" width="516" height="299" rx="17" fill="#fff" stroke="#d4ded6" stroke-width="3"/><text x="342" y="350" fill="#2b3c2f" font-size="28" font-weight="730" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">Candidate index 17</text><text x="894" y="350" fill="#2b3c2f" font-size="28" font-weight="730" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">Candidate index 31</text><rect x="143" y="375" width="405" height="96" rx="15" fill="#fff" stroke="#d8e0da" stroke-width="2.5"/><text x="345.5" y="417" fill="#293e30" font-size="26" font-weight="740" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">road[17]</text><text x="345.5" y="460" fill="#55665c" font-size="22" font-weight="620" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">already holds Cache</text><rect x="697" y="375" width="395" height="96" rx="15" fill="#fff" stroke="#d8e0da" stroke-width="2.5"/><text x="894.5" y="417" fill="#293e30" font-size="26" font-weight="740" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">road[31]</text><text x="894.5" y="460" fill="#55665c" font-size="22" font-weight="620" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">currently null</text><rect x="135" y="493" width="423" height="85" rx="13" fill="#f7f9f7" stroke="#dce5dd" stroke-width="2"/><rect x="686" y="493" width="419" height="85" rx="13" fill="#f7f9f7" stroke="#dce5dd" stroke-width="2"/><text x="346" y="544" fill="#829185" font-size="27" font-weight="700" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">What should happen?</text><text x="895" y="544" fill="#829185" font-size="27" font-weight="700" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">What should happen?</text><text x="70" y="659" fill="#5b6b5f" font-size="21" font-weight="560" font-family="Arial,Helvetica,sans-serif" text-anchor="start">Illustrative indexes only  ·  exact random outcomes are not specified.</text><text x="50" y="725" fill="#687069" font-size="17" font-weight="470" font-family="Arial,Helvetica,sans-serif" text-anchor="sta