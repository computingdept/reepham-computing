<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 740" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">BOARD  ·  EXAMINE ONE CELL</title><desc id="svgDesc">Board is 10 rows by 20 columns and holds Artifact objects. Question shows the input and two output needs without giving method sequence; answer reveals getGridItem and public getter logic with empty-category check. Actual seven-mark procedure remains native text.</desc><defs><filter id="soft" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="11"/></filter><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L11 6 L0 12 Z" fill="#4d5a50"/></marker></defs><rect width="1240" height="740" fill="#fff"/><rect x="30" y="29" width="1180" height="660" rx="27" fill="none" stroke="#1d5b40" stroke-width="14" opacity=".12" filter="url(#soft)"/><rect x="30" y="29" width="1180" height="660" rx="27" fill="#fff" stroke="#e1e5e1" stroke-width="2"/><text x="63" y="88" fill="#28332b" font-size="37" font-weight="765" font-family="Arial,Helvetica,sans-serif" text-anchor="start">BOARD  ·  EXAMINE ONE CELL</text><text x="64" y="127" fill="#5b675d" font-size="23" font-weight="550" font-family="Arial,Helvetica,sans-serif" text-anchor="start">June 2023 · H446/02 · Q9(d) · 7 marks · ANSWER REVEAL</text><rect x="70" y="195" width="247" height="170" rx="15" fill="#fff" stroke="#d8e0da" stroke-width="2.5"/><text x="193.5" y="237" fill="#293e30" font-size="26" font-weight="740" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">Input location</text><text x="193.5" y="280" fill="#55665c" font-size="22" font-weight="620" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">row (0–9)</text><text x="193.5" y="314" fill="#55665c" font-size="21" font-weight="570" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">column (0–19)</text><rect x="355" y="195" width="247" height="170" rx="15" fill="#fff" stroke="#d8e0da" stroke-width="2.5"/><text x="478.5" y="237" fill="#293e30" font-size="26" font-weight="740" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">Board object</text><text x="478.5" y="280" fill="#55665c" font-size="22" font-weight="620" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">grid of 10 × 20</text><text x="478.5" y="314" fill="#55665c" font-size="21" font-weight="570" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">Artifact references</text><rect x="640" y="195" width="247" height="170" rx="15" fill="#fff" stroke="#d8e0da" stroke-width="2.5"/><text x="763.5" y="237" fill="#293e30" font-size="26" font-weight="740" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">Select Artifact</text><text x="763.5" y="280" fill="#55665c" font-size="22" font-weight="620" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">getGridItem</text><text x="763.5" y="314" fill="#55665c" font-size="21" font-weight="570" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">(row, column)</text><rect x="925" y="195" width="247" height="170" rx="15" fill="#fff" stroke="#d8e0da" stroke-width="2.5"/><text x="1048.5" y="237" fill="#293e30" font-size="26" font-weight="740" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">Check contents</text><text x="1048.5" y="280" fill="#55665c" font-size="22" font-weight="620" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">getCategory()</text><text x="1048.5" y="314" fill="#55665c" font-size="21" font-weight="570" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">equals &quot;&quot; ?</text><line x1="319" y1="280" x2="347" y2="280" stroke="#4d5a50" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="604" y1="280" x2="632" y2="280" stroke="#4d5a50" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="889" y1="280" x2="917" y2="280" stroke="#4d5a50" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="76" y="423" width="1090" height="180" rx="18" fill="#fff" stroke="#dce3dd" stroke-width="2"/><text x="620" y="462" fill="#58665c" font-size="26" font-weight="665" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">Use public getters; never read private fields directly.</text><rect x="106" y="487" width="486" height="94" rx="15" fill="#fff8c4" stroke="#ebce6d" stroke-width="2.5"/><text x="349" y="529" fill="#293e30" font-size="26" font-weight="740" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">Empty category</text><text x="349" y="572" fill="#55665c" font-size="22" font-weight="620" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">print(&quot;No artifact&quot;)</text><rect x="649" y="487" width="486" height="94" rx="15" fill="#fff8c4" stroke="#ebce6d" stroke-width="2.5"/><text x="892" y="529" fill="#293e30" font-size="26" font-weight="740" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">Artifact exists</text><text x="892" y="572" fill="#55665c" font-size="22" font-weight="620" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">print category and value</text><text x="70" y="659" fill="#5b6b5f" font-size="21" font-weight="560" font-family="Arial,Helvetica,sans-serif" text-anchor="start">Diagram supports, but does not replace, the original seven-mark procedure.</text><text x="50" y="725" fill="#687069" font-size="17" font-weight="470" font-family="Arial,Helvetica,sans-serif" text-anchor="start">RHS ORIGINAL TEACHING DIAGRAM  ·  NOT OCR EXAM ARTWORK</text></svg>