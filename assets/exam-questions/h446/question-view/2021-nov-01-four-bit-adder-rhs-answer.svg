<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc"><title id="title">November 2021 RHS four-bit carry chain worked answer</title><desc id="desc">Four full-adder stages for bits zero through three, from least to most significant. Each full adder is made using two half adders and an OR gate; carry-out of each feeds carry-in of next.</desc><defs><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9"/></filter></defs><rect width="900" height="900" fill="#fff"/><rect x="31" y="30" width="838" height="817" rx="26" fill="none" stroke="#195b42" stroke-width="16" opacity=".16" filter="url(#glow)"/><rect x="31" y="30" width="838" height="817" rx="26" fill="#fff" stroke="#e0e0e0" stroke-width="2"/><g font-family="Arial,Helvetica,sans-serif"><text x="54" y="108" font-size="42" font-weight="750" text-anchor="start" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">FOUR-BIT ADDER · ANSWER</text><text x="52" y="157" font-size="26" font-weight="500" text-anchor="start" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">Each full adder: 2 half adders + OR</text><rect x="50" y="322" width="177" height="184" rx="17" fill="#fff" stroke="#252525" stroke-width="4"/><text x="138" y="380" font-size="30" font-weight="750" text-anchor="middle" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">FULL</text><text x="138" y="421" font-size="30" font-weight="750" text-anchor="middle" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">ADDER</text><text x="138" y="473" font-size="25" font-weight="500" text-anchor="middle" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">bit 0</text><text x="137" y="281" font-size="30" font-weight="750" text-anchor="middle" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">A0 + B0</text><path d="M227 408 H260" stroke="#252525" stroke-width="5"/><text x="234" y="394" font-size="26" font-weight="750" text-anchor="start" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">→</text><rect x="260" y="322" width="177" height="184" rx="17" fill="#fff" stroke="#252525" stroke-width="4"/><text x="348" y="380" font-size="30" font-weight="750" text-anchor="middle" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">FULL</text><text x="348" y="421" font-size="30" font-weight="750" text-anchor="middle" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">ADDER</text><text x="348" y="473" font-size="25" font-weight="500" text-anchor="middle" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">bit 1</text><text x="347" y="281" font-size="30" font-weight="750" text-anchor="middle" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">A1 + B1</text><path d="M437 408 H470" stroke="#252525" stroke-width="5"/><text x="444" y="394" font-size="26" font-weight="750" text-anchor="start" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">→</text><rect x="470" y="322" width="177" height="184" rx="17" fill="#fff" stroke="#252525" stroke-width="4"/><text x="558" y="380" font-size="30" font-weight="750" text-anchor="middle" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">FULL</text><text x="558" y="421" font-size="30" font-weight="750" text-anchor="middle" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">ADDER</text><text x="558" y="473" font-size="25" font-weight="500" text-anchor="middle" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">bit 2</text><text x="557" y="281" font-size="30" font-weight="750" text-anchor="middle" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">A2 + B2</text><path d="M647 408 H680" stroke="#252525" stroke-width="5"/><text x="654" y="394" font-size="26" font-weight="750" text-anchor="start" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">→</text><rect x="680" y="322" width="177" height="184" rx="17" fill="#fff" stroke="#252525" stroke-width="4"/><text x="768" y="380" font-size="30" font-weight="750" text-anchor="middle" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">FULL</text><text x="768" y="421" font-size="30" font-weight="750" text-anchor="middle" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">ADDER</text><text x="768" y="473" font-size="25" font-weight="500" text-anchor="middle" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">bit 3</text><text x="767" y="281" font-size="30" font-weight="750" text-anchor="middle" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">A3 + B3</text><text x="55" y="580" font-size="31" font-weight="750" text-anchor="start" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">Carry-out feeds the next carry-in.</text><text x="55" y="662" font-size="28" font-weight="500" text-anchor="start" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">Start at the least-significant bit (bit 0).</text><text x="55" y="733" font-size="28" font-weight="500" text-anchor="start" fill="#1c1c1e" font-family="Arial,Helvetica,sans-serif">S0, S1, S2, S3 form the four sum bits.</text></g><text x="44" y="886" font-size="18" fill="#656565" font-family="Arial,sans-serif">RHS ORIGINAL PRACTICE · NOT OCR EXAM ARTWORK</text></svg>