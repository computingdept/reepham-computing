<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc"><title id="title">November 2021 RHS customer SQL query answer</title><desc id="desc">SQL answer: SELECT CustomerID, Surname FROM Customer WHERE Title = 'Miss' OR Title = 'Mrs'; Results include 101 Ross and 102 Chen.</desc><defs><filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="9"/></filter></defs><rect width="900" height="900" fill="#fff"/><rect x="32" y="29" width="836" height="819" rx="23" fill="none" stroke="#195b42" stroke-width="16" opacity=".17" filter="url(#glow)"/><rect x="32" y="29" width="836" height="819" rx="23" fill="#fff" stroke="#ddd" stroke-width="2"/><g font-family="Arial,Helvetica,sans-serif"><text x="52" y="106" font-size="43" font-weight="750" fill="#1d1d1f">SQL · MODEL ANSWER</text><text x="53" y="205" fill="#1d1d1f" font-size="30" font-weight="750">SELECT CustomerID, Surname</text><text x="53" y="263" fill="#1d1d1f" font-size="30" font-weight="750">FROM Customer</text><text x="53" y="321" fill="#1d1d1f" font-size="30" font-weight="750">WHERE Title = 'Miss'</text><text x="53" y="379" fill="#1d1d1f" font-size="30" font-weight="750">   OR Title = 'Mrs';</text><text x="53" y="495" fill="#1d1d1f" font-size="31" font-weight="750">RESULT</text><text x="53" y="558" fill="#1d1d1f" font-size="32" font-weight="500">101  Ross</text><text x="53" y="617" fill="#1d1d1f" font-size="32" font-weight="500">102  Chen</text></g><text x="48" y="887" font-family="Arial,sans-serif" font-size="18" fill="#666">RHS ORIGINAL PRACTICE · NOT OCR EXAM ARTWORK</text></svg>