<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 740" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">EXPLORER  ·  UPDATE VALUES</title><desc id="svgDesc">Two labelled illustrative inputs (+3 money, +2 experience); question leaves updated state blank and answer shows mutually exclusive changes, with roadPosition unchanged. The procedure is still assessed as native code.</desc><defs><filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="11"/></filter><marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6.5 L0,13 Z" fill="#49544d"/></marker></defs><rect width="1240" height="740" fill="#fff"/><rect x="30" y="30" width="1180" height="660" rx="28" fill="none" stroke="#244e3a" stroke-width="14" opacity=".13" filter="url(#soft)"/><rect x="30" y="30" width="1180" height="660" rx="28" fill="#fff" stroke="#e2e6e2" stroke-width="2"/><text x="64" y="88" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="770" fill="#28312b" text-anchor="start">EXPLORER  ·  UPDATE VALUES</text><text x="65" y="127" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="520" fill="#59635b" text-anchor="start">June 2024 · H446/02 · Q9(c)(ii) · 5 marks · ANSWER REVEAL</text><rect x="75" y="184" width="1089" height="404" rx="18" fill="#fff" stroke="#d5dcd7" stroke-width="3"/><text x="100" y="226" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="720" fill="#28312b" text-anchor="start">Explorer starts: money = 5   ·   experience = 0   ·   roadPosition = 0</text><rect x="107" y="269" width="507" height="252" rx="16" fill="#fff" stroke="#d9dfda" stroke-width="2"/><rect x="625" y="269" width="507" height="252" rx="16" fill="#fff" stroke="#d9dfda" stroke-width="2"/><text x="361" y="323" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="720" fill="#273d2c" text-anchor="middle">pType = &quot;money&quot;</text><text x="878" y="323" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="720" fill="#273d2c" text-anchor="middle">pType = &quot;experience&quot;</text><text x="361" y="367" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="580" fill="#65736b" text-anchor="middle">pValue = 3  (example)</text><text x="878" y="367" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="580" fill="#65736b" text-anchor="middle">pValue = 2  (example)</text><rect x="149" y="397" width="422" height="83" rx="11" fill="#fff6b0" stroke="#e2cd79" stroke-width="2"/><rect x="665" y="397" width="422" height="83" rx="11" fill="#fff6b0" stroke="#e2cd79" stroke-width="2"/><text x="361" y="450" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="690" fill="#2b523a" text-anchor="middle">money 8 · experience 0</text><text x="876" y="450" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="690" fill="#2b523a" text-anchor="middle">money 5 · experience 2</text><text x="70" y="656" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="550" fill="#606a62" text-anchor="start">Original RHS supporting illustration — not OCR exam artwork</text><text x="50" y="725" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="470" fill="#687069" text-anchor="start">RHS ORIGINAL TEACHING DIAGRAM  ·  NOT OCR EXAM ARTWORK</text></svg>