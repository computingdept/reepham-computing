<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc"><title id="title">November 2021 RHS bounded stack push model answer</title><desc id="desc">Full four-mark pseudocode: input volunteer name; if top less than five then increment top and set names at top to name; endif. No overflow.</desc><defs><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9"/></filter></defs><rect width="900" height="900" fill="#fff"/><rect x="30" y="30" width="840" height="818" rx="27" fill="none" stroke="#195b42" stroke-width="16" opacity=".16" filter="url(#glow)"/><rect x="30" y="30" width="840" height="818" rx="27" fill="#fff" stroke="#e5e5e5" stroke-width="2"/><g font-family="Arial,Helvetica,sans-serif"><text x="60" y="104" font-size="43" font-weight="750" text-anchor="start" fill="#1d1d1f">PUSH · MODEL ANSWER</text><text x="60" y="154" font-size="28" font-weight="500" text-anchor="start" fill="#1d1d1f">Four marking points · six-slot array</text><rect x="68" y="210" width="760" height="84" rx="11" fill="#fff" stroke="#e6e6e6"/><text x="106" y="263" font-size="24" font-weight="700" text-anchor="start" fill="#1d1d1f">01</text><text x="177" y="265" font-size="31" font-weight="650" text-anchor="start" fill="#1d1d1f">name = INPUT("Volunteer:")</text><rect x="68" y="308" width="760" height="84" rx="11" fill="#f7f7f7" stroke="#e6e6e6"/><text x="106" y="361" font-size="24" font-weight="700" text-anchor="start" fill="#1d1d1f">02</text><text x="177" y="363" font-size="31" font-weight="650" text-anchor="start" fill="#1d1d1f">IF top &lt; 5 THEN</text><rect x="68" y="406" width="760" height="84" rx="11" fill="#fff" stroke="#e6e6e6"/><text x="106" y="459" font-size="24" font-weight="700" text-anchor="start" fill="#1d1d1f">03</text><text x="177" y="461" font-size="31" font-weight="650" text-anchor="start" fill="#1d1d1f">    top = top + 1</text><rect x="68" y="504" width="760" height="84" rx="11" fill="#f7f7f7" stroke="#e6e6e6"/><text x="106" y="557" font-size="24" font-weight="700" text-anchor="start" fill="#1d1d1f">04</text><text x="177" y="559" font-size="31" font-weight="650" text-anchor="start" fill="#1d1d1f">    names[top] = name</text><rect x="68" y="602" width="760" height="84" rx="11" fill="#fff" stroke="#e6e6e6"/><text x="106" y="655" font-size="24" font-weight="700" text-anchor="start" fill="#1d1d1f">05</text><text x="177" y="657" font-size="31" font-weight="650" text-anchor="start" fill="#1d1d1f">ENDIF</text><text x="77" y="792" font-size="24" font-weight="600" text-anchor="start" fill="#1d1d1f">Full when top = 5 · never write beyond index 5</text></g><text x="44" y="883" font-family="Arial,sans-serif" font-size="18" fill="#666">RHS ORIGINAL PRACTICE · NOT OCR EXAM ARTWORK</text></svg>