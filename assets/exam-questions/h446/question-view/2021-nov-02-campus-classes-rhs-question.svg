<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc"><title id="title">RHS November 2021 campus inheritance diagram</title><desc id="desc">Venue is base class with private label and floors and public constructor/accessors. Gallery and Workshop inherit Venue. Gallery has entranceFee and opensAt.</desc><defs><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8"/></filter></defs><rect width="900" height="900" fill="#fff"/><rect x="28" y="29" width="844" height="815" rx="25" fill="none" stroke="#195b42" opacity=".16" stroke-width="17" filter="url(#glow)"/><rect x="28" y="29" width="844" height="815" rx="25" fill="white" stroke="#dedede" stroke-width="2"/><text x="53" y="105" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="750" fill="#202124">CAMPUS CLASSES</text><text x="53" y="153" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="500" fill="#202124">Base class and two derived types</text><rect x="275" y="185" width="355" height="245" rx="16" fill="#fff" stroke="#242424" stroke-width="3"/><text x="297" y="235" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="750" fill="#202124">Venue</text><path d="M275 253H630" stroke="#ddd" stroke-width="2"/><text x="295" y="293" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="500" fill="#202124">− label : string</text><text x="295" y="336" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="500" fill="#202124">− floors : integer</text><text x="295" y="379" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="500" fill="#202124">+ new(...) / get...()</text><rect x="65" y="556" width="355" height="188" rx="16" fill="#fff" stroke="#242424" stroke-width="3"/><text x="87" y="606" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="750" fill="#202124">Gallery</text><path d="M65 624H420" stroke="#ddd" stroke-width="2"/><text x="85" y="664" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="500" fill="#202124">− entranceFee : real</text><text x="85" y="707" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="500" fill="#202124">− opensAt : string</text><rect x="486" y="556" width="355" height="188" rx="16" fill="#fff" stroke="#242424" stroke-width="3"/><text x="508" y="606" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="750" fill="#202124">Workshop</text><path d="M486 624H841" stroke="#ddd" stroke-width="2"/><text x="506" y="664" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="500" fill="#202124">inherits Venue</text><path d="M449 432 V495 H242 V550 M449 495 H662 V550" fill="none" stroke="#292929" stroke-width="5"/><path d="M437 449 L449 431 L461 449" fill="#fff" stroke="#292929" stroke-width="3"/><text x="43" y="880" font-family="Arial" font-size="18" fill="#6b6b6b">RHS ORIGINAL PRACTICE · NOT OCR EXAM ARTWORK</text></svg>