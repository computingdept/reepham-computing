<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1540" role="img" aria-labelledby="title desc"><title id="title">Entity relationship diagram — original H446 mobile teaching illustration</title><desc id="desc">Relate students and courses using an enrolment link table. Independently authored artwork, not an OCR paper diagram. Technical symbols are monochrome and school colour is decorative only.</desc><defs><filter id="schoolGlow" x="-70%" y="-80%" width="240%" height="260%"><feGaussianBlur stdDeviation="8"/></filter><marker id="tip" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10 Z" fill="#242424"/></marker></defs><rect width="900" height="1540" fill="#fff"/><g font-family="Inter,Arial,Helvetica,sans-serif"><text x="44" y="67" font-size="21" letter-spacing="2" font-weight="800" fill="#303030">A LEVEL COMPUTER SCIENCE / H446</text><text x="44" y="138" font-size="44" font-weight="800" fill="#171717">Entity relationship diagram</text><text x="44" y="184" font-size="23" fill="#585858">Relate students and courses using an enrolment link table.</text><rect x="36" y="216" width="828" height="1210" rx="27" stroke="#195B42" stroke-width="16" opacity=".15" fill="none" filter="url(#schoolGlow)"/><rect x="36" y="216" width="828" height="1210" rx="27" stroke="#E5E5E5" stroke-width="2" fill="#fff"/><rect x="130" y="316" width="640" height="215" rx="24" stroke="#195B42" stroke-width="16" fill="none" opacity=".43" filter="url(#schoolGlow)"/><rect x="130" y="316" width="640" height="215" rx="24" fill="white" stroke="#E5E5E5" stroke-width="2"/><text x="159" y="371" font-size="31" font-weight="820" text-anchor="start" fill="#242424">STUDENT</text><text x="159" y="430" font-size="25" font-weight="650" text-anchor="start" fill="#242424">StudentID (PK)</text><text x="159" y="468" font-size="25" font-weight="650" text-anchor="start" fill="#242424">Name</text><rect x="130" y="655" width="640" height="215" rx="24" stroke="#195B42" stroke-width="16" fill="none" opacity=".43" filter="url(#schoolGlow)"/><rect x="130" y="655" width="640" height="215" rx="24" fill="white" stroke="#E5E5E5" stroke-width="2"/><text x="159" y="710" font-size="31" font-weight="820" text-anchor="start" fill="#242424">ENROLMENT</text><text x="159" y="769" font-size="25" font-weight="650" text-anchor="start" fill="#242424">EnrolmentID (PK)</text><text x="159" y="807" font-size="25" font-weight="650" text-anchor="start" fill="#242424">StudentID (FK)</text><text x="159" y="845" font-size="25" font-weight="650" text-anchor="start" fill="#242424">CourseID (FK)</text><rect x="130" y="1072" width="640" height="215" rx="24" stroke="#195B42" stroke-width="16" fill="none" opacity=".43" filter="url(#schoolGlow)"/><rect x="130" y="1072" width="640" height="215" rx="24" fill="white" stroke="#E5E5E5" stroke-width="2"/><text x="159" y="1127" font-size="31" font-weight="820" text-anchor="start" fill="#242424">COURSE</text><text x="159" y="1186" font-size="25" font-weight="650" text-anchor="start" fill="#242424">CourseID (PK)</text><text x="159" y="1224" font-size="25" font-weight="650" text-anchor="start" fill="#242424">Title</text><path d="M450 531 L450 655" stroke="#242424" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M450 870 L450 1072" stroke="#242424" stroke-width="4" stroke-linecap="round" fill="none"/><text x="477" y="590" font-size="23" font-weight="780" text-anchor="start" fill="#242424">1 → many</text><text x="477" y="967" font-size="23" font-weight="780" text-anchor="start" fill="#242424">many ← 1</text><text x="76" y="1392" font-size="22" font-weight="740" text-anchor="start" fill="#242424">Enrolment is a junction table between students and courses.</text><text x="46" y="1490" font-size="18" fill="#606060">RHS ORIGINAL TEACHING EXAMPLE · NOT OCR ARTWORK · TEACHER REVIEW PENDING</text></g></svg>
