<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1540" role="img" aria-labelledby="title desc"><title id="title">Circular queue — original H446 portrait teaching diagram</title><desc id="desc">Track the front and rear indexes as they wrap around. Independently drawn RHS example, not the original OCR examination diagram. Black-and-white technical content, with decorative school-colour blurring around each component.</desc><defs><filter id="schoolGlow" x="-70%" y="-80%" width="240%" height="260%"><feGaussianBlur stdDeviation="8"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10 Z" fill="#242424"/></marker></defs><rect width="900" height="1540" fill="#fff"/><g font-family="Inter,Arial,Helvetica,sans-serif"><text x="45" y="68" font-size="22" font-weight="800" letter-spacing="2" fill="#303030">A LEVEL COMPUTER SCIENCE / H446</text><text x="45" y="137" font-size="46" font-weight="800" fill="#161616">Circular queue</text><text x="45" y="183" font-size="23" fill="#5C5C5C">Track the front and rear indexes as they wrap around.</text><rect x="37" y="216" width="826" height="1210" rx="28" stroke="#195B42" stroke-width="17" fill="none" opacity=".17" filter="url(#schoolGlow)"/><rect x="37" y="216" width="826" height="1210" rx="28" stroke="#E5E5E5" stroke-width="2" fill="white"/><path d="M333 401 L400 367" stroke="#242424" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><path d="M504 363 L585 400" stroke="#242424" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><path d="M640 479 L640 759" stroke="#242424" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><path d="M591 843 L510 880" stroke="#242424" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><path d="M407 881 L340 847" stroke="#242424" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><path d="M285 766 L285 486" stroke="#242424" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><circle cx="285" cy="425" r="49" stroke="#195B42" stroke-width="15" fill="none" opacity=".4" filter="url(#schoolGlow)"/><circle cx="285" cy="425" r="49" fill="#fff" stroke="#242424" stroke-width="4"/><text x="285" y="434" font-size="25" font-weight="800" text-anchor="middle" fill="#242424">M</text><text x="285" y="351" font-size="20" font-weight="650" text-anchor="middle" fill="#242424">index 0</text><circle cx="455" cy="340" r="49" stroke="#195B42" stroke-width="15" fill="none" opacity=".4" filter="url(#schoolGlow)"/><circle cx="455" cy="340" r="49" fill="#fff" stroke="#242424" stroke-width="4"/><text x="455" y="349" font-size="25" font-weight="800" text-anchor="middle" fill="#242424">N</text><text x="455" y="266" font-size="20" font-weight="650" text-anchor="middle" fill="#242424">index 1</text><circle cx="640" cy="425" r="49" stroke="#195B42" stroke-width="15" fill="none" opacity=".4" filter="url(#schoolGlow)"/><circle cx="640" cy="425" r="49" fill="#fff" stroke="#242424" stroke-width="4"/><text x="640" y="434" font-size="25" font-weight="800" text-anchor="middle" fill="#242424">·</text><text x="640" y="351" font-size="20" font-weight="650" text-anchor="middle" fill="#242424">index 2</text><circle cx="640" cy="820" r="49" stroke="#195B42" stroke-width="15" fill="none" opacity=".4" filter="url(#schoolGlow)"/><circle cx="640" cy="820" r="49" fill="#fff" stroke="#242424" stroke-width="4"/><text x="640" y="829" font-size="25" font-weight="800" text-anchor="middle" fill="#242424">·</text><text x="640" y="746" font-size="20" font-weight="650" text-anchor="middle" fill="#242424">index 3</text><circle cx="455" cy="905" r="49" stroke="#195B42" stroke-width="15" fill="none" opacity=".4" filter="url(#schoolGlow)"/><circle cx="455" cy="905" r="49" fill="#fff" stroke="#242424" stroke-width="4"/><text x="455" y="914" font-size="25" font-weight="800" text-anchor="middle" fill="#242424">K</text><text x="455" y="831" font-size="20" font-weight="650" text-anchor="middle" fill="#242424">index 4</text><circle cx="285" cy="820" r="49" stroke="#195B42" stroke-width="15" fill="none" opacity=".4" filter="url(#schoolGlow)"/><circle cx="285" cy="820" r="49" fill="#fff" stroke="#242424" stroke-width="4"/><text x="285" y="829" font-size="25" font-weight="800" text-anchor="middle" fill="#242424">L</text><text x="285" y="746" font-size="20" font-weight="650" text-anchor="middle" fill="#242424">index 5</text><text x="78" y="1160" font-size="22" font-weight="750" text-anchor="start" fill="#242424">HEAD = 4 (K)      TAIL = 1 (N)</text><text x="78" y="1194" font-size="22" font-weight="550" text-anchor="start" fill="#242424">Dequeue order: K → L → M → N. Next enqueue uses index 2.</text><text x="78" y="1228" font-size="22" font-weight="550" text-anchor="start" fill="#242424">Tail and head indexes wrap around the fixed-size array.</text><text x="46" y="1492" font-size="18" fill="#606060">RHS INDEPENDENT TEACHING MODEL · NOT OCR ARTWORK · DRAFT / REVIEW REQUIRED</text></g></svg>
