<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Circular queue — original H446 landscape teaching diagram</title><desc id="desc">Track the front and rear indexes as they wrap around. Independently drawn RHS example, not the original OCR examination diagram. Black-and-white technical content, with decorative school-colour blurring around each component.</desc><defs><filter id="schoolGlow" x="-70%" y="-80%" width="240%" height="260%"><feGaussianBlur stdDeviation="8"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10 Z" fill="#242424"/></marker></defs><rect width="1600" height="900" fill="#fff"/><g font-family="Inter,Arial,Helvetica,sans-serif"><text x="72" y="68" font-size="19" font-weight="800" letter-spacing="2" fill="#303030">A LEVEL COMPUTER SCIENCE / H446</text><text x="72" y="137" font-size="56" font-weight="800" fill="#161616">Circular queue</text><text x="74" y="183" font-size="23" fill="#5C5C5C">Track the front and rear indexes as they wrap around.</text><rect x="70" y="215" width="1460" height="611" rx="26" stroke="#195B42" stroke-width="17" fill="none" opacity=".17" filter="url(#schoolGlow)"/><rect x="70" y="215" width="1460" height="611" rx="26" stroke="#E5E5E5" stroke-width="2" fill="white"/><path d="M519 355 L737 335" stroke="#242424" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><path d="M852 335 L1069 355" stroke="#242424" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><path d="M1130 414 L1130 589" stroke="#242424" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><path d="M1076 655 L859 675" stroke="#242424" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><path d="M744 675 L526 655" stroke="#242424" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><path d="M465 596 L465 421" stroke="#242424" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/><circle cx="465" cy="360" r="49" stroke="#195B42" stroke-width="15" fill="none" opacity=".4" filter="url(#schoolGlow)"/><circle cx="465" cy="360" r="49" fill="#fff" stroke="#242424" stroke-width="4"/><text x="465" y="369" font-size="25" font-weight="800" text-anchor="middle" fill="#242424">M</text><text x="465" y="286" font-size="20" font-weight="650" text-anchor="middle" fill="#242424">index 0</text><circle cx="798" cy="330" r="49" stroke="#195B42" stroke-width="15" fill="none" opacity=".4" filter="url(#schoolGlow)"/><circle cx="798" cy="330" r="49" fill="#fff" stroke="#242424" stroke-width="4"/><text x="798" y="339" font-size="25" font-weight="800" text-anchor="middle" fill="#242424">N</text><text x="798" y="256" font-size="20" font-weight="650" text-anchor="middle" fill="#242424">index 1</text><circle cx="1130" cy="360" r="49" stroke="#195B42" stroke-width="15" fill="none" opacity=".4" filter="url(#schoolGlow)"/><circle cx="1130" cy="360" r="49" fill="#fff" stroke="#242424" stroke-width="4"/><text x="1130" y="369" font-size="25" font-weight="800" text-anchor="middle" fill="#242424">·</text><text x="1130" y="286" font-size="20" font-weight="650" text-anchor="middle" fill="#242424">index 2</text><circle cx="1130" cy="650" r="49" stroke="#195B42" stroke-width="15" fill="none" opacity=".4" filter="url(#schoolGlow)"/><circle cx="1130" cy="650" r="49" fill="#fff" stroke="#242424" stroke-width="4"/><text x="1130" y="659" font-size="25" font-weight="800" text-anchor="middle" fill="#242424">·</text><text x="1130" y="576" font-size="20" font-weight="650" text-anchor="middle" fill="#242424">index 3</text><circle cx="798" cy="680" r="49" stroke="#195B42" stroke-width="15" fill="none" opacity=".4" filter="url(#schoolGlow)"/><circle cx="798" cy="680" r="49" fill="#fff" stroke="#242424" stroke-width="4"/><text x="798" y="689" font-size="25" font-weight="800" text-anchor="middle" fill="#242424">K</text><text x="798" y="606" font-size="20" font-weight="650" text-anchor="middle" fill="#242424">index 4</text><circle cx="465" cy="650" r="49" stroke="#195B42" stroke-width="15" fill="none" opacity=".4" filter="url(#schoolGlow)"/><circle cx="465" cy="650" r="49" fill="#fff" stroke="#242424" stroke-width="4"/><text x="465" y="659" font-size="25" font-weight="800" text-anchor="middle" fill="#242424">L</text><text x="465" y="576" font-size="20" font-weight="650" text-anchor="middle" fill="#242424">index 5</text><text x="120" y="766" font-size="22" font-weight="750" text-anchor="start" fill="#242424">HEAD = 4 (K)      TAIL = 1 (N)</text><text x="120" y="800" font-size="22" font-weight="550" text-anchor="start" fill="#242424">Dequeue order: K → L → M → N. Next enqueue uses index 2.</text><text x="120" y="834" font-size="22" font-weight="550" text-anchor="start" fill="#242424">Tail and head indexes wrap around the fixed-size array.</text><text x="77" y="866" font-size="18" fill="#606060">RHS INDEPENDENT TEACHING MODEL · NOT OCR ARTWORK · DRAFT / REVIEW REQUIRED</text></g></svg>
