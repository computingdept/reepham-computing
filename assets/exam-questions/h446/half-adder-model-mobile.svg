<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1620" role="img" aria-labelledby="title desc">
<title id="title">Half adder: mobile worked teaching illustration</title>
<desc id="desc">Portrait independent teaching illustration. The XOR gate produces Sum from binary inputs A and B; the AND gate produces Carry from those same inputs. Worked truth table: 00 yields 00, 01 yields 10, 10 yields 10, 11 yields 01, in Sum Carry order. This is not an OCR exam figure. Coloured halos are decorative.</desc>
<!-- School accent applies only to filtered halos. -->
<style>
 text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#171717}
 .kicker{font-size:23px;font-weight:800;letter-spacing:2px;fill:#242424}
 .title{font-size:54px;font-weight:800}
 .subtitle{font-size:26px;fill:#5C5C5C}
 .ph{font-size:34px;font-weight:800}
 .secondary{font-size:23px;fill:#5C5C5C}
 .gateword{font-size:32px;font-weight:800;text-anchor:middle}
 .wire{fill:none;stroke:#222;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
 .shape{fill:white;stroke:#222;stroke-width:6;stroke-linejoin:round}
 .input{font-size:30px;font-weight:800;text-anchor:middle}
 .out{font-size:29px;font-weight:800}
 .th{font-size:26px;font-weight:800}
 .td{font-size:30px;font-weight:700}
</style>
<defs><filter id="schoolGlow" x="-70%" y="-80%" width="240%" height="260%"><feGaussianBlur stdDeviation="8"/></filter></defs>
<rect width="900" height="1620" fill="white"/>
<text class="kicker" x="45" y="68">H446 / BOOLEAN LOGIC</text>
<text class="title" x="45" y="136">Half adder</text>
<text class="subtitle" x="45" y="178">Two single-bit inputs. Two outputs.</text>

<!-- First card: XOR -->
<rect x="36" y="214" width="828" height="420" rx="28" fill="none" stroke="#195B42" stroke-width="16" opacity=".18" filter="url(#schoolGlow)"/>
<rect x="36" y="214" width="828" height="420" rx="28" fill="white" stroke="#E3E3E3" stroke-width="3"/>
<text class="ph" x="77" y="279">SUM OUTPUT</text>
<text class="secondary" x="78" y="319">XOR is 1 when the inputs differ.</text>
<g class="wire"><path d="M197 393 H450 M197 482 H450 M669 440 H730"/></g>
<g stroke="#195B42" stroke-width="16" opacity=".45" fill="none" filter="url(#schoolGlow)"><rect x="92" y="360" width="105" height="66" rx="12"/><rect x="92" y="449" width="105" height="66" rx="12"/></g>
<g fill="white" stroke="#222" stroke-width="4"><rect x="92" y="360" width="105" height="66" rx="12"/><rect x="92" y="449" width="105" height="66" rx="12"/></g>
<g class="input"><text x="144" y="403">A</text><text x="144" y="492">B</text></g>
<path d="M466 349 Q526 440 466 531 Q593 529 669 440 Q593 351 466 349 Z" fill="none" stroke="#195B42" stroke-width="19" opacity=".47" filter="url(#schoolGlow)"/>
<path d="M443 349 Q502 440 443 531" fill="none" stroke="#195B42" stroke-width="16" opacity=".47" filter="url(#schoolGlow)"/>
<path class="shape" d="M466 349 Q526 440 466 531 Q593 529 669 440 Q593 351 466 349 Z"/>
<path class="wire" d="M443 349 Q502 440 443 531"/>
<text class="gateword" x="570" y="450">XOR</text>
<text class="out" x="738" y="449">S</text>
<text class="secondary" x="77" y="594">S = A XOR B</text>

<!-- Second card: AND -->
<rect x="36" y="672" width="828" height="420" rx="28" fill="none" stroke="#195B42" stroke-width="16" opacity=".18" filter="url(#schoolGlow)"/>
<rect x="36" y="672" width="828" height="420" rx="28" fill="white" stroke="#E3E3E3" stroke-width="3"/>
<text class="ph" x="77" y="737">CARRY OUTPUT</text>
<text class="secondary" x="78" y="777">AND is 1 only when both inputs are 1.</text>
<g class="wire"><path d="M197 853 H449 M197 942 H449 M655 902 H730"/></g>
<g stroke="#195B42" stroke-width="16" opacity=".45" fill="none" filter="url(#schoolGlow)"><rect x="92" y="820" width="105" height="66" rx="12"/><rect x="92" y="909" width="105" height="66" rx="12"/></g>
<g fill="white" stroke="#222" stroke-width="4"><rect x="92" y="820" width="105" height="66" rx="12"/><rect x="92" y="909" width="105" height="66" rx="12"/></g>
<g class="input"><text x="144" y="863">A</text><text x="144" y="952">B</text></g>
<path d="M449 810 H562 A92 92 0 0 1 562 994 H449 Z" fill="none" stroke="#195B42" stroke-width="19" opacity=".47" filter="url(#schoolGlow)"/>
<path class="shape" d="M449 810 H562 A92 92 0 0 1 562 994 H449 Z"/>
<text class="gateword" x="547" y="913">AND</text>
<text class="out" x="737" y="911">C</text>
<text class="secondary" x="77" y="1053">C = A AND B</text>

<!-- Worked table -->
<rect x="36" y="1130" width="828" height="411" rx="28" fill="none" stroke="#195B42" stroke-width="16" opacity=".18" filter="url(#schoolGlow)"/>
<rect x="36" y="1130" width="828" height="411" rx="28" fill="white" stroke="#E3E3E3" stroke-width="3"/>
<text class="ph" x="75" y="1190">WORKED TRUTH TABLE</text>
<text class="secondary" x="76" y="1227">Teacher model / answer reveal</text>
<rect x="71" y="1252" width="756" height="54" rx="10" fill="#F4F4F4"/>
<g class="th"><text x="158" y="1289">A</text><text x="353" y="1289">B</text><text x="550" y="1289">S</text><text x="742" y="1289">C</text></g>
<g stroke="#E3E3E3" stroke-width="2"><path d="M71 1361 H827 M71 1413 H827 M71 1465 H827"/></g>
<g class="td">
 <text x="158" y="1345">0</text><text x="353" y="1345">0</text><text x="550" y="1345">0</text><text x="742" y="1345">0</text>
 <text x="158" y="1397">0</text><text x="353" y="1397">1</text><text x="550" y="1397">1</text><text x="742" y="1397">0</text>
 <text x="158" y="1449">1</text><text x="353" y="1449">0</text><text x="550" y="1449">1</text><text x="742" y="1449">0</text>
 <text x="158" y="1501">1</text><text x="353" y="1501">1</text><text x="550" y="1501">0</text><text x="742" y="1501">1</text>
</g>
<text x="45" y="1589" font-size="20" fill="#5C5C5C">Independent teaching diagram · not the original OCR examination figure</text>
</svg>
