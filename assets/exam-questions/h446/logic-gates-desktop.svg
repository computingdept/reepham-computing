<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Boolean gate circuit — original H446 desktop teaching illustration</title><desc id="desc">A three-input expression using AND and OR. Independently authored artwork, not an OCR paper diagram. Technical symbols are monochrome and school colour is decorative only.</desc><defs><filter id="schoolGlow" x="-70%" y="-80%" width="240%" height="260%"><feGaussianBlur stdDeviation="8"/></filter><marker id="tip" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10 Z" fill="#242424"/></marker></defs><rect width="1600" height="900" fill="#fff"/><g font-family="Inter,Arial,Helvetica,sans-serif"><text x="70" y="67" font-size="19" letter-spacing="2" font-weight="800" fill="#303030">A LEVEL COMPUTER SCIENCE / H446</text><text x="70" y="138" font-size="56" font-weight="800" fill="#171717">Boolean gate circuit</text><text x="73" y="184" font-size="23" fill="#585858">A three-input expression using AND and OR.</text><rect x="70" y="215" width="1460" height="611" rx="26" stroke="#195B42" stroke-width="16" opacity=".15" fill="none" filter="url(#schoolGlow)"/><rect x="70" y="215" width="1460" height="611" rx="26" stroke="#E5E5E5" stroke-width="2" fill="#fff"/><path d="M457 390 H547 A110 110 0 0 1 547 610 H457 Z" stroke="#195B42" stroke-width="16" fill="none" opacity=".43" filter="url(#schoolGlow)"/><path d="M457 390 H547 A110 110 0 0 1 547 610 H457 Z" fill="#fff" stroke="#242424" stroke-width="4"/><path d="M797 418 Q872 522 797 626 Q957 626 1042 522 Q957 418 797 418 Z" stroke="#195B42" stroke-width="16" fill="none" opacity=".43" filter="url(#schoolGlow)"/><path d="M797 418 Q872 522 797 626 Q957 626 1042 522 Q957 418 797 418 Z" fill="#fff" stroke="#242424" stroke-width="4"/><path d="M282 443 L457 443" stroke="#242424" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M282 553 L457 553" stroke="#242424" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M657 500 L824 500" stroke="#242424" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M282 720 L820 590" stroke="#242424" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M1042 522 L1132 522" stroke="#242424" stroke-width="4" stroke-linecap="round" fill="none"/><text x="244" y="453" font-size="26" font-weight="820" text-anchor="start" fill="#242424">A</text><text x="244" y="563" font-size="26" font-weight="820" text-anchor="start" fill="#242424">B</text><text x="244" y="730" font-size="26" font-weight="820" text-anchor="start" fill="#242424">C</text><text x="533" y="510" font-size="23" font-weight="850" text-anchor="start" fill="#242424">AND</text><text x="930" y="534" font-size="23" font-weight="850" text-anchor="start" fill="#242424">OR</text><text x="1150" y="531" font-size="29" font-weight="850" text-anchor="start" fill="#242424">F</text><text x="118" y="780" font-size="22" font-weight="740" text-anchor="start" fill="#242424">F = (A AND B) OR C</text><text x="118" y="815" font-size="22" font-weight="550" text-anchor="start" fill="#242424">The output is 1 if C = 1 or both A and B = 1.</text><text x="77" y="865" font-size="18" fill="#606060">RHS ORIGINAL TEACHING EXAMPLE · NOT OCR ARTWORK · TEACHER REVIEW PENDING</text></g></svg>
