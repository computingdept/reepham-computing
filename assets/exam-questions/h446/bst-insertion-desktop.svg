<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Binary search tree — original H446 landscape teaching diagram</title><desc id="desc">Place and search for values in an ordered binary tree. Independently drawn RHS example, not the original OCR examination diagram. Black-and-white technical content, with decorative school-colour blurring around each component.</desc><defs><filter id="schoolGlow" x="-70%" y="-80%" width="240%" height="260%"><feGaussianBlur stdDeviation="8"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10 Z" fill="#242424"/></marker></defs><rect width="1600" height="900" fill="#fff"/><g font-family="Inter,Arial,Helvetica,sans-serif"><text x="72" y="68" font-size="19" font-weight="800" letter-spacing="2" fill="#303030">A LEVEL COMPUTER SCIENCE / H446</text><text x="72" y="137" font-size="56" font-weight="800" fill="#161616">Binary search tree</text><text x="74" y="183" font-size="23" fill="#5C5C5C">Place and search for values in an ordered binary tree.</text><rect x="70" y="215" width="1460" height="611" rx="26" stroke="#195B42" stroke-width="17" fill="none" opacity=".17" filter="url(#schoolGlow)"/><rect x="70" y="215" width="1460" height="611" rx="26" stroke="#E5E5E5" stroke-width="2" fill="white"/><path d="M762 362 L542 485" stroke="#242424" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M838 362 L1058 485" stroke="#242424" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M466 540 L358 639" stroke="#242424" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M530 540 L638 639" stroke="#242424" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M1070 540 L962 639" stroke="#242424" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M1134 540 L1242 639" stroke="#242424" stroke-width="4" stroke-linecap="round" fill="none"/><ci