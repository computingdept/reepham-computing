<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#285348">
  <meta name="description" content="A large live binary clock for classroom whiteboards: read the hours, minutes and seconds using six binary place values.">
  <title>Binary Time | Synergy Assist</title>
  <link rel="stylesheet" href="/assets/synergy-logo.css?v=20261101-logo1">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d2c24;
      --panel: #1b4538;
      --border: #4a7364;
      --text: #f6fbf8;
      --muted: #c1d6cb;
      --hours: #badfd5;
      --minutes: #78d8ac;
      --seconds: #f7d48b;
      --light-size: clamp(40px, 8.1vh, 78px);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; min-height: 100svh; background: radial-gradient(circle at 50% -20%, #33604f 0, var(--bg) 64%); color: var(--text); font: 16px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 3px solid var(--seconds); outline-offset: 4px; }
    .shell { min-height: 100svh; display: flex; flex-direction: column; }
    .topbar { min-height: 62px; padding: 12px clamp(16px, 3vw, 38px); display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 3px solid #285348; background: #ffffff; color: #30383a; }
    .identity { display: flex; align-items: center; gap: 13px; font-size: .84rem; font-weight: 800; letter-spacing: .1em; color:#30383a; }
    .mark { display: inline-block; flex:none; width: 39px; height: 39px; background: var(--synergy-logo-image) center / contain no-repeat; }
    .back { padding: 8px 10px; border: 1px solid #d5ddda; border-radius: 9px; font-size: .9rem; font-weight: 700; color:#285348; white-space: nowrap; }
    .back:hover { background:#ecf2ef; } .control:hover { background: #ffffff18; }
    main { width: min(100%, 1100px); margin: auto; padding: clamp(12px, 2.3vh, 25px) clamp(14px, 3vw, 32px); display: flex; flex-direction: column; justify-content: center; }
    .intro { text-align: center; }
    h1 { margin: 0; line-height: 1.12; letter-spacing: -.045em; font-size: clamp(2rem, 4.8vw, 3.4rem); }
    .instruction { margin: 8px auto 14px; max-width: 760px; color: var(--muted); font-size: clamp(.9rem, 1.5vw, 1.1rem); }
    .board { background: #173d31ec; border: 1px solid var(--border); border-radius: 22px; padding: clamp(12px, 2.2vh, 22px) clamp(12px, 3vw, 28px); box-shadow: 0 18px 60px #00000029; }
    .grid-head, .bit-row { display: grid; grid-template-columns: minmax(60px, .7fr) repeat(3, minmax(0, 1fr)); align-items: center; justify-items: center; column-gap: clamp(4px, 1.1vw, 14px); }
    .grid-head { margin-bottom: 8px; font-weight: 850; letter-spacing: .075em; font-size: clamp(.73rem, 1.6vw, 1.18rem); }
    .grid-head .weight-name { font-size: clamp(.62rem, 1vw, .82rem); color: var(--muted); text-align: center; letter-spacing: .03em; }
    .grid-head .hour-label { color: var(--hours); }
    .grid-head .minute-label { color: var(--minutes); }
    .grid-head .second-label { color: var(--seconds); }
    .grid-body { display: grid; gap: clamp(4px, .8vh, 9px); }
    .weight { color: #e5f0f7; font: 800 clamp(1.2rem, 3.2vh, 2rem)/1 ui-monospace, SFMono-Regular, Consolas, monospace; font-variant-numeric: tabular-nums; }
    .light { display: grid; place-items: center; width: var(--light-size); height: var(--light-size); border-radius: 50%; border: 3px solid #527967; background: #254b3c; color: #9ab6a7; font: 800 clamp(1rem, 3vh, 1.9rem)/1 ui-monospace, SFMono-Regular, Consolas, monospace; font-variant-numeric: tabular-nums; transition: background-color .14s ease, box-shadow .14s ease, border-color .14s ease; }
    .light.on { border-color: transparent; color: #103127; }
    .light.hours.on { background: var(--hours); box-shadow: 0 0 22px #badfd566; }
    .light.minutes.on { background: var(--minutes); box-shadow: 0 0 22px #78d8ac66; }
    .light.seconds.on { background: var(--seconds); box-shadow: 0 0 22px #f7d48b66; }
    .time-line { display: flex; align-items: center; justify-content: center; min-height: clamp(54px, 10vh, 86px); margin-top: clamp(8px, 1.5vh, 16px); }
    .decimal { margin: 0; font: 850 clamp(2.3rem, 7.4vw, 5.4rem)/1 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .06em; font-variant-numeric: tabular-nums; text-align: center; }
    .decimal.hidden-answer { visibility: hidden; }
    .caption { margin: 3px auto 0; min-height: 20px; color: var(--muted); text-align: center; font-size: .83rem; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 9px; padding: 11px 14px 18px; }
    .control { min-height: 43px; min-width: 132px; border: 1px solid #739988; color: var(--text); background: #265546; border-radius: 10px; padding: 9px 15px; font-weight: 750; }
    .control.primary { background: #347b5f; border-color: #80bd9d; }
    .control.primary:hover { background: #438f6e; }
    .state { min-width: 98px; text-align: center; font-size: .85rem; color: #a9e7c5; font-weight: 800; }
    .state.frozen { color: var(--seconds); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-height: 750px) and (min-width: 660px) {
      .topbar { min-height: 52px; padding-top: 7px; padding-bottom: 7px; }
      h1 { font-size: clamp(1.6rem, 4vh, 2.3rem); }
      .instruction { margin: 4px auto 8px; }
      .board { padding-top: 10px; padding-bottom: 10px; }
      .controls { padding-top: 7px; padding-bottom: 9px; }
    }
    @media (max-width: 560px) {
      :root { --light-size: clamp(37px, 10.2vw, 60px); }
      .identity { font-size: .71rem; letter-spacing: .055em; gap: 8px; }
      .mark { width: 31px; height: 31px; }
      .topbar { min-height: 54px; }
      .back { font-size: .8rem; }
      .board { border-radius: 14px; }
      .grid-head, .bit-row { grid-template-columns: minmax(43px, .55fr) repeat(3, minmax(0, 1fr)); }
      .grid-head { font-size: .72rem; letter-spacing: .01em; }
      .grid-head .weight-name { font-size: .55rem; }
      .weight { font-size: 1.1rem; }
      .light { border-width: 2px; font-size: 1.2rem; }
      .controls { gap: 7px; }
      .control { flex: 1 1 140px; min-width: 0; font-size: .85rem; }
      .state { width: 100%; order: -1; }
    }
    @media (prefers-reduced-motion: reduce) { .light { transition: none; } }
    @media print { body { background: white; color: black; } .topbar, .controls { display:none; } .board { box-shadow:none; background:white; } .weight, .light { color:black; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="back" href="/" aria-label="Return to the Learning Hub">⌂ Learning Hub</a>
      <div class="identity"><span>SYNERGY ASSIST</span><span class="mark" aria-hidden="true"></span></div>
    </header>
    <main>
      <div class="intro">
        <h1>Binary Time</h1>
        <p class="instruction">Each lit circle is a <strong>1</strong>. Add the values of the lit circles in each column to read the time.</p>
      </div>
      <section class="board" aria-label="Synergy Assist live binary clock in hours, minutes and seconds">
        <div class="grid-head" aria-hidden="true">
          <span class="weight-name">BIT VALUE</span>
          <span class="hour-label">HOURS</span>
          <span class="minute-label">MINUTES</span>
          <span class="second-label">SECONDS</span>
        </div>
        <div class="grid-body" id="bit-grid" aria-hidden="true"></div>
        <div class="time-line">
          <p id="decimal-time" class="decimal">--:--:--</p>
        </div>
        <p id="answer-caption" class="caption">24-hour time · based on your device's clock</p>
        <p class="sr-only" id="accessible-time">Waiting for clock</p>
      </section>
    </main>
    <footer class="controls" aria-label="Clock controls">
      <button type="button" class="control primary" id="answer-toggle" aria-pressed="false">Hide time</button>
      <button type="button" class="control" id="freeze-toggle" aria-pressed="false">Freeze</button>
      <button type="button" class="control" id="fullscreen-toggle">⛶ Full screen</button>
      <span id="clock-state" class="state" role="status">● LIVE</span>
    </footer>
  </div>
  <script>
    (function () {
      'use strict';
      const weights = [32, 16, 8, 4, 2, 1];
      const parts = ['hours', 'minutes', 'seconds'];
      const grid = document.getElementById('bit-grid');
      const decimal = document.getElementById('decimal-time');
      const caption = document.getElementById('answer-caption');
      const accessible = document.getElementById('accessible-time');
      const answerToggle = document.getElementById('answer-toggle');
      const freezeToggle = document.getElementById('freeze-toggle');
      const fullscreenToggle = document.getElementById('fullscreen-toggle');
      const clockState = document.getElementById('clock-state');
      const lights = { hours: [], minutes: [], seconds: [] };
      let frozen = false;
      let frozenAt = null;
      let hiddenAnswer = false;
      let timeoutId = null;

      weights.forEach(function (weight) {
        const row = document.createElement('div');
        row.className = 'bit-row';
        const label = document.createElement('span');
        label.className = 'weight';
        label.textContent = weight;
        row.appendChild(label);
        parts.forEach(function (part) {
          const led = document.createElement('div');
          led.className = 'light ' + part;
          led.textContent = '0';
          row.appendChild(led);
          lights[part].push({ element: led, weight: weight });
        });
        grid.appendChild(row);
      });

      function pad(number) { return String(number).padStart(2, '0'); }
      function display(time) {
        const values = { hours: time.getHours(), minutes: time.getMinutes(), seconds: time.getSeconds() };
        parts.forEach(function (part) {
          lights[part].forEach(function (item) {
            const on = (values[part] & item.weight) !== 0;
            item.element.classList.toggle('on', on);
            item.element.textContent = on ? '1' : '0';
          });
        });
        const value = pad(values.hours) + ':' + pad(values.minutes) + ':' + pad(values.seconds);
        decimal.textContent = value;
        accessible.textContent = hiddenAnswer ? 'Time answer hidden. Six bits each for hours, minutes and seconds.' : 'Time ' + value;
      }

      function tick() {
        window.clearTimeout(timeoutId);
        display(frozen ? frozenAt : new Date());
        if (!frozen) {
          timeoutId = window.setTimeout(tick, Math.max(50, 1000 - (Date.now() % 1000) + 12));
        }
      }

      answerToggle.addEventListener('click', function () {
        hiddenAnswer = !hiddenAnswer;
        decimal.classList.toggle('hidden-answer', hiddenAnswer);
        answerToggle.textContent = hiddenAnswer ? 'Show time' : 'Hide time';
        answerToggle.setAttribute('aria-pressed', String(hiddenAnswer));
        caption.textContent = hiddenAnswer ? 'Challenge: add the lit bit values to decode the time.' : "24-hour time · based on your device's clock";
        tick();
      });

      freezeToggle.addEventListener('click', function () {
        frozen = !frozen;
        frozenAt = frozen ? new Date() : null;
        freezeToggle.textContent = frozen ? 'Resume live' : 'Freeze';
        freezeToggle.setAttribute('aria-pressed', String(frozen));
        clockState.textContent = frozen ? '❚❚ FROZEN' : '● LIVE';
        clockState.classList.toggle('frozen', frozen);
        tick();
      });

      async function toggleFullscreen() {
        try {
          if (document.fullscreenElement) {
            await document.exitFullscreen();
          } else if (document.documentElement.requestFullscreen) {
            await document.documentElement.requestFullscreen();
          }
        } catch (error) {
          fullscreenToggle.textContent = 'Use F11 for full screen';
        }
      }
      fullscreenToggle.addEventListener('click', toggleFullscreen);
      document.addEventListener('fullscreenchange', function () {
        fullscreenToggle.textContent = document.fullscreenElement ? '⤢ Exit full screen' : '⛶ Full screen';
      });
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden && !frozen) tick();
      });
      window.addEventListener('pageshow', function () { if (!frozen) tick(); });
      document.addEventListener('keydown', function (event) {
        if (event.altKey || event.ctrlKey || event.metaKey || event.repeat) return;
        if (event.target && ['BUTTON', 'A', 'INPUT'].includes(event.target.tagName)) return;
        if (event.key.toLowerCase() === 'h') answerToggle.click();
        if (event.key.toLowerCase() === 'f') toggleFullscreen();
        if (event.code === 'Space') { event.preventDefault(); freezeToggle.click(); }
      });
      if (!document.fullscreenEnabled) fullscreenToggle.title = 'If unavailable, press F11 for browser full screen';
      tick();
    }());
  </script>
</body>
</html>
