<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7f5">
  <meta name="description" content="Synergy Assist classroom clock. Live binary and analogue time with a clear whiteboard display and an optional challenge mode.">
  <title>Binary Time | Synergy Assist</title>
  <link rel="stylesheet" href="/assets/synergy-logo.css?v=20261101-logo1">
  <style>
    :root {
      color-scheme: light;
      --canvas:#f4f7f5;
      --paper:#ffffff;
      --ink:#23463b;
      --muted:#6b7e73;
      --line:#dce5de;
      --sage:#285348;
      --mint:#a9d5c3;
      --soft-sage:#588e77;
      --gold:#e6c88b;
      --lamp:clamp(41px,9vh,89px);
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;min-height:100svh;background:var(--canvas);font:16px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}
    button,a{font:inherit;-webkit-tap-highlight-color:transparent}
    button{cursor:pointer}
    :focus-visible{outline:3px solid #b18a44;outline-offset:3px}
    .app{min-height:100svh;display:flex;flex-direction:column}
    .sitebar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:51px;padding:8px clamp(13px,2.6vw,33px);border-bottom:1px solid #dce5de;background:#ffffffee}
    .back{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:5px 8px;color:var(--sage);border-radius:7px;text-decoration:none;font-weight:700;font-size:.89rem}
    .back:hover{background:#edf3ef}
    .back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .mini-brand{display:inline-flex;align-items:center;gap:8px;font-size:.67rem;font-weight:800;letter-spacing:.17em;color:#75887a}
    .mini-mark{display:block;width:26px;height:26px;background:var(--synergy-logo-image) center / contain no-repeat}
    .stage{flex:1;width:min(100%,1480px);padding:clamp(13px,2vh,25px) clamp(13px,3.2vw,54px) 9px;margin:auto;display:flex;align-items:center;justify-content:center}
    .clock-layout{width:100%;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.9fr);align-items:center;gap:clamp(16px,3.6vw,64px)}
    .binary{min-width:0}
    .binary-top{display:grid;grid-template-columns:minmax(64px,.57fr) repeat(3,minmax(0,1fr));gap:clamp(4px,.7vw,10px);align-items:end;text-align:center;padding-bottom:clamp(7px,1.5vh,13px)}
    .binary-top span{font-size:clamp(.74rem,1.2vw,1.04rem);font-weight:850;letter-spacing:.06em}
    .binary-top .weight-name{font-size:.65rem;color:#809187;letter-spacing:.06em}
    .binary-top .hours{color:#3b7864}
    .binary-top .minutes{color:#285348}
    .binary-top .seconds{color:#a27b36}
    .binary-rows{display:grid;gap:clamp(5px,.9vh,11px)}
    .bit-row{display:grid;grid-template-columns:minmax(64px,.57fr) repeat(3,minmax(0,1fr));align-items:center;justify-items:center;gap:clamp(4px,.7vw,10px)}
    .weight{font:800 clamp(1.32rem,2.9vh,2.1rem)/1 ui-monospace,SFMono-Regular,Consolas,monospace;color:#446256;font-variant-numeric:tabular-nums}
    .lamp{display:grid;place-items:center;width:var(--lamp);height:var(--lamp);border:2px solid #dce5df;border-radius:50%;background:#eff3f0;color:#a0aea5;font:750 clamp(1.03rem,2.8vh,2rem)/1 ui-monospace,SFMono-Regular,Consolas,monospace;transition:background .2s ease,border-color .2s ease;color:#95a89b;font-variant-numeric:tabular-nums}
    .lamp.on{border-color:transparent;color:#173a2d}
    .lamp.hours.on{background:var(--mint);box-shadow:0 2px 10px #a9d5c34a}
    .lamp.minutes.on{background:var(--soft-sage);color:#fff;box-shadow:0 2px 10px #588e7740}
    .lamp.seconds.on{background:var(--gold);box-shadow:0 2px 10px #e6c88b55}
    .analogue-panel{display:flex;flex-direction:column;align-items:center;min-width:0}
    .watch{position:relative;display:block;width:min(100%,min(40vw,485px),62vh);aspect-ratio:1;border-radius:50%;filter:drop-shadow(0 16px 22px #244b3721);background:#fdfefb}
    .watch svg{display:block;width:100%;height:100%;overflow:visible}
    .dial-mark{fill:#fdfefa;stroke:#d6ded4;stroke-width:5}
    .dial-inner{fill:none;stroke:#e7ede7;stroke-width:2}
    .tick{stroke:#577364;stroke-width:2.2;stroke-linecap:round}
    .tick.major{stroke:#285348;stroke-width:4}
    .hour-text{font:650 28px/1 Georgia,serif;fill:#285348;text-anchor:middle}
    .dial-brand{position:absolute;z-index:2;top:23%;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:1px;pointer-events:none;width:40%;text-align:center}
    .dial-emblem{width:clamp(18px,2.15vw,29px);height:clamp(18px,2.15vw,29px);background:var(--synergy-logo-image) center / contain no-repeat;opacity:.8}
    .dial-brand-name{font:700 clamp(9px,1vw,13px)/1.1 Georgia,"Times New Roman",serif;letter-spacing:.14em;white-space:nowrap;color:#315c48}
    .dial-brand-sub{font:650 clamp(6px,.65vw,9px)/1.1 system-ui,sans-serif;letter-spacing:.2em;color:#87978a}
    .watch-model{position:absolute;left:50%;top:71%;transform:translate(-50%,-50%);color:#87998d;white-space:nowrap;letter-spacing:.16em;font:750 clamp(7px,.66vw,10px)/1.4 system-ui,sans-serif}
    .hour-hand{stroke:#24483a;stroke-width:11;stroke-linecap:round}
    .minute-hand{stroke:#24483a;stroke-width:7;stroke-linecap:round}
    .second-hand{stroke:#b18a45;stroke-width:2.5;stroke-linecap:round}
    .hand-hub{fill:#315d4a;stroke:#fdfefa;stroke-width:3}
    .readout{margin:clamp(10px,2vh,22px) 0 0;text-align:center;font:720 clamp(1.7rem,3.3vw,3.25rem)/1.1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.04em;color:#2d5141;font-variant-numeric:tabular-nums}
    .readout.hidden-answer{visibility:hidden}
    .state-line{height:20px;margin:5px 0 0;font-size:.76rem;letter-spacing:.1em;font-weight:750;color:#718679;text-align:center}
    .state-line.frozen{color:#9b743b}
    .challenge .clock-layout{grid-template-columns:1fr}
    .challenge .analogue-panel{display:none}
    .challenge .binary{width:min(100%,810px);margin:auto}
    .challenge .lamp{width:clamp(52px,10vh,102px);height:clamp(52px,10vh,102px)}
    .settings{align-self:stretch;padding:1px clamp(13px,2.6vw,33px) 11px}
    .settings details{max-width:900px;margin:auto;text-align:center}
    .settings summary{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:5px 15px;border-radius:9px;font-size:.81rem;font-weight:700;color:#61796a;cursor:pointer;list-style:none}
    .settings summary::-webkit-details-marker{display:none}
    .settings summary::after{content:"⌄";margin-left:8px;font-size:1rem}
    .settings details[open] summary::after{content:"⌃"}
    .settings summary:hover{background:#e8f0e9}
    .control-bar{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;padding:10px 4px 5px}
    .control{min-height:42px;border:1px solid #cbdad0;border-radius:9px;padding:8px 14px;background:white;color:var(--sage);font-weight:750}
    .control:hover{background:#eaf2ed}
    .control[aria-pressed="true"]{border-color:#4a8469;background:#e2efe6}
    .settings-tip{margin:4px 0 0;color:#84958a;font-size:.73rem}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media (max-height:700px) and (min-width:780px){
      :root{--lamp:clamp(39px,7.4vh,68px)}
      .stage{padding-top:7px;padding-bottom:5px}
      .watch{width:min(100%,48vh)}
      .readout{margin-top:8px}
      .sitebar{min-height:44px}
    }
    @media (max-width:779px){
      :root{--lamp:clamp(38px,11vw,60px)}
      .clock-layout{grid-template-columns:1fr;gap:25px;max-width:680px;margin:auto}
      .stage{align-items:flex-start}
      .analogue-panel{margin-bottom:8px}
      .watch{width:min(66vw,350px)}
      .binary-top,.bit-row{grid-template-columns:minmax(45px,.48fr) repeat(3,minmax(0,1fr));gap:4px}
      .weight{font-size:clamp(1.1rem,4vw,1.55rem)}
      .binary-top span{font-size:clamp(.7rem,2.6vw,.95rem)}
      .binary-top .weight-name{font-size:.57rem}
      .readout{font-size:2.1rem;margin-top:12px}
      .mini-brand{font-size:.6rem}
      .challenge .lamp{width:clamp(41px,12vw,65px);height:clamp(41px,12vw,65px)}
      .dial-brand-name{font-size:clamp(8px,1.9vw,12px)}
      .dial-brand-sub{font-size:clamp(6px,1.25vw,9px)}
      .dial-emblem{width:clamp(18px,4vw,25px);height:clamp(18px,4vw,25px)}
    }
    @media (prefers-reduced-motion:reduce){.lamp{transition:none}}
    @media print{.sitebar,.settings{display:none!important}.stage{padding:0}.watch{filter:none}}
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="sitebar">
      <a id="back" class="back" href="/" aria-label="Back to Learning Hub">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 18-6-6 6-6"/></svg>
        <span id="back-text">Learning Hub</span>
      </a>
      <div class="mini-brand"><span>SYNERGY ASSIST</span><span class="mini-mark" aria-hidden="true"></span></div>
    </header>
    <main class="stage">
      <div class="clock-layout">
        <section class="binary" aria-label="Binary clock">
          <div class="binary-top" aria-hidden="true">
            <span class="weight-name">VALUE</span>
            <span class="hours">HOURS</span>
            <span class="minutes">MINUTES</span>
            <span class="seconds">SECONDS</span>
          </div>
          <div class="binary-rows" id="bit-grid" aria-hidden="true"></div>
        </section>
        <section class="analogue-panel" id="analogue" aria-label="Live analogue clock with Synergy Assist watch face">
          <div class="watch">
            <svg viewBox="0 0 400 400" role="img" aria-label="Analogue clock face with hour, minute and second hands">
              <circle cx="200" cy="200" r="191" fill="#e9eeea" stroke="#c5d3c7" stroke-width="2"/>
              <circle class="dial-mark" cx="200" cy="200" r="181"/>
              <circle class="dial-inner" cx="200" cy="200" r="162"/>
              <g id="ticks"></g>
              <text class="hour-text" x="200" y="81">12</text>
              <text class="hour-text" x="325" y="210">3</text>
              <text class="hour-text" x="200" y="341">6</text>
              <text class="hour-text" x="74" y="210">9</text>
              <g id="hour-hand" transform="rotate(0 200 200)"><line class="hour-hand" x1="200" y1="220" x2="200" y2="127"/></g>
              <g id="minute-hand" transform="rotate(0 200 200)"><line class="minute-hand" x1="200" y1="224" x2="200" y2="102"/></g>
              <g id="second-hand" transform="rotate(0 200 200)"><line class="second-hand" x1="200" y1="237" x2="200" y2="91"/></g>
              <circle class="hand-hub" cx="200" cy="200" r="8"/>
            </svg>
            <div class="dial-brand" aria-hidden="true">
              <span class="dial-emblem"></span>
              <span class="dial-brand-name">SYNERGY</span>
              <span class="dial-brand-sub">ASSIST</span>
            </div>
            <span class="watch-model" aria-hidden="true">BINARY TIME · 24H</span>
          </div>
          <p class="readout" id="decimal-time">--:--:--</p>
          <p class="state-line" id="clock-state" role="status">LIVE</p>
        </section>
      </div>
      <p class="sr-only" id="accessible-time" aria-live="off">Clock loading</p>
    </main>
    <footer class="settings">
      <details id="settings-panel">
        <summary>Clock controls</summary>
        <div class="control-bar">
          <button type="button" class="control" id="answer-toggle" aria-pressed="false">Hide digital time</button>
          <button type="button" class="control" id="challenge-toggle" aria-pressed="false">Challenge: binary only</button>
          <button type="button" class="control" id="freeze-toggle" aria-pressed="false">Freeze</button>
          <button type="button" class="control" id="fullscreen-toggle">Full screen</button>
        </div>
        <p class="settings-tip">H: hide time · C: challenge · Space: freeze · F: full screen</p>
      </details>
    </footer>
  </div>
  <script>
    (function(){
      'use strict';
      const weights=[32,16,8,4,2,1];
      const parts=['hours','minutes','seconds'];
      const svgNS='http://www.w3.org/2000/svg';
      const grid=document.getElementById('bit-grid');
      const ticks=document.getElementById('ticks');
      const clockState=document.getElementById('clock-state');
      const decimal=document.getElementById('decimal-time');
      const accessible=document.getElementById('accessible-time');
      const app=document.getElementById('app');
      const answerToggle=document.getElementById('answer-toggle');
      const challengeToggle=document.getElementById('challenge-toggle');
      const freezeToggle=document.getElementById('freeze-toggle');
      const fullscreenToggle=document.getElementById('fullscreen-toggle');
      const lights={hours:[],minutes:[],seconds:[]};
      let frozenAt=null, hiddenAnswer=false, challenge=false, timerId=null;

      // Return link preserves the exact lesson section from which SA was opened.
      const from=new URLSearchParams(location.search).get('from');
      if(from && /^\/(?!\/)/.test(from)){
        const url=new URL(from,location.origin);
        if(url.origin===location.origin && url.pathname!=='/binary-clock.html'){
          const back=document.getElementById('back');
          back.href=url.pathname+url.search+url.hash;
          const label=/^\/lessons\//.test(url.pathname)?'Back to lesson':/^\/revision\//.test(url.pathname)?'Back to practice':'Back to hub';
          document.getElementById('back-text').textContent=label;
          back.setAttribute('aria-label',label);
        }
      }

      for(const weight of weights){
        const row=document.createElement('div');
        row.className='bit-row';
        const value=document.createElement('span');
        value.className='weight';
        value.textContent=weight;
        row.append(value);
        for(const part of parts){
          const light=document.createElement('span');
          light.className='lamp '+part;
          light.textContent='0';
          row.append(light);
          lights[part].push({light,weight});
        }
        grid.append(row);
      }

      // Sixty precisely spaced watch markers; hour markers are heavier.
      for(let i=0;i<60;i++){
        const major=i%5===0;
        const angle=i*Math.PI/30;
        const radiusOuter=160, radiusInner=major?144:153;
        const line=document.createElementNS(svgNS,'line');
        line.setAttribute('x1',String(200+radiusInner*Math.sin(angle)));
        line.setAttribute('y1',String(200-radiusInner*Math.cos(angle)));
        line.setAttribute('x2',String(200+radiusOuter*Math.sin(angle)));
        line.setAttribute('y2',String(200-radiusOuter*Math.cos(angle)));
        line.setAttribute('class',major?'tick major':'tick');
        ticks.append(line);
      }

      function pad(number){return String(number).padStart(2,'0')}
      function render(){
        const time=frozenAt||new Date();
        const hours=time.getHours(),minutes=time.getMinutes(),seconds=time.getSeconds();
        const values={hours,minutes,seconds};
        for(const part of parts){
          for(const entry of lights[part]){
            const lit=(values[part]&entry.weight)!==0;
            entry.light.classList.toggle('on',lit);
            entry.light.textContent=lit?'1':'0';
          }
        }
        document.getElementById('hour-hand').setAttribute('transform','rotate('+((hours%12+minutes/60)*30)+' 200 200)');
        document.getElementById('minute-hand').setAttribute('transform','rotate('+((minutes+seconds/60)*6)+' 200 200)');
        document.getElementById('second-hand').setAttribute('transform','rotate('+(seconds*6)+' 200 200)');
        const value=pad(hours)+':'+pad(minutes)+':'+pad(seconds);
        decimal.textContent=value;
        accessible.textContent=challenge||hiddenAnswer?'Binary time is displayed; digital answer hidden.':'Time '+value;
        clockState.textContent=frozenAt?'PAUSED':'LIVE';
        clockState.classList.toggle('frozen',Boolean(frozenAt));
      }
      function tick(){
        clearTimeout(timerId);
        render();
        if(!frozenAt)timerId=setTimeout(tick,Math.max(50,1000-Date.now()%1000+12));
      }
      function updateAnswer(){
        decimal.classList.toggle('hidden-answer',hiddenAnswer);
        answerToggle.setAttribute('aria-pressed',String(hiddenAnswer));
        answerToggle.textContent=hiddenAnswer?'Show digital time':'Hide digital time';
      }
      answerToggle.addEventListener('click',function(){
        hiddenAnswer=!hiddenAnswer;
        updateAnswer();
        render();
      });
      challengeToggle.addEventListener('click',function(){
        challenge=!challenge;
        app.classList.toggle('challenge',challenge);
        challengeToggle.setAttribute('aria-pressed',String(challenge));
        challengeToggle.textContent=challenge?'Show analogue clock':'Challenge: binary only';
        render();
      });
      freezeToggle.addEventListener('click',function(){
        frozenAt=frozenAt?null:new Date();
        freezeToggle.setAttribute('aria-pressed',String(Boolean(frozenAt)));
        freezeToggle.textContent=frozenAt?'Resume live':'Freeze';
        tick();
      });
      async function toggleFullscreen(){
        try {
          if(document.fullscreenElement)await document.exitFullscreen();
          else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();
        }catch(error){
          fullscreenToggle.textContent='Use F11 for full screen';
        }
      }
      fullscreenToggle.addEventListener('click',toggleFullscreen);
      document.addEventListener('fullscreenchange',function(){
        fullscreenToggle.textContent=document.fullscreenElement?'Exit full screen':'Full screen';
      });
      document.addEventListener('visibilitychange',function(){
        if(!document.hidden&&!frozenAt)tick();
      });
      document.addEventListener('keydown',function(event){
        if(event.altKey||event.metaKey||event.ctrlKey||event.repeat)return;
        if(event.target && ['BUTTON','A','SUMMARY','INPUT'].includes(event.target.tagName))return;
        const key=event.key.toLowerCase();
        if(key==='h')answerToggle.click();
        if(key==='c')challengeToggle.click();
        if(key==='f')toggleFullscreen();
        if(event.code==='Space'){event.preventDefault();freezeToggle.click()}
      });
      tick();
    }());
  </script>
<script src="/assets/site-analytics.js" defer></script>
</body>
</html>
