name: Shared Do Now authoring contract

on:
  pull_request:
    paths:
      - 'data/do-now/**'
      - 'scripts/do-now/**'
      - 'tests/do-now-standard.test.cjs'
      - 'tests/do-now-q1-drafts.test.cjs'
      - 'docs/do-now-central-standard.md'
      - '.github/workflows/shared-donow-standard.yml'
  push:
    branches: [main]
    paths:
      - 'data/do-now/**'
      - 'scripts/do-now/**'
      - 'tests/do-now-standard.test.cjs'
      - 'tests/do-now-q1-drafts.test.cjs'
      - '.github/workflows/shared-donow-standard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and unit tests
        run: |
          node --check scripts/do-now/collect-legacy.cjs
          node --check scripts/do-now/validate-standard.cjs
          node --check scripts/do-now/validate-q1-drafts.cjs
          node --test tests/do-now-standard.test.cjs tests/do-now-q1-drafts.test.cjs
      - name: Check all three pilot banks against shared contract
        run: node scripts/do-now/validate-standard.cjs
      - name: Validate staged Q1 True or False rewrites against legacy sources
        run: node scripts/do-now/validate-q1-drafts.cjs
      - name: Verify legacy extraction remains reproducible
        run: node scripts/do-now/collect-legacy.cjs --check
