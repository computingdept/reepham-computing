name: J277 Paper 1 PDF.js visual mobile review
on:
  push:
    branches: [review/j277-paper1-v3-20261028]
    paths:
      - 'tools/revision/j277_paper1_pdfjs_viewport_qa.cjs'
      - '.github/workflows/j277-paper1-v3-pdfjs-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdfjs-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDF.js and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 pdfjs-dist@4.10.38
          npx playwright install --with-deps chromium
      - name: Render four real PDF pages in each viewport
        run: node tools/revision/j277_paper1_pdfjs_viewport_qa.cjs
      - name: Keep rendered phone/TV QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j277-paper1-pdfjs-mobile-review
          path: |
            review/j277-paper1-v3-20261028/verified/pdfjs-*.png
            review/j277-paper1-v3-20261028/verified/PDFJS_QA.json
