name: Special J277 H446 assessments browser audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'qa/master-audit-2026/nonstandard-assessment-regression.cjs'
      - 'lessons/j277/year11-assessment.js'
      - 'lessons/j277/year11-assessment.css'
      - 'lessons/j277/autumn2-rebuilt.js'
      - 'lessons/h446/lesson-036/index.html'
      - '.github/workflows/nonstandard-assessment-audit.yml'
permissions:
  contents: read
jobs:
  assessment-screens:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test student paper, teacher mark scheme and mobile layouts
        env:
          QA_REPORT: 'qa-output/nonstandard-assessment-report.json'
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/rhsc-assessment-audit.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          node qa/master-audit-2026/nonstandard-assessment-regression.cjs
      - name: Upload detailed browser survey
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nonstandard-assessment-browser-report
          path: qa-output/nonstandard-assessment-report.json
          if-no-files-found: warn
