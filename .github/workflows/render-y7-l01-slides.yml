name: Render Year 7 Lesson 1 slide preview

on:
  push:
    paths:
      - 'lessons/year7/year7-lesson-upload/Y7-L01-slides.pptx'
      - '.github/workflows/render-y7-l01-slides.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Install slide rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils

      - name: Render PowerPoint to slide images
        run: |
          set -e
          SRC="lessons/year7/year7-lesson-upload/Y7-L01-slides.pptx"
          OUT="lessons/year7/year7-lesson-upload/Y7-L01-preview"
          TMP="/tmp/y7-l01-preview"
          rm -rf "$TMP"
          mkdir -p "$TMP" "$OUT"
          rm -f "$OUT"/slide-*.png

          libreoffice --headless --nologo --nolockcheck             --convert-to pdf --outdir "$TMP" "$SRC"

          PDF="$TMP/Y7-L01-slides.pdf"
          pdftoppm -png -r 145 "$PDF" "$TMP/slide"

          n=1
          for file in "$TMP"/slide-*.png; do
            printf -v target "%s/slide-%02d.png" "$OUT" "$n"
            mv "$file" "$target"
            n=$((n+1))
          done

      - name: Commit generated preview images
        run: |
          if git diff --quiet -- lessons/year7/year7-lesson-upload/Y7-L01-preview; then
            echo "Preview images are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lessons/year7/year7-lesson-upload/Y7-L01-preview
          git commit -m "Render Year 7 Lesson 1 slide preview"
          git push
