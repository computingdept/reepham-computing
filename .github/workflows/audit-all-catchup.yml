name: Audit all J277 and H446 Catch Up lessons
on:
  push:
    branches: [main]
    paths:
      - 'qa/catchup/audit.cjs'
      - '.github/workflows/audit-all-catchup.yml'
      - 'assets/catchup-lesson.js'
      - 'assets/catchup-lesson.css'
      - 'assets/j277-catchup-builder.js'
      - 'data/catchup/**'
      - 'lessons/j277/lesson-*/learn.html'
      - 'lessons/h446/lesson-*/learn.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Audit every lesson in Chromium
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/catchup-server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          node qa/catchup/audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-catchup-audit
          path: qa/catchup/audit-result.json
          if-no-files-found: ignore
