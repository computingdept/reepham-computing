name: J277 Paper 1 V3 review-only PDF assembly
on:
  push:
    branches:
      - review/j277-paper1-v3-20261028
    paths:
      - 'review/j277-paper1-v3-20261028/incoming/**'
      - 'tools/revision/assemble_j277_paper1_review_v3.py'
      - '.github/workflows/j277-paper1-v3-review.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF verification engine
        run: python -m pip install pymupdf==1.26.4
      - name: Verify hash, assemble PDFs and check original 33 MCQ page proposals
        id: assembled
        run: python tools/revision/assemble_j277_paper1_review_v3.py
      - name: Save review files only to this isolated branch
        if: steps.assembled.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review/j277-paper1-v3-20261028/verified
          git add -u review/j277-paper1-v3-20261028/incoming
          git diff --cached --check
          git commit -m "Assemble verified J277 Paper 1 V3 review PDFs (not live)"
          git push origin HEAD:review/j277-paper1-v3-20261028
      - name: Record review PDF build artifacts
        if: steps.assembled.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: j277-paper1-v3-review-only
          path: review/j277-paper1-v3-20261028/verified/
          retention-days: 30
