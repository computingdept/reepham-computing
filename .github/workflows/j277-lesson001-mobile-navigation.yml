name: J277 Lesson 001 mobile swipe and vocabulary navigation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'qa/master-audit-2026/j277-lesson001-mobile-navigation.cjs'
      - 'assets/h446-lesson/lesson.js'
      - 'assets/h446-lesson/lesson-classroom.css'
      - 'lessons/j277/lesson-001/index.html'
      - '.github/workflows/j277-lesson001-mobile-navigation.yml'
permissions:
  contents: read
jobs:
  phone-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test phone swipe and vocabulary interactions
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/j277-mobile-nav.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          node qa/master-audit-2026/j277-lesson001-mobile-navigation.cjs
