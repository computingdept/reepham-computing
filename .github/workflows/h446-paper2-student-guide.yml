name: H446 Paper 2 student revision guide migration
on:
  push:
    branches: [main]
    paths:
      - 'tools/revision/migrate_h446_paper2_student_guide.py'
      - '.github/workflows/h446-paper2-student-guide.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  revise:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDF engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core libcairo2
          python -m pip install pymupdf==1.26.4 cairosvg==2.7.1
      - name: Rebuild student-facing Paper 2 PDF
        run: python tools/revision/migrate_h446_paper2_student_guide.py
      - name: Regenerate guide URL lookups
        run: python tools/revision/build_guide_links.py
      - name: Audit all H446 feedback destinations
        run: python tools/revision/audit_h446_feedback.py
      - name: Validate Paper 2 page keys and section destinations
        run: |
          python - <<'PY'
          import fitz,json
          from pathlib import Path
          g=Path('revision/h446/guides')
          d=json.loads((g/'paper-2-page-map.json').read_text())
          pdf=fitz.open(g/'H446_Paper_2_REVIEW_READY_2026-10-21.pdf')
          assert len(pdf)==d['page_count']==179
          assert d['edition']=='2026-10-27-theory-examples-terms'
          assert len(d['page_keys'])==179
          assert sorted(d['page_keys'].values())==list(range(1,180))
          assert len(pdf.get_toc())>=14
          for r in d['added_pages']:
            if r['key']>=172:
              assert 'Theory / Key terminology' in pdf[r['page']-1].get_text(),r
          print('PASS 179 pages, 179 unique stable keys, valid terminology pages')
          PY
          git diff --check
      - name: Publish Paper 2 PDF and feedback references atomically
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add revision/h446/guides/H446_Paper_2_REVIEW_READY_2026-10-21.pdf
          git add revision/h446/guides/paper-2-page-map.json revision/h446/guide-links.js
          git add h446-hub.html docs/audits/h446-feedback-destinations-20261023.csv
          git add docs/audits/h446-paper2-student-revision-20261027.md
          if ! git diff --cached --quiet; then
            git commit -m "Publish H446 Paper 2 independent revision guide with intact feedback links"
            git push
          fi
