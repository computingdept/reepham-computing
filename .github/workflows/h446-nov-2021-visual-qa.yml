name: H446 November 2021 Visual QA (Draft Only)

on:
  push:
    branches:
      - qa/2021-nov-stack-bst-views
    paths:
      - 'data/exam-questions/qa-2021-nov-*.html'
      - 'data/exam-questions/qa-visual-review.py'
      - 'assets/exam-questions/h446/question-view/**'
      - '.github/workflows/h446-nov-2021-visual-qa.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'data/exam-questions/qa-2021-nov-*.html'
      - 'data/exam-questions/qa-visual-review.py'
      - 'assets/exam-questions/h446/question-view/**'
      - '.github/workflows/h446-nov-2021-visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-screenshots:
    name: Capture isolated question and answer views
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser checker
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Generate visual QA screenshots and report
        id: audit
        continue-on-error: true
        run: |
          python data/exam-questions/qa-visual-review.py --output /tmp/h446-visual-review
      - name: Upload 124 question and answer images plus report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h446-nov2021-visual-qa
          path: /tmp/h446-visual-review
          if-no-files-found: warn
          retention-days: 14
      - name: Fail if screenshots contain blocking defects
        if: steps.audit.outcome == 'failure'
        run: |
          echo "Visual QA found failures. See the artifact report for details."
          exit 1
