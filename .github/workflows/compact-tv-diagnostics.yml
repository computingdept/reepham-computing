name: H446 compact TV layout diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'qa/master-audit-2026/compact-tv-diagnostics.cjs'
      - '.github/workflows/compact-tv-diagnostics.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Collect clipping element measurements
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/h446-compact-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          node qa/master-audit-2026/compact-tv-diagnostics.cjs
