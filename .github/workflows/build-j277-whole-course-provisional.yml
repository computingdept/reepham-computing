name: Build remaining J277 four-page provisional booklets
on:
  push:
    branches: [main]
    paths:
      - 'tools/revision/build_j277_whole_course.py'
      - '.github/workflows/build-j277-whole-course-provisional.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF engine
        run: python -m pip install pymupdf==1.26.4
      - name: Generate provisional PDFs and exception report
        run: python tools/revision/build_j277_whole_course.py
      - name: Check report and four-page outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import fitz
          root=Path('.')
          r=json.loads((root/'offline/booklets/j277/whole-course-audit.json').read_text())
          assert r['total']==144
          for item in r['lessons']:
              if item['status']!='generated_unapproved':continue
              p=root/item['file']
              assert p.exists()
              with fitz.open(p) as doc:
                  assert len(doc)==4
                  for page in doc:
                      assert round(page.rect.width)==595 and round(page.rect.height)==842
          print("Verified provisional generation:",r['generated'],"successes,",r['exceptions'],"exceptions")
          PY
      - name: Commit provisional PDFs and explicit exception manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- offline/booklets/j277/generated offline/booklets/j277/whole-course-audit.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Generate J277 provisional four-page booklets and exception audit'
            for attempt in 1 2 3 4; do
              if git push origin HEAD:main; then
                echo 'Published provisional outputs and audit manifest'
                break
              fi
              if [ "$attempt" -eq 4 ]; then exit 1; fi
              git fetch origin main
              git rebase origin/main
            done
          fi
