name: Render Year 8 L01 slides

on:
  push:
    paths:
      - 'lessons/year8/year8-lesson-upload/Y8-L01-slides.pptx'
      - '.github/workflows/render-y8-l01-slides.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install render tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils

      - name: Render original PowerPoint to slide images
        run: |
          set -e
          SRC="lessons/year8/year8-lesson-upload/Y8-L01-slides.pptx"
          OUT="lessons/year8/year8-lesson-upload/Y8-L01-preview"
          TMP="/tmp/y8l01"
          rm -rf "$TMP"
          mkdir -p "$TMP" "$OUT"
          rm -f "$OUT"/slide-*.png
          libreoffice --headless --convert-to pdf --outdir "$TMP" "$SRC"
          PDF="$TMP/Y8-L01-slides.pdf"
          pdftoppm -png -r 115 "$PDF" "$TMP/slide"
          n=1
          for f in "$TMP"/slide-*.png; do
            printf -v num "%02d" "$n"
            mv "$f" "$OUT/slide-$num.png"
            n=$((n+1))
          done

      - name: Commit rendered slides
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lessons/year8/year8-lesson-upload/Y8-L01-preview/slide-*.png
          if git diff --cached --quiet; then
            echo "No slide changes"
          else
            git commit -m "Render Year 8 L01 original PowerPoint slides [skip ci]"
            git push
          fi
