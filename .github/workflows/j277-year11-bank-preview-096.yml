      - '.github/workflows/j277-year11-bank-preview-096.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check Year 11 bank preview batches one to seven
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/j277-bank-preview-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          node qa/master-audit-2026/j277-bank-preview-096.cjs
          node qa/master-audit-2026/j277-bank-preview-batch1.cjs
          node qa/master-audit-2026/j277-bank-preview-batch2.cjs
          node qa/master-audit-2026/j277-bank-preview-batch3.cjs
          node qa/master-audit-2026/j277-bank-preview-batch4.cjs
          node qa/master-audit-2026/j277-bank-preview-batch5.cjs
          node qa/master-audit-2026/j277-bank-preview-batch6.cjs
          node qa/master-audit-2026/j277-bank-preview-batch7.cjs
