name: H446 Paper 1 logic terminology completion
on:
  push:
    branches: [main]
    paths:
      - 'tools/revision/add_h446_paper1_logic_vocabulary.py'
      - '.github/workflows/h446-paper1-logic-terms.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDF engine and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core libcairo2
          python -m pip install pymupdf==1.26.4 cairosvg==2.7.1
      - name: Insert dedicated 1.4.3 logic terminology
        run: python tools/revision/add_h446_paper1_logic_vocabulary.py
      - name: Rebuild both guide lookups
        run: python tools/revision/build_guide_links.py
      - name: Audit every H446 revision feedback destination
        run: python tools/revision/audit_h446_feedback.py
      - name: Validate all page keys and bookmarks
        run: |
          python - <<'PY'
          import json,fitz
          from pathlib import Path
          g=Path('revision/h446/guides')
          data=json.loads((g/'paper-1-page-map.json').read_text())
          pdf=fitz.open(g/'H446_Paper_1_CORRECTED_DRAFT_2026-10-21.pdf')
          assert len(pdf)==data['page_count']==264
          assert data['edition']=='2026-10-27-complete-vocabulary'
          assert len(data['page_keys'])==264
          assert sorted(data['page_keys'].values())==list(range(1,265))
          assert data['page_keys']['264']==225
          assert 'Theory / Key terminology' in pdf[224].get_text()
          assert all(1<=p<=264 for _,_,p in pdf.get_toc())
          print('PASS: 264 pages, complete key vocabulary, all previous feedback keys stable')
          PY
          git diff --check
      - name: Publish PDF, map, links and audit in one commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add revision/h446/guides/H446_Paper_1_CORRECTED_DRAFT_2026-10-21.pdf
          git add revision/h446/guides/paper-1-page-map.json revision/h446/guide-links.js
          git add h446-hub.html docs/audits/h446-feedback-destinations-20261023.csv
          git add docs/audits/h446-paper1-logic-vocabulary-20261027.md
          if ! git diff --cached --quiet; then
            git commit -m "Complete Paper 1 Boolean logic glossary and preserve H446 revision feedback"
            git push
          fi
