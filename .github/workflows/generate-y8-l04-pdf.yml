name: Generate Year 8 L04 PDF
on:
  push:
    paths:
      - 'tools/generate_y8_l04_pdf.py'
      - '.github/workflows/generate-y8-l04-pdf.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab
      - run: python tools/generate_y8_l04_pdf.py
      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lessons/year8/year8-lesson-upload/Y8-L04-print.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes"
          else
            git commit -m "Generate Year 8 L04 print booklet [skip ci]"
            git push
          fi
