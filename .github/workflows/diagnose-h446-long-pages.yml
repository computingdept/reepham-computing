name: Diagnose H446 long print booklet page layouts
on:
  push:
    branches: [main]
    paths:
      - 'tools/independent_booklets/diagnose_h446_long_pages.py'
      - '.github/workflows/diagnose-h446-long-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: h446-diagnose-long-pages
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF reader
        run: python -m pip install 'PyMuPDF==1.26.4'
      - name: Profile all 33 overlong A4 PDF documents
        run: python tools/independent_booklets/diagnose_h446_long_pages.py
      - name: Check report scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('offline/booklets/h446/H446_PRINT_LONG_PAGES_DIAGNOSTIC.json').read_text())
          assert a['overlong_records']==33
          assert all(len(r['pages'])==r['a4_pages'] for r in a['results'])
          print('PDF page-type and image-footprint diagnostics validated.')
          PY
      - name: Publish analysis only (no print PDFs or catalogue changes)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offline/booklets/h446/H446_PRINT_LONG_PAGES_DIAGNOSTIC.json offline/booklets/h446/H446_PRINT_LONG_PAGES_DIAGNOSTIC.md
          git diff --cached --quiet && exit 0
          git commit -m 'Audit why 33 H446 print booklets exceed 16 pages'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD~1)"
          git push origin HEAD:main
