name: Publish H446 Year 12 011-015 eight-page print drafts
on:
  push:
    branches: [main]
    paths:
      - 'tools/independent_booklets/publish_h446_year12_011_015.py'
      - '.github/workflows/publish-h446-year12-011-015.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h446-year12-011-015-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fonts and PDF dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core
          python -m pip install 'reportlab==4.2.5' 'beautifulsoup4==4.12.3' 'PyMuPDF==1.26.4'
      - name: Generate source-grounded booklets and validate pages
        run: python tools/independent_booklets/publish_h446_year12_011_015.py
      - name: Verify that every published catalogue link resolves to a real PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,fitz
          d=json.loads(Path('offline/booklets/catalogue.json').read_text())
          for n in range(11,16):
              r=d['lessons']['h446'][str(n)]
              assert r['a4_pages']==8 and not r['teacher_approved']
              for key in ('print_bw','learn_colour','booklet_bw','booklet_colour'):
                  p=Path(r[key]);assert p.is_file() and p.stat().st_size>10000, (n,key,p)
                  with fitz.open(p) as pdf:
                      assert len(pdf)==(8 if 'A4' in p.name else 4),(p,len(pdf))
              print(n,r['title'],'verified')
          PY
      - name: Commit only the reviewed batch and catalogue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offline/booklets/catalogue.json offline/booklets/h446/H446_Lesson_0{11,12,13,14,15}_8PAGE_REVIEW_*  offline/booklets/h446/H446_011_015_BATCH_AUDIT.json
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m 'Publish 8-page H446 Year 12 print drafts 011-015'
          pushed=0
          for attempt in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin main
            if git push origin HEAD:main; then pushed=1;break;fi
            sleep 3
          done
          test "$pushed" -eq 1
