name: Generate J277 unit PDFs from approved guides
on:
  push:
    branches: [main]
    paths:
      - 'tools/revision/build_j277_unit_pdfs.py'
      - '.github/workflows/generate-j277-unit-pdfs.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF splitter
        run: python -m pip install pymupdf
      - name: Create and validate exactly 11 PDFs
        run: python tools/revision/build_j277_unit_pdfs.py
      - name: Publish only validated J277 unit PDF copies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add revision/j277/guides/units/*.pdf revision/j277/guides/unit-pdfs.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish 11 unit PDFs extracted from approved J277 revision guides [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
