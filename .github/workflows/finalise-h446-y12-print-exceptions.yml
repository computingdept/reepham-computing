name: Finalise H446 Year 12 print booklet exceptions
on:
  push:
    branches: [main]
    paths:
      - 'tools/independent_booklets/publish_h446_y12_exceptions.py'
      - '.github/workflows/finalise-h446-y12-print-exceptions.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: h446-y12-exception-finalise
  cancel-in-progress: false
jobs:
  finalise:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core
          python -m pip install 'reportlab==4.2.5' 'beautifulsoup4==4.12.3' 'PyMuPDF==1.26.4'
      - name: Correct the four non-assessment exceptions and write final report
        run: python tools/independent_booklets/publish_h446_y12_exceptions.py
      - name: Verify published PDF paths and page counts
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,fitz
          c=json.loads(Path('offline/booklets/catalogue.json').read_text())
          a=json.loads(Path('offline/booklets/h446/Y12_EIGHT_PAGE_BATCHES.json').read_text())
          assert len(a['generated'])+len(a['deferred'])==145
          for x in a['generated']:
              n=x['lesson']
              v=c['lessons']['h446'][str(n)]
              assert not v['teacher_approved']
              for key in ('print_bw','learn_colour','booklet_bw','booklet_colour'):
                  f=Path(v[key]);assert f.exists(),f
                  with fitz.open(f) as pdf:
                      assert len(pdf)==(v['a4_pages'] if key in ('print_bw','learn_colour') else v['a3_spreads']),f
          print('Final drafts',len(a['generated']),'Deferred',len(a['deferred']))
          PY
      - name: Commit verified PDFs and final report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offline/booklets/catalogue.json offline/booklets/h446/Y12_EIGHT_PAGE_BATCHES.json offline/booklets/h446/Y12_FINAL_PRODUCTION_REPORT.md
          git add offline/booklets/h446/H446_Lesson_0{17,19,25,31}_{8,9}PAGE_REVIEW_*.pdf 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Resolve Year12 booklet exceptions and publish course report'
          pushed=0
          for attempt in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin main
            if git push origin HEAD:main; then pushed=1;break;fi
            sleep 3
          done
          test "$pushed" -eq 1
      - name: Show final report
        if: always()
        run: |
          if test -s offline/booklets/h446/Y12_FINAL_PRODUCTION_REPORT.md; then
            cat offline/booklets/h446/Y12_FINAL_PRODUCTION_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi
