name: J277 H446 You Do presentation audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'qa/master-audit-2026/youdo-presentation-regression.cjs'
      - 'assets/h446-lesson/lesson.js'
      - 'assets/h446-lesson/lesson-classroom.css'
      - 'lessons/j277/lesson-*/index.html'
      - 'lessons/j277/year11-extended-diagrams.js'
      - 'lessons/j277/year11-diagrams.js'
      - 'lessons/j277/autumn2-rebuilt.js'
      - 'lessons/j277/autumn2-*.json'
      - 'assets/j277/youdo-grouped.js'
      - 'assets/j277/youdo-grouped.css'
      - 'lessons/h446/lesson-*/index.html'
      - '.github/workflows/youdo-presentation-audit.yml'

permissions:
  contents: read

jobs:
  youdo-viewport-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Scan all standard lessons
        env:
          QA_SHARDS: '4'
          QA_SHARD: '${{ matrix.shard }}'
          QA_REPORT: 'qa-output/youdo-shard-${{ matrix.shard }}.json'
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/youdo-audit-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          node qa/master-audit-2026/youdo-presentation-regression.cjs
      - name: Summarise browser audit results
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          shard = "${{ matrix.shard }}"
          report = Path(f"qa-output/youdo-shard-{shard}.json")
          lines = [f"### You Do presentation audit — shard {shard}"]
          if report.is_file():
              data = json.loads(report.read_text())
              lines.append(
                  f"Lessons: {data.get('lessons', '?')} | "
                  f"Checks passed: {data.get('passed', '?')} | "
                  f"Failures: {data.get('failures', '?')} | "
                  f"Warnings: {data.get('warnings', '?')}"
              )
              for issue in (data.get("failed") or [])[:10]:
                  lines.append("- **FAIL** " + json.dumps(issue, ensure_ascii=False))
              for issue in (data.get("warningsDetail") or [])[:10]:
                  lines.append("- **REVIEW** " + json.dumps(issue, ensure_ascii=False))
          else:
              lines.append("No report was generated; inspect the scan step logs.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")
          PY
      - name: Upload browser audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youdo-presentation-shard-${{ matrix.shard }}
          path: qa-output/youdo-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
