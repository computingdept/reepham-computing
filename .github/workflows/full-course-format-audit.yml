name: Full J277 and H446 formatting audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'qa/master-audit-2026/cross-course-format-regression.cjs'
      - '.github/workflows/full-course-format-audit.yml'

permissions:
  contents: read

jobs:
  lesson-formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test existing lessons at TV compact TV and mobile sizes
        env:
          QA_FORMAT_ALL: '1'
          QA_FORMAT_SHARDS: '4'
          QA_FORMAT_SHARD: '${{ matrix.shard }}'
          QA_REPORT: 'qa-output/format-shard-${{ matrix.shard }}.json'
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/rhsc-full-format-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          node qa/master-audit-2026/cross-course-format-regression.cjs
      - name: Upload evidence from each shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whole-course-format-shard-${{ matrix.shard }}
          path: qa-output/format-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
