name: J277 and H446 classroom formatting audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'qa/master-audit-2026/cross-course-format-regression.cjs'
      - '.github/workflows/cross-course-format-audit.yml'
      - 'assets/h446-lesson/lesson-classroom.css'
      - 'assets/h446-lesson/lesson-base.css'
      - 'assets/h446-lesson/lesson.js'

permissions:
  contents: read

jobs:
  representative-format-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test selected J277 and H446 layouts at three sizes
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/rhsc-format-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          node qa/master-audit-2026/cross-course-format-regression.cjs
