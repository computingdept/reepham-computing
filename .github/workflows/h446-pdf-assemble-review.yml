name: Assemble verified H446 student PDFs

on:
  push:
    branches:
      - h446-student-guides-live-20261030
    paths:
      - '.github/workflows/h446-pdf-assemble-review.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: h446-student-guides-live-20261030
          persist-credentials: true
      - name: Decode and verify both PDF files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          items = [
              (1, 43, "d86eae7eff50a6708c22d23de3e0558345804c83659a357de6b6f484567faf7f"),
              (2, 37, "dd530390bd82618c4118ea464c78c6f1ce1980dd2bc394336884f27616fb95d5"),
          ]
          output = Path("revision/h446/guides")
          output.mkdir(parents=True, exist_ok=True)
          for paper, expected_parts, expected_sha in items:
              parts = sorted(Path(f".h446-pdf-upload/p{paper}").glob("part*.b64"))
              assert len(parts) == expected_parts, (paper,len(parts),expected_parts)
              b64 = "".join(x.read_text().strip() for x in parts)
              data = base64.b64decode(b64, validate=True)
              actual = hashlib.sha256(data).hexdigest()
              assert actual == expected_sha, (paper, actual, expected_sha)
              assert data.startswith(b"%PDF-") and b"%%EOF" in data[-1024:]
              target = output / f"H446_Paper_{paper}_FINAL_Student_Revision_Guide.pdf"
              target.write_bytes(data)
              print(f"VERIFIED Paper {paper}: {len(data)} bytes, SHA256 {actual}")
          PY
      - name: Commit verified PDFs and remove temporary transfer files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add revision/h446/guides/H446_Paper_1_FINAL_Student_Revision_Guide.pdf
          git add revision/h446/guides/H446_Paper_2_FINAL_Student_Revision_Guide.pdf
          git rm -r .h446-pdf-upload
          git rm .github/workflows/h446-pdf-assemble-review.yml
          git commit -m "Add verified H446 Paper 1 and 2 final student PDFs"
          git push origin HEAD:h446-student-guides-live-20261030
