name: J277 H446 self-marking presentation regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'qa/master-audit-2026/selfmarking-presentation-regression.cjs'
      - 'assets/h446-lesson/lesson.js'
      - 'assets/h446-lesson/lesson-classroom.css'
      - 'assets/j277/youdo-grouped.js'
      - 'assets/j277/youdo-grouped.css'
      - 'lessons/j277/lesson-*/index.html'
      - 'lessons/j277/J277Welcome.html'
      - 'assets/j277/welcome.css'
      - 'lessons/h446/lesson-*/index.html'
      - '.github/workflows/selfmarking-presentation-regression.yml'
permissions:
  contents: read
jobs:
  selfmark-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test self-marking at TV, compact TV and phone dimensions
        env:
          QA_REPORT: 'qa-output/selfmarking-browser.json'
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/selfmarking-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          node qa/master-audit-2026/selfmarking-presentation-regression.cjs
      - name: Upload self-marking browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfmarking-browser-report
          path: qa-output/selfmarking-browser.json
          if-no-files-found: warn
