name: Draft independent booklets · J277 and H446

on:
  push:
    branches:
      - 'draft/booklet-*'
    paths:
      - 'tools/independent_booklets/**'
      - '.github/workflows/draft-independent-booklets.yml'
  pull_request:
    paths:
      - 'tools/independent_booklets/**'
      - '.github/workflows/draft-independent-booklets.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: draft-independent-booklets
  cancel-in-progress: true

jobs:
  pilot:
    name: Representative source + PDF smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated booklet tooling
        run: python -m pip install 'reportlab==4.2.5' 'beautifulsoup4==4.12.3' 'PyMuPDF==1.26.4'
      - name: Generate and validate real lesson pilots
        run: python tools/independent_booklets/generate.py --smoke --out build/booklet-pilots --fail-on-errors
      - name: Upload pilot PDFs and manifest (unapproved drafts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unapproved-booklet-pilots
          path: build/booklet-pilots/
          if-no-files-found: warn
          retention-days: 21

  j277:
    name: Draft J277 PDFs + audit manifest
    needs: pilot
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install booklet tooling
        run: python -m pip install 'reportlab==4.2.5' 'beautifulsoup4==4.12.3' 'PyMuPDF==1.26.4'
      - name: Generate grounded J277 booklet drafts
        run: python tools/independent_booklets/generate.py --course j277 --out build/booklet-j277
      - name: Upload J277 drafts, A3 spreads, and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unapproved-J277-booklets
          path: build/booklet-j277/
          if-no-files-found: warn
          retention-days: 21

  h446:
    name: Draft H446 PDFs + audit manifest
    needs: pilot
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install booklet tooling
        run: python -m pip install 'reportlab==4.2.5' 'beautifulsoup4==4.12.3' 'PyMuPDF==1.26.4'
      - name: Generate grounded H446 booklet drafts
        run: python tools/independent_booklets/generate.py --course h446 --out build/booklet-h446
      - name: Upload H446 drafts, A3 spreads, and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unapproved-H446-booklets
          path: build/booklet-h446/
          if-no-files-found: warn
          retention-days: 21
