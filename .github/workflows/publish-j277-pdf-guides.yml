name: Publish J277 PDF revision guides after binary upload
on:
  push:
    branches: [main]
    paths:
      - 'revision/j277/guides/*.pdf'
      - 'tools/revision/publish_j277_pdf_guides.py'
      - '.github/workflows/publish-j277-pdf-guides.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Require both uploaded PDFs
        id: assets
        run: |
          if [ -s revision/j277/guides/J277_Paper_1_Revision_Guide_AP1_Aligned.pdf ] &&
             [ -s revision/j277/guides/J277_Paper_2_Revision_Guide_AP1_Aligned.pdf ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "PDFs have not both been uploaded. Hub and feedback links stay unpublished."
          fi
      - uses: actions/setup-node@v4
        if: steps.assets.outputs.ready == 'true'
        with:
          node-version: '22'
      - name: Install PDF validation engine
        if: steps.assets.outputs.ready == 'true'
        run: python -m pip install pymupdf==1.26.4
      - name: Validate PDF page counts, publish booklet cards and resolve feedback
        if: steps.assets.outputs.ready == 'true'
        run: python tools/revision/publish_j277_pdf_guides.py
      - name: Validate the indexed J277 feedback URLs
        if: steps.assets.outputs.ready == 'true'
        run: |
          python tools/revision/build_j277_guide_links.py --check
          node - <<'JS'
          const fs=require('fs'),vm=require('vm'),ctx={window:{}};
          vm.runInNewContext(fs.readFileSync('revision/j277/guides/guide-links.js','utf8'),ctx);
          const r=ctx.window.J277_RESOURCE_INDEX;
          for(const [paper,g] of Object.entries(r.guides)){
            if(!g.published)throw new Error('Paper '+paper+' not published');
            if(!fs.existsSync('revision/j277/guides/'+g.file))throw new Error('Missing '+g.file);
          }
          for(const id of Object.keys(r.skills)){
            const link=r.guideLink(id);
            if(!link || !link.includes('#page='+r.skills[id].page))throw new Error('Bad guide link '+id);
            if(!r.lessonLinks(id).length)throw new Error('Bad lesson targets '+id);
          }
          console.log('PASS:',Object.keys(r.skills).length,'J277 skill guide links');
          JS
          git diff --check
      - name: Commit booklet and revision-feedback activation
        if: steps.assets.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add j277-hub.html revision/j277/guides/skill-index.json revision/j277/guides/guide-links.js
          git add docs/audits/j277-guide-publication-20261027.md
          if ! git diff --cached --quiet; then
            git commit -m "Publish J277 PDF revision guides on hub and feedback"
            git push
          fi
