name: J277 and H446 shared yellow highlighting audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'qa/master-audit-2026/keyword-highlighter-regression.cjs'
      - 'assets/h446-lesson/keyword-highlighter.js'
      - 'assets/h446-lesson/keyword-highlighter.css'
      - 'assets/h446-lesson/lesson.js'
      - '.github/workflows/keyword-highlighter-audit.yml'
permissions:
  contents: read
jobs:
  marker-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check yellow highlighting on TV and phone across both courses
        env:
          QA_MARKER_SHARDS: '4'
          QA_MARKER_SHARD: '${{ matrix.shard }}'
          QA_REPORT: 'qa-output/marker-shard-${{ matrix.shard }}.json'
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/rhsc-marker-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          node qa/master-audit-2026/keyword-highlighter-regression.cjs
      - name: Upload marker consistency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marker-audit-shard-${{ matrix.shard }}
          path: qa-output/marker-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
