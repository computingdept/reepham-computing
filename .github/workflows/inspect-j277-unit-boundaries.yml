name: Inspect J277 unit PDF boundaries
on:
  push:
    branches: [main]
    paths:
      - 'tools/revision/inspect_j277_unit_boundaries.py'
      - '.github/workflows/inspect-j277-unit-boundaries.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pymupdf
      - run: python tools/revision/inspect_j277_unit_boundaries.py
      - name: Save boundary audit only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review/j277-unit-navigation/guide-outline.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit J277 unit PDF section boundaries [skip ci]"
            git push
          fi
