name: One-time extraction of verified J277 Paper 2 V3 PDF
on:
  push:
    branches:
      - release/j277-paper2-v3-20261028
    paths:
      - '.github/workflows/unpack-j277-paper2-v3-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    if: github.ref == 'refs/heads/release/j277-paper2-v3-20261028'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract and verify exact expected PDF
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from zipfile import ZipFile
          directory = Path('revision/j277/guides')
          archive = directory / 'J277_PAPER2_V3_CORRECT_9713830_UPLOAD_PACKAGE_20261029.zip'
          target = directory / 'J277_Paper_2_Revision_Guide_V3.pdf'
          expected_name = target.name
          expected_bytes = 9713830
          expected_sha256 = 'fb1b3c12969765e6044d58fdbd903933267de3df377750902d2416c8e3f261fa'
          if not archive.is_file():
              raise SystemExit('Missing verified ZIP upload')
          if target.exists():
              raise SystemExit('Target PDF already exists. Refusing to overwrite.')
          with ZipFile(archive) as z:
              names = z.namelist()
              if names != [expected_name]:
                  raise SystemExit('Unexpected ZIP contents: ' + repr(names))
              data = z.read(expected_name)
          if len(data) != expected_bytes:
              raise SystemExit(f'PDF size mismatch: {len(data)}')
          digest = hashlib.sha256(data).hexdigest()
          if digest != expected_sha256:
              raise SystemExit('PDF checksum mismatch: ' + digest)
          if not data.startswith(b'%PDF-'):
              raise SystemExit('Not a valid PDF header')
          target.write_bytes(data)
          archive.unlink()
          print(f'Exact release PDF verified and extracted: {target}, {len(data)} bytes, SHA-256 {digest}')
          PY
      - name: Commit verified PDF and remove ZIP
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- revision/j277/guides/J277_Paper_2_Revision_Guide_V3.pdf
          git add -u -- revision/j277/guides/J277_PAPER2_V3_CORRECT_9713830_UPLOAD_PACKAGE_20261029.zip
          git diff --cached --quiet && exit 0
          git commit -m 'Extract checksum-verified J277 Paper 2 V3 PDF from uploaded release ZIP'
          git push origin HEAD:release/j277-paper2-v3-20261028
