name: J277 MCQ Revision Hub regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'j277-hub.html'
      - 'revision/j277/shared/**'
      - 'revision/j277/section-*/**'
      - 'revision/j277/guides/**'
      - 'tools/revision/build_j277_guide_links.py'
      - 'qa/master-audit-2026/j277-revision-mcq-regression.cjs'
      - '.github/workflows/j277-revision-mcq.yml'
permissions:
  contents: read
jobs:
  revision-mcq:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify centralized J277 guide index
        run: python3 tools/revision/build_j277_guide_links.py --check
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify J277 revision quizzes on phone and TV
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/j277-mcq-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          node qa/master-audit-2026/j277-revision-mcq-regression.cjs
