name: Publish H446 full-course Catch Up lessons
on:
  push:
    branches: [main]
    paths:
      - 'tools/catchup/build_h446_full_course.py'
      - '.github/workflows/publish-h446-catchup-full-course.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-h446-catchup-full-course
  cancel-in-progress: false
jobs:
  generate-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned HTML parser
        run: python -m pip install beautifulsoup4==4.12.3
      - name: Generate H446 lesson 007-160 and 181-320 Catch-Up resources
        run: python tools/catchup/build_h446_full_course.py
      - name: Validate all 300 lesson routes and teacher-curated exemplars
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=Path('data/catchup')
          pages=Path('lessons/h446')
          hub=Path('h446-hub.html').read_text(encoding='utf-8')
          report=json.loads(Path('docs/audits/h446-catchup-full-course-generation.json').read_text(encoding='utf-8'))
          assert report['new_expected']==report['new_generated']==294
          assert not report['failed']
          for n in list(range(1,161))+list(range(181,321)):
              p=f'{n:03d}'
              x=pages/f'lesson-{p}'/'learn.html'
              y=data/f'h446-{p}.json'
              assert x.is_file() and y.is_file(),p
              text=x.read_text(encoding='utf-8')
              cfg=json.loads(y.read_text(encoding='utf-8'))
              assert cfg['id']==f'h446-{p}',p
              assert f'catchup/h446-{p}.json' in text,p
              assert cfg['course']=='h446' and cfg['pass_percent']==80,p
              assert cfg['year']==(12 if n<181 else 13),p
              assert [len(s['questions']) for s in cfg['stages']]==[4,3,4,3,3],p
              assert len({q['id'] for s in cfg['stages'] for q in s['questions']})==17,p
              for stage in cfg['stages']:
                  for q in stage['questions']:
                      assert q['prompt'] and q['answer'] and q['feedback'],p
                      if q['kind']=='choice':
                          assert len(q['options'])>=2 and len(set(q['options']))==len(q['options']) and q['answer'] in q['options'],p
              assert 'assets/catchup-lesson.js' in text,p
          # Pedagogical/provenance checks: 294 new Do Now sections must match
          # the classroom lesson's four retrieval stems and model answers.
          # 036/037 have no conventional retrieval; 20 source lessons have a
          # malformed Q4 and use the intended question recovered from HTML.
          import importlib.util
          from bs4 import BeautifulSoup
          spec=importlib.util.spec_from_file_location(
              'h446_catchup_builder','tools/catchup/build_h446_full_course.py')
          builder=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(builder)
          factual_patterns=set()
          for n in builder.IDS:
              p=f'{n:03d}'
              cfg=json.loads((data/f'h446-{p}.json').read_text(encoding='utf-8'))
              quiz=cfg['stages'][0]['questions']
              assert all(not q['prompt'].startswith('Choose the model answer: ')
                         for q in quiz),p
              assert all(len(q['prompt'])>=8 for q in quiz),p
              assert all(q['kind'] in ('number','choice') for q in quiz),p
              assert '14 of 17 correct' in (pages/f'lesson-{p}'/'learn.html').read_text(encoding='utf-8'),p
              truth=tuple(q['answer'] for q in cfg['stages'][4]['questions'])
              factual_patterns.add(truth)
              if n not in (36,37) and n not in builder.SOURCE_RETRIEVAL_CORRECTIONS:
                  source=(pages/f'lesson-{p}'/'index.html').read_text(encoding='utf-8')
                  original=builder.donow_of(BeautifulSoup(source,'html.parser'))
                  assert len(original)==4,p
                  assert [q['prompt'] for q in quiz]==[q for q,_,_ in original],p
                  assert [q['answer'] for q in quiz]==[a for _,a,_ in original],p
              if n in builder.PROTECTED_ASSESSMENTS:
                  assert 'prior-topic revision' in cfg['intro'] or n==36,p
                  assert all(len(q['answer'])<100
                             for q in cfg['stages'][3]['questions']),p
                  assert not any('FULL MODEL ANSWER MARK SCHEME' in q['answer'].upper()
                                 for q in cfg['stages'][3]['questions']),p
          assert len(factual_patterns)>2, 'Predictable True/False answer key'
          assert len(report['protected_assessment_lesson_ids'])==len(builder.PROTECTED_ASSESSMENTS)
          assert len(report['reconstructed_retrieval_lesson_ids'])==len(builder.SOURCE_RETRIEVAL_CORRECTIONS)==20
          assert all(next(x for x in report['records'] if x['id']==f'{n:03d}')['retrieval_source_correction']
                     for n in builder.SOURCE_RETRIEVAL_CORRECTIONS)
          print('PASS: 294 Do Now sources, assessment protection, varied review keys and accurate mastery labels')
          assert 'x<=320' in hub and 'x<=160' in hub
          print('PASS: all 300 H446 Catch-Up JSON and HTML routes, 80% mastery and question correctness structure')
          PY
          git diff --check
      - name: Commit generated resources and links
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/catchup/h446-*.json
          git add -- lessons/h446/lesson-*/learn.html
          git add -- h446-hub.html docs/audits/h446-catchup-full-course-generation.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Publish source-grounded H446 Catch Up lessons 007-160 and 181-320'
            for attempt in 1 2 3 4; do
              if git push origin HEAD:main; then
                echo 'H446 Catch Up resources published to main'
                break
              fi
              if [ "$attempt" -eq 4 ]; then
                echo 'Concurrent changes prevented safe publication' >&2
                exit 1
              fi
              git fetch origin main
              git rebase origin/main
            done
          fi
