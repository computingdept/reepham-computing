name: H446 guide legacy-table and Paper 2 inspection
on:
  push:
    branches: [main]
    paths:
      - 'tools/revision/inspect_h446_legacy_paper2.py'
      - '.github/workflows/h446-legacy-paper2-inspect.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install PDF engine
        run: python -m pip install pymupdf==1.26.4
      - name: Read vocabulary tables and Paper 2 headings
        run: python tools/revision/inspect_h446_legacy_paper2.py
      - name: Record inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/h446-guide-terminology-paper2-inspection-20261027.md
          if ! git diff --cached --quiet; then
            git commit -m "Record H446 legacy vocabulary and Paper 2 layout inspection"
            git push
          fi
