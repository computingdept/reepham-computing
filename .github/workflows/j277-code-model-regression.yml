name: J277 programming modelling regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lessons/j277/autumn2-*.json'
      - 'lessons/j277/autumn2-rebuilt.js'
      - 'lessons/j277/lesson-*/index.html'
      - 'assets/h446-lesson/lesson.js'
      - 'assets/h446-lesson/lesson-classroom.css'
      - 'qa/master-audit-2026/j277-code-model-regression.cjs'
      - '.github/workflows/j277-code-model-regression.yml'

permissions:
  contents: read

jobs:
  verify-programming-modelling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out latest lesson files
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test ten lessons at TV and mobile sizes
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/rhsc-qa-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          node qa/master-audit-2026/j277-code-model-regression.cjs
