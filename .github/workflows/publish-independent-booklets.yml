name: Publish independent booklet DRAFT PDFs to prototype

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-independent-booklets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-independent-booklets
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify and publish J277/H446 draft booklets
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install independent booklet tooling
        run: python -m pip install 'reportlab==4.2.5' 'beautifulsoup4==4.12.3' 'PyMuPDF==1.26.4'

      - name: Build all source-grounded J277 and H446 PDFs
        run: |
          python tools/independent_booklets/generate.py --course both --out build/booklet-publish
          test -s build/booklet-publish/manifest.json
          test -s build/booklet-publish/SUMMARY.md

      - name: Publish only verified, non-assessment, non-incomplete drafts
        run: |
          python tools/independent_booklets/publish.py --source build/booklet-publish --dest offline/booklets
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('offline/booklets/catalogue.json').read_text())
          count=sum(map(len,c['lessons'].values()))
          print('Verified DRAFT lesson resources:',count)
          print('PDF files:',c['counts'].get('pdf_files'))
          assert count>0, 'No valid draft resources'
          assert c['counts'].get('pdf_files')==count*4, 'Incomplete PDF variant set'
          PY
          du -sh offline/booklets

      - name: Commit public draft PDFs and machine-readable catalogue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offline/booklets/
          if git diff --cached --quiet; then
            echo 'No publication changes'
          else
            git commit -m 'Publish verified unapproved J277/H446 booklet drafts and audit catalogue'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Summarise actual publication
        if: always()
        run: |
          echo '## Independent booklet prototype publication' >> "$GITHUB_STEP_SUMMARY"
          echo 'DRAFT PDFs are **not teacher-approved**; original Teach lessons and guides are unchanged.' >> "$GITHUB_STEP_SUMMARY"
          if [ -s offline/booklets/catalogue.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          c=json.load(open('offline/booklets/catalogue.json'))
          print('Verified draft lessons:',sum(map(len,c['lessons'].values())))
          print('Verified PDFs:',c['counts'].get('pdf_files',0))
          print('Deferred:',c['counts'].get('deferred',0))
          PY
          fi
