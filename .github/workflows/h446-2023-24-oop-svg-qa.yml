name: H446 2023–24 OOP class and object source figure QA

on:
  push:
    branches:
      - qa/h446-2023-24-oop-class-object-svg
    paths:
      - "assets/exam-questions/h446/question-view/2023-jun-02-artifact-class-*.svg"
      - "assets/exam-questions/h446/question-view/2023-jun-02-artifact-encapsulation-*.svg"
      - "assets/exam-questions/h446/question-view/2023-jun-02-board-grid-*.svg"
      - "assets/exam-questions/h446/question-view/2024-jun-02-cache-object-*.svg"
      - "assets/exam-questions/h446/question-view/2024-jun-02-explorer-constructor-*.svg"
      - ".github/workflows/h446-2023-24-oop-svg-qa.yml"
  pull_request:
    branches:
      - main
    paths:
      - "assets/exam-questions/h446/question-view/2023-jun-02-artifact-class-*.svg"
      - "assets/exam-questions/h446/question-view/2023-jun-02-artifact-encapsulation-*.svg"
      - "assets/exam-questions/h446/question-view/2023-jun-02-board-grid-*.svg"
      - "assets/exam-questions/h446/question-view/2024-jun-02-cache-object-*.svg"
      - "assets/exam-questions/h446/question-view/2024-jun-02-explorer-constructor-*.svg"
      - ".github/workflows/h446-2023-24-oop-svg-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-qa-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG renderer
        run: python -m pip install --disable-pip-version-check --quiet cairosvg pillow
      - name: XML/diagram/raster QA
        shell: bash
        run: |
          python - <<'PY'
          import io,json,xml.etree.ElementTree as ET
          from pathlib import Path
          import cairosvg
          from PIL import Image,ImageDraw
          base=Path("assets/exam-questions/h446/question-view")
          names=[
            "2023-jun-02-artifact-class-rhs-question.svg",
            "2023-jun-02-artifact-class-rhs-answer.svg",
            "2023-jun-02-artifact-encapsulation-rhs-answer.svg",
            "2023-jun-02-board-grid-rhs-question.svg",
            "2023-jun-02-board-grid-rhs-answer.svg",
            "2024-jun-02-cache-object-rhs-question.svg",
            "2024-jun-02-cache-object-rhs-answer.svg",
            "2024-jun-02-explorer-constructor-rhs-question.svg",
            "2024-jun-02-explorer-constructor-rhs-answer.svg",
          ]
          out=Path("h446-2023-24-oop-evidence")
          out.mkdir(exist_ok=True)
          report=[]
          board=Image.new("RGB",(3*920,3*626),"#eef0f1")
          dr=ImageDraw.Draw(board)
          for i,name in enumerate(names):
            src=base/name
            tree=ET.parse(src)
            root=tree.getroot()
            title=root.find("{http://www.w3.org/2000/svg}title")
            desc=root.find("{http://www.w3.org/2000/svg}desc")
            assert root.tag.endswith("svg") and title is not None and title.text and desc is not None and desc.text, name
            img=Image.open(io.BytesIO(cairosvg.svg2png(url=str(src),output_width=1240))).convert("RGB")
            assert img.size==(1240,740),name
            img.save(out/name.replace(".svg",".png"))
            tile=img.copy();tile.thumbnail((892,557),Image.Resampling.LANCZOS)
            x=(i%3)*920+10
            y=(i//3)*626+10
            dr.text((x+6,y+4),name,fill="#252525")
            board.paste(tile,(x+(892-tile.width)//2,y+43+(557-tile.height)//2))
            report.append({"name":name,"size":img.size,"svg_xml":True,"title":title.text,"description":desc.text})
          board.save(out/"nine-svg-contact-sheet.png")
          (out/"report.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
          print(json.dumps({"svgs":len(report),"passed":len(report),"contact":"nine-svg-contact-sheet.png"}))
          PY
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h446-2023-24-oop-diagrams
          path: h446-2023-24-oop-evidence/
          if-no-files-found: warn
