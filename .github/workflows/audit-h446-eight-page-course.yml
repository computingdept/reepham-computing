name: Final OCR H446 eight-page teacher-review print QA
on:
  push:
    branches: [main]
    paths:
      - 'tools/independent_booklets/audit_h446_eight_page_course.py'
      - '.github/workflows/audit-h446-eight-page-course.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: h446-eight-page-complete-course-qa
  cancel-in-progress: false
jobs:
  verify-whole-course:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF inspector
        run: python -m pip install 'PyMuPDF==1.26.4'
      - name: Verify eight-page A4 PDFs and A3 imposition for every H446 Print record
        run: python tools/independent_booklets/audit_h446_eight_page_course.py
      - name: Confirm complete draft coverage and protected live catalogue
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,subprocess
          result=json.loads(Path('offline/booklets/h446/H446_EIGHT_PAGE_COURSE_QA_2026-11-03.json').read_text())
          assert result['catalogued_print_resources']==288
          assert result['eight_page_student_drafts']==288
          assert result['structural_issue_count']==0,result['structural_issue_count']
          assert result['teacher_approved']==0
          assert result['live_print_links_unchanged'] is True
          assert subprocess.check_output(['git','diff','--','offline/booklets/catalogue.json'])==b''
          print('All 288 eight-page teacher-review draft sets pass structural QA.')
          PY
      - name: Publish final structural QA without changing student-facing print links
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offline/booklets/h446/H446_EIGHT_PAGE_COURSE_QA_2026-11-03.json offline/booklets/h446/H446_EIGHT_PAGE_COURSE_QA_2026-11-03.md
          git diff --cached --quiet && exit 0
          git commit -m 'Record structural QA of all 288 OCR H446 eight-page print drafts'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD~1)"
          git push origin HEAD:main
