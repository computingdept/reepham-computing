<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#006347">
  <meta name="description" content="RHS Computing My Work — anonymous login pilot.">
  <title>My Work · RHS Computing</title>
  <style>
    :root{--green:#006347;--ink:#193d2f;--muted:#526c5e;--line:#d2e2d7;--pale:#eff6f1;--bg:#f7faf8}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
    button,input{font:inherit}button{cursor:pointer}a{color:var(--green)}:focus-visible{outline:3px solid #edb544;outline-offset:3px}
    header{background:white;border-bottom:1px solid var(--line)}.bar{max-width:990px;margin:auto;min-height:64px;padding:10px 18px;display:flex;align-items:center;gap:12px}
    .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}.mark{width:36px;height:36px;display:grid;place-items:center;border-radius:9px;background:var(--green);color:white;font-weight:900}
    .brand strong{display:block;line-height:1.1}.brand small{display:block;color:var(--green);font-size:10px;letter-spacing:.12em;font-weight:900}
    .back{margin-left:auto;font-size:14px;font-weight:750;text-decoration:none}
    main{max-width:990px;margin:auto;padding:26px 18px 55px}h1{font-size:clamp(30px,5vw,42px);letter-spacing:-.035em;line-height:1.15;margin:0 0 8px}h2{font-size:19px;margin:0 0 10px}
    .intro,.note{color:var(--muted)}.intro{margin:0 0 18px}.note{font-size:14px}.eyebrow{display:block;margin-bottom:7px;color:var(--green);font-size:12px;font-weight:900;letter-spacing:.11em;text-transform:uppercase}
    .panel,.card{background:#fff;border:1px solid var(--line);border-radius:14px}.panel{padding:24px}.entry{max-width:500px;margin:18px auto}
    label{display:block;font-weight:800;margin:0 0 6px}input{width:100%;min-height:49px;border:2px solid #9bb7a5;border-radius:9px;padding:10px 13px;font-size:17px}
    .field{margin-bottom:15px}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
    .btn{display:inline-flex;justify-content:center;align-items:center;min-height:46px;padding:10px 18px;background:var(--green);color:white;border:1px solid var(--green);border-radius:9px;text-decoration:none;font-size:15px;font-weight:800}
    .btn.secondary{background:white;color:var(--green)}.btn:disabled{opacity:.65;cursor:wait}.error{color:#9d352f;font-weight:700;font-size:14px;margin:12px 0 0}.error[hidden]{display:none}
    .notice{background:var(--pale);border-radius:9px;padding:12px 14px;margin-top:16px;font-size:14px}
    .heading{display:flex;justify-content:space-between;align-items:start;flex-wrap:wrap;gap:16px;margin-bottom:20px}.heading p{margin:0;color:var(--muted)}
    .summary{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}.count{padding:10px 15px;background:var(--pale);border-radius:9px;font-weight:750}.count strong{font-size:22px;margin-right:5px}
    .cards{display:grid;gap:12px}.card{padding:19px}.card-top{display:flex;justify-content:space-between;align-items:start;gap:12px}.card h2{margin:3px 0}
    .meta{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:900;color:var(--muted)}.status{font-weight:800;font-size:13px;background:var(--pale);border-radius:15px;padding:6px 10px;white-space:nowrap}
    .card p{margin:7px 0;color:var(--muted);font-size:14px}.empty{text-align:center;padding:32px 18px}
    .package{background:#fff;border:1.5px solid var(--line);padding:18px;border-radius:15px;margin:0 0 16px}
    .package>h2{margin:5px 0 4px}.package>.note{margin:0 0 14px}
    .package-items{display:grid;gap:10px}.package-items .card{background:var(--bg);border-color:var(--line)}
    .pilot-package{padding:23px}.pilot-tabs{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:17px 0}
    .pilot-tab{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1.5px solid var(--line);background:white;border-radius:12px;padding:12px 15px;color:var(--ink);font-weight:850}
    .pilot-tab[aria-selected="true"]{border-color:var(--green);background:#eaf5ee;color:var(--green)}
    .pilot-topic{border:1px solid var(--line);border-radius:12px;background:#fff;margin:9px 0;overflow:hidden}
    .pilot-topic>summary{cursor:pointer;background:var(--pale);padding:12px 15px;font-weight:850;list-style:revert}
    .pilot-task{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:11px 14px;border-top:1px solid #eaf0ec}
    .pilot-task>div{flex:1;min-width:0}.pilot-task strong{display:block;font-size:14px}.pilot-task small{display:block;color:var(--muted);font-size:12px}
    .pilot-open{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--green);color:var(--green);background:#fff;border-radius:9px;padding:6px 12px;min-height:37px;font-size:13px;font-weight:800;text-decoration:none}
    .pilot-open:hover{background:var(--pale)}.pilot-note{background:#f3f8f4;border:1px solid #dce9df;border-radius:12px;padding:11px 13px;font-size:13px;color:#486758}
    [hidden]{display:none!important}
    .earlier-work{margin:24px 0 12px;font-size:17px}
    footer{text-align:center;color:var(--muted);font-size:12px;padding:16px}.skip{position:absolute;left:-10000px}.skip:focus{left:12px;top:12px;z-index:10;background:white;padding:12px}
    @media(max-width:600px){.bar{padding:9px 12px}.back{font-size:12px}main{padding:20px 12px 45px}.panel{padding:18px}.entry{margin:10px auto}.card-top{flex-direction:column}.actions .btn{flex:1}}
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to My Work</a>
  <header><div class="bar">
    <a class="brand" href="/" aria-label="RHS Computing home"><span class="mark">SA</span><span><small>SYNERGY ASSIST</small><strong>My Work</strong></span></a>
    <a class="back" href="/">← Learning Hub</a>
  </div></header>
  <main id="main"><div id="app" aria-live="polite"><p>Loading My Work…</p></div></main>
  <footer>RHS Computing · Formative practice</footer>
  <script>
  (() => {
    'use strict';
    const API = 'https://rhsccs-my-work-api.jeromedthompson.workers.dev';
    const SESSION_KEY = 'rhs-my-work-learner-session-v1';
    const app = document.getElementById('app');
    let session = sessionStorage.getItem(SESSION_KEY) || '';
    let catalog = [];
    const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char]));

    async function request(path, options = {}) {
      const response = await fetch(API + path, {
        method: 'POST', cache: 'no-store',
        headers: { 'content-type': 'application/json', ...(options.session ? { authorization: 'Bearer ' + options.session } : {}) },
        body: JSON.stringify(options.body || {})
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        const error = new Error(data.error || 'Could not connect to My Work.');
        error.status = response.status;
        throw error;
      }
      return data;
    }

    async function loadCatalog() {
      try {
        const response = await fetch('/assets/j277-assignment-catalog.json', { cache: 'no-cache' });
        if (!response.ok) return;
        const value = await response.json();
        if (Array.isArray(value.items)) catalog = value.items;
      } catch { /* Login remains available if the catalogue cannot load. */ }
    }

    function showEntry(message = '') {
      app.innerHTML = `<span class="eyebrow">Classwork &amp; independent practice</span><h1>My Work</h1>
        <p class="intro">Sign in to see your assigned Skills and Revision Practice.</p>
        <section class="panel entry"><h2>Student sign in</h2>
          <form id="signIn">
            <div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="40" placeholder="Your RHS Computing ID"></div>
            <div class="field"><label for="password">4-digit PIN</label><input type="password" id="password" name="password" inputmode="numeric" autocomplete="off" pattern="[0-9]{4}" minlength="4" maxlength="4" required placeholder="Your 4-digit PIN"></div>
            <button class="btn" id="submit" type="submit">Sign in</button>
            <p class="error" id="error" role="alert" ${message ? '' : 'hidden'}>${escapeHtml(message)}</p>
          </form>
          <div class="notice"><strong>Classwork:</strong> open at any time of day, normally for seven days. Special one-day pilots finish on the advertised date.<br><strong>Homework:</strong> Mon–Fri 12:30–13:20 or after 15:30; weekends any time, until the teacher's deadline (UK time).</div>
        </section>`;
      document.getElementById('signIn').addEventListener('submit', async event => {
        event.preventDefault();
        const button = document.getElementById('submit');
        button.disabled = true; button.textContent = 'Checking…';
        try {
          const data = await request('/v1/login', { body: {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          } });
          session = data.session;
          sessionStorage.setItem(SESSION_KEY, session);
          await showAssigned();
        } catch (error) {
          showEntry(error instanceof TypeError ? 'Connection failed. Please try again.' : error.message);
        }
      });
    }

    function itemLink(item, level, assignmentKey) {
      if (!item || typeof item.url !== 'string' || !item.url.startsWith('/') || item.url.startsWith('//')) return null;
      const link = new URL(item.url, location.origin);
      if (level) link.searchParams.set('level', level);
      // An activity reference only. The Worker checks the real learner session
      // and assignment before accepting a recorded attempt.
      if ((['j277-skill-p1-convert','h446-skill-p1-convert'].includes(item.id) ||
          item.id.startsWith('j277-practice-') ||
          (item.id.startsWith('h446-practice-') && ['completion','question'].includes(item.tracking))) && assignmentKey)
        link.searchParams.set('workKey', assignmentKey);
      return link.pathname + link.search + link.hash;
    }

    function workCard(row) {
      const item = catalog.find(entry => entry.id === row.itemId);
      const isSkill = row.itemId.includes('-skill-');
      const kind = isSkill ? 'Skill' : 'Revision Practice';
      const title = item?.title || row.itemId.replace(/^(j277|h446)-(skill|practice)-/, '').replace(/-/g, ' ');
      const count = Number(row.attempts || 0);
      const links = [];
      if (isSkill && item?.paper === 2 && item?.levels?.includes('easy') && item?.levels?.includes('medium')) {
        for (const level of ['easy','medium']) {
          const href = itemLink(item, level, row.assignmentKey);
          if (href) links.push(`<a class="btn ${level === 'easy' ? 'secondary' : ''}" href="${escapeHtml(href)}">${level === 'easy' ? 'Easy' : 'Medium'}</a>`);
        }
      } else {
        const href = itemLink(item, null, row.assignmentKey);
        if (href) links.push(`<a class="btn" href="${escapeHtml(href)}">Open ${kind}</a>`);
      }
      const isConversionPilot = ['j277-skill-p1-convert','h446-skill-p1-convert'].includes(row.itemId);
      const isQuizPilot = row.itemId === 'h446-practice-141-a';
      const completionTracked = item?.tracking === 'completion';
      const linkOnly = item?.tracking === 'link-only';
      const questions = Number(row.questionsAttempted || 0);
      const correct = Number(row.firstTryCorrect || 0);
      const accuracy = questions ? Math.round(100 * correct / questions) : 0;
      const best = linkOnly ? 'Practice link · untracked'
        : completionTracked ? (count ? `Best quiz: ${Number(row.bestScore)}%` : 'Not started')
        : (isConversionPilot || isQuizPilot) && questions
        ? `${accuracy}% correct first time`
        : count ? (isConversionPilot ? `Best round: ${Number(row.bestScore)}%` : `Best recorded: ${Number(row.bestScore)}%`)
          : 'Not started';
      const practiceText = linkOnly
        ? 'You can open this Skill from My Work. Automatic score reporting has not yet been connected for this tool.'
        : completionTracked
          ? (count ? `${count} completed quiz${count === 1 ? '' : 'zes'} recorded · best ${Number(row.bestScore)}%. Each quiz is marked from first-checked answers.`
          : 'Complete all ten questions to save your first-check score to My Work. You can retry afterwards.')
        : isConversionPilot
        ? (questions ? `${questions} question${questions === 1 ? '' : 's'} attempted · ${correct} correct on the first check. Easy: ${Number(row.easyCorrect || 0)}/${Number(row.easyQuestions || 0)} · Medium: ${Number(row.mediumCorrect || 0)}/${Number(row.mediumQuestions || 0)}.${count ? ` ${count} earlier completed round${count === 1 ? '' : 's'} also recorded.` : ''}`
          : count ? `${count} earlier completed 10-question round${count === 1 ? '' : 's'}. New questions will save individually.`
            : 'Your first checked answer saves straight away. You can stop after one question.')
        : isQuizPilot
          ? (questions ? `${questions} MCQ answer${questions === 1 ? '' : 's'} recorded · ${correct} correct first time. The assigned quiz has ten questions; you can stop at any point.`
            : 'Ten MCQs. Every checked answer saves to My Work; you can stop after one.')
        : `${count} recorded attempt${count === 1 ? '' : 's'}`;
      return `<article class="card"><div class="card-top"><div><span class="meta">${escapeHtml(row.workType === 'classwork' ? "Classwork · " + kind : kind)}${item?.spec ? ' · ' + escapeHtml(item.spec) : ''}</span>
        <h2>${escapeHtml(title)}</h2></div><span class="status">${escapeHtml(best)}</span></div>
        <p>${escapeHtml(practiceText)}</p>
        <div class="actions">${links.join('') || '<span class="note">Your teacher will provide this activity link.</span>'}</div></article>`;
    }

    function pilotLibrary(set) {
      const panels = ['skill','practice'].map(type => {
        const rows = set.activities.filter(row => row.itemId.includes('-' + type + '-'));
        const byTopic = new Map();
        for (const row of rows) {
          const item = catalog.find(entry => entry.id === row.itemId);
          const code = String(item?.spec || '').match(/^\d+\.\d+/)?.[0] || 'Other';
          if (!byTopic.has(code)) byTopic.set(code, []);
          byTopic.get(code).push({ row,item });
        }
        const topics = [...byTopic.entries()].sort((a,b)=>a[0].localeCompare(b[0],undefined,{numeric:true}));
        return `<div class="pilot-panel" data-pilot-kind="${type}" ${type === 'practice' ? 'hidden' : ''}>
          ${topics.map(([code,entries],index)=>`<details class="pilot-topic" ${index === 0 ? 'open' : ''}>
            <summary>${escapeHtml(code)} · ${entries.length} ${type === 'skill' ? 'Skills' : 'revision topics'}</summary>
            ${entries.map(({row,item})=>{
              const href = itemLink(item, null, row.assignmentKey);
              const attempts = Number(row.attempts || 0);
              const questions = Number(row.questionsAttempted || 0);
              const note = item?.tracking === 'link-only' ? 'Practice available · scoring not connected'
                : questions ? `${questions} checked answer${questions === 1 ? '' : 's'} saved · ${Number(row.firstTryCorrect || 0)} correct first try`
                : attempts ? `Recorded practice · ${Number(row.bestScore || 0)}% best quiz/round`
                  : type === 'practice' ? '10 questions · not started' : 'Not started';
              return `<div class="pilot-task"><div><strong>${escapeHtml(item?.title || row.itemId)}</strong>
                <small>${escapeHtml(item?.spec || code)} · ${escapeHtml(note)}</small></div>
                ${href ? `<a class="pilot-open" href="${escapeHtml(href)}">Open →</a>` : '<span class="note">Link unavailable</span>'}</div>`;
            }).join('')}
          </details>`).join('')}
        </div>`;
      }).join('');
      const skills = set.activities.filter(row=>row.itemId.includes('-skill-')).length;
      const revision = set.activities.length - skills;
      return `<section class="package pilot-package"><span class="meta">One-day trial · Thursday 19 November 2026</span>
        <h2>${escapeHtml(set.title)}</h2><p class="note">Try one practical Skill and one 10-question revision topic, then explore anything else you find useful.</p>
        <div class="pilot-tabs" role="tablist" aria-label="Pilot activity lists">
          <button type="button" class="pilot-tab" data-pilot-tab="skill" role="tab" aria-selected="true">Skills <span>${skills}</span></button>
          <button type="button" class="pilot-tab" data-pilot-tab="practice" role="tab" aria-selected="false">Revision MCQs <span>${revision}</span></button>
        </div><p class="pilot-note">You can switch lists at any time. Correct answers and scores appear in My Work where automatic scoring is connected.</p>
        ${panels}</section>`;
    }

    function combinedAssignments(rows) {
      const groups = new Map();
      const older = [];
      for (const row of rows) {
        if (!row.packageId) { older.push(row); continue; }
        if (!groups.has(row.packageId)) groups.set(row.packageId, { title: row.packageTitle,
          kind: row.workType, dueDate: row.dueDate, activities: [] });
        groups.get(row.packageId).activities.push(row);
      }
      let html = '';
      for (const set of groups.values()) {
        if (/^Pilot Year (11|12|13)$/.test(set.title) && set.dueDate === '2026-11-19') {
          html += pilotLibrary(set); continue;
        }
        const rule = set.kind === 'classwork' ? 'Classwork · open at any hour during the seven-day assignment'
          : 'Homework · independent study hours' + (set.dueDate ? ' · due ' + set.dueDate : '');
        html += `<section class="package"><span class="meta">${escapeHtml(rule)}</span>
          <h2>${escapeHtml(set.title)}</h2><p class="note">${set.activities.length} activities in this assignment</p>
          <div class="package-items">${set.activities.map(workCard).join('')}</div></section>`;
      }
      if (older.length) html += `${groups.size ? '<h2 class="earlier-work">Earlier assigned activities</h2>' : ''}${older.map(workCard).join('')}`;
      return { html, assignmentCount: groups.size + older.length };
    }

    async function signOut() {
      const previous = session;
      session = ''; sessionStorage.removeItem(SESSION_KEY);
      showEntry();
      if (previous) await request('/v1/logout', { session: previous }).catch(() => {});
    }

    async function showAssigned() {
      if (!session) { showEntry(); return; }
      try {
        const data = await request('/v1/work', { session });
        if (!Array.isArray(data.work) || !/^Y(10|11|12|13)$/.test(data.cohort)) throw Error('Unexpected response from My Work.');
        const recorded = data.work.filter(row => Number(row.attempts || 0) > 0 || Number(row.questionsAttempted || 0) > 0).length;
        const combined = combinedAssignments(data.work);
        app.innerHTML = `<div class="heading"><div><span class="eyebrow">RHS Computing · Year ${escapeHtml(data.cohort.slice(1))}</span>
          <h1>My Work</h1><p>Your assigned activities</p></div><button class="btn secondary" id="signOut">Sign out</button></div>
          <div class="summary"><span class="count"><strong>${combined.assignmentCount}</strong> assignment${combined.assignmentCount === 1 ? '' : 's'}</span><span class="count"><strong>${data.work.length}</strong> activities</span><span class="count"><strong>${recorded}</strong> with recorded practice</span></div>
          <section class="cards" aria-label="Assigned work">${data.work.length ? combined.html : `<div class="panel empty"><h2>No available work</h2><p>${escapeHtml(data.notice || 'Your login is ready. Your teacher will add your activities.')}</p></div>`}</section>
          <div class="actions"><button class="btn secondary" id="refresh">Refresh My Work</button></div>
           <p class="note">Assigned J277 and H446 revision MCQs contain ten questions and save scores on completion; H446 1.4.1(a) and the Conversion Grid save each checked answer. Other Skills are practice links until their marking is connected.</p>`;
        document.getElementById('signOut').addEventListener('click', signOut);
        document.getElementById('refresh').addEventListener('click', showAssigned);
      } catch (error) {
        if (error.status === 404 || error.status === 401) { await signOut(); return; }
        app.innerHTML = `<section class="panel entry"><h1>My Work</h1><p>${escapeHtml(error.message || 'Connection problem.')}</p>
          <div class="actions"><button class="btn" id="retry">Try again</button><button class="btn secondary" id="signOut">Sign out</button></div></section>`;
        document.getElementById('retry').addEventListener('click', showAssigned);
        document.getElementById('signOut').addEventListener('click', signOut);
      }
    }

    app.addEventListener('click', event => {
      const button = event.target.closest('[data-pilot-tab]');
      if (!button) return;
      const packageNode = button.closest('.pilot-package');
      const type = button.dataset.pilotTab;
      for (const tab of packageNode.querySelectorAll('[data-pilot-tab]'))
        tab.setAttribute('aria-selected', String(tab === button));
      for (const panel of packageNode.querySelectorAll('[data-pilot-kind]'))
        panel.hidden = panel.dataset.pilotKind !== type;
    });

    (async () => { await loadCatalog(); if (session) await showAssigned(); else showEntry(); })();
  })();
  </script>
</body>
</html>
