<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#006347"><meta name="description" content="Reepham High School and College learning hub. Choose your year and subject to find lessons, skills practice and exam preparation."><title>RHSC Learning Hub</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23006347'/%3E%3Ctext x='16' y='23' text-anchor='middle' fill='white' font-size='23' font-family='Arial'%3ER%3C/text%3E%3C/svg%3E"><style>
:root{--green:#006347;--dark:#003a31;--soft:#eef7f4;--ink:#17211e;--muted:#5b6864;--line:#d8e1de}*{box-sizing:border-box}body{margin:0;background:#f6f8f7;color:var(--ink);font:1rem/1.5 Arial,Helvetica,sans-serif}a{color:var(--green)}a:focus-visible,button:focus-visible{outline:3px solid #f2b544;outline-offset:3px}.skip{position:absolute;top:-100px}.skip:focus{top:0;z-index:10;background:white;padding:1rem}.top{background:white;border-bottom:1px solid var(--line)}.top-inner{max-width:1200px;margin:auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--dark)}.seal{display:grid;place-items:center;width:44px;height:44px;flex-shrink:0;background:var(--green);color:white;border-radius:8px;font-size:25px;font-weight:bold}.brand small{display:block;font-size:12px;font-weight:700;letter-spacing:.08em}.brand strong{font-size:18px}.top-links{display:flex;flex-wrap:wrap;gap:12px}.top-links a{font-size:14px;min-height:44px;display:inline-flex;align-items:center;text-decoration:none}main{max-width:1200px;margin:auto;padding:28px 24px 40px}.back{display:inline-flex;align-items:center;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:5px;background:white;text-decoration:none;font-weight:700;margin-bottom:20px}.eyebrow{font-size:14px;letter-spacing:.12em;font-weight:700;color:var(--green);margin:0 0 8px}h1{font-size:clamp(28px,5vw,44px);line-height:1.1;letter-spacing:-.035em;margin:0;color:var(--dark)}.intro{color:var(--muted);max-width:700px;margin:12px 0 24px}.section-title{font-size:20px;margin:26px 0 12px}.years,.subjects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.year{background:var(--green);color:white;border-radius:8px;padding:22px;text-decoration:none;min-height:136px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s}.year strong{font-size:30px}.year span{font-size:14px}.year:hover{background:#004b39;transform:translateY(-2px)}.college{background:var(--dark)}.subject{display:flex;min-height:88px;padding:18px;background:white;border:1px solid var(--line);border-radius:6px;align-items:center;justify-content:space-between;gap:12px;color:var(--dark);font-weight:700;text-decoration:none}.subject:hover{background:var(--soft);border-color:var(--green)}.note{font-size:14px;color:var(--muted);max-width:850px;margin:18px 0}.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:24px 0 20px;border-bottom:1px solid var(--line)}.tabs a{min-height:48px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 4px;text-decoration:none;font-weight:700;border-bottom:3px solid transparent}.tabs a[aria-current]{background:var(--soft);border-color:var(--green)}.resource{background:white;border:1px solid var(--line);border-radius:6px;padding:24px}.resource h2{font-size:21px;margin:0 0 10px}.resource p{color:var(--muted);margin:10px 0}.resource a{display:inline-flex;align-items:center;min-height:44px;font-weight:700}.footer{border-top:1px solid var(--line);padding:20px 24px;background:white;color:var(--muted);font-size:14px}.footer-inner{max-width:1152px;margin:auto;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.footer a{display:inline-flex;min-height:44px;align-items:center}.sources{display:flex;flex-wrap:wrap;gap:16px}h1:focus{outline:none}
@media(max-width:700px){.top-inner{padding:12px 16px}.top-links{display:none}main{padding:20px 16px 32px}.years,.subjects{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.year{padding:16px;min-height:120px}.year strong{font-size:26px}.subject{padding:12px;overflow-wrap:anywhere}.brand small{font-size:11px}.tabs a{font-size:14px}.resource{padding:18px}}@media(max-width:360px){.brand small{max-width:210px}.subjects{grid-template-columns:1fr}.year strong{font-size:24px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* Clean school-app presentation */
body{background:#f5f8f7}.top{border-top:4px solid var(--green)}.seal{border-radius:12px}.top-inner{padding-block:18px}.brand strong{letter-spacing:-.02em}.top-links a{padding:0 14px;border:1px solid var(--line);border-radius:24px;background:#fff}main{padding-top:32px}.section-title{display:flex;align-items:baseline;gap:12px}.section-title .note{font-weight:400;margin:0}.years{grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.year{position:relative;background:white;color:var(--dark);border:1px solid var(--line);border-radius:16px;min-height:192px;padding:20px;box-shadow:0 3px 12px rgba(0,58,49,.035)}.year-top{display:flex;justify-content:space-between;align-items:center}.year .year-label{letter-spacing:.16em;font-size:12px;font-weight:700}.year strong{font-size:64px;letter-spacing:-.07em;font-weight:700;line-height:1.15}.year .year-arrow{display:grid;place-items:center;border-radius:50%;background:var(--soft);height:30px;width:30px;font-size:18px}.year .year-bottom{font-size:14px;color:var(--muted)}.year:hover{color:var(--dark);background:var(--soft);border-color:#95b7aa;box-shadow:0 8px 20px rgba(0,58,49,.08)}.year.college{background:var(--dark);color:white;border-color:var(--dark)}.year.college .year-bottom{color:#c8e4da}.year.college .year-arrow{background:#195247;color:white}.year.college:hover{background:#075043}.subjects{gap:12px}.subject{border-radius:12px;min-height:96px;padding:16px;box-shadow:0 2px 8px rgba(0,58,49,.025)}.subject-icon{flex-shrink:0;display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:#e8f3ed;color:#006347}.subject-name{flex:1;min-width:0}.subject-arrow{color:#7b8d85;font-size:24px;font-weight:400}.subject svg,.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.tone-science,.tone-math,.tone-code{background:#eaf0f8;color:#365b86}.tone-art,.tone-music,.tone-camera{background:#f3eef8;color:#735794}.tone-history,.tone-people{background:#f8f1e6;color:#84642c}.tabs{gap:6px;border:1px solid var(--line);background:#edf2ef;border-radius:12px;padding:5px}.tabs a{gap:9px;border:0;border-radius:8px;color:#53665d}.tabs a[aria-current]{background:white;color:var(--green);box-shadow:0 2px 6px rgba(0,58,49,.08)}.back{border-radius:24px;font-size:14px}.resource{border-radius:14px;border-top:3px solid #7aa793}.resource a{padding:8px 16px;background:var(--green);color:white;border-radius:8px;text-decoration:none}.footer{background:transparent}.intro{margin-bottom:28px} 
@media(max-width:900px){.years{grid-template-columns:repeat(3,minmax(0,1fr))}.subjects{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){main{padding-top:24px}.years{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.year{min-height:164px;padding:16px}.year strong{font-size:54px}.subjects{grid-template-columns:1fr;gap:8px}.subject{min-height:78px;padding:12px 14px}.subject-icon{width:42px;height:42px}.tabs a{flex-direction:column;gap:4px;min-height:66px;font-size:14px}.tabs svg{width:20px;height:20px}.section-title{flex-wrap:wrap;gap:4px 12px}.top-inner{padding-block:12px}}
.year.ks4{background:#39816c;border-color:#39816c;color:#fff}.year.ks4 .year-bottom{color:#fff}.year.ks4 .year-arrow{background:#2a6857;color:#fff}.year.ks4:hover{background:#2d705d;border-color:#2d705d;color:#fff}
</style></head><body><a class="skip" href="#main">Skip to learning</a><header class="top"><div class="top-inner"><a class="brand" href="#"><span class="seal" aria-hidden="true">R</span><span><small>REEPHAM HIGH SCHOOL &amp; COLLEGE</small><strong>Learning Hub</strong></span></a><nav class="top-links" aria-label="School websites"><a href="https://www.reephamhigh.org.uk/">High School ↗</a><a href="https://www.reephamcollege.org.uk/">College ↗</a></nav></div></header><main id="main"></main><footer class="footer"><div class="footer-inner"><span>Reepham High School &amp; College · 2026–27</span><div class="sources"><a href="computing.html">Computing department</a><a href="https://www.reephamhigh.org.uk/pupils/curriculum/">School curriculum ↗</a><a href="https://www.reephamcollege.org.uk/for-students-and-parents/subjects/">College courses ↗</a></div></div></footer><script>
const ks3=['Art and Design','Computing','Design and Technology','English','Geography','History','Mathematics','Modern Foreign Languages','Music','Physical Education','PSHE','Religious Education','Science'];
const core=['English','Mathematics','Science','Core Physical Education','Personal Development'];
const options=['Art, Craft and Design','Business Studies','Computer Science','Design Technology','Food Preparation','French','Geography','History','Information Technology','Music','Physical Education GCSE','Photography','Religious Studies','Spanish','Sports Studies'];
const college=['Art, Craft & Design','Biology','Business Studies','Chemistry','Computer Science','Criminology','Economics','English Language','English Literature','French','Further Mathematics','Geography','History','Law','Mathematics','Photography','Physical Education','Physics','Politics','Product Design','Psychology','Sociology','Spanish'];
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/-$/,'');
const escapeHtml=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');

function icon(name){const paths={
book:'<path d="M12 5v15M3 4h5a4 4 0 0 1 4 2 4 4 0 0 1 4-2h5v15h-5a5 5 0 0 0-4 2 5 5 0 0 0-4-2H3z"/>',
code:'<path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-14-2 18"/>',
math:'<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8M8 11h2m4 0h2m-8 4h2m4 0h2m-8 4h2m4 0h2"/>',
science:'<path d="M9 3h6m-5 0v7L4 20h16l-6-10V3M7 15h10"/>',
globe:'<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/>',
art:'<path d="m14 4 6 6M4 20l3-7L17 3l4 4-10 10zM4 20l7-3"/>',
music:'<path d="M9 18V5l11-2v13M9 8l11-2"/><ellipse cx="6" cy="18" rx="3" ry="2"/><ellipse cx="17" cy="16" rx="3" ry="2"/>',
people:'<circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M17 4a3 3 0 0 1 0 6m1 4a5 5 0 0 1 3 4v3"/>',
target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
exam:'<rect x="5" y="4" width="14" height="18" rx="2"/><path d="M9 4V2h6v2M8 10h8m-8 4h8m-8 4h5"/>',
history:'<path d="m3 8 9-5 9 5H3zm2 3v7m7-7v7m7-7v7M3 21h18"/>',
camera:'<path d="M3 7h4l2-3h6l2 3h4v14H3z"/><circle cx="12" cy="13" r="4"/>'
};return '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">'+(paths[name]||paths.book)+'</svg>'}
function subjectIcon(s){if(/Comput|Technology/.test(s))return 'code';if(/Math|Business|Econom/.test(s))return 'math';if(/Science|Biology|Chemistry|Physics/.test(s))return 'science';if(/Geography|French|Spanish|Languages/.test(s))return 'globe';if(/Art|Design|Food/.test(s))return 'art';if(/Music/.test(s))return 'music';if(/Photo/.test(s))return 'camera';if(/History|Law|Politics|Religious/.test(s))return 'history';if(/Physical|Sport/.test(s))return 'target';if(/PSHE|Personal|Psychology|Sociology|Criminology/.test(s))return 'people';return 'book'}

const main=document.getElementById('main');
function href(y,s,tab='lessons'){return '#year/'+y+'/'+slug(s)+'/'+tab}
function subjects(y){return y<10?ks3:y<12?[...core,...options]:college}
function tiles(y,list){return '<div class="subjects">'+list.map(s=>'<a class="subject" href="'+href(y,s)+'"><span class="subject-icon tone-'+subjectIcon(s)+'">'+icon(subjectIcon(s))+'</span><span class="subject-name">'+escapeHtml(s)+'</span><span class="subject-arrow" aria-hidden="true">›</span></a>').join('')+'</div>'}
function yearTile(y){return '<a class="year '+(y>11?'college':y>9?'ks4':'')+'" href="#year/'+y+'" aria-label="Year '+y+' subjects"><span class="year-top"><span class="year-label">YEAR</span><span class="year-arrow" aria-hidden="true">↗</span></span><strong>'+String(y).padStart(2,'0')+'</strong><span class="year-bottom">'+(y>11?'College':y>9?'Key Stage 4':'Key Stage 3')+'</span></a>'}
function render(){const parts=location.hash.slice(1).split('/');const y=Number(parts[1]);if(parts[0]!=='year'||!Number.isInteger(y)||y<7||y>13){document.title='RHSC Learning Hub';main.innerHTML='<p class="eyebrow">YOUR LEARNING, IN ONE PLACE</p><h1>Choose your year</h1><p class="intro">Find your subject, then explore lessons, skills practice and exam preparation.</p><h2 class="section-title">High School <span class="note">Years 7–11</span></h2><div class="years">'+[7,8,9,10,11].map(yearTile).join('')+'</div><h2 class="section-title">College <span class="note">Years 12–13</span></h2><div class="years">'+[12,13].map(yearTile).join('')+'</div>';return}
const s=subjects(y).find(s=>slug(s)===parts[2]);
if(!s){document.title='Year '+y+' subjects · RHSC';main.innerHTML='<a class="back" href="#">← All year groups</a><p class="eyebrow">'+(y>11?'COLLEGE':y>9?'KEY STAGE 4':'KEY STAGE 3')+'</p><h1>Year '+y+' subjects</h1><p class="intro">Choose the subject you study.</p>'+(y<10?tiles(y,ks3):y<12?'<h2 class="section-title">Core subjects</h2>'+tiles(y,core)+'<h2 class="section-title">Options</h2>'+tiles(y,options):tiles(y,college))+'<p class="note">'+(y<10?'Based on the published curriculum. Subject allocation and language choices can vary by year and teaching group.':y<12?'Options are based on the 2026 Year 10 booklet. Availability may differ for the current Year 11 cohort; follow your timetable.':'Published college course offer. Courses running may vary by cohort; follow your timetable.')+'</p>';return}
const tab=['lessons','skills','exam'].includes(parts[3])?parts[3]:'lessons';const titles={lessons:'Lessons',skills:'Skills Practice',exam:'Exam Practice'};
let external='';if(s==='Computing'&&y<10)external='year-'+y+'-hub.html'+(tab==='lessons'?'#lessons':tab==='skills'?'#skills':'#exam');if(s==='Computer Science')external=y>11?'https://computingdept.github.io/reepham-h446-lessons/':'https://computingdept.github.io/reepham-j277-lesson/';
let content=external?'<h2>'+titles[tab]+'</h2><p>'+(y<10?'35 lesson spaces, skills practice and two assessment points in your Year '+y+' Computing hub.':'Continue to the existing '+(y>11?'OCR H446 A Level':'OCR J277 GCSE')+' course resources.')+'</p><a href="'+external+'">Open '+(y<10?'Year '+y+' Computing':s)+' hub →</a>':tab==='lessons'?'<h2>Lessons</h2><p>Year '+y+' '+escapeHtml(s)+' lesson materials have not been added yet.</p><p>The lesson sequence and number of lessons will be set by the subject team.</p>':tab==='skills'?'<h2>Skills Practice</h2><p>Subject quizzes, practice activities and feedback will appear here when resources are added for Year '+y+' '+escapeHtml(s)+'.</p>':'<h2>Exam Practice</h2><p>Assessment dates, revision guides and online practice will appear here for Year '+y+' '+escapeHtml(s)+'.</p><p>The assessment schedule and marking resources are awaiting confirmation from the subject team.</p>';
document.title='Year '+y+' '+s+' · '+titles[tab]+' · RHSC';main.innerHTML='<a class="back" href="#year/'+y+'">← Year '+y+' subjects</a><p class="eyebrow">YEAR '+y+'</p><h1>'+escapeHtml(s)+'</h1><nav class="tabs" aria-label="Learning sections">'+Object.keys(titles).map(t=>'<a href="'+href(y,s,t)+'"'+(t===tab?' aria-current="page"':'')+'>'+icon(t==='lessons'?'book':t==='skills'?'target':'exam')+'<span>'+titles[t]+'</span></a>').join('')+'</nav><section class="resource" aria-label="'+titles[tab]+'">'+content+'</section>';
}
addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
</script></body></html>
