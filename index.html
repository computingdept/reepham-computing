  const words=document.getElementById('y8Words');if(words)words.innerHTML=data.glossary.map(w=>'<div class="y8-word"><strong>'+escapeHtml(w[0])+'</strong><em>'+escapeHtml(w[1])+'</em><span>'+escapeHtml(w[2])+'</span></div>').join('');
  y8BookletSetPage(1);
}
function y8BookletSetPage(n){
  n=Math.max(1,Math.min(25,Number(n)||1));y8BookletPage=n;
  const d=y8BookletData().pages.find(p=>p.page===n),page=document.getElementById('y8ReaderPage');if(!page)return;

function y8BookletRead(){
  if(!window.speechSynthesis)return;const r=document.getElementById('y8Reader'),help=document.getElementById('y8ReadingHelpBtn');if(r&&r.hidden){r.hidden=false;if(help)help.setAttribute('aria-pressed','true')}const b=document.getElementById('y8ReadBtn');
  if(speechSynthesis.speaking){speechSynthesis.cancel();if(b)b.textContent='🔊 Read aloud';return}
  const text=document.getElementById('y8ReaderPage')?.innerText.trim();if(!text)return;
  const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.9;
  const vs=speechSynthesis.getVoices().filter(v=>(v.lang||'').toLowerCase().startsWith('en-gb'));
  if(vs.length)u.voice=vs.find(v=>/sonia|libby|serena|female|kate/i.test(v.name))||vs[0];
  if(b)b.textContent='■ Stop';u.onend=u.onerror=()=>{if(b)b.textContent='🔊 Read aloud'};speechSynthesis.speak(u);
}
function y8BookletSize(dir){

}
function y8BookletToggleReader(){const r=document.getElementById('y8Reader'),b=document.getElementById('y8ReadingHelpBtn');if(!r)return;r.hidden=!r.hidden;if(b)b.setAttribute('aria-pressed',r.hidden?'false':'true')}
function y8BookletWords(){const w=document.getElementById('y8WordHelp'),b=document.getElementById('y8WordBtn');if(!w)return;const on=w.classList.toggle('open');if(b)b.setAttribute('aria-pressed',on?'true':'false')}
function y8BookletColour(){const r=document.getElementById('y8Reader'),b=document.getElementById('y8ReadingHelpBtn');if(r&&r.hidden){r.hidden=false;if(b)b.setAttribute('aria-pressed','true')}y8BookletColourMode=(y8BookletColourMode+1)%3;const p=document.getElementById('y8ReaderPage');if(!p)return;p.classList.remove('cream','bluegrey');if(y8BookletColourMode===1)p.classList.add('cream');if(y8BookletColourMode===2)p.classList.add('bluegrey')}
function y8BookletPrint(){document.body.classList.add('y8-print-reader');window.print();setTimeout(()=>document.body.classList.remove('y8-print-reader'),500)}
function render(){const parts=location.hash.slice(1).split('/');
if(parts[0]==='stage'&&(parts[1]==='10-11'||parts[1]==='12-13')){
  delete document.body.dataset.year;

if(parts[0]==='year'&&['7','8','9'].includes(parts[1])&&parts[2]==='computing'){const ky=Number(parts[1]),raw=parts[3]||'lessons';if(ky===8&&['exam','skills','revision'].includes(raw)){location.replace('year8-revision-ap3.html?v=20260928-1325');return}const t=raw==='booklet'?'booklet':(['exam','skills','revision'].includes(raw)?'revision':'lessons');const page={7:'year7-computing.html',8:'year8-computing.html',9:'year9-computing.html'}[ky];location.replace(page+'#'+t);return}const y=Number(parts[1]);if(parts[0]!=='year'||!Number.isInteger(y)||y<7||y>13){delete document.body.dataset.year;document.title='RHSC Learning Hub';main.innerHTML='<div class="landing-intro"><p class="eyebrow">YOUR LEARNING, IN ONE PLACE</p><h1>Find your learning</h1><p class="intro">Choose where to start.</p></div><nav class="landing-choice-grid" aria-label="Choose your year or course">'+[7,8,9].map(yearTile).join('')+stageTile('10-11','Choose your course')+stageTile('12-13','Choose your course',true)+'</nav>';return}
document.body.dataset.year=String(y);const available=subjects(y);const nested=y<10?['French','Spanish']:y<12?['Combined Science','Triple Science']:[];const legacyScience=y<12&&['physics','chemistry','biology'].includes(parts[2]);const s=legacyScience?'Science':[...available,...nested].find(s=>slug(s)===parts[2]);
if(!s){document.title='Year '+y+' subjects · RHSC';main.innerHTML='<a class="back" href="#">← All year groups</a><p class="eyebrow">'+(y>11?'COLLEGE':y>9?'KEY STAGE 4':'KEY STAGE 3')+'</p><h1>Year '+y+' subjects</h1><p class="intro">Choose the subject you study.</p>'+(y<10?tiles(y,ks3):y<12?tiles(y,[...core,...options]):tiles(y,college))+'<p class="note">'+(y<10?'Based on the published curriculum. Subject allocation and language choices can vary by year and teaching group.':y<12?'Options are based on the 2026 Year 10 booklet. Availability may differ for the current Year 11 cohort; follow your timetable.':'Published college course offer. Courses running may vary by cohort; follow your timetable.')+'</p>';return}
if((s==='Science'&&y>=10&&y<12)||s==='Modern Foreign Languages'){document.title='Year '+y+' '+s+' · RHSC';const chooserBack=y>=10?'#stage/10-11':'#year/'+y;const chooserBackText=y>=10?'← Years 10–11 courses':'← Year '+y+' subjects';main.innerHTML='<a class="back" href="'+chooserBack+'">'+chooserBackText+'</a><p class="eyebrow">YEAR '+y+'</p><h1>'+(s==='Modern Foreign Languages'?'MFL':s)+'</h1><p class="intro">Choose '+(s==='Science'?'your science course. Both routes cover biology, chemistry and physics.':'the language you study.')+'</p>'+tiles(y,s==='Science'?['Combined Science','Triple Science']:['French','Spanish']);return}
const rawTab=parts[3]||'lessons';const tab=rawTab==='skills'||rawTab==='exam'?'revision':(['lessons','booklet','revision'].includes(rawTab)?rawTab:'lessons');const titles={lessons:'Lessons',booklet:'Revision Booklet',revision:'Revision Hub'};
let external='';if(s==='Computer Science')external=y>11?'h446-hub.html':'j277-hub.html';
if(s==='Information Technology')external='it-j836-hub.html';
if(external){

  location.replace(external+'?year='+y+'#'+hubTab);

}

  content='<h2>Lessons</h2><p>Year '+y+' '+escapeHtml(s)+' lesson materials have not been added yet.</p><p>The lesson sequence and number of lessons will be set by the subject team.</p>';
}else if(tab==='booklet'){

if(s==='Computing'&&y<10){

}
const scienceIntro=s==='Science'?'Biology, chemistry and physics together in one KS3 Science hub.':s==='Combined Science'?'AQA Combined Science: Trilogy · Double award (2 GCSEs). Biology, chemistry and physics.':s==='Triple Science'?'AQA separate sciences · Biology, Chemistry and Physics (3 GCSEs).':'';
const scienceCourse=s==='Combined Science'||s==='Triple Science';
document.title='Year '+y+' '+s+' · '+titles[tab]+' · RHSC';
const groupBack=y<10?'#year/'+y:(y<12?'#stage/10-11':'#stage/12-13');
const groupBackText=y<10?'← Year '+y+' subjects':(y<12?'← Years 10–11 courses':'← Sixth Form courses');
const yearSwitch=y<10?'':'<nav class="simple-year-switch" aria-label="Choose year">'+(y<12?[10,11]:[12,13]).map(yy=>'<a href="'+href(yy,s,tab)+'"'+(yy===y?' aria-current="page"':'')+'>Year '+yy+'</a>').join('')+'</nav>';
main.innerHTML='<a class="back" href="'+(scienceCourse?href(y,'Science'):groupBack)+'">'+(scienceCourse?'← Year '+y+' Science':groupBackText)+'</a><p class="eyebrow">YEAR '+y+'</p><h1>'+escapeHtml(s)+'</h1>'+(scienceIntro?'<p class="intro">'+scienceIntro+'</p>':'')+yearSwitch+'<nav class="tabs" aria-label="Learning sections">'+Object.keys(titles).map(t=>'<a href="'+href(y,s,t)+'"'+(t===tab?' aria-current="page"':'')+'>'+icon(t==='lessons'||t==='booklet'?'book':'target')+'<span>'+titles[t]+'</span></a>').join('')+'</nav><section class="resource" aria-label="'+titles[tab]+'">'+content+'</section>';
}
