function subjects(y){return y<10?ks3:y<12?[...core,...options]:college}
function subjectOrder(list){const priority=['English','English Language','English Literature','Mathematics','Further Mathematics','Science','Biology','Chemistry','Physics'];return [...list].sort((a,b)=>{const ai=priority.indexOf(a),bi=priority.indexOf(b);return (ai<0?99:ai)-(bi<0?99:bi)||a.localeCompare(b,'en-GB')})}
function tiles(y,list){return '<div class="subjects">'+subjectOrder(list).map(s=>'<a class="subject" href="'+href(y,s)+'"><span class="subject-icon tone-'+subjectIcon(s)+'">'+icon(subjectIcon(s))+'</span><span class="subject-name">'+(s==='Modern Foreign Languages'?'MFL':escapeHtml(s))+(s==='Modern Foreign Languages'?'<small>French · Spanish</small>':s==='Science'?(y<10?'<small>Biology · Chemistry · Physics</small>':'<small>Combined · Triple</small>'):s==='Combined Science'?'<small>Double award · 2 GCSEs</small>':s==='Triple Science'?'<small>Separate sciences · 3 GCSEs</small>':'')+'</span><span class="subject-arrow" aria-hidden="true">›</span></a>').join('')+'</div>'}
function yearTile(y){return '<a class="year '+(y>11?'college':y>9?'ks4':'')+'" data-year="'+y+'" href="#year/'+y+'" aria-label="Year '+y+' subjects"><span class="year-top"><span class="year-label">YEAR</span><span class="year-arrow" aria-hidden="true">↗</span></span><strong>'+String(y).padStart(2,'0')+'</strong><span class="year-bottom">'+(y>11?'College':y>9?'Key Stage 4':'Key Stage 3')+'</span></a>'}
let y8BookletPage=1,y8BookletFont=1,y8BookletColourMode=0;
function y8BookletData(){return window.Y8_BOOKLET_ACCESS||{pages:[],glossary:[]}}
function y8BookletInit(){
  const sel=document.getElementById('y8PageSelect');if(!sel)return;
  const data=y8BookletData();sel.innerHTML=data.pages.map(p=>'<option value="'+p.page+'">Page '+p.page+'</option>').join('');
  const words=document.getElementById('y8Words');if(words)words.innerHTML=data.glossary.map(w=>'<div class="y8-word"><strong>'+escapeHtml(w[0])+'</strong><em>'+escapeHtml(w[1])+'</em><span>'+escapeHtml(w[2])+'</span></div>').join('');
  y8BookletSetPage(1);
}
function y8BookletSetPage(n){
  n=Math.max(1,Math.min(25,Number(n)||1));y8BookletPage=n;
  const d=y8BookletData().pages.find(p=>p.page===n),page=document.getElementById('y8ReaderPage');if(!page)return;
  page.textContent=d&&d.text?d.text:'No selectable text was available for this page in the teacher booklet.';
  const meta=document.getElementById('y8PageMeta');if(meta)meta.textContent='Page '+n+' of 25';
  const sel=document.getElementById('y8PageSelect');if(sel)sel.value=String(n);
  if(window.speechSynthesis)window.speechSynthesis.cancel();const b=document.getElementById('y8ReadBtn');if(b)b.textContent='🔊 Read aloud';
}
function y8BookletRead(){
  if(!window.speechSynthesis)return;const r=document.getElementById('y8Reader'),help=document.getElementById('y8ReadingHelpBtn');if(r&&r.hidden){r.hidden=false;if(help)help.setAttribute('aria-pressed','true')}const b=document.getElementById('y8ReadBtn');
  if(speechSynthesis.speaking){speechSynthesis.cancel();if(b)b.textContent='🔊 Read aloud';return}
  const text=document.getElementById('y8ReaderPage')?.innerText.trim();if(!text)return;
  const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.9;
  const vs=speechSynthesis.getVoices().filter(v=>(v.lang||'').toLowerCase().startsWith('en-gb'));
  if(vs.length)u.voice=vs.find(v=>/sonia|libby|serena|female|kate/i.test(v.name))||vs[0];
  if(b)b.textContent='■ Stop';u.onend=u.onerror=()=>{if(b)b.textContent='🔊 Read aloud'};speechSynthesis.speak(u);
}
function y8BookletSize(dir){
  const r=document.getElementById('y8Reader'),b=document.getElementById('y8ReadingHelpBtn');if(r&&r.hidden){r.hidden=false;if(b)b.setAttribute('aria-pressed','true')}
  y8BookletFont=Math.max(0,Math.min(3,y8BookletFont+dir));const p=document.getElementById('y8ReaderPage');if(!p)return;
  p.classList.remove('size-sm','size-lg','size-xl');if(y8BookletFont===0)p.classList.add('size-sm');if(y8BookletFont===2)p.classList.add('size-lg');if(y8BookletFont===3)p.classList.add('size-xl');
}
function y8BookletToggleReader(){const r=document.getElementById('y8Reader'),b=document.getElementById('y8ReadingHelpBtn');if(!r)return;r.hidden=!r.hidden;if(b)b.setAttribute('aria-pressed',r.hidden?'false':'true')}
function y8BookletWords(){const w=document.getElementById('y8WordHelp'),b=document.getElementById('y8WordBtn');if(!w)return;const on=w.classList.toggle('open');if(b)b.setAttribute('aria-pressed',on?'true':'false')}
function y8BookletColour(){const r=document.getElementById('y8Reader'),b=document.getElementById('y8ReadingHelpBtn');if(r&&r.hidden){r.hidden=false;if(b)b.setAttribute('aria-pressed','true')}y8BookletColourMode=(y8BookletColourMode+1)%3;const p=document.getElementById('y8ReaderPage');if(!p)return;p.classList.remove('cream','bluegrey');if(y8BookletColourMode===1)p.classList.add('cream');if(y8BookletColourMode===2)p.classList.add('bluegrey')}
function y8BookletPrint(){document.body.classList.add('y8-print-reader');window.print();setTimeout(()=>document.body.classList.remove('y8-print-reader'),500)}
function render(){const parts=location.hash.slice(1).split('/');const y=Number(parts[1]);if(parts[0]!=='year'||!Number.isInteger(y)||y<7||y>13){document.title='RHSC Learning Hub';main.innerHTML='<p class="eyebrow">YOUR LEARNING, IN ONE PLACE</p><h1>Choose your year</h1><p class="intro">Find your subject, then explore lessons, skills practice and exam preparation.</p><h2 class="section-title">High School <span class="note">Years 7–11</span></h2><div class="years">'+[7,8,9,10,11].map(yearTile).join('')+'</div><h2 class="section-title">College <span class="note">Years 12–13</span></h2><div class="years">'+[12,13].map(yearTile).join('')+'</div>';return}
const available=subjects(y);const nested=y<10?['French','Spanish']:y<12?['Combined Science','Triple Science']:[];const legacyScience=y<12&&['physics','chemistry','biology'].includes(parts[2]);const s=legacyScience?'Science':[...available,...nested].find(s=>slug(s)===parts[2]);
if(!s){document.title='Year '+y+' subjects · RHSC';main.innerHTML='<a class="back" href="#">← All year groups</a><p class="eyebrow">'+(y>11?'COLLEGE':y>9?'KEY STAGE 4':'KEY STAGE 3')+'</p><h1>Year '+y+' subjects</h1><p class="intro">Choose the subject you study.</p>'+(y<10?tiles(y,ks3):y<12?tiles(y,[...core,...options]):tiles(y,college))+'<p class="note">'+(y<10?'Based on the published curriculum. Subject allocation and language choices can vary by year and teaching group.':y<12?'Options are based on the 2026 Year 10 booklet. Availability may differ for the current Year 11 cohort; follow your timetable.':'Published college course offer. Courses running may vary by cohort; follow your timetable.')+'</p>';return}
if((s==='Science'&&y>=10&&y<12)||s==='Modern Foreign Languages'){document.title='Year '+y+' '+s+' · RHSC';main.innerHTML='<a class="back" href="#year/'+y+'">← Year '+y+' subjects</a><p class="eyebrow">YEAR '+y+'</p><h1>'+(s==='Modern Foreign Languages'?'MFL':s)+'</h1><p class="intro">Choose '+(s==='Science'?'your GCSE science course. Both routes cover biology, chemistry and physics.':'the language you study.')+'</p>'+tiles(y,s==='Science'?['Combined Science','Triple Science']:['French','Spanish']);return}
const isY8Computing=y==='8'&&s==='Computing';const tab=isY8Computing?(['lessons','booklet','exam'].includes(parts[3])?parts[3]:'lessons'):['lessons','skills','exam'].includes(parts[3])?parts[3]:'lessons';const titles=isY8Computing?{lessons:'Lessons',booklet:'Revision Booklet',exam:'Revision Hub'}:{lessons:'Lessons',skills:'Skills Practice',exam:'Exam Practice'};
let external='';if(s==='Computer Science')external=y>11?'h446-hub.html':'j277-hub.html';
if(s==='Information Technology')external='it-j836-hub.html';
let content=external?'<h2>'+titles[tab]+'</h2><p>'+(y<10?'35 lesson spaces, skills practice and two assessment points in your Year '+y+' Computing hub.':'Continue to the existing '+(s==='Information Technology'?'OCR J836':y>11?'OCR H446 A Level':'OCR J277 GCSE')+' course resources.')+'</p><a href="'+external+'">Open '+(y<10?'Year '+y+' Computing':s)+' hub →</a>':tab==='lessons'?'<h2>Lessons</h2><p>Year '+y+' '+escapeHtml(s)+' lesson materials have not been added yet.</p><p>The lesson sequence and number of lessons will be set by the subject team.</p>':tab==='skills'?'<h2>Skills Practice</h2><p>Subject quizzes, practice activities and feedback will appear here when resources are added for Year '+y+' '+escapeHtml(s)+'.</p>':'<h2>Exam Practice</h2><p>Assessment dates, revision guides and online practice will appear here for Year '+y+' '+escapeHtml(s)+'.</p><p>The assessment schedule and marking resources are awaiting confirmation from the subject team.</p>';
if(s==='Computing'&&y<10)content=computingResources[y][tab];
const scienceIntro=s==='Science'?'Biology, chemistry and physics together in one KS3 Science hub.':s==='Combined Science'?'AQA Combined Science: Trilogy · Double award (2 GCSEs). Biology, chemistry and physics.':s==='Triple Science'?'AQA separate sciences · Biology, Chemistry and Physics (3 GCSEs).':'';
const scienceCourse=s==='Combined Science'||s==='Triple Science';
document.title='Year '+y+' '+s+' · '+titles[tab]+' · RHSC';main.innerHTML='<a class="back" href="'+(scienceCourse?href(y,'Science'):'#year/'+y)+'">← Year '+y+(scienceCourse?' Science':' subjects')+'</a><p class="eyebrow">YEAR '+y+'</p><h1>'+escapeHtml(s)+'</h1>'+(scienceIntro?'<p class="intro">'+scienceIntro+'</p>':'')+'<nav class="tabs" aria-label="Learning sections">'+Object.keys(titles).map(t=>'<a href="'+href(y,s,t)+'"'+(t===tab?' aria-current="page"':'')+'>'+icon(t==='lessons'||t==='booklet'?'book':t==='skills'||(isY8Computing&&t==='exam')?'target':'exam')+'<span>'+titles[t]+'</span></a>').join('')+'</nav><section class="resource" aria-label="'+titles[tab]+'">'+content+'</section>';
if(isY8Computing&&tab==='booklet')setTimeout(y8BookletInit,0);
}
addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
</script></body></html>
